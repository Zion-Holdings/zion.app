<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Search | Zion Tech Group</title>
<meta name="description" content="Search AI and infrastructure services from Zion Tech Group."/>
</head>
<body class="min-h-screen bg-slate-950 text-white">
<main class="max-w-4xl mx-auto px-4 py-20">
  <h1 class="text-4xl font-bold mb-6">Search</h1>
  <input type="text" id="q" placeholder="Search services..." class="w-full px-4 py-3 rounded-lg bg-slate-900 border border-slate-700 text-white mb-6"/>
  <div id="results"></div>
  <script>
    const pages=[
      {title:"AI Services",url:"/ai-services/"},
      {title:"Services",url:"/services/"},
      {title:"Free Tools",url:"/free-tools-hub/"},
      {title:"Pricing",url:"/pricing/"},
      {title:"Case Studies",url:"/case-studies/"},
      {title:"About",url:"/about/"},
      {title:"Contact",url:"/contact/"}
    ];
    document.getElementById('q').addEventListener('input',e=>{
      const q=e.target.value.toLowerCase();
      document.getElementById('results').innerHTML=pages.filter(p=>p.title.toLowerCase().includes(q)).map(p=>`<a href="${p.url}" class="block p-4 rounded bg-slate-900 hover:border-purple-500 border border-slate-800 mb-2">${p.title}</a>`).join('')||'<p class="text-slate-400">No results</p>';
    });
  </script>
</main>
</body>
</html>
