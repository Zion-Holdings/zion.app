<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zion Tech Group — Twinsburg Rack & Stack Candidate Intake</title>
  <style>
    body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:#0b0f1a; color:#e7ecff; }
    .wrap { max-width: 860px; margin: 0 auto; padding: 40px 24px; }
    .card { background:#111827; border:1px solid #1f2a3d; border-radius:18px; padding:28px; }
    h1 { font-size:28px; font-weight:700; margin:0 0 8px; }
    p.lead { color:#a8b0c1; margin:0 0 20px; }
    label { display:block; font-size:13px; color:#c8d0df; margin:14px 0 6px; }
    input, textarea, select { width:100%; background:#0b1220; color:#e7ecff; border:1px solid #243044; border-radius:12px; padding:12px 14px; font-size:14px; }
    textarea { min-height:110px; resize: vertical; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    @media (max-width: 560px){ .row{ grid-template-columns:1fr; } }
    .btn { display:inline-flex; align-items:center; gap:10px; background:linear-gradient(90deg,#7c3aed,#2563eb); color:#fff; padding:14px 18px; border-radius:14px; border:none; font-weight:600; }
    .note { font-size:12px; color:#9aa3b2; margin-top:10px; }
    .ok { color:#7ee7a6; }
    .err { color:#ff9a9a; }
    .result { margin-top:14px; border-radius:12px; background:#0b1220; border:1px solid #1f2a3d; padding:14px; font-size:13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Zion Tech Group — Twinsburg Rack & Stack</h1>
      <p class="lead">Site: 8499 Darrow Road, Twinsburg, OH 44087. We need 2 engineers. US citizen required; passport + DL soft copies required before site access.</p>

      <form id="intake">
        <label>Full name *</label>
        <input id="fullName" required placeholder="First Last" />

        <div class="row">
          <div>
            <label>Email *</label>
            <input id="email" type="email" required placeholder="you@example.com" />
          </div>
          <div>
            <label>Phone</label>
            <input id="phone" placeholder="+1" />
          </div>
        </div>

        <div class="row">
          <div>
            <label>Availability date *</label>
            <input id="availability" required placeholder="Immediate / MM/DD" />
          </div>
          <div>
            <label>Rate preference *</label>
            <select id="ratePref" required>
              <option value="" disabled selected>Select</option>
              <option>Hourly</option>
              <option>Daily</option>
              <option>Both</option>
              <option>Prefer quote</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div>
            <label>Expected rate (USD)</label>
            <input id="rate" placeholder="e.g. $28/hr or $250/day" />
          </div>
          <div>
            <label>Work type</label>
            <select id="workType">
              <option value="contractor">Independent contractor</option>
              <option value="staffing">Staffing agency</option>
              <option value="employee">Open to employment</option>
            </select>
          </div>
        </div>

        <label>US citizen confirmation *</label>
        <select id="usCitizen" required>
          <option value="" disabled selected>Select</option>
          <option>Yes — US citizen</option>
          <option>No</option>
        </select>

        <label>Can you provide passport + DL soft copies before site access? *</label>
        <select id="canProvideDocs" required>
          <option value="" disabled selected>Select</option>
          <option>Yes</option>
          <option>No</option>
          <option>Need clarification</option>
        </select>

        <label>Certs / notes</label>
        <textarea id="notes" placeholder="Data center / cabling / CompTIA / OSHA / customer site experience..."></textarea>

        <button class="btn" type="submit">Submit intake</button>
        <div id="result" class="result" style="display:none;"></div>
        <p class="note">Contact: Kleber Garcia Alcatrão — +1 302 464 0950 — https://ziontechgroup.com</p>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('intake');
    const out = document.getElementById('result');
    form.addEventListener('submit', e => {
      e.preventDefault();
      const payload = {
        site: '8499 Darrow Road, Twinsburg, OH 44087',
        role: 'rack-and-stack engineer',
        fullName: document.getElementById('fullName').value.trim(),
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        availability: document.getElementById('availability').value.trim(),
        ratePref: document.getElementById('ratePref').value,
        rate: document.getElementById('rate').value.trim(),
        workType: document.getElementById('workType').value,
        usCitizen: document.getElementById('usCitizen').value,
        canProvideDocs: document.getElementById('canProvideDocs').value,
        notes: document.getElementById('notes').value.trim(),
        submittedAt: new Date().toISOString()
      };
      const key = 'zion_twinsburg_intake_';
      const raw = localStorage.getItem(key);
      const arr = raw ? JSON.parse(raw) : [];
      arr.push(payload);
      localStorage.setItem(key, JSON.stringify(arr));

      const lineItems = [
        `Name: ${payload.fullName}`,
        `Email: ${payload.email}`,
        `Phone: ${payload.phone || '—'}`,
        `Rate pref: ${payload.ratePref}`,
        `Rate: ${payload.rate || '—'}`,
        `US citizen: ${payload.usCitizen}`,
        `Docs: ${payload.canProvideDocs}`
      ].join('<br/>');
      out.style.display = 'block';
      out.innerHTML = `<div class="ok">Intake saved locally.</div><div>${lineItems}</div>`;
      form.reset();
    });
  </script>
</body>
</html>
