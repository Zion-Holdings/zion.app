<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog | Zion Tech Group</title>
  <meta name="description" content="AI and IT insights from Zion Tech Group: guides, playbooks, and implementation notes for modern teams.">
  <link rel="canonical" href="https://ziontechgroup.com/blog/">
  <style>
    :root { --bg:#020617; --text:#e5e7eb; --muted:#a1a1aa; --accent:#7c3aed; --accent-2:#10b981; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; background:radial-gradient(circle at top left,rgba(124,58,237,0.25),transparent 35%),var(--bg); color:var(--text); min-height:100vh; }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 96px 24px 64px; }
    h1 { font-size: clamp(32px, 5vw, 52px); line-height: 1.05; margin: 0 0 18px; background: linear-gradient(to right, #c4b5fd, #6ee7b7); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { color: var(--muted); font-size: 18px; line-height: 1.6; max-width: 760px; }
    .actions { display:flex; gap:16px; margin-top:28px; flex-wrap:wrap; }
    a.button { display:inline-block; padding:14px 22px; border-radius:12px; text-decoration:none; color:white; background:linear-gradient(135deg,#7c3aed,#10b981); font-weight:600; box-shadow:0 10px 25px rgba(124,58,237,0.35); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Blog</h1>
    <p>Practical guides on AI implementation, IT operations, cloud optimization, security, and more.</p>
    <div class="actions">
      <a class="button" href="/services/">Explore Services</a>
      <a class="button" href="/contact/" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);box-shadow:none;color:#e5e7eb;">Contact Us</a>
    </div>
  </div>
</body>
</html>
