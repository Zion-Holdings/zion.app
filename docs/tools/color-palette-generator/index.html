<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="/styles.css"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Color Palette Generator | Zion Tech Group Free Tools</title>
  <meta name="description" content="Generate color palettes instantly. Free online tool by Zion Tech Group." />
  <link rel="canonical" href="https://ziontechgroup.com/tools/color-palette-generator/" />
</head>
<body>
  <main>
    <h1>Color Palette Generator</h1>
    <p>Generate a random color palette.</p>
    <button onclick="gen()">Generate Palette</button>
    <div id="palette"></div>
    <p><a href="/tools/">Back to tools</a></p>
    <script>
      function gen(){
        const container=document.getElementById('palette');
        container.innerHTML='';
        for (let i=0;i<5;i++){
          const color=Math.floor(Math.random()*16777215).toString(16).padStart(6,'0');
          const div=document.createElement('div');
          div.style.cssText=`background:#${color};padding:20px;margin:5px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);`;
          div.textContent=`#${color}`;
          container.appendChild(div);
        }
      }
    </script>
  </main>
</body>
</html>
