<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subnet Calculator | Zion Tech Group Free Tools</title>
  <meta name="description" content="Calculate IP subnets and CIDR ranges. Free online tool by Zion Tech Group." />
  <link rel="canonical" href="https://ziontechgroup.com/tools/subnet-calculator/" />
</head>
<body>
  <main>
    <h1>Subnet Calculator</h1>
    <label>IP: <input id="ip" type="text" value="192.168.1.0" /></label><br />
    <label>CIDR: <input id="cidr" type="number" min="1" max="32" value="24" /></label><br />
    <button onclick="calc()">Calculate</button>
    <pre id="out"></pre>
    <p><a href="/tools/">Back to tools</a></p>
    <script>
      function calc(){
        const ip = document.getElementById('ip').value.split('.').map(Number);
        const cidr = parseInt(document.getElementById('cidr').value || '24', 10);
        const mask = -1 << (32 - cidr);
        const maskIP = [(mask >>> 24) & 255, (mask >>> 16) & 255, (mask >>> 8) & 255, mask & 255];
        const network = ip.map((o, i) => (o & maskIP[i])).join('.');
        const broadcast = ip.map((o, i) => (o | (~maskIP[i] & 255))).join('.');
        const hosts = Math.pow(2, 32 - cidr) - 2;
        document.getElementById('out').textContent = `Network: ${network}\nBroadcast: ${broadcast}\nUsable hosts: ${hosts}`;
      }
    </script>
  </main>
</body>
</html>
