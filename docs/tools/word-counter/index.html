<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Counter | Zion Tech Group Free Tools</title>
  <meta name="description" content="Count words and characters instantly. Free online tool by Zion Tech Group." />
  <link rel="canonical" href="https://ziontechgroup.com/tools/word-counter/" />
</head>
<body>
  <main>
    <h1>Word Counter</h1>
    <textarea id="text" rows="10" cols="80"></textarea>
    <button onclick="count()">Count</button>
    <pre id="out"></pre>
    <p><a href="/tools/">Back to tools</a></p>
    <script>
      function count(){
        const text = document.getElementById('text').value.trim();
        const words = text ? text.split(/\s+/).length : 0;
        const chars = text.length;
        document.getElementById('out').textContent = `Words: ${words}\nCharacters: ${chars}`;
      }
    </script>
  </main>
</body>
</html>
