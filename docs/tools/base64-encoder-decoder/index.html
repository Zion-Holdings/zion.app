<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Base64 Encoder/Decoder | Zion Tech Group Free Tools</title>
  <meta name="description" content="Encode and decode Base64 instantly. Free online tool by Zion Tech Group." />
  <link rel="canonical" href="https://ziontechgroup.com/tools/base64-encoder-decoder/" />
</head>
<body>
  <main>
    <h1>Base64 Encoder/Decoder</h1>
    <textarea id="in" rows="8" cols="80" placeholder="Input text"></textarea>
    <button onclick="encode()">Encode</button>
    <button onclick="decode()">Decode</button>
    <pre id="out"></pre>
    <p><a href="/tools/">Back to tools</a></p>
    <script>
      function encode(){
        try { document.getElementById('out').textContent = btoa(document.getElementById('in').value); }
        catch(e){ document.getElementById('out').textContent = 'Error: ' + e.message; }
      }
      function decode(){
        try { document.getElementById('out').textContent = atob(document.getElementById('in').value); }
        catch(e){ document.getElementById('out').textContent = 'Error: ' + e.message; }
      }
    </script>
  </main>
</body>
</html>
