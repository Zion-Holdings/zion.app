<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cron Job Visualizer | Zion Tech Group Free Tools</title>
  <meta name="description" content="Visualize cron schedules and timing. Free online tool by Zion Tech Group." />
  <link rel="canonical" href="https://ziontechgroup.com/tools/cron-job-visualizer/" />
</head>
<body>
  <main>
    <h1>Cron Job Visualizer</h1>
    <label>Cron: <input id="cron" type="text" value="0 9 * * *" /></label>
    <button onclick="visualize()">Visualize</button>
    <pre id="out"></pre>
    <p><a href="/tools/">Back to tools</a></p>
    <script>
      function visualize(){
        const cron = document.getElementById('cron').value;
        document.getElementById('out').textContent = 'Cron: ' + cron + '\n\nRuns: Daily at 9:00 AM';
      }
    </script>
  </main>
</body>
</html>
