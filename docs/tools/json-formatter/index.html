<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSON Formatter | Zion Tech Group Free Tools</title>
  <meta name="description" content="Format and validate JSON instantly. Free online tool by Zion Tech Group." />
  <link rel="canonical" href="https://ziontechgroup.com/tools/json-formatter/" />
</head>
<body>
  <main>
    <h1>JSON Formatter</h1>
    <textarea id="json" rows="10" cols="80">{"name":"Zion Tech Group","services":["AI","IT","Automation"]}</textarea>
    <button onclick="format()">Format</button>
    <pre id="out"></pre>
    <p><a href="/tools/">Back to tools</a></p>
    <script>
      function format(){
        try {
          const data = JSON.parse(document.getElementById('json').value);
          document.getElementById('out').textContent = JSON.stringify(data, null, 2);
        } catch (e) {
          document.getElementById('out').textContent = 'Error: ' + e.message;
        }
      }
    </script>
  </main>
</body>
</html>
