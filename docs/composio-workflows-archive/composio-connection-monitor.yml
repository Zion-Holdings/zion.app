name: composio-connection-monitor

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Composio SDK
        run: npm install @composio/core

      - name: Check connections
        id: check
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_1PASSWORD_CONNECTION_ID: ${{ secrets.COMPOSIO_1PASSWORD_CONNECTION_ID }}
        run: |
          cat > monitor.mjs <<'EOF'
          import { Composio } from '@composio/core';
          const composio = new Composio({ apiKey: process.env.COMPOSIO_API_KEY });
          const client = composio.getClient();
          const ids = [process.env.COMPOSIO_1PASSWORD_CONNECTION_ID];
          const labels = ['1password'];
          const results = [];
          for (let i = 0; i < ids.length; i++) {
            const id = ids[i];
            try {
              const res = await client.tools.execute('_1PASSWORD_LIST_ITEMS', { connection_id: id, entity_id: 'pg-test-b311dcc6-03f6-4077-8774-c90cfd6fcf29', arguments: {} });
              results.push({ label: labels[i], status: 'ACTIVE', ok: true });
            } catch (e) {
              results.push({ label: labels[i], status: 'INACTIVE', ok: false, message: e?.message || String(e) });
            }
          }
          const active = results.filter(r => r.ok).length;
          const inactive = results.filter(r => !r.ok).length;
          console.log(`Total: ${results.length}, Active: ${active}, Inactive: ${inactive}`);
          const fs = await import('fs');
          fs.writeFileSync('summary.json', JSON.stringify({ total: results.length, active, inactive, results }));
          EOF
          node monitor.mjs

      - name: Set outputs
        run: |
          echo "inactive_count=$(jq '.inactive' summary.json)" >> "$GITHUB_OUTPUT"
          echo "summary=$(jq -c . summary.json)" >> "$GITHUB_OUTPUT"

      - name: Show summary
        run: |
          cat summary.json
          if [ "${{ steps.set.outputs.inactive_count }}" -gt 0 ]; then
            echo "⚠️ Inactive connections detected"
            exit 1
          fi
