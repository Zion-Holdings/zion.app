name: outreach-llm-enable-check
permissions:
  contents: read

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/outreach/**'
      - '.github/workflows/outreach-llm-enable-check.yml'

jobs:
  llm-enable-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      enabled: ${{ steps.detect.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Detect configured LLM provider secrets
        id: detect
        run: |
          python - <<'PY'
          import json, os
          secrets = [
            'ZION_LLM_API_ENDPOINT',
            'ZION_LLM_API_KEY',
            'ZION_LLM_MODEL',
            'OPENROUTER_API_KEY',
            'GROQ_API_KEY',
            'GEMINI_API_KEY',
          ]
          present = [s for s in secrets if os.getenv(s)]
          print('SECRETS', json.dumps([s for s in present], separators=(',', ':')))
          enabled = len(present) > 0
          print(f'enabled={enabled}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f'enabled={"true" if enabled else "false"}\n')
          PY

      - name: Report readiness
        run: |-
          if [ '${{ steps.detect.outputs.enabled }}' = 'true' ]; then
            echo 'LLM_TAILORING_ACTIVE=true'
          else
            echo 'LLM_TAILORING_INACTIVE=true'
            echo '---'
            echo 'Live LLM tailoring is inactive.'
            echo 'To activate, add one of these secret sets in GitHub > Settings > Secrets and variables > Actions:'
            echo '  - ZION_LLM_API_ENDPOINT, ZION_LLM_API_KEY, ZION_LLM_MODEL'
            echo '  - OPENROUTER_API_KEY'
            echo '  - GROQ_API_KEY'
            echo '  - GEMINI_API_KEY'
            echo 'Do not expose secret values in logs or commit them to the repository.'
          fi
