name: Pages Watchdog

permissions:
  contents: read
  issues: write

concurrency:
  group: pages-watchdog
  cancel-in-progress: true

"on":
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: python -m pip install requests
      - name: Probe Pages
        run: python automation/scripts/pages_watchdog.py
      - name: Upload report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-watchdog-report
          path: automation/reports/pages-watchdog-latest.json
          retention-days: 7
      - name: Create issue on regression
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = 'automation/reports/pages-watchdog-latest.json';
            let body = 'Pages watchdog failed.';
            try {
              const data = JSON.parse(fs.readFileSync(path, 'utf8'));
              body = `## Pages Watchdog Failure\n\n${data.routes_checked} checked, ${data.routes_broken} broken at ${data.checked_at}.\n\nReport: \`pages-watchdog-report\` artifact in this run.`;
            } catch {}
            await github.rest.issues.create({
              ...context.repo,
              title: `🔴 Pages Watchdog Failure - ${new Date().toISOString().split('T')[0]}`,
              body,
              labels: ['production-incident', 'bug']
            });
