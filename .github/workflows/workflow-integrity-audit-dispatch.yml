name: Workflow integrity audit (manual)

permissions:
  contents: read

"on":
  workflow_dispatch:

concurrency:
  group: workflow-integrity-audit-dispatch
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Workflow integrity audit (duplicate names/bodies, malformed headers)
        run: node automation/github-workflow-integrity-auditor.cjs

      - name: Upload integrity report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-workflow-integrity-audit-${{ github.run_id }}
          path: automation/reports/github-workflow-integrity-audit-latest.json
          if-no-files-found: ignore
          retention-days: 14
