name: Mirror main build to gh-pages branch

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Guard against source-less trees
        run: node scripts/checks/source-integrity-check.cjs

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build site
        run: |
          set -euo pipefail
          mkdir -p out/docs out/public
          if [ -d docs ]; then cp -Rf docs/. out/docs/; fi
          if [ -d public ]; then cp -Rf public/. out/public/; fi
          find . -maxdepth 1 -name '*.html' -type f -exec cp -f {} out/ \; || true
          if npm run build:check || npm run build; then
            echo "Next build succeeded"
          else
            echo "::warning::Next build failed; mirroring committed static fallbacks"
          fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          keep_files: false
          user_name: Zion CI
          user_email: ci@ziontechgroup.com
