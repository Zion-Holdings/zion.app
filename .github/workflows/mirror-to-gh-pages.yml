name: Mirror main build to gh-pages branch

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Mirror static fallbacks to gh-pages
        run: |
          set -euo pipefail
          mkdir -p out
          if [ -d public ]; then cp -Rf public/. out/; fi
          if [ -d docs ]; then mkdir -p out/docs && cp -Rf docs/. out/docs/; fi
          find . -maxdepth 1 -name '*.html' -type f -exec cp -f {} out/ \; || true
          printf 'ziontechgroup.com\n' > out/CNAME
          test -s out/CNAME
          test -f out/index.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          keep_files: true
          user_name: Zion CI
          user_email: ci@ziontechgroup.com
          cname: ziontechgroup.com
