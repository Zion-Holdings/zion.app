name: Mirror main build to gh-pages branch

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm install; else echo "No package.json; static publish only"; fi

      - name: Build site
        run: |
          set -euo pipefail
          mkdir -p out
          if [ -f package.json ]; then
            npm run pages:sync || true
            npm run build || echo "Next build skipped; publishing public/ fallbacks"
          fi
          cp -Rf public/. out/
          cp -Rf docs/. out/docs/ 2>/dev/null || true
          [ -f CNAME ] && cp -f CNAME out/CNAME || true
          [ -f public/CNAME ] && cp -f public/CNAME out/CNAME || true
          find . -maxdepth 1 -name '*.html' -type f -exec cp -f {} out/ \;

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          keep_files: false
          user_name: Zion CI
          user_email: ci@ziontechgroup.com
