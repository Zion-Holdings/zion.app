name: composio-onepassword-master

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  onepassword:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      COMPOSIO_1PASSWORD_CONNECTION_ID: ${{ secrets.COMPOSIO_1PASSWORD_CONNECTION_ID }}
      ENTITY_ID: pg-test-b311dcc6-03f6-4077-8774-c90cfd6fcf29
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @composio/core

      - name: List 1Password items via Composio
        id: onepassword
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_1PASSWORD_CONNECTION_ID: ${{ secrets.COMPOSIO_1PASSWORD_CONNECTION_ID }}
          ENTITY_ID: pg-test-b311dcc6-03f6-4077-8774-c90cfd6fcf29
        run: |
          cat > sync.mjs <<'EOF'
          import { Composio } from '@composio/core';
          const composio = new Composio({ apiKey: process.env.COMPOSIO_API_KEY });
          const client = composio.getClient();
          const connectionId = process.env.COMPOSIO_1PASSWORD_CONNECTION_ID;
          const vaultResult = await client.tools.execute('_1PASSWORD_LIST_VAULTS', {
            connection_id: connectionId,
            entity_id: 'pg-test-b311dcc6-03f6-4077-8774-c90cfd6fcf29',
            arguments: {}
          });
          const vaults = vaultResult?.data?.items || [];
          const vaultId = vaults[0]?.id;
          if (!vaultId) {
            console.log(JSON.stringify({ ok: false, error: 'No vaults found', vaultResult }, null, 2));
            process.exit(0);
          }
          const result = await client.tools.execute('_1PASSWORD_LIST_ITEMS', {
            connection_id: connectionId,
            entity_id: 'pg-test-b311dcc6-03f6-4077-8774-c90cfd6fcf29',
            arguments: { vault_id: vaultId }
          });
          console.log(JSON.stringify({ ok: true, vaultId, result }, null, 2));
          EOF
          node sync.mjs

      - name: Comment summary
        run: |
          echo "1Password sync executed successfully." >> "$GITHUB_STEP_SUMMARY"
