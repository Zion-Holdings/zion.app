name: composio-onepassword-master

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  onepassword:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      COMPOSIO_1PASSWORD_CONNECTION_ID: ${{ secrets.COMPOSIO_1PASSWORD_CONNECTION_ID }}
      ENTITY_ID: pg-test-b311dcc6-03f6-4077-8774-c90cfd6fcf29
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @composio/core

      - name: List 1Password items via Composio
        id: onepassword
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: |
          mkdir -p .github/scripts
          cat > .github/scripts/op.mjs <<'NODE'
          import { Composio } from '@composio/core';
          const composio = new Composio({ apiKey: process.env.COMPOSIO_API_KEY });
          const connectionId = process.env.COMPOSIO_1PASSWORD_CONNECTION_ID;
          const entityId = process.env.ENTITY_ID;
          const result = await composio.tools.execute('_1PASSWORD_LIST_ITEMS', {
            connection_id: connectionId,
            entity_id: entityId,
            arguments: {}
          });
          const out = {
            ok: true,
            connectionId,
            toolkit: '_1PASSWORD_LIST_ITEMS',
            entityId,
            result
          };
          console.log(JSON.stringify(out, null, 2));
          NODE
          node .github/scripts/op.mjs

      - name: Comment summary
        run: |
          echo "1Password sync executed successfully." >> "$GITHUB_STEP_SUMMARY"
