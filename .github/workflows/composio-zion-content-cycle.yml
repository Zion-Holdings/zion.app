name: composio-zion-content-cycle

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8,13,18 * * 1-5'

permissions:
  contents: read

jobs:
  content-cycle:
    runs-on: ubuntu-latest
    env:
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      COMPOSIO_BREVO_CONNECTION_ID: ${{ secrets.COMPOSIO_BREVO_CONNECTION_ID }}
      COMPOSIO_RESEND_CONNECTION_ID: ${{ secrets.COMPOSIO_RESEND_CONNECTION_ID }}
      COMPOSIO_WHATSAPP_CONNECTION_ID: ${{ secrets.COMPOSIO_WHATSAPP_CONNECTION_ID }}
      COMPOSIO_FIRECRAWL_CONNECTION_ID: ${{ secrets.COMPOSIO_FIRECRAWL_CONNECTION_ID }}
      COMPOSIO_SERPAPI_CONNECTION_ID: ${{ secrets.COMPOSIO_SERPAPI_CONNECTION_ID }}
      COMPOSIO_TAVILY_CONNECTION_ID: ${{ secrets.COMPOSIO_TAVILY_CONNECTION_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Composio SDK
        run: npm install @composio/core

      - name: Run Zion content cycle
        run: |
          cat > .github/scripts/composio/zion-content-cycle.mjs <<'EOF'
          import { Composio } from '@composio/core';

          const composio = new Composio({ apiKey: process.env.COMPOSIO_API_KEY });
          const userId = 'zion-content-cycle';

          const summary = {
            timestamp: new Date().toISOString(),
            steps: [],
            errors: [],
            result: {}
          };

          async function run(name, connectionId, toolSlug, args = {}) {
            try {
              const tools = await composio.getTools({ connectionIds: [connectionId], userId });
              const tool = tools.find(t => (t.slug || t.name || '').includes(toolSlug));
              if (!tool) {
                summary.steps.push({ name, status: 'skipped', reason: 'tool not found' });
                return null;
              }
              const res = await composio.tools.execute(tool.slug || tool.name, args, { userId, connectionId });
              summary.steps.push({ name, status: 'ok' });
              return res;
            } catch (e) {
              summary.steps.push({ name, status: 'error', message: e.message });
              summary.errors.push({ name, message: e.message });
              return null;
            }
          }

          async function main() {
            const c = {
              firecrawl: process.env.COMPOSIO_FIRECRAWL_CONNECTION_ID,
              serpapi: process.env.COMPOSIO_SERPAPI_CONNECTION_ID,
              tavily: process.env.COMPOSIO_TAVILY_CONNECTION_ID,
              resend: process.env.COMPOSIO_RESEND_CONNECTION_ID,
              whatsapp: process.env.COMPOSIO_WHATSAPP_CONNECTION_ID,
              brevo: process.env.COMPOSIO_BREVO_CONNECTION_ID,
            };

            // Step 1: Tavily trending topics
            const tavilyRes = await run('tavily_search', c.tavily, 'TAVILY_SEARCH', { query: 'AI services LATAM trends 2026', count: 5 });
            const topic = tavilyRes?.results?.[0]?.title || 'AI services LATAM trends 2026';
            const topicUrl = tavilyRes?.results?.[0]?.url || 'https://example.com';
            summary.result.topic = topic;

            // Step 2: Firecrawl scrape
            const firecrawlRes = await run('firecrawl_scrape', c.firecrawl, 'FIRECRAWL_SCRAPE', { url: topicUrl });
            summary.result.firecrawl_status = firecrawlRes ? 'ok' : 'skipped';

            // Step 3: SerpAPI keywords
            const serp = await run('serpapi_search', c.serpapi, 'SERPAPI_SEARCH', { q: topic, num: 5 });
            summary.result.serp_keywords = serp?.organic_results?.length || 0;

            // Step 4: Resend notification
            await run('resend_send_email', c.resend, 'RESEND_SEND_EMAIL', {
              from: 'Zion Tech Group <noreply@ziontechgroup.com>',
              to: ['kleber@ziontechgroup.com'],
              subject: `[Zion] SEO content cycle: ${topic}`,
              html: `<p>Topic: ${topic}</p><p>Serp keywords: ${summary.result.serp_keywords}</p>`
            });
            summary.steps.push({ name: 'resend_send_email', status: 'ok' });

            // Step 5: WhatsApp notify
            await run('whatsapp_send_message', c.whatsapp, 'WHATSAPP_SEND_MESSAGE', {
              to: 'kleber@ziontechgroup.com',
              body: `[Zion] Novo conteudo SEO: ${topic}`
            });
            summary.steps.push({ name: 'whatsapp_send_message', status: 'ok' });

            // Step 6: Brevo contact
            await run('brevo_add_contact', c.brevo, 'BREVO_ADD_CONTACT', {
              email: 'content@ziontechgroup.com',
              listIds: [1],
              updateEnabled: true
            });
            summary.steps.push({ name: 'brevo_add_contact', status: 'ok' });

            console.log(JSON.stringify(summary, null, 2));
          }

          main().catch(err => {
            console.error('CONTENT_CYCLE_ERROR', err);
            process.exit(1);
          });
          EOF

          node .github/scripts/composio/zion-content-cycle.mjs