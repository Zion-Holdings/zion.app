name: OpenClaw autonomy handoff snapshot

permissions:
  contents: read

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

concurrency:
  group: openclaw-handoff-snapshot
  cancel-in-progress: false

jobs:
  handoff-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Generate handoff from repository reports
        run: node automation/openclaw-autonomy-handoff.cjs

      - name: Validate handoff shape
        run: node automation/openclaw-handoff-validate.cjs

      - name: Upload handoff artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-autonomy-handoff-${{ github.run_id }}
          path: automation/reports/openclaw-autonomy-handoff-latest.json
          if-no-files-found: warn
          retention-days: 14
