name: Minimal Build Test
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    branches:
    - main
jobs:
  minimal:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
    - run: rm -rf node_modules .next out
    - run: npm ci --no-audit --fund=false
    - run: npm run build
    timeout-minutes: 10
