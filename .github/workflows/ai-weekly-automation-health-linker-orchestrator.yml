name: AI weekly automation health linker orchestrator

permissions:
  contents: read
  issues: write

"on":
  workflow_dispatch:
  schedule:
    - cron: '12 */6 * * *'

concurrency:
  group: ai-weekly-automation-health-linker-orchestrator
  cancel-in-progress: false

jobs:
  linker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Run weekly health linker orchestrator
        env:
          GH_TOKEN: ${{ github.token }}
          WEEKLY_HEALTH_LINKER_CONFIDENCE_MIN: ${{ vars.WEEKLY_HEALTH_LINKER_CONFIDENCE_MIN }}
          WEEKLY_HEALTH_LINKER_WARN_DAYS: ${{ vars.WEEKLY_HEALTH_LINKER_WARN_DAYS }}
          WEEKLY_HEALTH_LINKER_CRIT_DAYS: ${{ vars.WEEKLY_HEALTH_LINKER_CRIT_DAYS }}
          WEEKLY_HEALTH_LINKER_WINDOW_HOURS: ${{ vars.WEEKLY_HEALTH_LINKER_WINDOW_HOURS }}
        run: node automation/weekly-automation-health-linker-orchestrator.cjs

      - name: Upload linker state artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: weekly-health-linker-${{ github.run_id }}
          path: automation/reports/weekly-automation-health-linker-state.json
          if-no-files-found: ignore
          retention-days: 30
