name: Autonomous Lazy-Loading Route Slicer
permissions:
  contents: read
on:
  schedule:
  - cron: 0 4 * * 0
  workflow_dispatch:
    inputs:
      apply:
        description: Apply transformations (creates PR)
        required: false
        default: 'false'
        type: boolean
jobs:
  route-slicer:
    name: Lazy-Load Route Slicer
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Build app (to generate bundle stats)
        run: |
          ANALYZE=true npm run build
          if [ ! -d ".next/stats" ]; then
            echo "No bundle stats found. Run with ANALYZE=true to generate."
            exit 1
          fi
      - name: Run Route Slicer (dry-run)
        id: slicer
        continue-on-error: true
        run: |
          node automation/route-slicer.cjs > /tmp/route-slicer-output.txt || true
          echo "exit_code=$?" >> $GITHUB_OUTPUT
      - name: Upload proposal artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: route-slicer-proposal
          path: .hermes/memory/route-slicer/proposals/*
          retention-days: 30
      - name: Notify Telegram on proposals
        if: success() && steps.slicer.outputs.exit_code == '0'
        run: |
          PROPOSALS=$(find .hermes/memory/route-slicer/proposals -name summary.json 2>/dev/null | wc -l)
          if [ "$PROPOSALS" -gt 0 ]; then
            node automation/notify-telegram.js "🚀 Route Slicer: $PROPOSALS route optimization proposal(s) ready for review."
          fi
      - name: Notify Telegram on errors
        if: failure()
        run: node automation/notify-telegram.js "⚠️ Route Slicer encountered errors. Check workflow logs."
    timeout-minutes: 10
