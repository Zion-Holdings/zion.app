name: Composio Calendly Paid Consultations
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
jobs:
  calendly-paid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Composio SDK
        run: npm install composio
      - name: Sync paid consultations
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          CALENDLY_CONNECTION_ID: ${{ secrets.CALENDLY_CONNECTION_ID }}
          STRIPE_CONNECTION_ID: ${{ secrets.STRIPE_CONNECTION_ID }}
        run: |
          cat > scripts/composio/calendly-paid-sync.js << 'EOF'
          const { Composio } = require('composio');
          const client = new Composio({ apiKey: process.env.COMPOSIO_API_KEY });
          (async () => {
            try {
              const calendlyTools = await client.tools.get('calendly', { userId: process.env.CALENDLY_CONNECTION_ID });
              const stripeTools = await client.tools.get('stripe', { userId: process.env.STRIPE_CONNECTION_ID });
              console.log('Calendly tools:', calendlyTools.tools.length);
              console.log('Stripe tools:', stripeTools.tools.length);
            } catch (e) { console.error('Calendly sync error:', e.message); }
          })();
          EOF
          node scripts/composio/calendly-paid-sync.js
