name: Lighthouse Production Audit

permissions:
  contents: read

concurrency:
  group: lighthouse-production
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 12 * * 0'
  workflow_dispatch:

jobs:
  lighthouse-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Run Lighthouse production audit
        run: npm run lighthouse:production

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-production-${{ github.run_id }}
          path: automation/reports/lighthouse-production-latest.json
          if-no-files-found: ignore
          retention-days: 30
