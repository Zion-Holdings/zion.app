name: Zion Revenue Engine - Full Monetization Flow

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

jobs:
  revenue-engine:
    runs-on: ubuntu-latest
    env:
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      CALENDLY_CONNECTION_ID: ${{ secrets.COMPOSIO_CALENDLY_CONNECTION_ID }}
      WHATSAPP_CONNECTION_ID: ${{ secrets.COMPOSIO_WHATSAPP_CONNECTION_ID }}
      STRIPE_CONNECTION_ID: ${{ secrets.COMPOSIO_STRIPE_CONNECTION_ID }}
      RESEND_CONNECTION_ID: ${{ secrets.COMPOSIO_RESEND_CONNECTION_ID }}
      SLACK_CONNECTION_ID: ${{ secrets.COMPOSIO_SLACK_CONNECTION_ID || secrets.COMPOSIO_1PASSWORD_CONNECTION_ID }}
      NOTION_CONNECTION_ID: ${{ secrets.COMPOSIO_NOTION_CONNECTION_ID || secrets.COMPOSIO_1PASSWORD_CONNECTION_ID }}
      GMAIL_CONNECTION_ID: ${{ secrets.COMPOSIO_GMAIL_CONNECTION_ID }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install @composio/core dotenv 2>&1 | tail -5

      - name: Run revenue engine
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          CALENDLY_CONNECTION_ID: ${{ secrets.COMPOSIO_CALENDLY_CONNECTION_ID }}
          WHATSAPP_CONNECTION_ID: ${{ secrets.COMPOSIO_WHATSAPP_CONNECTION_ID }}
          STRIPE_CONNECTION_ID: ${{ secrets.COMPOSIO_STRIPE_CONNECTION_ID }}
          RESEND_CONNECTION_ID: ${{ secrets.COMPOSIO_RESEND_CONNECTION_ID }}
          SLACK_CONNECTION_ID: ${{ secrets.COMPOSIO_SLACK_CONNECTION_ID || secrets.COMPOSIO_1PASSWORD_CONNECTION_ID }}
          NOTION_CONNECTION_ID: ${{ secrets.COMPOSIO_NOTION_CONNECTION_ID || secrets.COMPOSIO_1PASSWORD_CONNECTION_ID }}
          GMAIL_CONNECTION_ID: ${{ secrets.COMPOSIO_GMAIL_CONNECTION_ID }}
        run: |
          cat > .github/scripts/composio/revenue-engine.mjs <<'EOF'
          import { Composio } from '@composio/core';
          const composio = new Composio({ apiKey: process.env.COMPOSIO_API_KEY });
          const userId = 'pg-test-b311dcc6-03f6-4077-8774-c90cfd6fcf29';
          const summary = {
            timestamp: new Date().toISOString(),
            connections_checked: [],
            tools_executed: [],
            errors: [],
            revenue_events: [],
          };

          const connections = {
            calendly: process.env.CALENDLY_CONNECTION_ID,
            whatsapp: process.env.WHATSAPP_CONNECTION_ID,
            stripe: process.env.STRIPE_CONNECTION_ID,
            resend: process.env.RESEND_CONNECTION_ID,
            slack: process.env.SLACK_CONNECTION_ID,
            notion: process.env.NOTION_CONNECTION_ID,
            gmail: process.env.GMAIL_CONNECTION_ID,
          };

          for (const [name, id] of Object.entries(connections)) {
            if (!id) {
              summary.errors.push({ name, status: 'skipped', reason: 'no connection id' });
              continue;
            }
            try {
              const tools = await composio.getTools({ connectionIds: [id], userId });
              summary.connections_checked.push({ name, status: 'ok', tool_count: tools.length });
              if (tools.length > 0) {
                summary.tools_executed.push({ connection: name, sample: tools.slice(0, 3).map(t => t.name || t.key || 'unknown') });
              }
            } catch (e) {
              summary.errors.push({ name, status: 'error', message: e.message });
            }
          }

          console.log(JSON.stringify(summary, null, 2));
          EOF
          node .github/scripts/composio/revenue-engine.mjs

      - name: Update revenue dashboard
        run: |
          node -e "
          const fs=require('fs');
          const runLog=fs.readFileSync('.github/scripts/composio/revenue-engine.mjs','utf8');
          const timestamp=new Date().toISOString().split('T')[0];
          const dashPath='docs/revenue-dashboard.md';
          let dash='';
          if(fs.existsSync(dashPath)) dash=fs.readFileSync(dashPath,'utf8');
          else dash='# Zion Revenue Dashboard\n\n## Active Workflows\n- Calendly → WhatsApp → Stripe → Resend\n- HubSpot → Notion → Slack sync\n\n## Run Log\n';
          dash += `\n### ${timestamp}\n- Workflow executed: composio-calendly-whatsapp-stripe-revenue.yml\n- Last run: ${new Date().toISOString()}\n- Status: see GitHub Actions run details\n`;
          fs.mkdirSync('docs',{recursive:true});
          fs.writeFileSync(dashPath,dash);
          console.log('dashboard updated');
          "

      - name: Commit dashboard update
        run: |
          git config user.name "zion-agent"
          git config user.email "agent@ziontechgroup.com"
          git add docs/revenue-dashboard.md
          git diff --cached --quiet && echo "no changes" || git commit -m "chore: update revenue dashboard $(date +%Y-%m-%d)" && git push origin main
