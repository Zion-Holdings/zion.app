name: Zion Revenue Engine - Unified Production

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9,14 * * 1-5'

permissions:
  contents: read

jobs:
  revenue-engine:
    runs-on: ubuntu-latest
    env:
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      COMPOSIO_CALENDLY_CONNECTION_ID: ${{ secrets.COMPOSIO_CALENDLY_CONNECTION_ID }}
      COMPOSIO_WHATSAPP_CONNECTION_ID: ${{ secrets.COMPOSIO_WHATSAPP_CONNECTION_ID }}
      COMPOSIO_STRIPE_CONNECTION_ID: ${{ secrets.COMPOSIO_STRIPE_CONNECTION_ID }}
      COMPOSIO_RESEND_CONNECTION_ID: ${{ secrets.COMPOSIO_RESEND_CONNECTION_ID }}
      COMPOSIO_GMAIL_CONNECTION_ID: ${{ secrets.COMPOSIO_GMAIL_CONNECTION_ID }}
      COMPOSIO_HUBSPOT_CONNECTION_ID: ${{ secrets.COMPOSIO_HUBSPOT_CONNECTION_ID }}
      COMPOSIO_NOTION_CONNECTION_ID: ${{ secrets.COMPOSIO_NOTION_CONNECTION_ID }}
      COMPOSIO_SLACK_CONNECTION_ID: ${{ secrets.COMPOSIO_SLACK_CONNECTION_ID || secrets.COMPOSIO_1PASSWORD_CONNECTION_ID }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Composio SDK
        run: npm install @composio/core

      - name: Run revenue engine
        run: |
          cat > .github/scripts/composio/revenue-engine.mjs <<'EOF'
          import { Composio } from '@composio/core';

          const composio = new Composio({ apiKey: process.env.COMPOSIO_API_KEY });
          const userId = 'zion-revenue-engine';
          const summary = {
            timestamp: new Date().toISOString(),
            connections_checked: [],
            tools_executed: [],
            errors: [],
            revenue_events: [],
            metrics: { leads: 0, bookings: 0, revenue: 0, messages: 0 },
          };

          const connections = {
            calendly: process.env.COMPOSIO_CALENDLY_CONNECTION_ID,
            whatsapp: process.env.COMPOSIO_WHATSAPP_CONNECTION_ID,
            stripe: process.env.COMPOSIO_STRIPE_CONNECTION_ID,
            resend: process.env.COMPOSIO_RESEND_CONNECTION_ID,
            gmail: process.env.COMPOSIO_GMAIL_CONNECTION_ID,
            hubspot: process.env.COMPOSIO_HUBSPOT_CONNECTION_ID,
            notion: process.env.COMPOSIO_NOTION_CONNECTION_ID,
            slack: process.env.COMPOSIO_SLACK_CONNECTION_ID,
          };

          async function getTools(name, connectionId) {
            if (!connectionId) {
              summary.errors.push({ name, status: 'skipped', reason: 'no connection id' });
              return [];
            }
            try {
              const tools = await composio.getTools({ connectionIds: [connectionId], userId });
              summary.connections_checked.push({ name, status: 'ok', tool_count: tools.length });
              return tools;
            } catch (e) {
              summary.errors.push({ name, status: 'error', message: e.message });
              return [];
            }
          }

          async function main() {
            // Check all connections
            for (const [name, connectionId] of Object.entries(connections)) {
              const tools = await getTools(name, connectionId);
              if (tools.length > 0) {
                summary.tools_executed.push({ connection: name, sample: tools.slice(0, 5).map(t => t.slug || t.name || 'unknown') });
              }
            }

            // If Stripe is connected, try to list recent customers/charges
            if (connections.stripe) {
              try {
                const stripeTools = await getTools('stripe', connections.stripe);
                const listCustomers = stripeTools.find(t => (t.slug || t.name || '').includes('STRIPE_LIST_CUSTOMERS'));
                const listCharges = stripeTools.find(t => (t.slug || t.name || '').includes('STRIPE_LIST_CHARGES'));
                if (listCustomers) {
                  const customers = await composio.tools.execute(listCustomers.slug || listCustomers.name, {}, { userId, connectionId: connections.stripe });
                  summary.metrics.leads = customers?.data?.length || 0;
                }
                if (listCharges) {
                  const charges = await composio.tools.execute(listCharges.slug || listCharges.name, { limit: 10 }, { userId, connectionId: connections.stripe });
                  const total = (charges?.data || []).reduce((sum, c) => sum + (c.amount || 0), 0);
                  summary.metrics.revenue = total;
                }
                summary.revenue_events.push({ type: 'stripe_sync', status: 'ok' });
              } catch (e) {
                summary.errors.push({ name: 'stripe', status: 'sync_error', message: e.message });
              }
            }

            // If Calendly is connected, try to list events
            if (connections.calendly) {
              try {
                const calendlyTools = await getTools('calendly', connections.calendly);
                const listEvents = calendlyTools.find(t => (t.slug || t.name || '').includes('CALENDLY_LIST_EVENTS') || (t.slug || t.name || '').includes('CALENDLY_GET_EVENTS'));
                if (listEvents) {
                  const events = await composio.tools.execute(listEvents.slug || listEvents.name, { count: 10 }, { userId, connectionId: connections.calendly });
                  summary.metrics.bookings = events?.data?.length || events?.events?.length || 0;
                }
                summary.revenue_events.push({ type: 'calendly_sync', status: 'ok' });
              } catch (e) {
                summary.errors.push({ name: 'calendly', status: 'sync_error', message: e.message });
              }
            }

            console.log(JSON.stringify(summary, null, 2));
          }

          main().catch((err) => {
            console.error('FATAL:', err);
            process.exit(1);
          });
          EOF
          node .github/scripts/composio/revenue-engine.mjs

      - name: Update revenue dashboard
        run: |
          node -e "
          const fs=require('fs');
          const runLog=fs.readFileSync('.github/scripts/composio/revenue-engine.mjs','utf8');
          const timestamp=new Date().toISOString().split('T')[0];
          const dashPath='docs/revenue-dashboard.md';
          let dash='';
          if(fs.existsSync(dashPath)) dash=fs.readFileSync(dashPath,'utf8');
          else dash='# Zion Revenue Dashboard\n\n## Active Workflows\n- Calendly → WhatsApp → Stripe → Resend\n- HubSpot → Notion → Slack sync\n\n## Run Log\n';
          dash += `\n### ${timestamp}\n- Workflow executed: composio-calendly-whatsapp-stripe-revenue.yml\n- Last run: ${new Date().toISOString()}\n- Status: see GitHub Actions run details\n`;
          fs.mkdirSync('docs',{recursive:true});
          fs.writeFileSync(dashPath,dash);
          console.log('dashboard updated');
          "

      - name: Commit dashboard update
        run: |
          git config user.name "zion-agent"
          git config user.email "agent@ziontechgroup.com"
          git add docs/revenue-dashboard.md
          git diff --cached --quiet && echo "no changes" || git commit -m "chore: update revenue dashboard $(date +%Y-%m-%d)" && git push origin main
