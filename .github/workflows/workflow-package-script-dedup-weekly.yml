# Scheduled check for duplicate keys in package.json "scripts" (complements path-filtered fast workflow).

name: Package script dedup check (weekly)

permissions:
  contents: read

"on":
  schedule:
    - cron: '28 6 * * 2' # Tuesdays 06:28 UTC
  workflow_dispatch:

concurrency:
  group: workflow-package-script-dedup-weekly
  cancel-in-progress: true

jobs:
  dedup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: No duplicate npm script keys in package.json
        run: node scripts/automation/check-package-script-duplicates.cjs
