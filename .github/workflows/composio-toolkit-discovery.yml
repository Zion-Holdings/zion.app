name: composio-toolkit-discovery

on:
  workflow_dispatch:
    inputs:
      toolkit:
        description: 'Composio toolkit slug, e.g. whatsapp, firecrawl, brevo, stripe, calendly, serpapi, tavily'
        required: true
        type: string
      query:
        description: 'Optional tool search query, e.g. send, crawl, search, list'
        required: false
        type: string
        default: ''

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm install @composio/core
      - name: Discover toolkit tools
        run: |
          cat > /tmp/discover.mjs <<'NODE'
          import { Composio } from '@composio/core';
          const toolkit = process.argv[2];
          const query = process.argv[3] || '';
          const apiKey = process.env.COMPOSIO_API_KEY;
          if (!apiKey) {
            console.error('Missing COMPOSIO_API_KEY');
            process.exit(1);
          }
          const composio = new Composio({ apiKey });
          const toolkitData = await composio.toolkits.getToolkitBySlug({ slug: toolkit });
          const tools = await composio.tools.get({ toolkit });
          const items = Array.isArray(tools) ? tools : [];
          let output = `Toolkit: ${toolkitData?.name || toolkit}\nTools count: ${items.length}\n`;
          const filtered = query
            ? items.filter(t => {
                const hay = `${t.name} ${t.description} ${(t.meta || {}).tags?.join(' ') || ''}`.toLowerCase();
                return hay.includes(query.toLowerCase());
              })
            : items;
          for (const t of filtered.slice(0, 50)) {
            output += `- ${t.slug}: ${t.description?.slice(0, 120) || t.name}\n`;
          }
          console.log(output);
          NODE
          node /tmp/discover.mjs "${{ inputs.toolkit }}" "${{ inputs.query }}"
