name: Composio Calendar to Slack Reminder

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  calendar-to-slack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install @composio/core 2>/dev/null || true
      - run: node scripts/composio/calendar-to-slack-check.js
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
