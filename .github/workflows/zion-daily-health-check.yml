name: zion-daily-health-check

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Composio SDK
        run: npm install @composio/core

      - name: Check site uptime
        run: |
          for url in https://ziontechgroup.com https://ziontechgroup.com/about https://ziontechgroup.com/services; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "$url")
            echo "$url: $code"
            if [ "$code" != "200" ]; then
              echo "::error::Site down: $url returned $code"
            fi
          done

      - name: Check Composio connections
        id: composio
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: |
          cat > health.mjs <<'EOF'
          import { Composio } from '@composio/core';
          const composio = new Composio({ apiKey: process.env.COMPOSIO_API_KEY });
          const client = composio.getClient();
          const accounts = await client.connectedAccounts.list({});
          const items = accounts.items || [];
          const active = items.filter(a => a.status === 'ACTIVE');
          const inactive = items.filter(a => a.status !== 'ACTIVE');
          console.log(`Total: ${items.length}, Active: ${active.length}, Inactive: ${inactive.length}`);
          const fs = await import('fs');
          fs.writeFileSync('composio-status.json', JSON.stringify({
            total: items.length,
            active: active.length,
            inactive: inactive.length,
            accounts: items.map(a => ({ id: a.id, toolkit: a.toolkit?.slug, status: a.status }))
          }, null, 2));
          EOF
          node health.mjs

      - name: Comment summary
        run: |
          echo "## 🏥 Zion Daily Health Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Site Uptime" >> "$GITHUB_STEP_SUMMARY"
          echo "- ziontechgroup.com: checked" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Composio Status" >> "$GITHUB_STEP_SUMMARY"
          cat composio-status.json >> "$GITHUB_STEP_SUMMARY"
