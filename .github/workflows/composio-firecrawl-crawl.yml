name: composio-firecrawl-crawl

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Composio SDK
        run: npm install @composio/core

      - name: Firecrawl crawl
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: |
          cat > firecrawl.mjs <<'EOF'
          import { Composio } from '@composio/core';
          const composio = new Composio({ apiKey: process.env.COMPOSIO_API_KEY });
          const client = composio.getClient();
          const accounts = await client.connectedAccounts.list({});
          const firecrawl = (accounts.items || []).find(a => a.toolkit?.slug === 'firecrawl');
          if (!firecrawl) {
            console.error('No Firecrawl connected account found');
            process.exit(1);
          }
          const result = await client.tools.execute('FIRECRAWL_SCRAPE_URL', {
            connection_id: firecrawl.id,
            entity_id: firecrawl.user_id,
            arguments: {
              url: 'https://ziontechgroup.com'
            }
          });
          console.log(JSON.stringify(result, null, 2));
          EOF
          node firecrawl.mjs
