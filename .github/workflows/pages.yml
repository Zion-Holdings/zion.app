name: GitHub Pages

# New main is already a static export. Pages currently serves origin/gh-pages,
# which has no CNAME — that is why ziontechgroup.com returns GitHub's 404.
# This job restages the tree, forces the apex CNAME, and mirrors to gh-pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Stage static site with apex CNAME
        run: |
          set -euo pipefail
          mkdir -p out
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'out/' \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            --exclude 'automation/reports/' \
            --exclude '.composio/' \
            ./ out/
          printf 'ziontechgroup.com\n' > out/CNAME
          test -s out/CNAME
          echo "Publishing $(find out -type f | wc -l) files; CNAME=$(tr -d '\n' < out/CNAME)"

      - name: Mirror to gh-pages with CNAME
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: false
          keep_files: false
          cname: ziontechgroup.com
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
