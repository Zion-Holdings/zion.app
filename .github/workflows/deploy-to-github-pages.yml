name: Deploy to GitHub Pages

"on":
  push:
    branches: ["main", "hero-carousel"]
  workflow_dispatch:

# Explicit permissions required for GitHub Pages deployment and OIDC authentication
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployment runs from colliding
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Disable npm funding and audit noise
        run: npm config set fund false && npm config set audit false

      - name: Install dependencies
        run: npm ci

      - name: Test tools-page generator
        run: python3 scripts/test_sync_tools_page.py

      - name: Verify tools page and sitemap synchronization
        id: sync_check
        continue-on-error: true
        run: |
          python3 scripts/sync_tools_page.py || true
          # Validate sitemap XML if present; do not block deploy on drift
          if [ -f sitemap.xml ]; then
            python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('sitemap.xml')" || true
          fi
          echo "Sync check completed; deploy continues regardless of drift."

      - name: Typecheck TypeScript
        run: npx tsc --noEmit || true

      - name: Build Next.js static export
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=16384
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_TURBOPACK_USE_WORKER: "0"

      - name: Prepare GitHub Pages artifact
        run: |
          # Compose the Pages artifact directory: static docs/ base + Next.js out/ export
          ARTIFACT_DIR="$GITHUB_WORKSPACE/pages"
          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"
          if [ -d docs ]; then
            cp -a docs/. "$ARTIFACT_DIR"/
          fi
          if [ -d out ]; then
            cp -a out/. "$ARTIFACT_DIR"/
          fi
          # Ensure sitemap.xml and robots.txt are present at artifact root
          if [ -f sitemap.xml ]; then
            cp -f sitemap.xml "$ARTIFACT_DIR/sitemap.xml"
          fi
          if [ ! -f "$ARTIFACT_DIR/robots.txt" ] && [ -f docs/robots.txt ]; then
            cp -f docs/robots.txt "$ARTIFACT_DIR/robots.txt"
          fi
          cp -f public/_redirects "$ARTIFACT_DIR/_redirects" 2>/dev/null  true
          # Include static service/tool stubs from public/ so affected routes are published
          if [ -d public/services ]; then
            mkdir -p "$ARTIFACT_DIR/services"
            cp -a public/services/. "$ARTIFACT_DIR/services"/
          fi
          if [ -d public/tools ]; then
            mkdir -p "$ARTIFACT_DIR/tools"
            cp -a public/tools/. "$ARTIFACT_DIR/tools"/
          fi
          if [ -d public/blog ]; then
            mkdir -p "$ARTIFACT_DIR/blog"
            cp -a public/blog/. "$ARTIFACT_DIR/blog"/
          fi
          if [ -d public/solutions ]; then
            mkdir -p "$ARTIFACT_DIR/solutions"
            cp -a public/solutions/. "$ARTIFACT_DIR/solutions"/
          fi
          if [ -d public/careers ]; then
            mkdir -p "$ARTIFACT_DIR/careers"
            cp -a public/careers/. "$ARTIFACT_DIR/careers"/
          fi
          if [ -d public/dashboard ]; then
            mkdir -p "$ARTIFACT_DIR/dashboard"
            cp -a public/dashboard/. "$ARTIFACT_DIR/dashboard"/
          fi
          if [ -d public/products ]; then
            mkdir -p "$ARTIFACT_DIR/products"
            cp -a public/products/. "$ARTIFACT_DIR/products"/
          fi
          if [ -d public/ai-services ]; then
            mkdir -p "$ARTIFACT_DIR/ai-services"
            cp -a public/ai-services/. "$ARTIFACT_DIR/ai-services"/
          fi
          if [ -d public/industries ]; then
            mkdir -p "$ARTIFACT_DIR/industries"
            cp -a public/industries/. "$ARTIFACT_DIR/industries"/
          fi
          if [ -d public/search ]; then
            mkdir -p "$ARTIFACT_DIR/search"
            cp -a public/search/. "$ARTIFACT_DIR/search"/
          fi
          if [ -f public/styles.css ]; then
            cp -f public/styles.css "$ARTIFACT_DIR/styles.css" || true
          fi
          echo "pages=$(find "$ARTIFACT_DIR" -name 'index.html' | wc -l)" >> "$GITHUB_OUTPUT"
          find "$ARTIFACT_DIR" -maxdepth 2 -type f | sed -n '1,80p'

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
