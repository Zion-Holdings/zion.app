name: AI Report Hygiene Weekly

permissions:
  contents: read

concurrency:
  group: ai-report-hygiene-weekly
  cancel-in-progress: false

on:
  schedule:
    - cron: '40 14 * * 0'
  workflow_dispatch:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Run report hygiene (compact + dry-run prune + size budget)
        run: npm run reports:hygiene:check
