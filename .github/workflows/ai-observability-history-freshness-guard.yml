name: Observability history freshness guard

permissions:
  contents: read
  issues: write

"on":
  schedule:
    - cron: '27 */12 * * *'
  workflow_dispatch:

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Check observability history freshness
        env:
          GH_TOKEN: ${{ github.token }}
          OBSERVABILITY_HISTORY_MAX_STALE_HOURS: "48"
        run: node scripts/automation/check-observability-history-freshness.cjs
