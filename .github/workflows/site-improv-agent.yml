name: AI Site Improvement Agent

permissions:
  contents: read

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: site-improvement-agent
  cancel-in-progress: false

jobs:
  site-improv:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python deps for site integrity checks
        run: python -m pip install --upgrade pip && pip install requests beautifulsoup4

      - name: Run site improvement agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node automation/ai-site-improvement-agent.cjs --base https://ziontechgroup.com

      - name: Surface site improvement agent results
        id: site-improv-result
        if: always()
        run: |
          set -euo pipefail
          report=automation/reports/site-improvement-agent-latest.json
          if [ -f "$report" ]; then
            echo "REPORT_EXISTS=1" >> "$GITHUB_OUTPUT"
            echo '---REPORT HEAD---'
            sed -n '1,220p' "$report" || true
          else
            echo "REPORT_EXISTS=0" >> "$GITHUB_OUTPUT"
            echo 'site-improvement-agent report missing after run'
          fi

      - name: Upload site improvement report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: site-improvement-agent-${{ github.run_id }}
          path: automation/reports/site-improvement-agent-latest.json
          retention-days: 14
          if-no-files-found: ignore
