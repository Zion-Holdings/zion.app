name: Zion Composio Master Workflow

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9,14 * * 1-5'

permissions:
  contents: read

jobs:
  composio-master-sync:
    runs-on: ubuntu-latest
    env:
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      CALENDLY_CONNECTION_ID: ${{ secrets.COMPOSIO_CALENDLY_CONNECTION_ID }}
      STRIPE_CONNECTION_ID: ${{ secrets.COMPOSIO_STRIPE_CONNECTION_ID }}
      RESEND_CONNECTION_ID: ${{ secrets.COMPOSIO_RESEND_CONNECTION_ID }}
      NOTION_CONNECTION_ID: ${{ secrets.COMPOSIO_NOTION_CONNECTION_ID }}
      SLACK_CONNECTION_ID: ${{ secrets.COMPOSIO_SLACK_CONNECTION_ID }}
      GMAIL_CONNECTION_ID: ${{ secrets.COMPOSIO_GMAIL_CONNECTION_ID }}
      HUBSPOT_CONNECTION_ID: ${{ secrets.COMPOSIO_HUBSPOT_CONNECTION_ID }}
      WHATSAPP_CONNECTION_ID: ${{ secrets.COMPOSIO_WHATSAPP_CONNECTION_ID }}
      ZION_USER_ID: ${{ secrets.ZION_USER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install @composio/core dotenv
      - name: Run Master Composio Flow
        run: node .github/scripts/composio/master-flow.mjs
      - name: Update Dashboard
        run: |
          node -e "
          const fs=require('fs');
          const ts=new Date().toISOString();
          const path='docs/ops/composio-master-log.md';
          let text='# Composio Master Flow Log\n\n';
          if(fs.existsSync(path)) text=fs.readFileSync(path,'utf8');
          text += '\n## ' + ts + '\n- Status: executed\n- Connections: Calendly, Stripe, Resend, Notion, Slack, Gmail, HubSpot, WhatsApp\n';
          fs.mkdirSync('docs/ops',{recursive:true});
          fs.writeFileSync(path,text);
          "
      - name: Commit & Push Dashboard
        run: |
          git config user.name "zion-agent"
          git config user.email "agent@ziontechgroup.com"
          git add docs/ops/composio-master-log.md
          git diff --cached --quiet && echo "no changes" || git commit -m "chore: composio master flow $(date +%Y-%m-%d)" && git push origin main
