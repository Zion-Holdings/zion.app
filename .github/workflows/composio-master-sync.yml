name: composio-master-sync

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  all-connections:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 1Password
            workflow: onepassword-sync.yml
          - name: Calendly
            workflow: composio-calendly-sync.yml
          - name: WhatsApp
            workflow: composio-whatsapp-sync.yml
          - name: Tavily
            workflow: composio-tavily-sync.yml
          - name: Firecrawl
            workflow: composio-firecrawl-sync.yml
          - name: Brevo
            workflow: composio-brevo-sync.yml
          - name: Resend
            workflow: composio-resend-sync.yml
          - name: Stripe
            workflow: composio-stripe-sync.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Trigger ${{ matrix.name }} workflow
        run: |
          gh workflow run .github/workflows/${{ matrix.workflow }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for ${{ matrix.name }} workflow to complete
        run: |
          sleep 30
          echo "Workflow ${{ matrix.name }} triggered, check Actions tab for results"
