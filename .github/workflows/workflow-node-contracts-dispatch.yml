name: Workflow Node contracts only (manual)

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: workflow-node-contracts-dispatch
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Workflow contracts (dedupe, integrity, pin strict)
        run: npm run workflows:contracts:node
