name: Workflow Node contracts only (manual)

permissions:
  contents: read

"on":
  workflow_dispatch:

concurrency:
  group: workflow-node-contracts-dispatch
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Workflow contracts (dedupe, integrity, pin strict)
        run: npm run workflows:contracts:node
