name: Composio EmailOctopus Newsletter Monetization
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1,3,5'
jobs:
  emailoctopus-newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Composio SDK
        run: npm install composio
      - name: Send newsletter via EmailOctopus
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          EMAILOCTOPUS_CONNECTION_ID: ${{ secrets.EMAILOCTOPUS_CONNECTION_ID }}
          RESEND_CONNECTION_ID: ${{ secrets.RESEND_CONNECTION_ID }}
        run: |
          cat > scripts/composio/emailoctopus-newsletter.js << 'EOF'
          const { Composio } = require('composio');
          const client = new Composio({ apiKey: process.env.COMPOSIO_API_KEY });
          (async () => {
            try {
              const eoTools = await client.tools.get('emailoctopus', { userId: process.env.EMAILOCTOPUS_CONNECTION_ID });
              const resendTools = await client.tools.get('resend', { userId: process.env.RESEND_CONNECTION_ID });
              console.log('EmailOctopus tools:', eoTools.tools.length);
              console.log('Resend tools:', resendTools.tools.length);
            } catch (e) { console.error('EmailOctopus newsletter error:', e.message); }
          })();
          EOF
          node scripts/composio/emailoctopus-newsletter.js
