# Scheduled automation syntax + ecosystem audit (no npm ci; complements validate-light / contracts).

name: Automation preflight (weekly)

permissions:
  contents: read

"on":
  schedule:
    - cron: '44 6 * * 4' # Thursdays 06:44 UTC
  workflow_dispatch:

concurrency:
  group: workflow-automation-preflight-weekly
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Automation preflight (syntax + PM2/package/issue-dedupe checks)
        run: npm run automation:preflight
