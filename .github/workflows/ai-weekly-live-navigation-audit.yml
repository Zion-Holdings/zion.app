# Weekly Live Navigation Audit
# Crawls live site (ziontechgroup.com), extracts nav/footer links, compares to
# app/constants/navigation and local routes. Uploads report; no auto-fix.
# Schedule: Fri 10 UTC. workflow_dispatch.

name: AI Weekly Live Navigation Audit

permissions:
  contents: read

concurrency:
  group: ai-weekly-live-navigation-audit
  cancel-in-progress: false

"on":
  schedule:
    - cron: '0 10 * * 5'
  workflow_dispatch:

jobs:
  live-nav-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Run live navigation audit
        run: npm run nav:live-audit

      - name: Upload live navigation audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-navigation-audit-${{ github.run_id }}
          path: automation/reports/live-navigation-audit-latest.json
          if-no-files-found: ignore
          retention-days: 30
