name: composio-connection-monitor

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Composio SDK
        run: npm install @composio/core

      - name: Check connections
        id: check
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: |
          cat > monitor.mjs <<'EOF'
          import { Composio } from '@composio/core';
          const composio = new Composio({ apiKey: process.env.COMPOSIO_API_KEY });
          const client = composio.getClient();
          const accounts = await client.connectedAccounts.list({});
          const items = accounts.items || [];
          const active = items.filter(a => a.status === 'ACTIVE');
          const inactive = items.filter(a => a.status !== 'ACTIVE');
          console.log(`Total: ${items.length}, Active: ${active.length}, Inactive: ${inactive.length}`);
          const summary = {
            total: items.length,
            active: active.map(a => ({ toolkit: a.toolkit?.slug, id: a.id, status: a.status })),
            inactive: inactive.map(a => ({ toolkit: a.toolkit?.slug, id: a.id, status: a.status }))
          };
          console.log(JSON.stringify(summary, null, 2));
          const fs = await import('fs');
          fs.writeFileSync('summary.json', JSON.stringify(summary));
          EOF
          node monitor.mjs

      - name: Set outputs
        run: |
          echo "inactive_count=$(jq '.inactive | length' summary.json)" >> "$GITHUB_OUTPUT"
          echo "summary=$(jq -c . summary.json)" >> "$GITHUB_OUTPUT"

      - name: Alert if needed
        if: ${{ steps.set.outputs.inactive_count > 0 }}
        uses: composio/composio-action@main
        with:
          api_key: ${{ secrets.COMPOSIO_API_KEY }}
          connection_id: ${{ secrets.COMPOSIO_1PASSWORD_CONNECTION_ID }}
          app: "1password"
          action: "list_items"
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
