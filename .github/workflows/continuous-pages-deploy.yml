name: Continuous Pages Deploy
on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: continuous-pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: '--max-old-space-size=4096'
    outputs:
      sha: ${{ steps.resolve-sha.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Static site build
        id: build
        run: |
          set -euo pipefail
          npm run build -- --webpack
          if [ -d out ]; then
            PAGES=$(find out -name 'index.html' | wc -l)
            SIZE=$(du -sh out | awk '{print $1}')
          else
            PAGES=0
            SIZE="unknown"
          fi
          echo "pages=$PAGES" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Write deploy status
        id: resolve-sha
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
        run: |
          sha="${{ github.sha }}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          DEPLOY_STATUS=triggered DEPLOY_STATUS_SOURCE=continuous-pages-deploy npm run deploy:status:generate

      - name: Pages artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5

      - name: Write deploy status (completed)
        if: always()
        env:
          GITHUB_SHA: ${{ needs.build.outputs.sha }}
          GITHUB_RUN_ID: ${{ github.run_id_
          GITHUB_WORKFLOW: ${{ github.workflow }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            DEPLOY_STATUS=success DEPLOY_STATUS_SOURCE=continuous-pages-deploy npm run deploy:status:generate
          else
            DEPLOY_STATUS=failed DEPLOY_STATUS_SOURCE=continuous-pages-deploy npm run deploy:status:generate
          fi