name: Continuous Pages Deploy
on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: continuous-pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Build static export
        id: build
        run: |
          set -euo pipefail
          npm run build
          if [ -d out ]; then
            PAGES=$(find out -name 'index.html' | wc -l)
            SIZE=$(du -sh out | awk '{print $1}')
          else
            PAGES=0
            SIZE="unknown"
          fi
          echo "pages=$PAGES" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "trigger=schedule" >> "$GITHUB_OUTPUT"

      - name: Generate service index + sitemap + feed
        run: |
          set -euo pipefail
          node scripts/generate_service_index.cjs
          node scripts/generate_services_json.cjs
          node scripts/generate-sitemap-feed.cjs
          test -f out/sitemap.xml
          test -f out/feed.xml
          test -f out/service-index.json
          test -f out/data/services.json
        continue-on-error: false

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: out

      - name: Summary
        if: always()
        run: |
          echo "pages=${{ steps.build.outputs.pages }}"
          echo "size=${{ steps.build.outputs.size }}"
          echo "trigger=${{ steps.build.outputs.trigger }}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5

      - name: Pages smoke check
        if: success()
        env:
          BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --max-time 10 -o /dev/null -w "%{http_code}" "${BASE_URL}/" || echo "000")
          if [ "$status" = "200" ]; then
            echo "OK home ($status)"
          else
            echo "FAIL home ($status)"
            exit 1
          fi
          status=$(curl --silent --show-error --max-time 10 -o /dev/null -w "%{http_code}" "${BASE_URL}/services/" || echo "000")
          if [ "$status" = "200" ]; then
            echo "OK services ($status)"
          else
            echo "FAIL services ($status)"
            exit 1
          fi
