name: Continuous Pages Deploy
'on':
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: continuous-pages-deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: '--max-old-space-size=16384'
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --fund=false

      - name: Static site build
        id: build
        run: |
          set -euo pipefail
          npm run build -- --webpack || echo "Next build failed; will rely on docs/ fallback"

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          ARTIFACT_DIR="${GITHUB_WORKSPACE:-.}/artifacts/pages"
          mkdir -p "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR/docs"
          if [ -d docs ]; then
            cp -a docs/. "$ARTIFACT_DIR"/
          fi
          if [ -d out ]; then
            cp -a out/. "$ARTIFACT_DIR"/ || true
          fi
          if [ -f public/_redirects ]; then cat public/_redirects > "$ARTIFACT_DIR/_redirects"; fi
          if [ -f public/_headers ]; then cp -f public/_headers "$ARTIFACT_DIR/_headers"; fi
          if [ -f public/sitemap.xml ]; then cp -f public/sitemap.xml "$ARTIFACT_DIR/sitemap.xml"; fi
          if [ -f public/robots.txt ]; then cp -f public/robots.txt "$ARTIFACT_DIR/robots.txt"; fi
          if [ ! -f "$ARTIFACT_DIR/robots.txt" ] && [ -f docs/robots.txt ]; then cp -f docs/robots.txt "$ARTIFACT_DIR/robots.txt"; fi
          if [ ! -f "$ARTIFACT_DIR/sitemap.xml" ] && [ -f docs/sitemap.xml ]; then cp -f docs/sitemap.xml "$ARTIFACT_DIR/sitemap.xml"; fi
          PAGES=$(find "$ARTIFACT_DIR" -name 'index.html' | wc -l)
          echo "pages=$PAGES" >> "$GITHUB_OUTPUT"
          echo "pages=$PAGES"
          find "$ARTIFACT_DIR" -maxdepth 2 -type f | sed -n '1,80p' || true

      - name: Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5

      - name: Verify deployment
        run: |
          echo "Deployment URL: ${{ steps.deployment.outputs.page_url }}"
          sleep 30
          curl -sf "${{ steps.deployment.outputs.page_url }}/" > /dev/null && echo "✓ Homepage is live" || echo "✗ Homepage check failed"
          for p in /services/ /solutions/ /pricing/ /contact/ /tools/ /about /blog /careers /partners /portal /ai-services-index /free-ai-it-tools; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${{ steps.deployment.outputs.page_url }}${p}" || true)
            echo "$p -> $code"
          done
