name: Continuous Pages Deploy
'on':
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: continuous-pages-deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --fund=false

      - name: Build Next export
        id: build
        run: |
          set -euo pipefail
          npm run build || true
          if [ -d out ]; then
            PAGES=$(find out -name 'index.html' | wc -l)
            SIZE=$(du -sh out | awk '{print $1}')
            echo "pages=$PAGES" >> "$GITHUB_OUTPUT"
            echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          else
            echo "pages=0" >> "$GITHUB_OUTPUT"
            echo "size=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          ARTIFACT_DIR="${GITHUB_WORKSPACE:-.}/artifacts/pages"
          mkdir -p "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR/docs"
          # Always include docs/ static content as deploy base.
          if [ -d docs ]; then
            cp -a docs/. "$ARTIFACT_DIR"/
          fi
          docs_index=.github/docs_index.html
          if [ ! -f "$ARTIFACT_DIR/index.html" ] && [ -f "$docs_index" ]; then
            cp -a "$docs_index" "$ARTIFACT_DIR/index.html"
          fi
          # If Next export succeeded, overlay generated files.
          if [ -d out ]; then
            cp -a out/. "$ARTIFACT_DIR"/ || true
          fi
          if [ -d public ]; then
            cp -a public/. "$ARTIFACT_DIR"/
          fi
          # Ensure SEO files exist whichever path produced them.
          if [ ! -f "$ARTIFACT_DIR/robots.txt" ] && [ -f docs/robots.txt ]; then cp -f docs/robots.txt "$ARTIFACT_DIR/robots.txt"; fi
          if [ ! -f "$ARTIFACT_DIR/sitemap.xml" ] && [ -f docs/sitemap.xml ]; then cp -f docs/sitemap.xml "$ARTIFACT_DIR/sitemap.xml"; fi
          PAGES=$(find "$ARTIFACT_DIR" -name 'index.html' | wc -l)
          echo "pages=$PAGES" >> "$GITHUB_OUTPUT"
          echo 'manifest:'
          find "$ARTIFACT_DIR" -maxdepth 2 -type f | sed -n '1,120p'

      - name: Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: artifacts/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify deployment
        run: |
          echo "Deployed URL: ${{ steps.deployment.outputs.page_url }}"
          sleep 20
          curl -sf "${{ steps.deployment.outputs.page_url }}/" > /dev/null && echo "✓ Homepage" || echo "✗ Homepage"
          for p in /services/ /solutions/ /pricing/ /contact/ /tools/ /about /blog /careers /partners /portal /ai-services-index /free-ai-it-tools; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${{ steps.deployment.outputs.page_url }}${p}" || true)
            echo "$p -> $code"
          done
