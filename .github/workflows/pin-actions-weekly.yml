name: Pin Actions Weekly

permissions:
  contents: write
  actions: read

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

concurrency:
  group: pin-actions-weekly
  # Queue: this job commits and pushes to main; canceling mid-run can strand a half-done pin update.
  cancel-in-progress: false

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@4f4ea57a51b29252d111198be4cd3a793796b0ef # v4
        with:
          token: ${{ github.token }}

      - name: Setup Node
        uses: actions/setup-node@6048f788ec73ddb5fada9e4b2edabe8cbb3132b8 # v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run pin actions weekly
        run: npm run pin-actions

      - name: Push pinned actions
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes to push"
            exit 0
          fi
          git add .github/workflows/
          bash scripts/automation/commit-and-push-main.sh "chore: pin actions to SHA digests"

      - name: Upload results
        uses: actions/upload-artifact@390d87beece2197232615af1b5a6d3cac1f2191b # v4
        if: always()
        with:
          name: workflow-results-${{ github.run_id }}
          path: .github/workflows/
          retention-days: 7
