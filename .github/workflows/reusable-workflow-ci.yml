name: Reusable workflow CI (validate + optional contracts)

permissions:
  contents: read

"on":
  workflow_call:
    inputs:
      run_contracts:
        description: 'Run npm run workflows:contracts:node (dedupe, integrity, pin strict)'
        required: false
        default: false
        type: boolean

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache npm
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Workflow validate light (Ruby YAML contracts + grep + bash + repo hygiene)
        run: npm run automation:preflight

      - name: Workflow contracts (dedupe, integrity, pin)
        if: ${{ inputs.run_contracts }}
        run: npm run workflows:contracts:node
