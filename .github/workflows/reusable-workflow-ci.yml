name: Reusable workflow CI (validate + optional contracts)

permissions:
  contents: read

"on":
  workflow_call:
    inputs:
      run_contracts:
        description: 'Run npm run workflows:contracts:node (dedupe, integrity, pin strict)'
        required: false
        default: false
        type: boolean

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Workflow validate light (Ruby YAML contracts + grep + bash + repo hygiene)
        run: npm run automation:preflight

      - name: Workflow contracts (dedupe, integrity, pin)
        if: ${{ inputs.run_contracts }}
        run: npm run workflows:contracts:node
