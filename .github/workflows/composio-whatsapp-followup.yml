name: composio-whatsapp-followup

on:
  workflow_dispatch:
  issues:
    types: [opened]

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Composio SDK
        run: npm install @composio/core

      - name: Send WhatsApp follow-up
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: |
          cat > send-whatsapp.mjs <<'EOF'
          import { Composio } from '@composio/core';
          const composio = new Composio({ apiKey: process.env.COMPOSIO_API_KEY });
          const client = composio.getClient();
          const accounts = await client.connectedAccounts.list({});
          const whatsapp = (accounts.items || []).find(a => a.toolkit?.slug === 'whatsapp');
          if (!whatsapp) {
            console.error('No WhatsApp connected account found');
            process.exit(1);
          }
          const result = await client.tools.execute('WHATSAPP_SEND_MESSAGE', {
            connection_id: whatsapp.id,
            entity_id: whatsapp.user_id,
            arguments: {
              to: '',
              message: 'New lead from GitHub issue: Zion Tech Group'
            }
          });
          console.log(JSON.stringify(result, null, 2));
          EOF
          node send-whatsapp.mjs
