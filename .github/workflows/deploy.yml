name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4.2.2
      
      - name: Prepare static files
        run: |
          mkdir -p out
          cp -r public/* out/ 2>/dev/null || true
          cp public/tools/* out/tools/ 2>/dev/null || true
          cp sitemap.xml out/ 2>/dev/null || true
          cp feed.xml out/ 2>/dev/null || true
          ls -la out/ | head -20
      
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
