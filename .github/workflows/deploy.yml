name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Verify tools page links every deployed tool
        run: |
          python3 scripts/sync_tools_page.py
          if ! git diff --quiet -- app/tools/page.tsx; then
            echo "::error::app/tools/page.tsx is out of sync with public/tools/."
            echo "Run 'python3 scripts/sync_tools_page.py' and commit the result."
            git --no-pager diff --stat -- app/tools/page.tsx
            exit 1
          fi
          echo "Tools page in sync."

      - name: Typecheck
        run: npx tsc --noEmit

      - run: npm run build

      - run: ls -la out/ | head -20

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
