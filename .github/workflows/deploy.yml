name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --max-old-space-size=16384
      NEXT_TURBOPACK_USE_WORKER: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Disable npm funding and audit noise
        run: npm config set fund false && npm config set audit false
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Build Next.js static export
        run: NODE_OPTIONS="--max-old-space-size=16384 --no-lru-cache" NEXT_TELEMETRY_DISABLED=1 NEXT_DISABLE_SWC_WORKER=1 npm run build -- --no-lint
      - name: Verify build output
        run: |
          if [ ! -d "out" ]; then
            echo "::error::Build output directory 'out' not found"
            exit 1
          fi
          PAGE_COUNT=$(find out -name '*.html' | wc -l)
          echo "Pages in build: $PAGE_COUNT"
          if [ "$PAGE_COUNT" -lt 1 ]; then
            echo "::error::No HTML pages generated"
            exit 1
          fi
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./out
  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
