name: Composio Health & Credentials Sync
on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'

concurrency:
  group: composio-health
  cancel-in-progress: true

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Composio CLI
        run: |
          curl -fsSL https://composio.dev/install | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - run: composio whoami 2>&1 || echo "WHOAMI_FAILED"

      - name: List Connections
        run: |
          echo "=== Connections ==="
          composio connections list 2>&1

      - run: echo "Done $(date -u)"
