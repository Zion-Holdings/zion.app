name: Composio Health & Credentials Sync
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  push:
    paths:
      - '.github/workflows/composio-health.yml'
    branches:
      - main

jobs:
  health-check:
    runs-on: ubuntu-latest
    env:
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Composio CLI
        run: |
          curl -fsSL https://composio.dev/install | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Composio Whoami
        run: composio whoami 2>&1 || echo "WHOAMI_FAILED"

      - name: List Connected Accounts
        run: |
          echo "=== Connected Accounts ==="
          composio connections list 2>&1 || echo "LIST_FAILED"

      - name: Tools List (first 20)
        run: |
          echo "=== Available Tools (first 20) ==="
          composio tools list 2>&1 | head -20 || echo "TOOLS_FAILED"

      - name: Summary
        run: |
          echo "Composio health check completed at $(date -u)"
          echo "Key set: $([ -n "$COMPOSIO_API_KEY" ] && echo 'yes' || echo 'no')"