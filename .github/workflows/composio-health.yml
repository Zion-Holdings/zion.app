name: Composio Health & Credentials Sync
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  push:
    paths:
      - '.github/workflows/composio-health.yml'
    branches:
      - main

jobs:
  health-check:
    runs-on: ubuntu-latest
    env:
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Composio
        run: |
          npm install -g composio
          export PATH="$PATH:$(npm root -g)/.bin:$HOME/.npm-global/bin"
          which composio || echo "NOT_IN_PATH"

      - name: Composio Whoami
        run: |
          export PATH="$PATH:$(npm root -g)/.bin:$HOME/.npm-global/bin"
          npx composio whoami 2>&1 || echo "WHOAMI_FAILED"

      - name: List All Connections
        run: |
          export PATH="$PATH:$(npm root -g)/.bin:$HOME/.npm-global/bin"
          echo "=== All Connected Accounts ==="
          npx composio connections list 2>&1 || echo "LIST_FAILED"

      - name: 1Password Tools Check
        run: |
          export PATH="$PATH:$(npm root -g)/.bin:$HOME/.npm-global/bin"
          echo "=== 1Password Tools ==="
          npx composio tools list --toolkits _1password 2>&1 || echo "1P_TOOLS_FAILED"

      - name: Summary
        run: |
          echo "Health check completed at $(date -u)"
          echo "Key set: $([ -n \"$COMPOSIO_API_KEY\" ] && echo 'yes' || echo 'no')"
