name: Composio Lead-to-Revenue Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1,3,5'

jobs:
  lead-revenue:
    runs-on: ubuntu-latest
    env:
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      GMAIL_CONNECTION_ID: ${{ secrets.GMAIL_CONNECTION_ID }}
      NOTION_CONNECTION_ID: ${{ secrets.NOTION_CONNECTION_ID }}
      SLACK_CONNECTION_ID: ${{ secrets.SLACK_CONNECTION_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install composio dotenv
      - name: Send outreach emails via Gmail
        run: node .github/scripts/composio/lead-outreach.js
      - name: Log revenue pipeline to Notion
        run: node .github/scripts/composio/revenue-pipeline.js
      - name: Notify sales team on Slack
        run: node .github/scripts/composio/sales-alert.js
