# Scheduled scan for unresolved merge conflict markers on main (complements PR-scoped checks).

name: Merge conflict markers (weekly)

permissions:
  contents: read

"on":
  schedule:
    - cron: '42 6 * * 0' # Sundays 06:42 UTC
  workflow_dispatch:

concurrency:
  group: workflow-merge-conflict-markers-weekly
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Check tracked files for merge conflict markers
        run: node scripts/automation/check-merge-conflict-markers.cjs
