name: Zion Composio Master Orchestrator

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read

jobs:
  master:
    runs-on: ubuntu-latest
    env:
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      COMPOSIO_CALENDLY_CONNECTION_ID: ${{ secrets.COMPOSIO_CALENDLY_CONNECTION_ID }}
      COMPOSIO_WHATSAPP_CONNECTION_ID: ${{ secrets.COMPOSIO_WHATSAPP_CONNECTION_ID }}
      COMPOSIO_STRIPE_CONNECTION_ID: ${{ secrets.COMPOSIO_STRIPE_CONNECTION_ID }}
      COMPOSIO_RESEND_CONNECTION_ID: ${{ secrets.COMPOSIO_RESEND_CONNECTION_ID }}
      COMPOSIO_BREVO_CONNECTION_ID: ${{ secrets.COMPOSIO_BREVO_CONNECTION_ID }}
      COMPOSIO_GMAIL_CONNECTION_ID: ${{ secrets.COMPOSIO_GMAIL_CONNECTION_ID }}
      COMPOSIO_HUBSPOT_CONNECTION_ID: ${{ secrets.COMPOSIO_HUBSPOT_CONNECTION_ID }}
      COMPOSIO_NOTION_CONNECTION_ID: ${{ secrets.COMPOSIO_NOTION_CONNECTION_ID }}
      COMPOSIO_SLACK_CONNECTION_ID: ${{ secrets.COMPOSIO_SLACK_CONNECTION_ID || secrets.COMPOSIO_1PASSWORD_CONNECTION_ID }}
      COMPOSIO_1PASSWORD_CONNECTION_ID: ${{ secrets.COMPOSIO_1PASSWORD_CONNECTION_ID }}
      COMPOSIO_SENDGRID_CONNECTION_ID: ${{ secrets.COMPOSIO_SENDGRID_CONNECTION_ID }}
      COMPOSIO_ACTIVECAMPAIGN_CONNECTION_ID: ${{ secrets.COMPOSIO_ACTIVECAMPAIGN_CONNECTION_ID }}
      COMPOSIO_FIRECRAWL_CONNECTION_ID: ${{ secrets.COMPOSIO_FIRECRAWL_CONNECTION_ID }}
      COMPOSIO_SERPAPI_CONNECTION_ID: ${{ secrets.COMPOSIO_SERPAPI_CONNECTION_ID }}
      COMPOSIO_TAVILY_CONNECTION_ID: ${{ secrets.COMPOSIO_TAVILY_CONNECTION_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install @composio/core

      - name: Verify connections
        run: node .github/scripts/composio/verify-connections.mjs

      - name: Revenue pipeline
        run: |
          if [ -f .github/scripts/composio/revenue-pipeline.mjs ]; then
            node .github/scripts/composio/revenue-pipeline.mjs || echo "REVENUE_PIPELINE_FAILED"
          fi
          if [ -f .github/scripts/composio/sales-alert.mjs ]; then
            node .github/scripts/composio/sales-alert.mjs || echo "SALES_ALERT_FAILED"
          fi

      - name: Update revenue log
        run: |
          if [ -f .github/scripts/composio/update-revenue-log.mjs ]; then
            node .github/scripts/composio/update-revenue-log.mjs || echo "REVENUE_LOG_FAILED"
          fi

      - name: Firecrawl sync
        run: |
          if [ -f .github/scripts/composio/firecrawl-sync.mjs ]; then
            node .github/scripts/composio/firecrawl-sync.mjs || echo "FIRECRAWL_SYNC_FAILED"
          fi

      - name: Master status
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const summary = {
            orchestrator: 'zion-master',
            timestamp: new Date().toISOString(),
            connections: [
              'calendly','whatsapp','stripe','resend','brevo','gmail',
              'hubspot','notion','slack','1password','sendgrid','activecampaign',
              'firecrawl','serpapi','tavily'
            ],
            scripts: {
              revenue_pipeline: fs.existsSync('.github/scripts/composio/revenue-pipeline.mjs') ? 'present' : 'missing',
              sales_alert: fs.existsSync('.github/scripts/composio/sales-alert.mjs') ? 'present' : 'missing',
              revenue_log: fs.existsSync('.github/scripts/composio/update-revenue-log.mjs') ? 'present' : 'missing',
              firecrawl_sync: fs.existsSync('.github/scripts/composio/firecrawl-sync.mjs') ? 'present' : 'missing',
            }
          };
          console.log(JSON.stringify(summary, null, 2));
          EOF
