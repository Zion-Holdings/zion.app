name: Service Center Canary

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  service-center-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run service center integrity check
        id: check
        run: |
          python automation/scripts/service_center_check.py --base https://ziontechgroup.com
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Create issue on degraded result
        if: steps.check.outputs.exit_code != '0'
        uses: actions/github-script@v9
        with:
          script: |
            const output = `## Service Center Alert\n\nThe service-center canary detected degraded results.\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nCheck \`automation/reports/service-integrity-latest.json\` for details.`;
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: 'site-health',
              per_page: 5,
            });
            const existing = issues.find(i => i.title.includes('Service Center Alert'));
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body: `Repeated alert at ${new Date().toISOString()}.\n\n${output}`,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title: `🔴 Service Center Alert - ${new Date().toISOString().split('T')[0]}`,
                body: output,
                labels: ['site-health', 'bug'],
              });
            }
