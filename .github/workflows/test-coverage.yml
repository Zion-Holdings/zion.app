name: Test Coverage Guard
"on":
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  schedule:
  - cron: '0 10 * * *'
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  test-coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: '.nvmrc'
        cache: npm
    - run: npm ci
    - name: Run tests with coverage
      run: 'mkdir -p coverage || true

        npm run test:ci -- --coverage --watchAll=false --coverageDirectory=./coverage
        || true

        '
    - name: Enforce coverage threshold
      run: "COVERAGE=$(awk -F'[ %]+' '/All files/{print $3}' coverage/lcov-report/index.html\
        \ 2>/dev/null || echo 0)\nif [ \"$COVERAGE\" = \"0\" ]; then\n  echo \"No\
        \ tests found; skip coverage threshold.\"\n  exit 0\nfi\nif awk \"BEGIN{exit\
        \ !($COVERAGE<60)}\"; then\n  echo \"Coverage too low: $COVERAGE%\"\n  exit\
        \ 1\nfi\n"
    - name: Create regression issue on failure
      if: failure()
      uses: actions/github-script@v9
      with:
        script: "github.rest.issues.create({\n  owner: context.repo.owner,\n  repo:\
          \ context.repo.repo,\n  title: `Test coverage regression detected on ${context.sha.slice(0,7)}`,\n\
          \  body: `Test coverage fell below threshold or tests failed. See workflow\
          \ run in Actions.`\n})\n"
    timeout-minutes: 20
