name: composio-resend-brevo-sync

on:
  issues:
    types:
      - opened
  issue_comment:
    types:
      - created
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Composio SDK
        run: npm install @composio/core

      - name: Create Resend contact
        uses: composio/composio-sdk-action@v1
        with:
          connection_id: ${{ secrets.COMPOSIO_RESEND_CONNECTION_ID }}
          action: RESEND_CREATE_CONTACT
          input: |
            {
              "email": "${{ github.event.issue.title }}",
              "firstName": "Lead",
              "lastName": "Sync",
              "audienceId": "36bc979f-6357-4916-afd3-e4b6e9bdf873"
            }

      - name: Send Brevo email
        uses: composio/composio-sdk-action@v1
        with:
          connection_id: ${{ secrets.COMPOSIO_BREVO_CONNECTION_ID }}
          action: BREVO_SEND_EMAIL
          input: |
            {
              "to": "${{ secrets.BREVO_TO_EMAIL }}",
              "subject": "Zion Tech Group — Soluções em TI e IA",
              "html": "<p>Olá, vimos seu interesse em <strong>${{ github.event.issue.title }}</strong>. Podemos ajudar com <a href='https://ziontechgroup.com'>nossos serviços</a>.</p>"
            }

      - name: Send Resend notification
        uses: composio/composio-sdk-action@v1
        with:
          connection_id: ${{ secrets.COMPOSIO_RESEND_CONNECTION_ID }}
          action: RESEND_SEND_EMAIL
          input: |
            {
              "to": "${{ secrets.RESEND_TO_EMAIL }}",
              "from": "${{ secrets.RESEND_FROM_EMAIL }}",
              "subject": "Sync: ${{ github.event.issue.title }}",
              "html": "<p>Resend+Brevo sync para: <strong>${{ github.event.issue.title }}</strong></p>"
            }

      - name: Notify Telegram
        uses: composio/composio-send-telegram-message@v1
        with:
          chat_id: "-1003886112318"
          text: |
            Resend+Brevo sync:
            ${{ github.event.issue.title }}
