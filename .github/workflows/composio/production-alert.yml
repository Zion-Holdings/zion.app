name: composio-production-alert

on:
  workflow_run:
    types: [completed]
    workflows: ["gh-pages.yml"]
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check site health
        id: health
        uses: composio/composio-http-request@v1
        with:
          method: "GET"
          url: "https://ziontechgroup.com/"
          timeout_ms: 10000

      - name: Aggregate status JSON
        id: status
        run: |
          if [ "${{ failure() || steps.health.outputs.status_code != '200' }}" = "true" ]; then
            echo '{"ok":false,"code":${{ steps.health.outputs.status_code || 0 }},"conclusion":"${{ github.event.workflow_run.conclusion || 'n/a' }}"}' >/tmp/status.json
          else
            echo '{"ok":true,"code":${{ steps.health.outputs.status_code }},"conclusion":"${{ github.event.workflow_run.conclusion || 'n/a' }}"}' >/tmp/status.json
          fi

      - name: Send Telegram on degraded/unknown
        if: fromJSON(steps.status.outputs.result).ok == false
        uses: composio/composio-send-telegram-message@v1
        with:
          chat_id: "-1003886112318"
          text: |
            Zion alert:
            Code: ${{ steps.health.outputs.status_code || 'n/a' }}
            Conclusion: ${{ fromJSON(steps.status.outputs.result).conclusion }}
            Link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}

      - name: Send email on degraded/unknown
        if: fromJSON(steps.status.outputs.result).ok == false
        uses: composio/composio-send-resend-email@v1
        with:
          to: "kleber@ziontechgroup.com"
          from: "ziontechgroup@alcatrao.eti.br"
          subject: "ziontechgroup.com health alert"
          body: |
            Health check failed or workflow failed.
            Code: ${{ steps.health.outputs.status_code || 'n/a' }}
            Conclusion: ${{ fromJSON(steps.status.outputs.result).conclusion }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}
