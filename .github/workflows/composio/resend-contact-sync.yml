name: composio-resend-contact-sync

on:
  issues:
    types:
      - opened
  issue_comment:
    types:
      - created
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Composio SDK
        run: npm install @composio/core

      - name: Send Resend notification
        uses: composio/composio-sdk-action@v1
        with:
          connection_id: ${{ secrets.COMPOSIO_RESEND_CONNECTION_ID }}
          action: RESEND_SEND_EMAIL
          input: |
            {
              "to": "${{ secrets.RESEND_TO_EMAIL }}",
              "from": "${{ secrets.RESEND_FROM_EMAIL }}",
              "subject": "Lead sync: ${{ github.event.issue.title }}",
              "html": "<p>Novo lead sincronizado: <strong>${{ github.event.issue.title }}</strong></p>"
            }

      - name: Notify Telegram
        uses: composio/composio-send-telegram-message@v1
        with:
          chat_id: "-1003886112318"
          text: |
            Resend contact synced:
            ${{ github.event.issue.title }}
