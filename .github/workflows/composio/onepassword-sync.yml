name: composio-1password-sync

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  onepassword-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Composio
        uses: composio/composio-action@main
        with:
          api_key: ${{ secrets.COMPOSIO_API_KEY }}

      - name: Refresh 1Password connection
        uses: composio/composio-action@main
        with:
          connection_id: ${{ secrets.COMPOSIO_1PASSWORD_CONNECTION_ID }}
          app: "1password"
          action: "list_items"
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}

      - name: Comment summary
        run: |
          echo "1Password connection refreshed successfully." >> "$GITHUB_STEP_SUMMARY"
