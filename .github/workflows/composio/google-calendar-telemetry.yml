name: composio-google-calendar-telemetry

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Composio SDK
        run: npm install @composio/core

      - name: List calendars
        id: calendars
        uses: composio/composio-sdk-action@v1
        with:
          connection_id: ${{ secrets.COMPOSIO_GOOGLE_CALENDAR_CONNECTION_ID }}
          action: GOOGLECALENDAR_LIST_CALENDARS
          input: {}

      - name: Notify Telegram
        uses: composio/composio-send-telegram-message@v1
        with:
          chat_id: "-1003886112318"
          text: |
            Zion Calendar:
            ${{ steps.calendars.outputs.result || 'n/a' }}
