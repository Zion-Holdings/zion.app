name: composio-lead-capture-gmail-linear-notion-resend

on:
  issues:
    types:
      - opened
  issue_comment:
    types:
      - created
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Composio SDK
        run: npm install @composio/core

      - name: Create Linear issue
        uses: composio/composio-create-linear-issue@v1
        with:
          team_name: "Zion Support"
          title: "Lead: ${{ github.event.issue.title }}"
          description: |
            New lead captured from GitHub issue.
            Link: ${{ github.event.issue.html_url }}

      - name: Create Notion page
        uses: composio/composio-sdk-action@v1
        with:
          connection_id: ${{ secrets.COMPOSIO_NOTION_CONNECTION_ID }}
          action: NOTION_CREATE_PAGE
          input: |
            {
              "database_id": "${{ secrets.NOTION_LEADS_DB_ID }}",
              "parent": { "database_id": "${{ secrets.NOTION_LEADS_DB_ID }}" },
              "properties": {
                "Name": { "title": [{ "text": { "content": "${{ github.event.issue.title }}" } }] },
                "Source": { "rich_text": [{ "text": { "content": "GitHub Issue" } }] },
                "Status": { "status": { "name": "New" } }
              }
            }

      - name: Create Resend contact
        uses: composio/composio-sdk-action@v1
        with:
          connection_id: ${{ secrets.COMPOSIO_RESEND_CONNECTION_ID }}
          action: RESEND_SEND_EMAIL
          input: |
            {
              "to": "${{ secrets.RESEND_TO_EMAIL }}",
              "from": "${{ secrets.RESEND_FROM_EMAIL }}",
              "subject": "Novo lead: ${{ github.event.issue.title }}",
              "html": "<p>Novo lead a partir da issue <a href=\\\"${{ github.event.issue.html_url }}\\\">#${{ github.event.issue.number }}</a>.</p>"
            }

      - name: Send Brevo email
        uses: composio/composio-sdk-action@v1
        with:
          connection_id: ${{ secrets.COMPOSIO_BREVO_CONNECTION_ID }}
          action: BREVO_SEND_EMAIL
          input: |
            {
              "to": "${{ secrets.RESEND_TO_EMAIL }}",
              "subject": "Zion Tech Group — Soluções em TI e IA",
              "html": "<p>Olá, vimos seu interesse em <strong>${{ github.event.issue.title }}</strong>. Podemos ajudar com <a href='https://ziontechgroup.com'>nossos serviços</a>.</p>"
            }

      - name: Notify Telegram
        uses: composio/composio-send-telegram-message@v1
        with:
          chat_id: "-1003886112318"
          text: |
            New lead captured:
            ${{ github.event.issue.title }}
            ${{ github.event.issue.html_url }}
