name: composio-github-pr-linear-notion

on:
  pull_request:
    types:
      - opened
      - ready_for_review
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Composio SDK
        run: npm install @composio/core

      - name: Create Linear issue
        uses: composio/composio-create-linear-issue@v1
        with:
          team_name: "Zion Support"
          title: "PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
          description: |
            Author: ${{ github.event.pull_request.user.login }}
            Branch: ${{ github.event.pull_request.head.ref }}
            Link: ${{ github.event.pull_request.html_url }}

      - name: Create Notion page
        uses: composio/composio-sdk-action@v1
        with:
          connection_id: ${{ secrets.COMPOSIO_NOTION_CONNECTION_ID }}
          action: NOTION_CREATE_PAGE
          input: |
            {
              "database_id": "${{ secrets.NOTION_LEADS_DB_ID }}",
              "parent": { "database_id": "${{ secrets.NOTION_LEADS_DB_ID }}" },
              "properties": {
                "Name": { "title": [{ "text": { "content": "PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}" } }] },
                "Source": { "rich_text": [{ "text": { "content": "GitHub PR #${{ github.event.pull_request.number }}" } }] },
                "Status": { "status": { "name": "Open" } }
              }
            }

      - name: Notify Telegram
        uses: composio/composio-send-telegram-message@v1
        with:
          chat_id: "-1003886112318"
          text: |
            New PR:
            #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}
            ${{ github.event.pull_request.html_url }}
