name: composio-master-orchestrator

on:
  issues:
    types:
      - opened
  issue_comment:
    types:
      - created
  schedule:
    - cron: "0 8 * * 1-5"
  workflow_dispatch:

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Composio SDK
        run: npm install @composio/core

      - name: Extract event context
        id: ctx
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            echo "type=issue" >> $GITHUB_OUTPUT
            echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
            echo "title=${{ github.event.issue.title }}" >> $GITHUB_OUTPUT
            echo "url=${{ github.event.issue.html_url }}" >> $GITHUB_OUTPUT
            echo "labels=$(echo '${{ toJSON(github.event.issue.labels) }}' | jq -r 'map(.name) | join(", ")')" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "issue_comment" ]; then
            echo "type=comment" >> $GITHUB_OUTPUT
            echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
            echo "title=${{ github.event.issue.title }}" >> $GITHUB_OUTPUT
            echo "url=${{ github.event.issue.html_url }}" >> $GITHUB_OUTPUT
            echo "labels=$(echo '${{ toJSON(github.event.issue.labels) }}' | jq -r 'map(.name) | join(", ")')" >> $GITHUB_OUTPUT
          else
            echo "type=scheduled" >> $GITHUB_OUTPUT
            echo "number=0" >> $GITHUB_OUTPUT
            echo "title=Daily sync" >> $GITHUB_OUTPUT
            echo "url=" >> $GITHUB_OUTPUT
            echo "labels=" >> $GITHUB_OUTPUT
          fi

      - name: Sync to Notion
        id: notion
        uses: composio/composio-sdk-action@v1
        with:
          connection_id: ${{ secrets.COMPOSIO_NOTION_CONNECTION_ID }}
          action: NOTION_CREATE_PAGE
          input: |
            {
              "database_id": "${{ secrets.NOTION_LEADS_DB_ID }}",
              "parent": { "database_id": "${{ secrets.NOTION_LEADS_DB_ID }}" },
              "properties": {
                "Name": { "title": [{ "text": { "content": "${{ steps.ctx.outputs.title }}" } }] },
                "Source": { "rich_text": [{ "text": { "content": "GitHub ${{ steps.ctx.outputs.type }}" } }] },
                "Status": { "status": { "name": "Open" } }
              }
            }

      - name: Create Linear issue
        id: linear
        uses: composio/composio-sdk-action@v1
        with:
          connection_id: ${{ secrets.COMPOSIO_LINEAR_CONNECTION_ID }}
          action: LINEAR_CREATE_ISSUE
          input: |
            {
              "teamId": "${{ secrets.LINEAR_TEAM_ID }}",
              "title": "GH #${{ steps.ctx.outputs.number }}: ${{ steps.ctx.outputs.title }}",
              "description": "${{ steps.ctx.outputs.url }}"
            }

      - name: Send Telegram summary
        uses: composio/composio-send-telegram-message@v1
        with:
          chat_id: "-1003886112318"
          text: |
            🔄 Orchestrator:
            Type: ${{ steps.ctx.outputs.type }}
            Title: ${{ steps.ctx.outputs.title }}
            Labels: ${{ steps.ctx.outputs.labels }}
            Notion: ${{ steps.notion.outputs.result }}
            Linear: ${{ steps.linear.outputs.result }}
