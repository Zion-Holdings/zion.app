name: composio-daily-summary

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Composio SDK
        run: npm install @composio/core

      - name: Aggregate site health
        id: health
        uses: composio/composio-http-request@v1
        with:
          method: "GET"
          url: "https://ziontechgroup.com/"
          timeout_ms: 10000

      - name: Fetch recent emails
        id: gmail
        uses: composio/composio-sdk-action@v1
        continue-on-error: true
        with:
          connection_id: ${{ secrets.COMPOSIO_GMAIL_CONNECTION_ID }}
          action: GMAIL_FETCH_EMAILS
          input: |
            {
              "max_results": 5,
              "query": "in:inbox newer_than:1d"
            }

      - name: Check Stripe payments
        id: stripe
        uses: composio/composio-sdk-action@v1
        continue-on-error: true
        with:
          connection_id: ${{ secrets.COMPOSIO_STRIPE_CONNECTION_ID }}
          action: STRIPE_LIST_EVENTS
          input: |
            {
              "type": "payment_intent.succeeded",
              "limit": 5
            }

      - name: Notion daily page
        uses: composio/composio-sdk-action@v1
        continue-on-error: true
        with:
          connection_id: ${{ secrets.COMPOSIO_NOTION_CONNECTION_ID }}
          action: NOTION_CREATE_PAGE
          input: |
            {
              "database_id": "${{ secrets.NOTION_LEADS_DB_ID }}",
              "parent": { "database_id": "${{ secrets.NOTION_LEADS_DB_ID }}" },
              "properties": {
                "Name": { "title": [{ "text": { "content": "Daily Summary - $(date +%Y-%m-%d)" } }] },
                "Source": { "rich_text": [{ "text": { "content": "Daily automation" } }] },
                "Status": { "status": { "name": "Open" } }
              }
            }

      - name: Telegram summary
        uses: composio/composio-send-telegram-message@v1
        with:
          chat_id: "-1003886112318"
          text: |
            Zion daily summary:
            Site: ${{ steps.health.outputs.status_code || 'n/a' }}
            Gmail: ${{ steps.gmail.outputs.result || 'n/a' }}
            Stripe: ${{ steps.stripe.outputs.result || 'n/a' }}
