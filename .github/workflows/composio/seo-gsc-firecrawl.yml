name: composio-seo-gsc-firecrawl

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  seo-watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Composio SDK
        run: npm install @composio/core

      - name: Firecrawl scrape
        id: firecrawl
        uses: composio/composio-sdk-action@v1
        with:
          connection_id: ${{ secrets.COMPOSIO_FIRECRAWL_CONNECTION_ID }}
          action: FIRECRAWL_SCRAPE
          input: |
            {
              "url": "https://ziontechgroup.com",
              "formats": ["markdown"],
              "onlyMainContent": true
            }

      - name: GSC query
        id: gsc
        uses: composio/composio-sdk-action@v1
        with:
          connection_id: ${{ secrets.COMPOSIO_GOOGLE_SEARCH_CONSOLE_CONNECTION_ID }}
          action: GOOGLE_SEARCH_CONSOLE_SEARCH_ANALYTICS_QUERY
          input: |
            {
              "site_url": "sc-domain:ziontechgroup.com",
              "start_date": "$(date -d '7 days ago' +%Y-%m-%d)",
              "end_date": "$(date +%Y-%m-%d)",
              "dimensions": ["query"],
              "row_limit": 20
            }

      - name: Notion page
        uses: composio/composio-sdk-action@v1
        with:
          connection_id: ${{ secrets.COMPOSIO_NOTION_CONNECTION_ID }}
          action: NOTION_CREATE_PAGE
          input: |
            {
              "database_id": "${{ secrets.NOTION_LEADS_DB_ID }}",
              "parent": { "database_id": "${{ secrets.NOTION_LEADS_DB_ID }}" },
              "properties": {
                "Name": { "title": [{ "text": { "content": "SEO Weekly - $(date +%Y-%m-%d)" } }] },
                "Source": { "rich_text": [{ "text": { "content": "GSC + Firecrawl" } }] },
                "Status": { "status": { "name": "Open" } }
              }
            }

      - name: Telegram summary
        uses: composio/composio-send-telegram-message@v1
        with:
          chat_id: "-1003886112318"
          text: |
            Zion SEO Weekly:
            Firecrawl: ${{ steps.firecrawl.outputs.result || 'n/a' }}
            GSC: ${{ steps.gsc.outputs.result || 'n/a' }}
