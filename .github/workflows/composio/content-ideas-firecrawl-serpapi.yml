name: composio-content-ideas-firecrawl-serpapi

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  content-ideas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Composio SDK
        run: npm install @composio/core

      - name: Scrape Zion site
        id: firecrawl
        uses: composio/composio-sdk-action@v1
        with:
          connection_id: ${{ secrets.COMPOSIO_FIRECRAWL_CONNECTION_ID }}
          action: FIRECRAWL_SCRAPE
          input: |
            {
              "url": "https://ziontechgroup.com",
              "formats": ["markdown"],
              "onlyMainContent": true
            }

      - name: Search trending AI/IT topics
        id: serpapi
        uses: composio/composio-sdk-action@v1
        with:
          connection_id: ${{ secrets.COMPOSIO_SERPAPI_CONNECTION_ID }}
          action: SERPAPI_SEARCH
          input: |
            {
              "query": "AI IT services trends 2026 LATAM"
            }

      - name: Create Notion page with content ideas
        uses: composio/composio-sdk-action@v1
        with:
          connection_id: ${{ secrets.COMPOSIO_NOTION_CONNECTION_ID }}
          action: NOTION_CREATE_PAGE
          input: |
            {
              "database_id": "${{ secrets.NOTION_LEADS_DB_ID }}",
              "parent": { "database_id": "${{ secrets.NOTION_LEADS_DB_ID }}" },
              "properties": {
                "Name": { "title": [{ "text": { "content": "Content Ideas - $(date +%Y-%m-%d)" } }] },
                "Source": { "rich_text": [{ "text": { "content": "Firecrawl + SerpAPI" } }] },
                "Status": { "status": { "name": "Open" } }
              }
            }

      - name: Notify Telegram
        uses: composio/composio-send-telegram-message@v1
        with:
          chat_id: "-1003886112318"
          text: |
            Zion content ideas:
            Firecrawl: ${{ steps.firecrawl.outputs.result || 'n/a' }}
            SerpAPI: ${{ steps.serpapi.outputs.result || 'n/a' }}
