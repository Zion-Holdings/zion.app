name: composio-notion-linear-sync

on:
  issues:
    types:
      - opened
  issue_comment:
    types:
      - created
  workflow_dispatch:

jobs:
  notion-to-linear:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Composio SDK
        run: npm install @composio/core

      - name: Fetch Notion page
        uses: composio/composio-sdk-action@v1
        id: notion
        with:
          connection_id: ${{ secrets.COMPOSIO_NOTION_CONNECTION_ID }}
          action: NOTION_FETCH_PAGE
          input: |
            {
              "page_id": "${{ secrets.NOTION_SOURCE_PAGE_ID }}"
            }

      - name: Create Linear issue
        uses: composio/composio-sdk-action@v1
        with:
          connection_id: ${{ secrets.COMPOSIO_LINEAR_CONNECTION_ID }}
          action: LINEAR_CREATE_ISSUE
          input: |
            {
              "teamId": "${{ secrets.LINEAR_TEAM_ID }}",
              "title": "${{ fromJson(steps.notion.outputs.result).properties.Name.title[0].plain_text }}",
              "description": "${{ fromJson(steps.notion.outputs.result).properties.Description.rich_text[0].plain_text }}"
            }