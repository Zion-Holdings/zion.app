name: composio-sentry-github-issues

on:
  issues:
    types:
      - opened
  issue_comment:
    types:
      - created
  workflow_dispatch:

jobs:
  sentry-to-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Composio SDK
        run: npm install @composio/core

      - name: Create GitHub issue from Sentry event
        uses: composio/composio-sdk-action@v1
        with:
          connection_id: ${{ secrets.COMPOSIO_SENTRY_CONNECTION_ID }}
          action: SENTRY_CREATE_ISSUE
          input: |
            {
              "title": "${{ github.event.issue.title }}",
              "body": "${{ github.event.issue.body }}",
              "labels": ["sentry", "auto-created"]
            }
