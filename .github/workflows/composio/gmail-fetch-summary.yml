name: composio-gmail-fetch-summary

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Composio SDK
        run: npm install @composio/core

      - name: Fetch recent emails
        id: gmail
        uses: composio/composio-sdk-action@v1
        with:
          connection_id: ${{ secrets.COMPOSIO_GMAIL_CONNECTION_ID }}
          action: GMAIL_FETCH_EMAILS
          input: |
            {
              "max_results": 10,
              "query": "in:inbox"
            }

      - name: Notify Telegram
        uses: composio/composio-send-telegram-message@v1
        with:
          chat_id: "-1003886112318"
          text: |
            Zion inbox summary:
            ${{ steps.gmail.outputs.result || 'n/a' }}
