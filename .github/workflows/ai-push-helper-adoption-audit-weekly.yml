name: AI Push helper adoption audit (weekly)

permissions:
  contents: read

on:
  schedule:
    - cron: '34 15 * * 1'
  pull_request:
    paths:
      - "automation/audit-push-helper-adoption.cjs"
  workflow_dispatch:

concurrency:
  group: ai-push-helper-adoption-audit-weekly
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      with:

        fetch-depth: 1

- name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Run push-helper adoption audit
        run: node automation/audit-push-helper-adoption.cjs

      - name: Upload adoption report artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: push-helper-adoption-${{ github.run_id }}
          path: automation/reports/workflow-push-helper-adoption-latest.json
          if-no-files-found: error
          retention-days: 14
