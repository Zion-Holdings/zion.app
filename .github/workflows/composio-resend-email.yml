name: composio-resend-email

on:
  workflow_dispatch:
  issues:
    types: [opened]

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Composio SDK
        run: npm install @composio/core

      - name: Send email via Resend
        id: resend
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: |
          cat > send.mjs <<'EOF'
          import { Composio } from '@composio/core';
          const composio = new Composio({ apiKey: process.env.COMPOSIO_API_KEY });
          const client = composio.getClient();
          const accounts = await client.connectedAccounts.list({});
          const resend = (accounts.items || []).find(a => a.toolkit?.slug === 'resend');
          if (!resend) {
            console.error('No Resend connected account found');
            process.exit(1);
          }
          const entityId = resend.user_id;
          const result = await client.tools.execute('RESEND_SEND_EMAIL', {
            connection_id: resend.id,
            entity_id: entityId,
            arguments: {
              to: 'kleber@ziontechgroup.com',
              subject: 'Zion lead captured',
              body: 'New lead from GitHub issue',
              from: 'Zion <noreply@ziontechgroup.com>'
            }
          });
          console.log(JSON.stringify(result, null, 2));
          EOF
          node send.mjs
