name: composio-stripe-monitor

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Composio SDK
        run: npm install @composio/core

      - name: Stripe monitor
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: |
          cat > stripe.mjs <<'EOF'
          import { Composio } from '@composio/core';
          const composio = new Composio({ apiKey: process.env.COMPOSIO_API_KEY });
          const client = composio.getClient();
          const accounts = await client.connectedAccounts.list({});
          const stripe = (accounts.items || []).find(a => a.toolkit?.slug === 'stripe');
          if (!stripe) {
            console.error('No Stripe connected account found');
            process.exit(1);
          }
          const result = await client.tools.execute('STRIPE_LIST_PAYMENTS', {
            connection_id: stripe.id,
            entity_id: stripe.user_id,
            arguments: {
              limit: 5
            }
          });
          console.log(JSON.stringify(result, null, 2));
          EOF
          node stripe.mjs
