name: AI Agents Docs Updater

permissions:
  contents: read

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  update-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Generate AI agents docs snapshot
        run: node automation/ai-agents-docs-updater.cjs

      - name: Upload agents docs snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ai-agents-docs-${{ github.run_id }}
          path: automation/reports/ai-agents-docs-latest.json
          if-no-files-found: error
          retention-days: 14

