name: AI Weekly Launch Digest

permissions:
  contents: read

"on":
  schedule:
    - cron: '30 13 * * 1'
  workflow_dispatch:

jobs:
  launch-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Generate AI launch digest
        run: node automation/generate-ai-launch-digest.cjs

      - name: Upload digest artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-launch-digest-${{ github.run_id }}
          path: |
            automation/reports/ai-launch-digest-latest.json
            automation/reports/ai-launch-digest-latest.md
          if-no-files-found: error

