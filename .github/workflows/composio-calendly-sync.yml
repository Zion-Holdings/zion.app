name: composio-calendly-sync

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Composio SDK
        run: npm install @composio/core

      - name: Calendly sync
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: |
          cat > calendly.mjs <<'EOF'
          import { Composio } from '@composio/core';
          const composio = new Composio({ apiKey: process.env.COMPOSIO_API_KEY });
          const client = composio.getClient();
          const accounts = await client.connectedAccounts.list({});
          const calendly = (accounts.items || []).find(a => a.toolkit?.slug === 'calendly');
          if (!calendly) {
            console.error('No Calendly connected account found');
            process.exit(1);
          }
          const result = await client.tools.execute('CALENDYLIST_EVENT_TYPES', {
            connection_id: calendly.id,
            entity_id: calendly.user_id,
            arguments: {}
          });
          console.log(JSON.stringify(result, null, 2));
          EOF
          node calendly.mjs
