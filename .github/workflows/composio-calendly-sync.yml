name: Composio Calendly Sync

on:
  schedule:
    - cron: '0 7,19 * * *'
  workflow_dispatch:

jobs:
  calendly-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install @composio/core 2>/dev/null || true
      - run: node scripts/composio/calendly-check.js
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
