name: AI GHA scheduled cost estimate

permissions:
  contents: read

on:
  schedule:
    - cron: '12 15 * * 0'
  workflow_dispatch:

concurrency:
  group: ai-gha-cost-estimate
  cancel-in-progress: false

jobs:
  estimate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Estimate scheduled CI minutes
        run: node automation/gha-workflow-cost-estimator.cjs

      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gha-workflow-cost-${{ github.run_id }}
          path: automation/reports/gha-workflow-cost-estimate-latest.json
          if-no-files-found: ignore
          retention-days: 90
