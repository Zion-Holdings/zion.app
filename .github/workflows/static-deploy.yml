name: Simple Static Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          mkdir -p out
          # Root HTML first (legacy export), then public/ wins for marketing pages.
          for d in */; do
            d="${d%/}"
            case "$d" in out|.git|.github|node_modules|.next|public|docs) continue ;; esac
            if [ -f "$d/index.html" ]; then
              rm -rf "out/$d"
              cp -Rf "$d" "out/$d"
            fi
          done
          for f in *.html; do
            [ -f "$f" ] && cp -f "$f" "out/$f"
          done
          cp -Rf docs/. out/docs/ 2>/dev/null || true
          cp -Rf public/. out/
          [ -f CNAME ] && cp -f CNAME out/CNAME || true
          [ -f public/CNAME ] && cp -f public/CNAME out/CNAME || true
          [ -f public/404.html ] && cp -f public/404.html out/404.html || true
          [ -f docs/_redirects ] && cp -f docs/_redirects out/_redirects || true
          [ -f public/_redirects ] && cp -f public/_redirects out/_redirects || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - uses: actions/deploy-pages@v4
