name: Simple Static Deploy

# Fallback Pages publish from committed public/ + docs/.
# This must NEVER replace the Next.js source tree on main.
# Source integrity is enforced by source-integrity.yml.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard against source-less trees
        run: node scripts/checks/source-integrity-check.cjs

      - run: |
          set -euo pipefail
          mkdir -p out
          if [ -d public ]; then cp -Rf public/. out/; fi
          if [ -d docs ]; then mkdir -p out/docs && cp -Rf docs/. out/docs/; fi
          [ -f _headers ] && cp -f _headers out/_headers || true
          [ -f _redirects ] && cp -f _redirects out/_redirects || true
          [ -f CNAME ] && cp -f CNAME out/CNAME || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - uses: actions/deploy-pages@v4
