name: Simple Static Deploy

# Publishes committed public/ to GitHub Pages.
# Must always include CNAME or the custom domain is cleared
# (ziontechgroup.com then 404s with "There isn't a GitHub Pages site here").
on:
  push:
    branches: [ main, cursor/fix-pages-cname-8234 ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Pages artifact with custom domain
        run: |
          set -euo pipefail
          mkdir -p out
          if [ -d public ]; then cp -Rf public/. out/; fi
          if [ -d docs ]; then mkdir -p out/docs && cp -Rf docs/. out/docs/; fi
          [ -f _headers ] && cp -f _headers out/_headers || true
          [ -f _redirects ] && cp -f _redirects out/_redirects || true
          [ -f CNAME ] && cp -f CNAME out/CNAME || true
          [ -f public/CNAME ] && cp -f public/CNAME out/CNAME || true
          printf 'ziontechgroup.com\n' > out/CNAME
          touch out/.nojekyll
          # Promote root static routes if public/ is missing them (live /pricing 404).
          for route in pricing contact about faq services tools blog ai-services; do
            if [ ! -f "out/${route}/index.html" ] && [ -f "${route}/index.html" ]; then
              mkdir -p "out/${route}"
              cp -f "${route}/index.html" "out/${route}/index.html"
              echo "promoted /${route}/ from repo root"
            fi
          done
          test -s out/CNAME
          test -f out/index.html
          test -f out/pricing/index.html
          test -f out/contact/index.html
          echo "Publishing $(find out -type f | wc -l) files; CNAME=$(tr -d '\n' < out/CNAME)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - uses: actions/deploy-pages@v4
