name: Simple Static Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          mkdir -p out
          cp -Rf public/. out/
          cp -Rf docs/. out/docs/ 2>/dev/null || true
          [ -f CNAME ] && cp -f CNAME out/CNAME || true
          [ -f public/CNAME ] && cp -f public/CNAME out/CNAME || true
          [ -f public/404.html ] && cp -f public/404.html out/404.html || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - uses: actions/deploy-pages@v4
