name: Lighthouse Baseline
'on':
  schedule:
  - cron: 0 1 * * *
  workflow_dispatch: {}
jobs:
  baseline:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
    - name: checkout
      uses: actions/checkout@v4
    - name: set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
    - name: install dependencies
      run: npm ci --prefer-offline --no-audit --fund=false
    - name: build
      run: npm run build
    - name: run Lighthouse
      run: npx lighthouse http://localhost:3000 \
          --chrome-flags='--headless --no-sandbox' \
          --only-categories=performance,accessibility,best-practices,seo \
          --output=json \
          --output-path=./lighthouse-report.json || true
    - name: Lighthouse baseline update
      run: bash scripts/checks/lighthouse-baseline-update.sh
    - name: upload baseline
      uses: actions/upload-artifact@v4
      with:
        name: lighthouse-baseline
        path: lighthouse-baseline.json
        retention-days: 90
    timeout-minutes: 20
