name: robots-sitemap-compliance
"on":
  schedule:
  - cron: 0 3 * * 1
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: npm
        cache-dependency-path: package-lock.json
    - name: Install deps
      run: npm ci
    - name: Run robots/sitemap compliance check
      run: node automation/robots-sitemap-check.cjs
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 10
