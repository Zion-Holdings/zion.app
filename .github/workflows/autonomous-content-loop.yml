name: Autonomous Content Loop

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  content-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Hermes CLI
        run: |
          npm install -g @nousresearch/hermes-agent || true
          hermes --version || true

      - name: Run content cycle
        run: |
          echo 'Content is generated locally. This workflow builds and deploys the current repo state.'

      - name: Build site
        run: |
          npm ci
          npm run build -- --webpack
          node scripts/generate-sitemap-feed.cjs
          node scripts/write-clean-sitemap.cjs

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          destination_dir: .
          keep_files: true
          enable_jekyll: false

      - name: Report summary
        if: always()
        run: |
          echo "## Content Cycle Summary" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          ls -la content/posts || true
          tail -n 20 content/queue.md || true
