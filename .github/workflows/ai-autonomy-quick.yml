name: AI Autonomy Quick Cycle

permissions:
  contents: read

"on":
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * *' # Daily at 05:30 UTC

jobs:
  autonomy-quick-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Run deploy readiness gate
        id: readiness
        run: |
          set +e
          npm run deploy:readiness
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run autonomy quick cycle (improvement + deploy)
        if: steps.readiness.outputs.status == '0'
        env:
#           NETLIFY_BUILD_HOOK removed (Netlify decommissioned → GitHub Pages)
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run app:autonomy-quick-cycle

