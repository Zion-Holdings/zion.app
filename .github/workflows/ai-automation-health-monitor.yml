name: AI Automation Health Monitor

permissions:
  contents: read

concurrency:
  group: ai-automation-health-monitor
  cancel-in-progress: true

"on":
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Run automation health monitor
        run: npm run automation:health

      - name: Run cron health monitor
        run: npm run cron:health

      - name: Upload health reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: automation-health-${{ github.run_id }}
          path: |
            automation/reports/health-monitor-latest.json
            automation/logs/cron-health-monitor.log
          if-no-files-found: ignore
          retention-days: 14

