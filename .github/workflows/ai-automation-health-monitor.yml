name: AI Automation Health Monitor

permissions:
  contents: read

concurrency:
  group: ai-automation-health-monitor
  cancel-in-progress: true

"on":
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Run automation health monitor
        run: npm run automation:health

      - name: Run cron health monitor
        run: npm run cron:health

      - name: Upload health reports
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: automation-health-${{ github.run_id }}
          path: |
            automation/reports/health-monitor-latest.json
            automation/logs/cron-health-monitor.log
          if-no-files-found: ignore
          retention-days: 14

