name: Composio Stripe Monetization
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
jobs:
  stripe-monetization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Composio SDK
        run: npm install composio
      - name: Sync Stripe revenue to Notion
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          STRIPE_CONNECTION_ID: ${{ secrets.STRIPE_CONNECTION_ID }}
          NOTION_CONNECTION_ID: ${{ secrets.NOTION_CONNECTION_ID }}
        run: |
          cat > scripts/composio/stripe-to-notion-revenue-sync.js << 'EOF'
          const { Composio } = require('composio');
          const client = new Composio({ apiKey: process.env.COMPOSIO_API_KEY });
          (async () => {
            try {
              const stripeTools = await client.tools.get('stripe', { userId: process.env.STRIPE_CONNECTION_ID });
              const notionTools = await client.tools.get('notion', { userId: process.env.NOTION_CONNECTION_ID });
              console.log('Stripe tools:', stripeTools.tools.length);
              console.log('Notion tools:', notionTools.tools.length);
            } catch (e) { console.error('Sync error:', e.message); }
          })();
          EOF
          node scripts/composio/stripe-to-notion-revenue-sync.js
