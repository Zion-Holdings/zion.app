# Read-only / conservative checks — safe to run manually before dependency work.
name: AI conservative autofix audit

permissions:
  contents: read

"on":
  workflow_dispatch:

concurrency:
  group: ai-conservative-autofix-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: npm audit (report only)
        run: |
          mkdir -p automation/reports
          npm audit --json > automation/reports/conservative-npm-audit-${{ github.run_id }}.json || true

      - name: Lint check (informational)
        run: npm run lint:check
        continue-on-error: true

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conservative-autofix-audit-${{ github.run_id }}
          path: automation/reports/conservative-npm-audit-${{ github.run_id }}.json
          if-no-files-found: ignore
          retention-days: 14
