permissions:
  contents: read
name: Autonomous Changelog Generator
"on":
  push:
    branches:
    - main
  workflow_dispatch:
jobs:
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '20'
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Run Changelog Generator
      id: changelog
      continue-on-error: true
      run: 'node automation/changelog-generator.cjs > /tmp/changelog-output.txt ||
        true

        echo "exit_code=$?" >> $GITHUB_OUTPUT

        '
    - name: Upload changelog artifact
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: changelog-md
        path: CHANGELOG.md
        retention-days: 7
    - name: Commit updated CHANGELOG.md
      if: steps.changelog.outputs.exit_code == '0'
      run: 'git config user.name "openclaw-automation"

        git config user.email "openclaw@ziontechgroup.com"

        git add CHANGELOG.md

        git diff --cached --quiet || git commit -m "docs(auto): update changelog with
        recent changes"

        git push origin HEAD:${{ github.ref }}

        '
    - name: Notify Telegram on update
      if: steps.changelog.outputs.exit_code == '0' && success()
      run: "# Count new entries added (rough check)\nnode automation/notify-telegram.js\
        \ \"\U0001F4CB Changelog updated with latest commits.\"\n"
    - name: Notify Telegram on errors
      if: failure()
      run: "node automation/notify-telegram.js \"\u26A0\uFE0F Changelog generator\
        \ encountered errors. Check workflow logs.\"\n"
    timeout-minutes: 10
