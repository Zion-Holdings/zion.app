name: Hook Self-Test
permissions:
  contents: read
"on":
  workflow_dispatch:
    inputs:
      hook:
        description: Hook test target
        required: false
        default: app/hooks/__tests__/useAutoJsonLdPage.self-test.cjs
        type: string
jobs:
  self-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: run self-test
      run: 'set -euo pipefail

        node "${{ inputs.hook || ''app/hooks/__tests__/useAutoJsonLdPage.self-test.cjs''
        }}"

        '
    timeout-minutes: 20
