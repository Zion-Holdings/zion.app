name: Composio SendGrid Billing Emails
on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'
jobs:
  sendgrid-billing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Composio SDK
        run: npm install composio
      - name: Send billing emails via SendGrid
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          SENDGRID_CONNECTION_ID: ${{ secrets.SENDGRID_CONNECTION_ID }}
          STRIPE_CONNECTION_ID: ${{ secrets.STRIPE_CONNECTION_ID }}
        run: |
          cat > scripts/composio/sendgrid-billing-email.js << 'EOF'
          const { Composio } = require('composio');
          const client = new Composio({ apiKey: process.env.COMPOSIO_API_KEY });
          (async () => {
            try {
              const sendgridTools = await client.tools.get('sendgrid', { userId: process.env.SENDGRID_CONNECTION_ID });
              const stripeTools = await client.tools.get('stripe', { userId: process.env.STRIPE_CONNECTION_ID });
              console.log('SendGrid tools:', sendgridTools.tools.length);
              console.log('Stripe tools:', stripeTools.tools.length);
            } catch (e) { console.error('SendGrid billing error:', e.message); }
          })();
          EOF
          node scripts/composio/sendgrid-billing-email.js
