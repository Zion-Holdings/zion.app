name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pages-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare Pages artifact
        run: bash scripts/prepare-pages-out.sh

      - name: Assert money pages exist in artifact
        run: |
          set -euo pipefail
          missing=0
          for f in index.html book/index.html plans/index.html discovery/index.html; do
            if [ ! -f "out/$f" ]; then
              echo "::error::Missing out/$f"
              missing=1
            else
              echo "ok out/$f"
            fi
          done
          if [ ! -f out/robots.txt ] && [ ! -f out/sitemap-0.xml ]; then
            echo "::warning::No robots.txt or sitemap-0.xml in artifact"
          fi
          exit "$missing"

      - name: Assert Family A chrome tags
        run: |
          set -euo pipefail
          missing=0
          for f in blog/index.html discovery/index.html services/index.html; do
            if [ ! -f "out/$f" ]; then
              echo "::warning::skip missing out/$f"
              continue
            fi
            if ! grep -q 'zion-shell.js' "out/$f"; then
              echo "::error::Missing zion-shell.js in out/$f"
              missing=1
            else
              echo "ok chrome out/$f"
            fi
          done
          exit "$missing"

      - name: Artifact file count
        run: echo "Prepared $(find out -type f | wc -l) files"
