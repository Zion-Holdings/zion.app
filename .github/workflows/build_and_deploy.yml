name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Stay disabled. This job copies leftover main public/ (Portuguese
# "Automação e IA" homepage) onto GitHub Pages via deploy-pages@v4 and
# overwrites the honest Discovery $99 site from legacy gh-pages.
jobs:
  build-and-deploy:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare artifact
        run: |
          set -euo pipefail
          mkdir -p out
          cp -Rf public/. out/
          cp -Rf docs/. out/docs/
          [ -f _headers ] && cp -f _headers out/_headers || true
          [ -f out/_headers ] || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - uses: actions/deploy-pages@v4
