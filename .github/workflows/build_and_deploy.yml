name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare artifact
        run: |
          set -euo pipefail
          mkdir -p out
          cp -Rf public/. out/
          cp -Rf docs/. out/docs/ 2>/dev/null || true
          [ -f _headers ] && cp -f _headers out/_headers || true
          [ -f _redirects ] && cp -f _redirects out/_redirects || true
          [ -f CNAME ] && cp -f CNAME out/CNAME || true
          [ -f public/CNAME ] && cp -f public/CNAME out/CNAME || true
          printf 'ziontechgroup.com\n' > out/CNAME
          test -s out/CNAME
          test -f out/index.html
          echo "Publishing $(find out -type f | wc -l) files; CNAME=$(tr -d '\n' < out/CNAME)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - uses: actions/deploy-pages@v4
