name: 1Password Sync
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Composio
        run: |
          npm install -g composio
          composio login --key $COMPOSIO_API_KEY || echo "Login may use env var"

      - name: List 1Password Connections
        run: |
          echo "=== Active 1Password Connections ==="
          composio connections list --toolkits _1password 2>&1 || echo "NO_CONNECTIONS"

      - name: 1Password List Vaults
        run: |
          echo "=== 1Password Vaults ==="
          CA=$(composio connections list --toolkits _1password --json 2>/dev/null | jq -r '.[0].id' 2>/dev/null)
          if [ -z "$CA" ] || [ "$CA" = "null" ]; then
            echo "No active 1Password connected account found"
            exit 0
          fi
          echo "Using CA: $CA"
          composio tools execute _1PASSWORD_LIST_VAULTS \
            --connected_account_id "$CA" \
            -d '{}' 2>&1 || echo "VAULTS_FAILED"

      - name: Save Status
        run: |
          echo "1Password sync completed at $(date -u)"
          echo "Check logs above for vault access status"
