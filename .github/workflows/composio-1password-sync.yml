name: 1Password Sync
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Composio
        run: npm install -g composio

      - name: 1Password List Vaults
        run: |
          echo "=== Listing 1Password Vaults ==="
          composio execute _1PASSWORD_LIST_VAULTS -d '{}' 2>/dev/null || echo "FAILED"

      - name: 1Password List Items (if vaults exist)
        run: |
          echo "=== Listing 1Password Items ==="
          composio execute _1PASSWORD_LIST_ITEMS -d '{}' 2>/dev/null || echo "FAILED"

      - name: Save 1Password Status
        run: |
          echo "1Password sync completed at $(date -u)"
