name: Workflow Ruby parse only (manual)

permissions:
  contents: read

"on":
  workflow_dispatch:

concurrency:
  group: workflow-parse-ruby-only-dispatch
  cancel-in-progress: true

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse workflow YAML (names, concurrency, job ids, local uses, cron, timeouts)
        run: ruby scripts/automation/parse-github-workflows-yaml.rb
