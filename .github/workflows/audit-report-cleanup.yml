name: Audit Report Cleanup
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: 'checkout'
        uses: actions/checkout@v4

      - name: 'archive old audit reports'
        run: |
          set -euo pipefail
          mkdir -p audit/archive
          find audit -maxdepth 1 -type f -name 'report-*.md' -mtime +30 | while read -r f; do
            month=$(date -r "$f" +%Y-%m)
            mkdir -p "audit/archive/${month}"
            mv "$f" "audit/archive/${month}/"
          done

      - name: 'prune automation health history'
        run: |
          set -euo pipefail
          if [ -f public/api/automation-health-history.json ]; then
            node -e "const fs=require('fs');const p='public/api/automation-health-history.json';try{const data=JSON.parse(fs.readFileSync(p,'utf8'));const cutoff=Date.now()-30*24*60*60*1000;const out=Array.isArray(data)?data.filter(e=>(e.timestamp||e.date||0)>=cutoff):[];fs.writeFileSync(p,JSON.stringify(out,null,2));console.log('pruned',out.length);}catch(e){console.log('skip prune:',e.message);}"
          fi

      - name: 'commit cleanup changes'
        run: |
          set -euo pipefail
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add audit/archive public/api/automation-health-history.json || true
          git diff --cached --quiet || git commit -m 'chore: archive old audit reports and prune health history'
          git push origin HEAD:main || true
