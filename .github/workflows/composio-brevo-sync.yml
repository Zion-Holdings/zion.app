name: composio-brevo-sync

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Composio SDK
        run: npm install @composio/core

      - name: Brevo sync
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: |
          cat > brevo.mjs <<'EOF'
          import { Composio } from '@composio/core';
          const composio = new Composio({ apiKey: process.env.COMPOSIO_API_KEY });
          const client = composio.getClient();
          const accounts = await client.connectedAccounts.list({});
          const brevo = (accounts.items || []).find(a => a.toolkit?.slug === 'brevo');
          if (!brevo) {
            console.error('No Brevo connected account found');
            process.exit(1);
          }
          const result = await client.tools.execute('BREVO_GET_ALL_CONTACTS', {
            connection_id: brevo.id,
            entity_id: brevo.user_id,
            arguments: {
              limit: 10
            }
          });
          console.log(JSON.stringify(result, null, 2));
          EOF
          node brevo.mjs
