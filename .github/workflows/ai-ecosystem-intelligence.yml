name: AI Ecosystem Intelligence

permissions:
  contents: read

concurrency:
  group: ai-ecosystem-intelligence
  cancel-in-progress: false

"on":
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:

jobs:
  ecosystem-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Run Ecosystem Intelligence Agent
        run: node automation/ai-ecosystem-intelligence-agent.cjs run

      - name: Run Content Freshness Agent
        run: node automation/ai-content-freshness-agent.cjs run

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecosystem-intelligence-${{ github.run_id }}
          path: |
            automation/reports/ecosystem-intelligence-latest.json
            automation/reports/content-freshness-latest.json
            automation/data/ecosystem-suggestions.json
          if-no-files-found: ignore
          retention-days: 30
