name: Route Watchdog
'on':
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
jobs:
  route-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check routes
        run: |
          set -euo pipefail
          base=https://ziontechgroup.com
          for path in / /services/ /solutions/ /pricing/ /contact/ /tools/ /about /blog /careers /partners /portal /ai-services-index /free-ai-it-tools; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$base$path" || true)
            if [ "$code" != "200" ]; then
              echo "::warning::$base$path returned $code"
            fi
          done
