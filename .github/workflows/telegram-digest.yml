name: Telegram Daily Digest
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: 'checkout'
        uses: actions/checkout@v4

      - name: 'build digest payload'
        id: build
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const healthPath = 'public/api/automation-health.json';
          const historyPath = 'public/api/automation-health-history.json';
          const text = (() => {
            try {
              const health = JSON.parse(fs.readFileSync(healthPath, 'utf8'));
              const history = JSON.parse(fs.readFileSync(historyPath, 'utf8'));
              const currentScore = health.sloScore ?? 'n/a';
              const prev = history.length > 1 ? history[history.length - 2] : null;
              const prevScore = prev?.sloScore ?? 'n/a';
              return [
                'Zion Daily Digest',
                `SLO Score: ${currentScore}`,
                `Previous: ${prevScore}`,
                `Deploy Status: ${health.deployStatus ?? 'unknown'}`,
                `Open Incident Fingerprints: ${health.openFingerprintIssues ?? 'n/a'}`
              ].join('\n');
            } catch (e) {
              return 'Zion Daily Digest\nCould not parse automation health data: ' + e.message;
            }
          })();
          const payload = { chat_id: process.env.TELEGRAM_CHAT_ID, text };
          fs.writeFileSync('digest.json', JSON.stringify(payload));
          console.log('digest_payload=' + JSON.stringify(payload));
          NODE

      - name: 'send Telegram digest'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H 'Content-Type: application/json' \
            -d @digest.json \
            >/tmp/telegram-response.json
          cat /tmp/telegram-response.json
