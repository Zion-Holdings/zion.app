name: Telegram Daily Digest
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - name: 'checkout'
        uses: actions/checkout@v4

      - name: 'build digest payload'
        id: build
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const token = process.env.TELEGRAM_BOT_TOKEN || '';
          const chatId = process.env.TELEGRAM_CHAT_ID || '';
          const hasTelegram = Boolean(token && chatId);
          const text = hasTelegram
            ? 'Zion Daily Digest\nTelegram delivery is configured.'
            : 'Zion Daily Digest\nConfigure TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID secrets to enable delivery.';
          const payload = { chat_id: chatId || '__missing__', text };
          fs.writeFileSync('digest.json', JSON.stringify(payload));
          console.log('digest_payload=' + JSON.stringify(payload));
          NODE

      - name: 'send Telegram digest'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H 'Content-Type: application/json' \
            -d @digest.json \
            >/tmp/telegram-response.json || true
          cat /tmp/telegram-response.json || true
