name: Telegram Daily Digest
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: 'checkout'
        uses: actions/checkout@v4

      - name: 'build digest payload'
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const hp='public/api/automation-health.json',hisp='public/api/automation-health-history.json',out='digest.json';let text='';try{const health=JSON.parse(fs.readFileSync(hp,'utf8')),history=JSON.parse(fs.readFileSync(hisp,'utf8')),cur=health.sloScore??'n/a',prev=history.length>1?history[history.length-2]:null,ps=prev?.sloScore??'n/a';text=`Zion Daily Digest\\nSLO Score: ${cur}\\nPrevious: ${ps}\\nDeploy Status: ${health.deployStatus??'unknown'}\\nOpen Incident Fingerprints: ${health.openFingerprintIssues??'n/a'}`;}catch(e){text='Zion Daily Digest\\nCould not parse automation health data: '+e.message;}fs.writeFileSync(out,JSON.stringify({text}));console.log('digest',text);"

      - name: 'send Telegram digest'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          PAYLOAD=$(cat digest.json)
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD"
