name: Telegram Daily Digest
permissions:
  contents: read
"on":
  schedule:
  - cron: '0 6 * * *'
  workflow_dispatch: {}
jobs:
  digest:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: build digest payload
      id: build
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: "set -euo pipefail\nnode <<'NODE'\nconst fs = require('fs');\nconst token\
        \ = process.env.TELEGRAM_BOT_TOKEN || '';\nconst chatId = process.env.TELEGRAM_CHAT_ID\
        \ || '';\nconst hasTelegram = Boolean(token && chatId);\nconst text = hasTelegram\n\
        \  ? 'Zion Daily Digest\\nTelegram delivery is configured.'\n  : 'Zion Daily\
        \ Digest\\nConfigure TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID secrets to enable\
        \ delivery.';\nconst payload = { chat_id: chatId || '__missing__', text };\n\
        fs.writeFileSync('digest.json', JSON.stringify(payload));\nconsole.log('digest_payload='\
        \ + JSON.stringify(payload));\nNODE\n"
    - name: send Telegram digest
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: "set -euo pipefail\ncurl -s -X POST \"https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage\"\
        \ \\\n  -H 'Content-Type: application/json' \\\n  -d @digest.json \\\n  >/tmp/telegram-response.json\
        \ || true\ncat /tmp/telegram-response.json || true\n"
    timeout-minutes: 10
