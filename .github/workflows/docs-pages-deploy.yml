name: Docs Pages Deploy
'on':
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: docs-pages-deploy
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          mkdir -p artifact
          if [ -d docs ]; then
            cp -a docs/. artifact/
          fi
          if [ -d out ]; then
            cp -a out/. artifact/
          fi
        id: pages-artifact
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_path: artifact
