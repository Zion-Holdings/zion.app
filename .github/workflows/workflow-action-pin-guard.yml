name: Workflow action pin guard

permissions:
  contents: read

"on":
  pull_request:
    paths:
      - ".github/workflows/**/*.yml"
      - ".github/workflows/**/*.yaml"
      - "scripts/automation/run-workflow-grep-guards.sh"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**/*.yml"
      - ".github/workflows/**/*.yaml"
      - "scripts/automation/run-workflow-grep-guards.sh"
  workflow_dispatch:

jobs:
  reject-floating-action-tags:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Action pin checks + no pull_request_target (grep guards)
        run: bash scripts/automation/run-workflow-grep-guards.sh --pin
