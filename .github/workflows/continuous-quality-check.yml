name: Continuous Quality Check

on:
  schedule:
    - cron: '0 */6 * * *'  # Run every 6 hours
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read

jobs:
  quality-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --fund=false

      - name: Run quality checks
        run: |
          echo "=== Running Lint ==="
          npm run quality -- app components || true
          
          echo "=== Running Type Check ==="
          npm run type-check || true
          
          echo "=== Running Tests ==="
          npm test -- --ci --watchAll=false --passWithNoTests || true
          
          echo "=== Running Build ==="
          NODE_OPTIONS="--max-old-space-size=4096" npm run build || true

      - name: Report status
        if: always()
        run: |
          echo "Quality check completed"
          if [ -d out ]; then
            pages=$(find out -name 'index.html' | wc -l)
            echo "Pages generated: $pages"
          fi