name: site-and-outreach-dry-run
permissions:
  contents: read

"on":
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run site integrity crawler
        run: |
          python automation/site_integrity_run.py > automation/reports/site-integrity-report.json

      - name: Upload integrity report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-integrity-report
          path: automation/reports/site-integrity-report.json
          retention-days: 7
