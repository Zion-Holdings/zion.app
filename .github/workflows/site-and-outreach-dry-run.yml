name: site-and-outreach-dry-run

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run site integrity crawler
        run: |
          python automation/site_integrity_run.py > automation/reports/site-integrity-report.json

      - name: Upload integrity report
        uses: actions/upload-artifact@v7
        with:
          name: site-integrity-report
          path: automation/reports/site-integrity-report.json
          retention-days: 7
