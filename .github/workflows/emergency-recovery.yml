name: Emergency Recovery - Minimal Build
permissions:
  contents: read
on:
  workflow_dispatch: null
  push:
    branches:
    - main
jobs:
  recovery:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '20'
    - run: rm -rf node_modules .next node
    - run: npm install --force
    - run: npm run build
    timeout-minutes: 10
