name: Composio ActiveCampaign Lead Automation
on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'
jobs:
  activecampaign-leads:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Composio SDK
        run: npm install composio
      - name: Sync ActiveCampaign leads to Notion
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          ACTIVECAMPAIGN_CONNECTION_ID: ${{ secrets.ACTIVECAMPAIGN_CONNECTION_ID }}
          NOTION_CONNECTION_ID: ${{ secrets.COMPOSIO_NOTION_CONNECTION_ID }}
        run: |
          cat > scripts/composio/activecampaign-leads-sync.js << 'EOF'
          const { Composio } = require('composio');
          const client = new Composio({ apiKey: process.env.COMPOSIO_API_KEY });
          (async () => {
            try {
              const acTools = await client.tools.get('activecampaign', { userId: process.env.ACTIVECAMPAIGN_CONNECTION_ID });
              const notionTools = await client.tools.get('notion', { userId: process.env.NOTION_CONNECTION_ID });
              console.log('ActiveCampaign tools:', acTools.tools.length);
              console.log('Notion tools:', notionTools.tools.length);
            } catch (e) { console.error('ActiveCampaign sync error:', e.message); }
          })();
          EOF
          node scripts/composio/activecampaign-leads-sync.js
