name: composio-1password-sync

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  onepassword-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Composio SDK
        run: npm install @composio/core

      - name: Refresh 1Password connection
        id: onepassword
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_1PASSWORD_CONNECTION_ID: ${{ secrets.COMPOSIO_1PASSWORD_CONNECTION_ID }}
        run: |
          cat > sync.mjs <<'EOF'
          import { Composio } from '@composio/core';
          const composio = new Composio({ apiKey: process.env.COMPOSIO_API_KEY });
          const client = composio.getClient();
          const connectionId = process.env.COMPOSIO_1PASSWORD_CONNECTION_ID;
          const result = await client.tools.execute('_1PASSWORD_LIST_ITEMS', {
            connection_id: connectionId,
            arguments: {}
          });
          console.log(JSON.stringify(result, null, 2));
          EOF
          node sync.mjs

      - name: Comment summary
        run: |
          echo "1Password connection refreshed successfully." >> "$GITHUB_STEP_SUMMARY"
