name: Performance Budget Enforcer with CI Gate

on:
  pull_request:
    branches:
    - main
  schedule:
  - cron: 0 3 * * *
  workflow_dispatch:

permissions:
  contents: read
jobs:
  performance-budget:
    name: Performance Budget Check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: npm

    - name: Install dependencies
      run: npm ci --include=dev

    - name: Show environment
      run: |
        node -v
        npm -v
        ls -la
        pwd

    - name: Build site
      run: |
        node scripts/build-wrapper.cjs > /tmp/build-wrapper.log 2>&1
        BUILD_EXIT=$?
        echo "Build wrapper exit code: $BUILD_EXIT"
        cat /tmp/build-wrapper.log || true
        if [ $BUILD_EXIT -ne 0 ]; then
          echo "Build failed"
          exit $BUILD_EXIT
        fi

    - name: Verify static export
      run: |-
        if [ -d out ]; then
          PAGES=$(find out -name 'index.html' | wc -l)
          SIZE=$(du -sh out | awk '{print $1}')
          echo "Static export successful: $PAGES pages, $SIZE"
        else
          echo "No out/ directory found"
          exit 1
        fi

    - name: Run Performance Budget Enforcer
      id: perf
      env:
        IS_MAIN_BRANCH: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
      run: |
        set +e
        node automation/performance-budget-enforcer.cjs \
          --live-url https://ziontechgroup.com \
          --output-dir .hermes/memory/performance-budget \
          --baseline-file .hermes/memory/performance-budget/baseline.json \
          > /tmp/perf-output.txt 2>&1
        exit_code=$?
        echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
        echo "EXIT_CODE=$exit_code" >> "$GITHUB_ENV"
        if [ -s /tmp/perf-output.txt ]; then
          echo '---PERF OUTPUT---'
          cat /tmp/perf-output.txt
        else
          echo 'Performance budget enforcer produced no output.'
        fi

    - name: Upload performance artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: performance-budget-state
        path: |
          .hermes/memory/performance-budget/
          /tmp/perf-output.txt
          /tmp/next-start.log
          /tmp/build-wrapper.log
        retention-days: 30

    - name: Post PR comment (if PR and failed)
      if: github.event_name == 'pull_request' && steps.perf.outputs.exit_code != '0'
      run: |
        if [ -s /tmp/perf-output.txt ]; then
          echo "::warning::Performance budget regression detected. See workflow artifacts for details."
        else
          echo "::warning::Performance budget enforcer ran but produced no details."
        fi

    - name: Notify Telegram on failure
      if: failure()
      run: |
        if [ -f automation/notify-telegram.cjs ]; then
          node automation/notify-telegram.cjs "Performance budget check failed. See CI logs." || true
        else
          echo "notify-telegram.cjs not found; skipping Telegram alert."
        fi

    - name: Notify Telegram on success
      if: success()
      run: |
        if [ -f automation/notify-telegram.cjs ]; then
          node automation/notify-telegram.cjs "Performance budget check passed." || true
        else
          echo "notify-telegram.cjs not found; skipping Telegram alert."
        fi

    timeout-minutes: 25