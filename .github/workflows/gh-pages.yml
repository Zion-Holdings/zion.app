name: Continuous Pages Deploy
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: continuous-pages-deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      pages: ${{ steps.prepare_pages.outputs.pages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare Pages artifact
        id: prepare_pages
        run: |
          set -euo pipefail
          ARTIFACT_DIR="${GITHUB_WORKSPACE:-.}/artifacts/pages"
          mkdir -p "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR/docs"
          if [ -d docs ]; then
            cp -a docs/. "$ARTIFACT_DIR"/
          fi
          docs_index=.github/docs_index.html
          if [ ! -f "$ARTIFACT_DIR/index.html" ] && [ -f "$docs_index" ]; then
            cp -a "$docs_index" "$ARTIFACT_DIR/index.html"
          fi
          if [ -d public ]; then
            cp -a public/. "$ARTIFACT_DIR"/
          fi
          if [ ! -f "$ARTIFACT_DIR/robots.txt" ] && [ -f docs/robots.txt ]; then cp -f docs/robots.txt "$ARTIFACT_DIR/robots.txt"; fi
          if [ ! -f "$ARTIFACT_DIR/sitemap.xml" ] && [ -f docs/sitemap.xml ]; then cp -f docs/sitemap.xml "$ARTIFACT_DIR/sitemap.xml"; fi
          for f in \
            case-studies/index.html \
            industries/index.html \
            partners/index.html \
            pricing/index.html \
            testimonials/index.html \
            automation/index.html \
            services/index.html \
            tools/index.html \
            solutions/index.html \
            resources/index.html \
            services/ai-workflow-automation/index.html \
            services/ai-email-intelligence/index.html \
            services/ai-smart-global-campaign/index.html \
            autonomous-ai-operating-system/index.html \
            growth-engine/index.html \
            fast-start-ai-audit/index.html \
            partner-enablement/index.html \
            ai-managed-services/index.html \
            methodology/index.html \
            why-us/index.html \
            financial-services/index.html \
            reseller/index.html \
            defense-logistics/index.html \
            ROI/index.html \
            staff-augmentation/index.html \
            ai-performance-optimization/index.html \
            ai-security/index.html \
            ai-healthcare/index.html \
            ai-ecommerce/index.html \
            ai-education/index.html \
            ai-real-estate/index.html \
            ai-legal/index.html \
            ai-energy/index.html; do
            mkdir -p "$ARTIFACT_DIR/$(dirname "$f")"
            if [ ! -f "$ARTIFACT_DIR/$f" ] && [ -f "docs/$f" ]; then
              cp -a "docs/$f" "$ARTIFACT_DIR/$f"
            fi
          done
          PAGES=$(find "$ARTIFACT_DIR" -name 'index.html' | wc -l)
          echo "pages=$PAGES" >> "$GITHUB_OUTPUT"
          echo 'manifest:'
          find "$ARTIFACT_DIR" -maxdepth 2 -type f | sed -n '1,120p'

      - name: Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/pages

  deploy:
    needs: build
    if: success() && needs.build.outputs.pages != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5

      - name: Verify deployment
        run: |
          echo "Deployed URL: ${{ steps.deployment.outputs.page_url }}"
          sleep 20
          curl -sf "${{ steps.deployment.outputs.page_url }}/" > /dev/null && echo "✓ Homepage" || echo "✗ Homepage"
          for p in /services/ /solutions/ /contact/ /tools/ /automation/ /free-ai-it-tools /case-studies /industries /testimonials; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${{ steps.deployment.outputs.page_url }}/${p#/}" || true)
            echo "$p -> $code"
          done
