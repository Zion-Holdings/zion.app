name: Deploy to GitHub Pages
on:
  push:
    branches:
    - main
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
    - run: npm install --no-audit --fund=false
    - run: npm run build:ci
    - uses: actions/configure-pages@v4
      with:
        enablement: true
    - name: Prepare Pages artifact
      run: |
        set -euo pipefail
        mkdir -p artifact
        if [ -d docs ]; then cp -a docs/. artifact/; fi
        if [ -d out ]; then cp -a out/. artifact/; fi
        if [ -f public/_redirects ]; then cat public/_redirects > artifact/_redirects; fi
        if [ -f public/_headers ]; then cp -f public/_headers artifact/_headers; fi
        if [ -d public ]; then
          find public -type f -name 'index.html' -print0 | while IFS= read -r -d '' f; do
            dest="artifact/${f#public/}"
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
          done
          if [ -f public/sitemap.xml ]; then cp -f public/sitemap.xml artifact/sitemap.xml; fi
          if [ -f public/robots.txt ]; then cp -f public/robots.txt artifact/robots.txt; fi
          if [ -f public/feed.xml ]; then cp -f public/feed.xml artifact/feed.xml; fi
        fi
    - uses: actions/upload-pages-artifact@v4
      with:
        path: ./artifact
    timeout-minutes: 30
  deploy:
    environment:
      name: github-pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/deploy-pages@v4
