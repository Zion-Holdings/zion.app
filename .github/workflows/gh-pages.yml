name: Continuous Pages Deploy
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          ARTIFACT_DIR="${GITHUB_WORKSPACE:-.}/artifacts/pages"
          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"
          if [ -d docs ]; then
            cp -a docs/. "$ARTIFACT_DIR"/ || true
          fi
          if [ -d out ]; then
            cp -a out/. "$ARTIFACT_DIR"/ || true
          fi
          if [ -d public ]; then
            cp -a public/. "$ARTIFACT_DIR"/ || true
          fi
          PAGES=$(find "$ARTIFACT_DIR" -name 'index.html' | wc -l)
          echo "pages=$PAGES" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        id: pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_path: artifacts/pages

      - name: Verify deployment
        run: |
          set -euo pipefail
          URL="${{ steps.deployment.outputs.page_url }}"
          echo "Deployed URL: ${URL}"
          sleep 20
          for p in \
            / \
            /services/ \
            /about/ \
            /contact/ \
            /blog/ \
            /pricing/ \
            /tools/ \
            /ai/ \
            /portal \
            /portal/ \
            /services/ai-agents-autonomous \
            /services/ai-agents-autonomous/ \
            /services/ai-email-bounce-and-deliverability-recovery/; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${URL}${p}" || true)
              echo "${p} -> ${code}"
            done
