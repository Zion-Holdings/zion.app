name: Continuous Pages Deploy
# cache-bust: 2026-08-04T11:10Z
'on':
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: continuous-pages-deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifacts_uploaded: ${{ steps.build.outputs.artifacts_uploaded }}
      production_out_exists: ${{ steps.build.outputs.production_out_exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Install dependencies
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo "No package.json present; skipping npm install."
          else
            npm install --no-audit --fund=false
          fi
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build Next export
        id: build
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo "No package.json present; skipping npm build."
            echo "npm_run_build_failed=" >> "$GITHUB_OUTPUT"
            echo "pages=0" >> "$GITHUB_OUTPUT"
            echo "size=none" >> "$GITHUB_OUTPUT"
            echo "artifacts_uploaded=1" >> "$GITHUB_OUTPUT"
            echo "production_out_exists=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm run build > build.log 2>&1 || echo "npm_run_build_failed=1" >> "$GITHUB_OUTPUT"
          if [ -d out ]; then
            PAGES=$(find out -name 'index.html' | wc -l)
            echo "pages=$PAGES" >> "$GITHUB_OUTPUT"
            echo "artifacts_uploaded=1" >> "$GITHUB_OUTPUT"
            echo "size=$(du -sh out | awk '{print $1}')" >> "$GITHUB_OUTPUT"
            echo "production_out_exists=1" >> "$GITHUB_OUTPUT"
          else
            echo "pages=0" >> "$GITHUB_OUTPUT"
            echo "size=none" >> "$GITHUB_OUTPUT"
            echo "artifacts_uploaded=1" >> "$GITHUB_OUTPUT"
            echo "production_out_exists=0" >> "$GITHUB_OUTPUT"
          fi
          if [ ! -d out ]; then
            echo "Build did not produce out/, continuing with docs/public fallback."
          fi

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-diagnostics-${{ github.run_number }}
          path: |
            build.log
            automation/reports/build-state.json
            out

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          ARTIFACT_DIR="${GITHUB_WORKSPACE:-.}/artifacts/pages"
          mkdir -p "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR/docs"
          # Base: docs/ from main branch.
          if [ -d docs ]; then
            cp -a docs/. "$ARTIFACT_DIR"/
          fi
          docs_index=.github/docs_index.html
          if [ ! -f "$ARTIFACT_DIR/index.html" ] && [ -f "$docs_index" ]; then
            cp -a "$docs_index" "$ARTIFACT_DIR/index.html"
          fi
          # If Next export succeeded, overlay generated files.
          if [ -d out ]; then
            cp -a out/. "$ARTIFACT_DIR"/ || true
          fi
          if [ -d public ]; then
            cp -a public/. "$ARTIFACT_DIR"/
          fi
          # Merge gh-pages branch content so redirects and static fallbacks are included,
          # without overwriting files already generated by the current build.
          gh_dir=$(mktemp -d)
          git clone --depth=1 --branch=gh-pages "https://github.com/Zion-support/zion-support.github.io.git" "$gh_dir" >/dev/null 2>&1 || true
          if [ -d "$gh_dir" ]; then
            if [ -f "$gh_dir/_redirects" ] && [ ! -f "$ARTIFACT_DIR/_redirects" ]; then cp -f "$gh_dir/_redirects" "$ARTIFACT_DIR/_redirects"; fi
            if [ -d "$gh_dir/public" ]; then
              mkdir -p "$ARTIFACT_DIR/public"
              cd "$gh_dir/public" && find . -type f | while read -r f; do
                target="$ARTIFACT_DIR/public/$f"
                if [ ! -f "$target" ]; then mkdir -p "$(dirname "$target")" && cp -a "$f" "$target"; fi
              done
            fi
            if [ -d "$gh_dir/docs" ]; then
              mkdir -p "$ARTIFACT_DIR/docs"
              cd "$gh_dir/docs" && find . -type f | while read -r f; do
                target="$ARTIFACT_DIR/docs/$f"
                if [ ! -f "$target" ]; then mkdir -p "$(dirname "$target")" && cp -a "$f" "$target"; fi
              done
            fi
            if [ -f "$gh_dir/robots.txt" ] && [ ! -f "$ARTIFACT_DIR/robots.txt" ]; then cp -f "$gh_dir/robots.txt" "$ARTIFACT_DIR/robots.txt"; fi
            if [ -f "$gh_dir/sitemap.xml" ] && [ ! -f "$ARTIFACT_DIR/sitemap.xml" ]; then cp -f "$gh_dir/sitemap.xml" "$ARTIFACT_DIR/sitemap.xml"; fi
          fi
          # Include root redirects and SEO files.
          if [ -f _redirects ] && [ ! -f "$ARTIFACT_DIR/_redirects" ]; then cp -f _redirects "$ARTIFACT_DIR/_redirects"; fi
          if [ ! -f "$ARTIFACT_DIR/robots.txt" ] && [ -f docs/robots.txt ]; then cp -f docs/robots.txt "$ARTIFACT_DIR/robots.txt"; fi
          if [ ! -f "$ARTIFACT_DIR/robots.txt" ] && [ -f public/robots.txt ]; then cp -f public/robots.txt "$ARTIFACT_DIR/robots.txt"; fi
          if [ ! -f "$ARTIFACT_DIR/sitemap.xml" ] && [ -f docs/sitemap.xml ]; then cp -f docs/sitemap.xml "$ARTIFACT_DIR/sitemap.xml"; fi
          PAGES=$(find "$ARTIFACT_DIR" -name 'index.html' | wc -l)
          echo "pages=$PAGES" >> "$GITHUB_OUTPUT"
          echo "artifacts_uploaded=1" >> "$GITHUB_OUTPUT"
          echo 'manifest:'
          find "$ARTIFACT_DIR" -maxdepth 2 -type f | sed -n '1,120p'

      - name: Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: artifacts/pages

  deploy:
    needs: build
    if: success() && (needs.build.outputs.production_out_exists == '1' || needs.build.outputs.artifacts_uploaded == '1')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0

      - name: Verify deployment
        run: |
          echo "Deployed URL: ${{ steps.deployment.outputs.page_url }}"
          sleep 20
          curl -sf "${{ steps.deployment.outputs.page_url }}/" > /dev/null && echo "Homepage OK" || echo "Homepage FAIL"
          for p in /services/ /solutions/ /pricing/ /contact/ /tools/ /about /blog /careers /partners /portal /ai-services-index /free-ai-it-tools /automation/ /services/ai-customer-support-pro/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${{ steps.deployment.outputs.page_url }}${p}" || true)
            echo "$p -> $code"
          done
