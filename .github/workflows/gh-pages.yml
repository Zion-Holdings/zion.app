name: Deploy to GitHub Pages
'on':
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.sha }}
  cancel-in-progress: false
env:
  PAGES_BRANCH: gh-pages
  PAGES_BUILD_TYPE: static
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - run: npm install --no-audit --fund=false
      - run: npm run build:ci
      - name: Validate static export output
        run: |
          if [ ! -d out ] && [ ! -d docs ]; then
            echo "Static export output missing: neither 'out/' nor 'docs/' exists after build"
            ls -la .next || true
            echo '---automation/reports/build-state.json---'; cat automation/reports/build-state.json 2>/dev/null || true; echo
            echo '---log tail---'; tail -n 50 .next/trace 2>/dev/null || true
            find out -maxdepth 2 -type f 2>/dev/null | sed -n '1,40p' || true
            exit 1
          fi
      - name: Upload build state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-state
          path: automation/reports/build-state.json
          retention-days: 7
      - name: Configure GitHub Pages
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ.get('GITHUB_TOKEN') or os.environ.get('ACTIONS_RUNTIME_TOKEN')
          owner, name = repo.split('/',1)
          url = f'https://api.github.com/repos/{owner}/{name}/pages'
          payload = {
            'source': {
              'branch': os.environ.get('PAGES_BRANCH','gh-pages'),
              'path': '/'
            }
          }
          req = urllib.request.Request(url, data=json.dumps(payload).encode(), method='POST', headers={
            'Authorization': f'token {token}',
            'Accept': 'application/vnd.github+json',
            'User-Agent': 'Hermes-Agent',
            'Content-Type': 'application/json'
          })
          try:
            with urllib.request.urlopen(req, timeout=20) as r:
              print('pages-config:', r.status, json.loads(r.read().decode('utf-8')))
          except Exception as e:
            print('pages-config note:', e)
          PY
      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          mkdir -p artifact
          if [ -d docs ]; then cp -a docs/. artifact/; fi
          if [ -d out ]; then cp -a out/. artifact/; fi
          if [ -d public ]; then cp -a public/. artifact/; fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./artifact
  deploy:
    environment:
      name: github-pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployment
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "Deployed URL: $url"
          check(){
            local expected="$1"; local code
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url$expected" || true)
            echo "$expected -> $code"
          }
          check "/"
          for p in /services /solutions /pricing /contact /tools /about /blog /careers /partners /portal /monitoring /ai-services-index /free-ai-it-tools; do
            if [ "$p" = "/" ]; then
              check "/"
              continue
            fi
            code1=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url$p" || true)
            code2=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url$p/" || true)
            if [ "$code1" = "200" ] || [ "$code2" = "200" ]; then
              echo "$p -> 200 (via $([ "$code1" = "200" ] && echo "$p" || echo "$p/") )"
            else
              echo "$p -> $code1/$code2"
            fi
          done
