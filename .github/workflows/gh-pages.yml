name: Continuous Pages Deploy
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: continuous-pages-deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      pages: ${{ steps.prepare_pages.outputs.pages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

      - name: Install dependencies
        run: npm ci --no-audit --fund=false
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

      - name: Build artifact
        id: build
        run: |
          set -euo pipefail
          node scripts/build-wrapper.cjs > build.log 2>&1
          echo "build_log_start"
          set +x
          echo "---- BUILD LOG TAIL ----"
          tail -n 400 build.log || true
          echo "---- /BUILD LOG TAIL ----"
          set -x
          echo "build_log_end"

      - name: Upload build diagnostics on failure or completion
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.run_number }}
          path: |
            build.log
            automation/reports/build-state.json
            out

      - name: Prepare Pages artifact
        id: prepare_pages
        run: |
          set -euo pipefail
          ARTIFACT_DIR="${GITHUB_WORKSPACE:-.}/artifacts/pages"
          mkdir -p "$ARTIFACT_DIR"
          # Copy docs static content as deploy base.
          if [ -d docs ]; then
            cp -a docs/. "$ARTIFACT_DIR"/
          fi
          docs_index=.github/docs_index.html
          if [ ! -f "$ARTIFACT_DIR/index.html" ] && [ -f "$docs_index" ]; then
            cp -a "$docs_index" "$ARTIFACT_DIR/index.html"
          fi
          # If Next export succeeded, overlay generated files.
          if [ -d out ]; then
            cp -a out/. "$ARTIFACT_DIR"/ || true
          fi
          if [ -d public ]; then
            cp -a public/. "$ARTIFACT_DIR"/
          fi
          cp -f public/_redirects "$ARTIFACT_DIR/_redirects" 2>/dev/null || true
          cp -f docs/_redirects "$ARTIFACT_DIR/_redirects" 2>/dev/null || true
          # Ensure fallback pages exist in the exported artifact, even if Next didn't emit them.
          for f in \
            use-cases/index.html \
            industries/financial-services/index.html \
            public-roadmap/index.html \
            tools/phishing-analyzer/index.html \
            status/index.html \
            solutions/healthcare/index.html \
            free-consultation/index.html \
            pricing/index.html \
            partners/index.html \
            careers/index.html \
            services/ai-readiness-assessment/index.html \
            services/ai-data-pipeline-integration/index.html \
            services/ai-governance-risk-compliance/index.html \
            docs/ai-resources/index.html \
            tools/zion-roi-calculator/index.html \
            case-studies/index.html \
            industries/index.html \
            testimonials/index.html \
            automation/index.html \
            services/ai-workflow-automation/index.html \
            services/ai-email-intelligence/index.html \
            services/ai-smart-global-campaign/index.html \
            free-ai-it-tools/index.html \
          ; do
            mkdir -p "$ARTIFACT_DIR/$(dirname "$f")"
            if [ ! -f "$ARTIFACT_DIR/$f" ]; then
              if [ -f "public/$f" ]; then
                cp -a "public/$f" "$ARTIFACT_DIR/$f"
              elif [ -f "docs/$f" ]; then
                cp -a "docs/$f" "$ARTIFACT_DIR/$f"
              fi
            fi
          done
          # Ensure SEO files exist whichever path produced them.
          if [ ! -f "$ARTIFACT_DIR/robots.txt" ] && [ -f docs/robots.txt ]; then cp -f docs/robots.txt "$ARTIFACT_DIR/robots.txt"; fi
          if [ ! -f "$ARTIFACT_DIR/sitemap.xml" ] && [ -f docs/sitemap.xml ]; then cp -f docs/sitemap.xml "$ARTIFACT_DIR/sitemap.xml"; fi
          PAGES=$(find "$ARTIFACT_DIR" -name 'index.html' | wc -l)
          echo "pages=$PAGES" >> "$GITHUB_OUTPUT"
          echo 'manifest:'
          find "$ARTIFACT_DIR" -maxdepth 2 -type f | sed -n '1,120p'

      - name: Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/pages

  deploy:
    needs: build
    if: success() && needs.build.outputs.pages != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5

      - name: Verify deployment
        run: |
          echo "Deployed URL: ${{ steps.deployment.outputs.page_url }}"
          sleep 20
          curl -sf "${{ steps.deployment.outputs.page_url }}/" > /dev/null && echo "✓ Homepage" || echo "✗ Homepage"
          for p in /services/ /solutions/ /pricing/ /contact/ /tools/ /about/ /blog/ /careers/ /partners/ /portal/ /ai-services-index/ /free-ai-it-tools/ /automation/ /services/ai-customer-support-pro/ /use-cases/ /industries/financial-services/ /public-roadmap/ /status/ /solutions/healthcare/ /free-consultation/ /tools/phishing-analyzer/ /tools/zion-roi-calculator/ /docs/ai-resources/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${{ steps.deployment.outputs.page_url }}${p}" || true)
            echo "$p -> $code"
          done
          for p in /case-studies/ /industries/ /testimonials/ /services/ai-readiness-assessment/ /services/ai-data-pipeline-integration/ /services/ai-governance-risk-compliance/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${{ steps.deployment.outputs.page_url }}${p}" || true)
            echo "$p -> $code"
          done