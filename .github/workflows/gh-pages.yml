name: Deploy to GitHub Pages
'on':
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.sha }}
  cancel-in-progress: false
env:
  PAGES_BRANCH: gh-pages
  PAGES_BUILD_TYPE: static
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - run: npm install --no-audit --fund=false
      - run: npm run build
      - name: Validate static export output
        run: |
          if [ ! -d out ]; then
            echo "Static export output missing: 'out/' does not exist after build"
            ls -la .next || true
            echo '---log tail---'
            tail -n 50 .next/trace 2>/dev/null || true
            exit 1
          fi
      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          mkdir -p artifact
          if [ -d docs ]; then cp -a docs/. artifact/; fi
          if [ -d out ]; then cp -a out/. artifact/; fi
          if [ -d public ]; then cp -a public/. artifact/; fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./artifact
  deploy:
    environment:
      name: github-pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployment
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "Deployed URL: $url"
          check(){
            local expected="$1"; local code
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url$expected" || true)
            echo "$expected -> $code"
          }
          check "/"
          for p in /services /solutions /pricing /contact /tools /about /blog /careers /partners /portal /monitoring /ai-services-index /free-ai-it-tools /services/ai-chatbot-builder /services/ai-customer-support-pro; do
            if [ "$p" = "/" ]; then
              check "/"
              continue
            fi
            code1=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url$p" || true)
            code2=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url$p/" || true)
            if [ "$code1" = "200" ] || [ "$code2" = "200" ]; then
              echo "$p -> 200 (via $( [ "$code1" = "200" ] && echo "$p" || echo "$p/") )"
            else
              echo "$p -> $code1/$code2"
            fi
          done
