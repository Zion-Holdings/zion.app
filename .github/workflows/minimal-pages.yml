name: Minimal Pages Deploy
on:
  push:
    branches: [ gh-pages ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: minimal-pages-deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          ARTIFACT_DIR="${GITHUB_WORKSPACE:-.}/artifacts/pages"
          mkdir -p "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR/docs"
          if [ -d docs ]; then cp -a docs/. "$ARTIFACT_DIR"/; fi
          if [ -d blog ]; then cp -a blog/. "$ARTIFACT_DIR"/blog/; fi
          docs_index=".github/docs_index.html"
          if [ ! -f "$ARTIFACT_DIR/index.html" ] && [ -f "$docs_index" ]; then cp -a "$docs_index" "$ARTIFACT_DIR/index.html"; fi
          if [ -d out ]; then cp -a out/. "$ARTIFACT_DIR"/ || true; fi
          if [ -d public ]; then cp -a public/. "$ARTIFACT_DIR"/; fi
          if [ ! -f "$ARTIFACT_DIR/robots.txt" ] && [ -f docs/robots.txt ]; then cp -f docs/robots.txt "$ARTIFACT_DIR/robots.txt"; fi
          if [ ! -f "$ARTIFACT_DIR/sitemap.xml" ] && [ -f docs/sitemap.xml ]; then cp -f docs/sitemap.xml "$ARTIFACT_DIR/sitemap.xml"; fi
          PAGES=$(find "$ARTIFACT_DIR" -name 'index.html' | wc -l)
          echo "pages=$PAGES" >> "$GITHUB_OUTPUT"
          echo "artifacts_uploaded=1" >> "$GITHUB_OUTPUT"
          echo 'manifest:'
          find "$ARTIFACT_DIR" -maxdepth 2 -type f | sed -n '1,80p'
      - name: Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/pages
  deploy:
    needs: build
    if: success() && needs.build.outputs.artifacts_uploaded == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
      - name: Verify deployment
        run: |
          echo "Deployed URL: ${{ steps.deployment.outputs.page_url }}"
          sleep 15
          curl -sf "${{ steps.deployment.outputs.page_url }}/" > /dev/null && echo "✓ Homepage" || echo "✗ Homepage"
          for p in /blog/ai-customer-support-automation-roi-in-90-days/ /services/ /contact/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${{ steps.deployment.outputs.page_url }}${p}" || true)
            echo "$p -> $code"
          done
