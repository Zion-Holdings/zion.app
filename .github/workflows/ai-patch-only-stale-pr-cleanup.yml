name: AI patch-only stale PR cleanup

permissions:
  pull-requests: write
  contents: read

"on":
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * 4'

concurrency:
  group: ai-patch-only-stale-pr-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Close stale patch-only draft PRs
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_ONLY_STALE_DAYS: '10'
        run: node scripts/automation/close-stale-patch-only-prs.cjs
