<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XML Formatter | Zion Tech Group Free Tools</title>
  <meta name="description" content="Format XML code. Free online tool by Zion Tech Group." />
  <link rel="canonical" href="https://ziontechgroup.com/tools/xml-formatter/" />
</head>
<body>
  <main>
    <h1>XML Formatter</h1>
    <textarea id="xml" rows="5" placeholder="Enter XML code" style="width: 100%;"></textarea>
    <button onclick="format()">Format</button>
    <p id="result" style="margin-top: 10px;"></p>
    <p><a href="/tools/">Back to tools</a></p>
    <script>
      function format(){
        const xml = document.getElementById('xml').value;
        const res = document.getElementById('result');
        let formatted = '';
        let indent = 0;
        for (let i = 0; i < xml.length; i++) {
          const char = xml[i];
          const next = xml[i + 1];
          if (char === '<') {
            if (next === '/') indent--;
            formatted += '\n' + '  '.repeat(indent) + char;
            if (next !== '/' && next !== '?' && next !== '!') {
              indent++;
            }
          } else if (char === '>') {
            formatted += char;
          } else {
            formatted += char;
          }
        }
        res.innerHTML = '<textarea readonly style="width:100%;height:100px;">' + formatted.trim() + '</textarea>';
      }
    </script>
  </main>
</body>
</html>
