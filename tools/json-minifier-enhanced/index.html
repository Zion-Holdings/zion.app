<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSON Minifier | Zion Tech Group Free Tools</title>
  <meta name="description" content="Minify JSON code. Free online tool by Zion Tech Group." />
  <link rel="canonical" href="https://ziontechgroup.com/tools/json-minifier/" />
</head>
<body>
  <main>
    <h1>JSON Minifier</h1>
    <textarea id="json" rows="5" placeholder="Enter JSON code" style="width: 100%;"></textarea>
    <button onclick="minify()">Minify</button>
    <p id="result" style="margin-top: 10px;"></p>
    <p><a href="/tools/">Back to tools</a></p>
    <script>
      function minify(){
        const json = document.getElementById('json').value;
        const res = document.getElementById('result');
        try {
          const obj = JSON.parse(json);
          res.innerHTML = '<textarea readonly style="width:100%;height:100px;">' + JSON.stringify(obj) + '</textarea>';
        } catch(e) {
          res.textContent = 'Invalid JSON';
        }
      }
    </script>
  </main>
</body>
</html>
