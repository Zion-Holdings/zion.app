<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Color Picker | Zion Tech Group Free Tools</title>
  <meta name="description" content="Pick colors and get hex, RGB, HSL values. Free online tool by Zion Tech Group." />
  <link rel="canonical" href="https://ziontechgroup.com/tools/color-picker/" />
</head>
<body>
  <main>
    <h1>Color Picker</h1>
    <input type="color" id="color" value="#ff0000" onchange="update()" />
    <div id="output" style="width: 100px; height: 100px; background-color: #ff0000; margin: 10px 0;"></div>
    <p id="values">Hex: #FF0000 | RGB: 255, 0, 0 | HSL: 0, 100%, 50%</p>
    <p><a href="/tools/">Back to tools</a></p>
    <script>
      function update(){
        const color = document.getElementById('color').value;
        document.getElementById('output').style.backgroundColor = color;
        const r = parseInt(color.slice(1, 3), 16);
        const g = parseInt(color.slice(3, 5), 16);
        const b = parseInt(color.slice(5, 7), 16);
        const h = Math.max(r, g, b) === r ? ((g - b) / (Math.max(r, g, b) - Math.min(r, g, b))) * 60 : Math.max(r, g, b) === g ? ((b - r) / (Math.max(r, g, b) - Math.min(r, g, b))) + 2 : ((r - g) / (Math.max(r, g, b) - Math.min(r, g, b))) + 4;
        const s = (Math.max(r, g, b) + Math.min(r, g, b)) / 2;
        const l = (Math.max(r, g, b) + Math.min(r, g, b)) / 2;
        const hex = '#' + color.slice(1).toUpperCase();
        const hsl = 'HSL: ' + Math.round(h) + ', ' + Math.round(s * 100) + '%, ' + Math.round(l * 100) + '%';
        document.getElementById('values').textContent = 'Hex: ' + hex + ' | RGB: ' + r + ', ' + g + ', ' + b + ' | ' + hsl;
      }
    </script>
  </main>
</body>
</html>
