<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XML Formatter | Zion Tech Group Free Tools</title>
  <meta name="description" content="Format and indent XML code. Free online tool by Zion Tech Group." />
  <link rel="canonical" href="https://ziontechgroup.com/tools/xml-formatter/" />
</head>
<body>
  <main>
    <h1>XML Formatter</h1>
    <textarea id="xml" rows="5" placeholder="Enter XML to format">&lt;root&gt;&lt;person&gt;&lt;name&gt;John&lt;/name&gt;&lt;/person&gt;&lt;/root&gt;</textarea>
    <button onclick="format()">Format</button>
    <textarea id="result" rows="5" readonly placeholder="Formatted XML"></textarea>
    <p><a href="/tools/">Back to tools</a></p>
    <script>
      function format(){
        const xml = document.getElementById('xml').value;
        let formatted = '';
        let indent = 0;
        for (let i = 0; i < xml.length; i++) {
          const char = xml[i];
          if (char === '&lt;') {
            formatted += '\n' + '  '.repeat(indent) + '&lt;';
            indent++;
          } else if (char === '&gt;') {
            formatted += '&gt;';
            indent--;
          } else {
            formatted += char;
          }
        }
        document.getElementById('result').value = formatted.trim();
      }
    </script>
  </main>
</body>
</html>
