<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHA-256 Hash Generator | Zion Tech Group Free Tools</title>
  <meta name="description" content="Generate SHA-256 hashes. Free online tool by Zion Tech Group." />
  <link rel="canonical" href="https://ziontechgroup.com/tools/sha256-hash-generator/" />
</head>
<body>
  <main>
    <h1>SHA-256 Hash Generator</h1>
    <input id="text" type="text" placeholder="Enter text to hash" style="width: 100%;" />
    <button onclick="hash()">Hash</button>
    <p id="result"></p>
    <p><a href="/tools/">Back to tools</a></p>
    <script>
      async function hash(){
        const text = document.getElementById('text').value;
        const res = document.getElementById('result');
        const encoder = new TextEncoder();
        const data = encoder.encode(text);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        res.innerHTML = '<textarea readonly style="width:100%;height:80px;">' + hashHex + '</textarea>';
      }
    </script>
  </main>
</body>
</html>
