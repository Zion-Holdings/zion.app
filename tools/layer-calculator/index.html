<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Layer Calculator | Zion Tech Group Free Tools</title>
  <meta name="description" content="Calculate TCP/IP layers and OSI model layers. Free online tool by Zion Tech Group." />
  <link rel="canonical" href="https://ziontechgroup.com/tools/layer-calculator/" />
</head>
<body>
  <main>
    <h1>Layer Calculator</h1>
    <select id="model">
      <option value="tcpip">TCP/IP Model</option>
      <option value="osi">OSI Model</option>
    </select>
    <select id="layer" onchange="showInfo()">
      <option value="">Select a layer</option>
    </select>
    <p id="info"></p>
    <p><a href="/tools/">Back to tools</a></p>
    <script>
      const layers = {
        tcpip: {
          1: 'Application Layer - Handles high-level protocols like HTTP, FTP, SMTP, DNS',
          2: 'Transport Layer - Provides end-to-end communication and data recovery',
          3: 'Internet Layer - Handles IP addressing and routing',
          4: 'Network Access Layer - Manages physical network communication'
        },
        osi: {
          1: 'Physical Layer - Transmits raw bit streams over physical media',
          2: 'Data Link Layer - Provides node-to-node data transfer and error detection',
          3: 'Network Layer - Routes data between networks',
          4: 'Transport Layer - Provides end-to-end communication services',
          5: 'Session Layer - Manages sessions and connections',
          6: 'Presentation Layer - Handles data translation and encryption',
          7: 'Application Layer - Provides network services to applications'
        }
      };
      function showInfo(){
        const model = document.getElementById('model').value;
        const layer = document.getElementById('layer').value;
        document.getElementById('info').textContent = layer ? layers[model][layer] : '';
      }
      document.getElementById('model').onchange = function(){
        const model = this.value;
        const select = document.getElementById('layer');
        select.innerHTML = '<option value="">Select a layer</option>';
        for (let i = 1; i <= (model === 'tcpip' ? 4 : 7); i++) {
          select.innerHTML += '<option value="' + i + '">Layer ' + i + '</option>';
        }
        document.getElementById('info').textContent = '';
      };
    </script>
  </main>
</body>
</html>
