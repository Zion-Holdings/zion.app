<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image to Base64 Converter | Zion Tech Group Free Tools</title>
  <meta name="description" content="Convert images to Base64. Free online tool by Zion Tech Group." />
  <link rel="canonical" href="https://ziontechgroup.com/tools/image-to-base64/" />
</head>
<body>
  <main>
    <h1>Image to Base64 Converter</h1>
    <input type="file" id="image" accept="image/*" />
    <button onclick="convert()">Convert</button>
    <p id="result" style="margin-top: 10px;"></p>
    <p><a href="/tools/">Back to tools</a></p>
    <script>
      function convert(){
        const input = document.getElementById('image');
        const res = document.getElementById('result');
        if (!input.files || !input.files[0]) return res.textContent = 'Please select an image';
        const reader = new FileReader();
        reader.onload = function(e){
          res.innerHTML = '<textarea readonly style="width:100%;height:100px;">' + e.target.result + '</textarea>';
        };
        reader.readAsDataURL(input.files[0]);
      }
    </script>
  </main>
</body>
</html>
