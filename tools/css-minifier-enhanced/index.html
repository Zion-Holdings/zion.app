<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Minifier | Zion Tech Group Free Tools</title>
  <meta name="description" content="Minify CSS code. Free online tool by Zion Tech Group." />
  <link rel="canonical" href="https://ziontechgroup.com/tools/css-minifier/" />
</head>
<body>
  <main>
    <h1>CSS Minifier</h1>
    <textarea id="css" rows="5" placeholder="Enter CSS code" style="width: 100%;"></textarea>
    <button onclick="minify()">Minify</button>
    <p id="result" style="margin-top: 10px;"></p>
    <p><a href="/tools/">Back to tools</a></p>
    <script>
      function minify(){
        const css = document.getElementById('css').value;
        const res = document.getElementById('result');
        const minified = css
          .replace(/\/\*[\s\S]*?\*\//g, '')
          .replace(/\/\/.*$/gm, '')
          .replace(/\s+/g, ' ')
          .replace(/\s*([{};:,>~])\s*/g, '$1')
          .trim();
        res.innerHTML = '<textarea readonly style="width:100%;height:100px;">' + minified + '</textarea>';
      }
    </script>
  </main>
</body>
</html>
