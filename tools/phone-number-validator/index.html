<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phone Number Validator | Zion Tech Group Free Tools</title>
  <meta name="description" content="Validate phone numbers. Free online tool by Zion Tech Group." />
  <link rel="canonical" href="https://ziontechgroup.com/tools/phone-number-validator/" />
</head>
<body>
  <main>
    <h1>Phone Number Validator</h1>
    <input id="phone" type="text" placeholder="Enter phone number" style="width: 100%;" />
    <button onclick="validate()">Validate</button>
    <p id="result"></p>
    <p><a href="/tools/">Back to tools</a></p>
    <script>
      function validate(){
        const phone = document.getElementById('phone').value.replace(/[^0-9+]/g,'');
        const res = document.getElementById('result');
        const re = /^\+?1?[0-9]{10,15}$/;
        if (re.test(phone)) {
          res.innerHTML = '<span style="color: green;">✓ Valid phone number</span>';
        } else {
          res.innerHTML = '<span style="color: red;">✗ Invalid phone number</span>';
        }
      }
    </script>
  </main>
</body>
</html>
