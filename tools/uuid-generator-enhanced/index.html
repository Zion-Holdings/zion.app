<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UUID Generator | Zion Tech Group Free Tools</title>
  <meta name="description" content="Generate UUID v4 identifiers. Free online tool by Zion Tech Group." />
  <link rel="canonical" href="https://ziontechgroup.com/tools/uuid-generator/" />
</head>
<body>
  <main>
    <h1>UUID Generator</h1>
    <button onclick="generate()">Generate UUID</button>
    <p id="result" style="margin-top: 10px;"></p>
    <p><a href="/tools/">Back to tools</a></p>
    <script>
      function generate(){
        const res = document.getElementById('result');
        const uuid = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
          const r = Math.random() * 16 | 0;
          const v = c === 'x' ? r : (r & 0x3 | 0x8);
          return v.toString(16);
        });
        res.innerHTML = '<p>' + uuid + '</p><button onclick="copy()">Copy</button>';
      }
      function copy(){
        const text = document.getElementById('result').textContent;
        navigator.clipboard.writeText(text);
        alert('Copied to clipboard!');
      }
    </script>
  </main>
</body>
</html>
