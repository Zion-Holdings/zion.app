<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML to JSX Converter | Zion Tech Group Free Tools</title>
  <meta name="description" content="Convert HTML to React JSX format. Free online tool by Zion Tech Group." />
  <link rel="canonical" href="https://ziontechgroup.com/tools/html-to-jsx-converter/" />
</head>
<body>
  <main>
    <h1>HTML to JSX Converter</h1>
    <textarea id="html" rows="6" cols="60">&lt;div className="test"&gt;Hello&lt;/div&gt;</textarea>
    <button onclick="convert()">Convert</button>
    <pre id="out"></pre>
    <p><a href="/tools/">Back to tools</a></p>
    <script>
      function convert(){
        let html = document.getElementById('html').value;
        html = html.replace(/class/g, 'className');
        html = html.replace(/&gt;/g, '>');
        html = html.replace(/&lt;/g, '<');
        document.getElementById('out').textContent = html;
      }
    </script>
  </main>
</body>
</html>
