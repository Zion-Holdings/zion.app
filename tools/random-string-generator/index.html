<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random String Generator | Zion Tech Group Free Tools</title>
  <meta name="description" content="Generate random strings. Free online tool by Zion Tech Group." />
  <link rel="canonical" href="https://ziontechgroup.com/tools/random-string-generator/" />
</head>
<body>
  <main>
    <h1>Random String Generator</h1>
    <select id="type">
      <option value="alphanumeric">Alphanumeric</option>
      <option value="hex">Hexadecimal</option>
      <option value="numeric">Numeric</option>
    </select>
    <input id="length" type="number" value="16" min="1" max="100" />
    <button onclick="generate()">Generate</button>
    <p id="result" style="margin-top: 10px;"></p>
    <p><a href="/tools/">Back to tools</a></p>
    <script>
      function generate(){
        const type = document.getElementById('type').value;
        const length = parseInt(document.getElementById('length').value);
        const res = document.getElementById('result');
        let chars = '';
        if (type === 'alphanumeric') chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        else if (type === 'hex') chars = '0123456789ABCDEF';
        else if (type === 'numeric') chars = '0123456789';
        let result = '';
        for (let i = 0; i < length; i++) {
          result += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        res.innerHTML = '<p>' + result + '</p><button onclick="copy()">Copy</button>';
      }
      function copy(){
        const text = document.getElementById('result').textContent;
        navigator.clipboard.writeText(text);
        alert('Copied to clipboard!');
      }
    </script>
  </main>
</body>
</html>
