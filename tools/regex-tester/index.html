<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regex Tester | Zion Tech Group</title>
  <meta name="description" content="Test regex patterns with real-time match highlighting and flags.">
  <meta property="og:title" content="Regex Tester | Zion Tech Group">
  <meta property="og:description" content="Free online regex tester with match highlighting.">
  <meta property="og:url" content="https://ziontechgroup.com/tools/regex-tester/">
  <link rel="canonical" href="https://ziontechgroup.com/tools/regex-tester/">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b0f1a; color: #e5e7eb; min-height: 100vh; }
    .container { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    .subtitle { color: #94a3b8; margin-bottom: 2rem; }
    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 0.875rem; color: #94a3b8; margin-bottom: 0.5rem; }
    .field input[type="text"] { width: 100%; padding: 0.75rem; background: #1e293b; border: 1px solid #334155; border-radius: 0.5rem; color: #fff; font-family: monospace; }
    textarea { width: 100%; padding: 0.75rem; background: #1e293b; border: 1px solid #334155; border-radius: 0.5rem; color: #fff; font-family: monospace; resize: vertical; min-height: 120px; }
    textarea:focus, .field input:focus { outline: none; border-color: #6366f1; }
    .flags { display: flex; gap: 1rem; margin-bottom: 1rem; }
    .flags label { display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; cursor: pointer; }
    .flags input { accent-color: #6366f1; }
    .section { background: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; padding: 1.5rem; margin-bottom: 1rem; }
    .section h3 { font-size: 1rem; margin-bottom: 0.75rem; color: #818cf8; }
    .section pre { background: #0f172a; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; font-size: 0.875rem; line-height: 1.5; white-space: pre-wrap; word-break: break-all; }
    .error { background: #7f1d1d; border: 1px solid #991b1b; border-radius: 0.5rem; padding: 0.75rem; color: #fecaca; margin-bottom: 1rem; display: none; }
    .matches { margin-top: 0.5rem; }
    .match { background: #6366f1; color: #fff; padding: 0.125rem 0.25rem; border-radius: 0.25rem; }
    .back { display: inline-block; margin-top: 1.5rem; color: #818cf8; text-decoration: none; }
    .back:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Regex Tester</h1>
    <p class="subtitle">Test regex patterns with real-time match highlighting.</p>
    
    <div class="field">
      <label>Pattern</label>
      <input type="text" id="pattern" placeholder="e.g. \w+@\w+\.\w+" value="\w+@\w+\.\w+">
    </div>
    
    <div class="flags">
      <label><input type="checkbox" id="global" checked> Global (g)</label>
      <label><input type="checkbox" id="caseInsensitive"> Case Insensitive (i)</label>
      <label><input type="checkbox" id="multiline"> Multiline (m)</label>
    </div>
    
    <div class="field">
      <label>Test String</label>
      <textarea id="testString" placeholder="Enter text to test against...">Contact us at hello@example.com or support@test.org for help.</textarea>
    </div>
    
    <div class="error" id="error"></div>
    
    <div class="section">
      <h3>Matches (<span id="matchCount">0</span>)</h3>
      <pre id="matches">—</pre>
    </div>
    
    <a href="/tools/" class="back">← Back to Tools</a>
  </div>

  <script>
    function update() {
      const pattern = document.getElementById('pattern').value;
      const testString = document.getElementById('testString').value;
      const errorEl = document.getElementById('error');
      const matchesEl = document.getElementById('matches');
      const countEl = document.getElementById('matchCount');
      
      if (!pattern) {
        matchesEl.textContent = '—';
        countEl.textContent = '0';
        errorEl.style.display = 'none';
        return;
      }
      
      try {
        let flags = '';
        if (document.getElementById('global').checked) flags += 'g';
        if (document.getElementById('caseInsensitive').checked) flags += 'i';
        if (document.getElementById('multiline').checked) flags += 'm';
        
        const regex = new RegExp(pattern, flags);
        const matches = [];
        let match;
        
        if (flags.includes('g')) {
          while ((match = regex.exec(testString)) !== null) {
            matches.push(match[0]);
            if (match[0].length === 0) regex.lastIndex++;
          }
        } else {
          match = regex.exec(testString);
          if (match) matches.push(match[0]);
        }
        
        if (matches.length > 0) {
          matchesEl.innerHTML = matches.map(m => `<span class="match">${m}</span>`).join('\n');
          countEl.textContent = matches.length;
        } else {
          matchesEl.textContent = 'No matches found';
          countEl.textContent = '0';
        }
        
        errorEl.style.display = 'none';
      } catch(e) {
        errorEl.textContent = '✗ ' + e.message;
        errorEl.style.display = 'block';
        matchesEl.textContent = '—';
        countEl.textContent = '0';
      }
    }
    
    document.getElementById('pattern').addEventListener('input', update);
    document.getElementById('testString').addEventListener('input', update);
    document.getElementById('global').addEventListener('change', update);
    document.getElementById('caseInsensitive').addEventListener('change', update);
    document.getElementById('multiline').addEventListener('change', update);
    update();
  </script>
</body>
</html>
