<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Strength Checker | Zion Tech Group Free Tools</title>
  <meta name="description" content="Check password strength and get suggestions. Free online tool by Zion Tech Group." />
  <link rel="canonical" href="https://ziontechgroup.com/tools/password-strength-checker/" />
</head>
<body>
  <main>
    <h1>Password Strength Checker</h1>
    <input id="password" type="password" placeholder="Enter password" value="MySecurePassword123!" />
    <button onclick="check()">Check Strength</button>
    <p id="result"></p>
    <p><a href="/tools/">Back to tools</a></p>
    <script>
      function check(){
        const password = document.getElementById('password').value;
        let score = 0;
        if (password.length >= 8) score++;
        if (password.length >= 12) score++;
        if (/[a-z]/.test(password)) score++;
        if (/[A-Z]/.test(password)) score++;
        if (/[0-9]/.test(password)) score++;
        if (/[^A-Za-z0-9]/.test(password)) score++;
        const res = document.getElementById('result');
        const strengths = ['Very Weak', 'Weak', 'Fair', 'Good', 'Strong', 'Very Strong'];
        res.textContent = 'Strength: ' + strengths[score] + ' (' + score + '/6)';
      }
    </script>
  </main>
</body>
</html>
