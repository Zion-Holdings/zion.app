<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Beautifier | Zion Tech Group Free Tools</title>
  <meta name="description" content="Beautify minified CSS instantly. Free online tool by Zion Tech Group." />
  <link rel="canonical" href="https://ziontechgroup.com/tools/css-beautifier/" />
</head>
<body>
  <main>
    <h1>CSS Beautifier</h1>
    <textarea id="css" rows="10" cols="80">.a{color:red;margin:0}.b{color:blue}</textarea>
    <button onclick="beautify()">Beautify</button>
    <pre id="out"></pre>
    <p><a href="/tools/">Back to tools</a></p>
    <script>
      function beautify(){
        const text = document.getElementById('css').value;
        const out = text.replace(/([^{}]+)\{([^{}]+)\}/g, (_, sel, body) => {
          const props = body.split(';').filter(Boolean).map(p => '  ' + p.trim()).join('\n');
          return sel.trim() + ' {\n' + props + '\n}';
        });
        document.getElementById('out').textContent = out;
      }
    </script>
  </main>
</body>
</html>
