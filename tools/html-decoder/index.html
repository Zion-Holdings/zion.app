<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML Decoder | Zion Tech Group Free Tools</title>
  <meta name="description" content="Decode HTML entities. Free online tool by Zion Tech Group." />
  <link rel="canonical" href="https://ziontechgroup.com/tools/html-decoder/" />
</head>
<body>
  <main>
    <h1>HTML Decoder</h1>
    <textarea id="text" rows="3" placeholder="Enter HTML encoded text">&lt;script&gt;alert(&quot;Hello&quot;)&lt;/script&gt;</textarea>
    <button onclick="decode()">Decode</button>
    <textarea id="result" rows="3" readonly placeholder="Decoded text"></textarea>
    <p><a href="/tools/">Back to tools</a></p>
    <script>
      function decode(){
        const text = document.getElementById('text').value;
        const result = text.replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&#\d+;/g, function(m){return String.fromCharCode(parseInt(m.slice(2,-1)));});
        document.getElementById('result').value = result;
      }
    </script>
  </main>
</body>
</html>
