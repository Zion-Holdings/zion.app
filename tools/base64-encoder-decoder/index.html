<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Base64 Encoder/Decoder | Zion Tech Group Free Tools</title>
  <meta name="description" content="Encode or decode Base64 strings. Free online tool by Zion Tech Group." />
  <link rel="canonical" href="https://ziontechgroup.com/tools/base64-encoder-decoder/" />
</head>
<body>
  <main>
    <h1>Base64 Encoder/Decoder</h1>
    <textarea id="input" rows="4" cols="60">Hello World</textarea><br/>
    <button onclick="encode()">Encode</button>
    <button onclick="decode()">Decode</button>
    <pre id="out"></pre>
    <p><a href="/tools/">Back to tools</a></p>
    <script>
      function encode(){
        document.getElementById('out').textContent = btoa(document.getElementById('input').value);
      }
      function decode(){
        document.getElementById('out').textContent = atob(document.getElementById('input').value);
      }
    </script>
  </main>
</body>
</html>
