<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text Case Converter | Zion Tech Group Free Tools</title>
  <meta name="description" content="Convert text case (upper, lower, title, camel). Free online tool by Zion Tech Group." />
  <link rel="canonical" href="https://ziontechgroup.com/tools/text-case-converter/" />
</head>
<body>
  <main>
    <h1>Text Case Converter</h1>
    <input id="text" type="text" placeholder="Enter text" style="width: 100%;" />
    <select id="case">
      <option value="upper">UPPERCASE</option>
      <option value="lower">lowercase</option>
      <option value="title">Title Case</option>
      <option value="camel">camelCase</option>
    </select>
    <button onclick="convert()">Convert</button>
    <p id="result"></p>
    <p><a href="/tools/">Back to tools</a></p>
    <script>
      function convert(){
        const text = document.getElementById('text').value;
        const caseType = document.getElementById('case').value;
        const res = document.getElementById('result');
        let result = '';
        if (caseType === 'upper') result = text.toUpperCase();
        else if (caseType === 'lower') result = text.toLowerCase();
        else if (caseType === 'title') result = text.replace(/\b\w/g, l => l.toUpperCase());
        else if (caseType === 'camel') result = text.replace(/(?:^\w|[A-Z]|\b\w)/g, (word, index) => index === 0 ? word.toLowerCase() : word.toUpperCase()).replace(/\s+/g,'');
        res.innerHTML = '<p>' + result + '</p>';
      }
    </script>
  </main>
</body>
</html>
