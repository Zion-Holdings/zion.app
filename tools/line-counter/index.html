<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Line Counter | Zion Tech Group Free Tools</title>
  <meta name="description" content="Count lines in text. Free online tool by Zion Tech Group." />
  <link rel="canonical" href="https://ziontechgroup.com/tools/line-counter/" />
</head>
<body>
  <main>
    <h1>Line Counter</h1>
    <textarea id="text" rows="5" placeholder="Enter text to count lines" style="width: 100%;"></textarea>
    <button onclick="count()">Count</button>
    <p id="result"></p>
    <p><a href="/tools/">Back to tools</a></p>
    <script>
      function count(){
        const text = document.getElementById('text').value;
        const res = document.getElementById('result');
        const lines = text.split('\n').length;
        const chars = text.length;
        const words = text.trim().split(/\s+/).length;
        res.innerHTML = '<p>Lines: ' + lines + '</p><p>Words: ' + words + '</p><p>Characters: ' + chars + '</p>';
      }
    </script>
  </main>
</body>
</html>
