<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Minifier | Zion Tech Group Free Tools</title>
  <meta name="description" content="Minify CSS code. Free online tool by Zion Tech Group." />
  <link rel="canonical" href="https://ziontechgroup.com/tools/css-minifier/" />
</head>
<body>
  <main>
    <h1>CSS Minifier</h1>
    <textarea id="css" rows="5" placeholder="Enter CSS to minify">body {
  background-color: #fff;
  color: #333;
  font-family: Arial, sans-serif;
}</textarea>
    <button onclick="minify()">Minify</button>
    <textarea id="result" rows="3" readonly placeholder="Minified CSS"></textarea>
    <p><a href="/tools/">Back to tools</a></p>
    <script>
      function minify(){
        const css = document.getElementById('css').value;
        const minified = css
          .replace(/\/\*[\s\S]*?\*\//g, '')
          .replace(/\s+/g, ' ')
          .replace(/\s*([{}:;,>~])\s*/g, '$1')
          .replace(/(\s*:\s*)/g, ':')
          .replace(/(\s*,\s*)/g, ',')
          .trim();
        document.getElementById('result').value = minified;
      }
    </script>
  </main>
</body>
</html>
