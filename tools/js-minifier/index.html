<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JS Minifier | Zion Tech Group Free Tools</title>
  <meta name="description" content="Minify JavaScript code. Free online tool by Zion Tech Group." />
  <link rel="canonical" href="https://ziontechgroup.com/tools/js-minifier/" />
</head>
<body>
  <main>
    <h1>JS Minifier</h1>
    <textarea id="js" rows="5" placeholder="Enter JavaScript to minify">function hello(name) {
  console.log(&quot;Hello, &quot; + name);
}

hello(&quot;World&quot;);</textarea>
    <button onclick="minify()">Minify</button>
    <textarea id="result" rows="3" readonly placeholder="Minified JavaScript"></textarea>
    <p><a href="/tools/">Back to tools</a></p>
    <script>
      function minify(){
        const js = document.getElementById('js').value;
        const minified = js
          .replace(/\/\*[\s\S]*?\*\//g, '')
          .replace(/\/\/.*$/gm, '')
          .replace(/\s+/g, ' ')
          .replace(/\s*([{};:,=])\s*/g, '$1')
          .replace(/\s*\(\s*/g, '(')
          .replace(/\s*\)\s*/g, ')')
          .trim();
        document.getElementById('result').value = minified;
      }
    </script>
  </main>
</body>
</html>
