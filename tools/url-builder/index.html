<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Builder | Zion Tech Group Free Tools</title>
  <meta name="description" content="Build URLs from components. Free online tool by Zion Tech Group." />
  <link rel="canonical" href="https://ziontechgroup.com/tools/url-builder/" />
</head>
<body>
  <main>
    <h1>URL Builder</h1>
    <select id="protocol">
      <option value="https">https</option>
      <option value="http">http</option>
    </select>
    <input id="domain" type="text" placeholder="domain.com" style="width: 100%;" />
    <input id="path" type="text" placeholder="/path" style="width: 100%;" />
    <button onclick="build()">Build</button>
    <p id="result"></p>
    <p><a href="/tools/">Back to tools</a></p>
    <script>
      function build(){
        const protocol = document.getElementById('protocol').value;
        const domain = document.getElementById('domain').value;
        const path = document.getElementById('path').value;
        const res = document.getElementById('result');
        if (!domain) return res.textContent = 'Please enter a domain';
        res.innerHTML = '<p>' + protocol + '://' + domain + (path ? path : '') + '</p>';
      }
    </script>
  </main>
</body>
</html>
