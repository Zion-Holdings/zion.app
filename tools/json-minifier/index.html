<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSON Minifier | Zion Tech Group Free Tools</title>
  <meta name="description" content="Minify JSON data. Free online tool by Zion Tech Group." />
  <link rel="canonical" href="https://ziontechgroup.com/tools/json-minifier/" />
</head>
<body>
  <main>
    <h1>JSON Minifier</h1>
    <textarea id="json" rows="5" placeholder="Enter JSON to minify">{
  &quot;name&quot;: &quot;John&quot;,
  &quot;age&quot;: 30,
  &quot;city&quot;: &quot;New York&quot;
}</textarea>
    <button onclick="minify()">Minify</button>
    <textarea id="result" rows="3" readonly placeholder="Minified JSON"></textarea>
    <p><a href="/tools/">Back to tools</a></p>
    <script>
      function minify(){
        try {
          const json = JSON.parse(document.getElementById('json').value);
          document.getElementById('result').value = JSON.stringify(json);
        } catch(e) {
          document.getElementById('result').value = 'Invalid JSON: ' + e.message;
        }
      }
    </script>
  </main>
</body>
</html>
