<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSV to JSON Converter | Zion Tech Group</title>
  <meta name="description" content="Convert CSV to JSON online with RFC 4180 quoted-field support. Choose comma, semicolon, tab, or pipe delimiters, toggle header rows, then copy or download pretty-printed JSON.">
  <meta property="og:title" content="CSV to JSON Converter | Zion Tech Group">
  <meta property="og:description" content="Free online CSV to JSON converter — RFC 4180 parsing, custom delimiters, header detection, copy and download.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ziontechgroup.com/tools/csv-to-json/">
  <link rel="canonical" href="https://ziontechgroup.com/tools/csv-to-json/">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b0f1a; color: #e5e7eb; min-height: 100vh; }
    .container { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    .subtitle { color: #94a3b8; margin-bottom: 2rem; }
    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 0.875rem; color: #94a3b8; margin-bottom: 0.5rem; }
    textarea { width: 100%; padding: 0.75rem; background: #1e293b; border: 1px solid #334155; border-radius: 0.5rem; color: #fff; font-family: monospace; font-size: 0.875rem; resize: vertical; min-height: 160px; line-height: 1.5; }
    textarea:focus { outline: none; border-color: #6366f1; }
    select { padding: 0.75rem; background: #1e293b; border: 1px solid #334155; border-radius: 0.5rem; color: #fff; font-size: 0.875rem; }
    select:focus { outline: none; border-color: #6366f1; }
    .options { display: flex; gap: 1.5rem; align-items: flex-end; flex-wrap: wrap; margin-bottom: 1rem; }
    .checkbox-row { display: flex; align-items: center; gap: 0.5rem; padding-bottom: 0.75rem; }
    .checkbox-row input[type="checkbox"] { width: 1rem; height: 1rem; accent-color: #6366f1; cursor: pointer; }
    .checkbox-row label { font-size: 0.875rem; color: #94a3b8; margin: 0; cursor: pointer; }
    .buttons { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .btn { padding: 0.5rem 1rem; background: #6366f1; color: #fff; border: none; border-radius: 0.5rem; cursor: pointer; font-size: 0.875rem; }
    .btn:hover { background: #4f46e5; }
    .btn.secondary { background: #374151; }
    .btn.secondary:hover { background: #4b5563; }
    .btn.success { background: #059669; }
    .btn.success:hover { background: #047857; }
    .error { background: #7f1d1d; border: 1px solid #991b1b; border-radius: 0.5rem; padding: 0.75rem; color: #fecaca; margin-bottom: 1rem; display: none; }
    .results { background: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; padding: 1.5rem; }
    .results h3 { font-size: 1rem; margin-bottom: 1rem; color: #818cf8; }
    .stats { display: flex; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid #334155; }
    .stat { display: flex; flex-direction: column; gap: 0.25rem; }
    .stat-label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-value { font-size: 1.125rem; font-weight: 700; color: #e5e7eb; font-family: monospace; }
    pre { background: #0b0f1a; border: 1px solid #334155; border-radius: 0.5rem; padding: 1rem; font-family: monospace; font-size: 0.8125rem; color: #e5e7eb; overflow: auto; max-height: 480px; white-space: pre; line-height: 1.5; }
    .hint { font-size: 0.8125rem; color: #64748b; margin-bottom: 1rem; }
    .back { display: inline-block; margin-top: 1.5rem; color: #818cf8; text-decoration: none; }
    .back:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <h1>CSV to JSON Converter</h1>
    <p class="subtitle">Convert CSV data to pretty-printed JSON with full RFC 4180 quoted-field support.</p>

    <div class="field">
      <label for="csvInput">CSV Input</label>
      <textarea id="csvInput" placeholder='name,role,notes
Ada Lovelace,Engineer,"Loves commas, quotes and ""nested"" text"
Alan Turing,Researcher,"Multi-line
value here"'></textarea>
    </div>

    <div class="options">
      <div class="field" style="margin-bottom: 0;">
        <label for="delimiter">Delimiter</label>
        <select id="delimiter">
          <option value=",">Comma ( , )</option>
          <option value=";">Semicolon ( ; )</option>
          <option value="\t">Tab ( \t )</option>
          <option value="|">Pipe ( | )</option>
        </select>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="hasHeader" checked>
        <label for="hasHeader">First row is header</label>
      </div>
    </div>

    <div class="buttons">
      <button class="btn" onclick="convert()">Convert</button>
      <button class="btn success" onclick="copyJson()">Copy JSON</button>
      <button class="btn secondary" onclick="downloadJson()">Download .json</button>
      <button class="btn secondary" onclick="loadSample()">Load Sample</button>
      <button class="btn secondary" onclick="clearAll()">Clear</button>
    </div>

    <p class="hint">Quoted fields may contain the delimiter, line breaks, and escaped quotes (<code>""</code>). Empty rows are skipped.</p>

    <div class="error" id="error"></div>

    <div class="results" id="results" style="display: none;">
      <h3>JSON Output</h3>
      <div class="stats" id="stats"></div>
      <pre id="output"></pre>
    </div>

    <a href="/tools/" class="back">← Back to Tools</a>
  </div>

  <script>
    var lastJson = '';

    function getDelimiter() {
      var raw = document.getElementById('delimiter').value;
      return raw === '\\t' ? '\t' : raw;
    }

    // RFC 4180 compliant CSV parser.
    // Handles quoted fields containing delimiters, CR/LF, and doubled quotes.
    function parseCsv(text, delimiter) {
      var rows = [];
      var row = [];
      var field = '';
      var inQuotes = false;
      var i = 0;
      var len = text.length;

      while (i < len) {
        var ch = text[i];

        if (inQuotes) {
          if (ch === '"') {
            if (text[i + 1] === '"') {
              field += '"';
              i += 2;
              continue;
            }
            inQuotes = false;
            i++;
            continue;
          }
          field += ch;
          i++;
          continue;
        }

        if (ch === '"' && field === '') {
          inQuotes = true;
          i++;
          continue;
        }

        if (ch === delimiter) {
          row.push(field);
          field = '';
          i++;
          continue;
        }

        if (ch === '\r') {
          row.push(field);
          field = '';
          rows.push(row);
          row = [];
          i += (text[i + 1] === '\n') ? 2 : 1;
          continue;
        }

        if (ch === '\n') {
          row.push(field);
          field = '';
          rows.push(row);
          row = [];
          i++;
          continue;
        }

        field += ch;
        i++;
      }

      if (inQuotes) {
        throw new Error('Unterminated quoted field — check that every opening " has a closing ".');
      }

      // Flush the trailing field/row.
      row.push(field);
      rows.push(row);

      // Drop rows that are entirely empty (e.g. trailing newline).
      return rows.filter(function (r) {
        return !(r.length === 1 && r[0].trim() === '');
      });
    }

    function convert() {
      var text = document.getElementById('csvInput').value;
      var errorEl = document.getElementById('error');
      var resultsEl = document.getElementById('results');
      var outputEl = document.getElementById('output');
      var statsEl = document.getElementById('stats');

      if (!text.trim()) {
        showError('✗ Please paste some CSV data');
        return;
      }

      var rows;
      try {
        rows = parseCsv(text, getDelimiter());
      } catch (e) {
        showError('✗ ' + e.message);
        return;
      }

      if (rows.length === 0) {
        showError('✗ No data rows found');
        return;
      }

      var useHeader = document.getElementById('hasHeader').checked;
      var columnCount = 0;
      rows.forEach(function (r) {
        if (r.length > columnCount) columnCount = r.length;
      });

      var result;
      var dataRowCount;

      if (useHeader) {
        var headers = rows[0].map(function (h, idx) {
          var name = h.trim();
          return name === '' ? 'column_' + (idx + 1) : name;
        });
        // De-duplicate repeated header names so no data is silently lost.
        var seen = {};
        headers = headers.map(function (name) {
          if (seen[name] === undefined) {
            seen[name] = 1;
            return name;
          }
          seen[name] += 1;
          return name + '_' + seen[name];
        });

        var dataRows = rows.slice(1);
        result = dataRows.map(function (r) {
          var obj = {};
          headers.forEach(function (name, idx) {
            obj[name] = idx < r.length ? r[idx] : '';
          });
          return obj;
        });
        dataRowCount = dataRows.length;
        columnCount = headers.length;
      } else {
        result = rows.map(function (r) { return r.slice(); });
        dataRowCount = rows.length;
      }

      lastJson = JSON.stringify(result, null, 2);
      outputEl.textContent = lastJson;

      statsEl.innerHTML =
        statBlock('Data Rows', dataRowCount) +
        statBlock('Columns', columnCount) +
        statBlock('Total Lines', rows.length) +
        statBlock('Output Size', formatBytes(lastJson.length));

      errorEl.style.display = 'none';
      resultsEl.style.display = 'block';
    }

    function statBlock(label, value) {
      return '<div class="stat"><span class="stat-label">' + label +
        '</span><span class="stat-value">' + escapeHtml(String(value)) + '</span></div>';
    }

    function formatBytes(n) {
      if (n < 1024) return n + ' B';
      if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
      return (n / (1024 * 1024)).toFixed(2) + ' MB';
    }

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function showError(msg) {
      var errorEl = document.getElementById('error');
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
      document.getElementById('results').style.display = 'none';
      lastJson = '';
    }

    function flashButton(btn, label) {
      var original = btn.textContent;
      btn.textContent = label;
      setTimeout(function () { btn.textContent = original; }, 2000);
    }

    function copyJson() {
      if (!lastJson) convert();
      if (!lastJson) return;
      var btn = document.querySelector('.btn.success');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(lastJson).then(function () {
          flashButton(btn, 'Copied!');
        }).catch(function () {
          fallbackCopy(lastJson, btn);
        });
      } else {
        fallbackCopy(lastJson, btn);
      }
    }

    function fallbackCopy(text, btn) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        flashButton(btn, 'Copied!');
      } catch (e) {
        flashButton(btn, 'Copy failed');
      }
      document.body.removeChild(ta);
    }

    function downloadJson() {
      if (!lastJson) convert();
      if (!lastJson) return;
      var blob = new Blob([lastJson], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'data.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    }

    function loadSample() {
      document.getElementById('delimiter').value = ',';
      document.getElementById('hasHeader').checked = true;
      document.getElementById('csvInput').value =
        'id,name,role,notes\n' +
        '1,Ada Lovelace,Engineer,"Loves commas, semicolons and ""nested"" quotes"\n' +
        '2,Alan Turing,Researcher,"Multi-line\nnotes field"\n' +
        '3,Grace Hopper,Admiral,\n';
      convert();
    }

    function clearAll() {
      document.getElementById('csvInput').value = '';
      document.getElementById('error').style.display = 'none';
      document.getElementById('results').style.display = 'none';
      document.getElementById('output').textContent = '';
      lastJson = '';
    }

    document.getElementById('delimiter').addEventListener('change', function () {
      if (document.getElementById('csvInput').value.trim()) convert();
    });
    document.getElementById('hasHeader').addEventListener('change', function () {
      if (document.getElementById('csvInput').value.trim()) convert();
    });
  </script>
</body>
</html>
