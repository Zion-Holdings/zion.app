<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Path / Query Explorer | Zion Tech Group</title>
  <meta name="description" content="Query JSON with dot and bracket path expressions like users[0].name or items[*].id. Browse a collapsible JSON tree, click any node to get its path, and copy matched values. Free online JSON path explorer.">
  <meta property="og:title" content="JSON Path / Query Explorer | Zion Tech Group">
  <meta property="og:description" content="Free online JSON path explorer — run dot/bracket queries, view a collapsible JSON tree, and copy matched results.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ziontechgroup.com/tools/json-query/">
  <link rel="canonical" href="https://ziontechgroup.com/tools/json-query/">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b0f1a; color: #e5e7eb; min-height: 100vh; }
    .container { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    .subtitle { color: #94a3b8; margin-bottom: 2rem; }
    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 0.875rem; color: #94a3b8; margin-bottom: 0.5rem; }
    input[type="text"] { width: 100%; padding: 0.75rem; background: #1e293b; border: 1px solid #334155; border-radius: 0.5rem; color: #fff; font-family: monospace; font-size: 0.875rem; }
    input[type="text"]:focus { outline: none; border-color: #6366f1; }
    textarea { width: 100%; padding: 0.75rem; background: #1e293b; border: 1px solid #334155; border-radius: 0.5rem; color: #fff; font-family: monospace; font-size: 0.875rem; min-height: 180px; resize: vertical; line-height: 1.5; }
    textarea:focus { outline: none; border-color: #6366f1; }
    .buttons { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .btn { padding: 0.5rem 1rem; background: #6366f1; color: #fff; border: none; border-radius: 0.5rem; cursor: pointer; font-size: 0.875rem; }
    .btn:hover { background: #4f46e5; }
    .btn.secondary { background: #374151; }
    .btn.secondary:hover { background: #4b5563; }
    .btn.success { background: #059669; }
    .btn.success:hover { background: #047857; }
    .error { background: #7f1d1d; border: 1px solid #991b1b; border-radius: 0.5rem; padding: 0.75rem; color: #fecaca; margin-bottom: 1rem; display: none; }
    .results { background: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; padding: 1.5rem; margin-bottom: 1rem; }
    .results h3 { font-size: 1rem; margin-bottom: 1rem; color: #818cf8; }
    .result-item { display: flex; padding: 0.5rem 0; border-bottom: 1px solid #334155; }
    .result-item:last-child { border-bottom: none; }
    .result-label { flex: 0 0 140px; font-size: 0.875rem; color: #94a3b8; font-weight: 600; }
    .result-value { flex: 1; font-family: monospace; font-size: 0.875rem; color: #e5e7eb; word-break: break-all; }
    .result-value.empty { color: #64748b; font-style: italic; }
    pre { background: #0b0f1a; border: 1px solid #334155; border-radius: 0.5rem; padding: 0.75rem; font-family: monospace; font-size: 0.8125rem; color: #e5e7eb; overflow-x: auto; white-space: pre; margin-top: 0.5rem; max-height: 340px; }
    .match-path { font-family: monospace; font-size: 0.8125rem; color: #818cf8; margin-top: 0.75rem; word-break: break-all; }
    .hint { font-size: 0.8125rem; color: #64748b; margin-top: 0.5rem; }
    .hint code { color: #94a3b8; }
    .tree { font-family: monospace; font-size: 0.8125rem; line-height: 1.7; overflow-x: auto; max-height: 420px; }
    .tree ul { list-style: none; margin: 0; padding-left: 1.1rem; border-left: 1px solid #334155; }
    .tree > ul { padding-left: 0; border-left: none; }
    .tree li { white-space: nowrap; }
    .toggle { display: inline-block; width: 1rem; color: #94a3b8; cursor: pointer; user-select: none; text-align: center; }
    .toggle.leaf { cursor: default; color: #334155; }
    .node-key { color: #818cf8; cursor: pointer; }
    .node-key:hover { text-decoration: underline; }
    .node-sep { color: #64748b; }
    .val-string { color: #6ee7b7; }
    .val-number { color: #fbbf24; }
    .val-boolean { color: #f472b6; }
    .val-null { color: #64748b; font-style: italic; }
    .val-meta { color: #64748b; }
    .collapsed > ul { display: none; }
    .back { display: inline-block; margin-top: 1.5rem; color: #818cf8; text-decoration: none; }
    .back:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <h1>JSON Path / Query Explorer</h1>
    <p class="subtitle">Query JSON with dot and bracket paths, and explore the structure as a tree.</p>

    <div class="field">
      <label>JSON</label>
      <textarea id="jsonInput" placeholder='{"users": [{"name": "Ada"}], "items": [{"id": 1}, {"id": 2}]}' spellcheck="false"></textarea>
    </div>

    <div class="field">
      <label>Path expression</label>
      <input type="text" id="pathInput" placeholder="users[0].name">
      <div class="hint">Examples: <code>users[0].name</code> &middot; <code>items[*].id</code> &middot; <code>a.b.c</code> &middot; <code>["odd key"].value</code> &middot; <code>*</code></div>
    </div>

    <div class="buttons">
      <button class="btn" onclick="runQuery()">Run Query</button>
      <button class="btn success" onclick="copyPath()">Copy Path</button>
      <button class="btn success" onclick="copyResult()">Copy Result</button>
      <button class="btn secondary" onclick="loadSample()">Load Sample</button>
      <button class="btn secondary" onclick="clearAll()">Clear</button>
    </div>

    <div class="error" id="error"></div>

    <div class="results" id="results" style="display: none;">
      <h3>Query Result</h3>
      <div id="resultsContent"></div>
    </div>

    <div class="results" id="treeCard" style="display: none;">
      <h3>JSON Tree <span class="val-meta" style="font-weight:400;font-size:0.8125rem;">(click a key to use its path)</span></h3>
      <div class="tree" id="tree"></div>
    </div>

    <a href="/tools/" class="back">&larr; Back to Tools</a>
  </div>

  <script>
    // --- QUERY ENGINE START ---
    // Tokenize a dot/bracket path expression into segments.
    // Returns { tokens: [...] } or { error: 'message' }.
    function tokenizePath(expr) {
      var src = String(expr == null ? '' : expr).trim();
      if (src.charAt(0) === '$') src = src.slice(1);
      if (src.charAt(0) === '.') src = src.slice(1);
      var tokens = [];
      var i = 0;
      while (i < src.length) {
        var ch = src.charAt(i);
        if (ch === '.') {
          i++;
          if (i >= src.length) return { error: 'Path ends with a trailing "."' };
          if (src.charAt(i) === '.') return { error: 'Empty segment: found ".." in path' };
          continue;
        }
        if (ch === '[') {
          var close = -1;
          var quote = null;
          for (var j = i + 1; j < src.length; j++) {
            var c = src.charAt(j);
            if (quote) {
              if (c === '\\') { j++; continue; }
              if (c === quote) quote = null;
              continue;
            }
            if (c === '"' || c === "'") { quote = c; continue; }
            if (c === ']') { close = j; break; }
          }
          if (close === -1) return { error: 'Unclosed "[" in path' };
          var inner = src.slice(i + 1, close).trim();
          i = close + 1;
          if (inner === '') return { error: 'Empty brackets "[]" in path' };
          if (inner === '*') { tokens.push({ type: 'wildcard' }); continue; }
          var q = inner.charAt(0);
          if ((q === '"' || q === "'") && inner.charAt(inner.length - 1) === q && inner.length >= 2) {
            var raw = inner.slice(1, -1).replace(/\\(["'\\])/g, '$1');
            tokens.push({ type: 'key', name: raw });
            continue;
          }
          if (/^-?\d+$/.test(inner)) { tokens.push({ type: 'index', index: parseInt(inner, 10) }); continue; }
          tokens.push({ type: 'key', name: inner });
          continue;
        }
        if (ch === '*') { tokens.push({ type: 'wildcard' }); i++; continue; }
        if (ch === ']') return { error: 'Unexpected "]" in path' };
        var start = i;
        while (i < src.length && src.charAt(i) !== '.' && src.charAt(i) !== '[' && src.charAt(i) !== ']') i++;
        var name = src.slice(start, i).trim();
        if (name === '') return { error: 'Empty segment in path' };
        if (src.charAt(i) === ']') return { error: 'Unexpected "]" in path — use ["key"] for quoted keys' };
        tokens.push({ type: 'key', name: name });
      }
      return { tokens: tokens };
    }

    function isIdentifier(key) {
      return /^[A-Za-z_$][A-Za-z0-9_$]*$/.test(key);
    }

    function joinPath(base, token) {
      if (token.type === 'index') return base + '[' + token.index + ']';
      if (isIdentifier(token.name)) return base + '.' + token.name;
      return base + '[' + JSON.stringify(token.name) + ']';
    }

    function valueType(value) {
      if (value === null) return 'null';
      if (Array.isArray(value)) return 'array';
      return typeof value;
    }

    // Run a path expression against parsed JSON data.
    // Returns { matches: [{ path, value }], error: null } — never throws for
    // missing keys, out-of-range indices, or paths that walk into null.
    function queryJson(data, expr) {
      var parsed = tokenizePath(expr);
      if (parsed.error) return { matches: [], error: parsed.error, tokens: [] };
      var tokens = parsed.tokens;
      var current = [{ path: '$', value: data }];
      for (var t = 0; t < tokens.length; t++) {
        var token = tokens[t];
        var next = [];
        for (var m = 0; m < current.length; m++) {
          var node = current[m];
          var value = node.value;
          if (value === null || value === undefined || typeof value !== 'object') continue;
          if (token.type === 'wildcard') {
            if (Array.isArray(value)) {
              for (var k = 0; k < value.length; k++) {
                next.push({ path: node.path + '[' + k + ']', value: value[k] });
              }
            } else {
              var keys = Object.keys(value);
              for (var ki = 0; ki < keys.length; ki++) {
                next.push({ path: joinPath(node.path, { type: 'key', name: keys[ki] }), value: value[keys[ki]] });
              }
            }
            continue;
          }
          if (token.type === 'index') {
            var idx = token.index;
            if (Array.isArray(value)) {
              var real = idx < 0 ? value.length + idx : idx;
              if (real < 0 || real >= value.length) continue;
              next.push({ path: node.path + '[' + real + ']', value: value[real] });
            } else if (Object.prototype.hasOwnProperty.call(value, String(idx))) {
              next.push({ path: joinPath(node.path, { type: 'key', name: String(idx) }), value: value[String(idx)] });
            }
            continue;
          }
          // key token
          if (Array.isArray(value)) {
            if (/^-?\d+$/.test(token.name)) {
              var ai = parseInt(token.name, 10);
              var ar = ai < 0 ? value.length + ai : ai;
              if (ar >= 0 && ar < value.length) next.push({ path: node.path + '[' + ar + ']', value: value[ar] });
            }
            continue;
          }
          if (Object.prototype.hasOwnProperty.call(value, token.name)) {
            next.push({ path: joinPath(node.path, token), value: value[token.name] });
          }
        }
        current = next;
        if (current.length === 0) break;
      }
      return { matches: current, error: null, tokens: tokens };
    }
    // --- QUERY ENGINE END ---

    var lastResultText = '';

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function showError(msg) {
      var errorEl = document.getElementById('error');
      errorEl.textContent = '\u2717 ' + msg;
      errorEl.style.display = 'block';
    }

    function hideError() {
      document.getElementById('error').style.display = 'none';
    }

    function parseInput() {
      var raw = document.getElementById('jsonInput').value.trim();
      if (!raw) {
        showError('Please paste some JSON first');
        return null;
      }
      try {
        return { data: JSON.parse(raw) };
      } catch (e) {
        showError('Invalid JSON: ' + e.message);
        return null;
      }
    }

    function runQuery() {
      var resultsEl = document.getElementById('results');
      var contentEl = document.getElementById('resultsContent');
      hideError();

      var parsed = parseInput();
      if (!parsed) { resultsEl.style.display = 'none'; return; }

      renderTree(parsed.data);

      var expr = document.getElementById('pathInput').value.trim();
      if (!expr) {
        showError('Please enter a path expression (e.g. users[0].name)');
        resultsEl.style.display = 'none';
        return;
      }

      var res = queryJson(parsed.data, expr);
      if (res.error) {
        showError('Invalid path: ' + res.error);
        resultsEl.style.display = 'none';
        return;
      }

      if (res.matches.length === 0) {
        lastResultText = '';
        contentEl.innerHTML =
          '<div class="result-item"><div class="result-label">Path</div><div class="result-value">' + escapeHtml(expr) + '</div></div>' +
          '<div class="result-item"><div class="result-label">Matches</div><div class="result-value">0</div></div>' +
          '<div class="result-item"><div class="result-label">Type</div><div class="result-value empty">no match</div></div>';
        resultsEl.style.display = 'block';
        showError('No match: the path "' + expr + '" did not match anything in this JSON');
        return;
      }

      var types = [];
      for (var i = 0; i < res.matches.length; i++) {
        var t = valueType(res.matches[i].value);
        if (types.indexOf(t) === -1) types.push(t);
      }

      var output;
      if (res.matches.length === 1) {
        output = stringify(res.matches[0].value);
      } else {
        output = stringify(res.matches.map(function (m) { return m.value; }));
      }
      lastResultText = output;

      var pathsHtml = '';
      if (res.matches.length > 1) {
        var shown = res.matches.slice(0, 50).map(function (m) { return escapeHtml(m.path); }).join('<br>');
        if (res.matches.length > 50) shown += '<br>&hellip; and ' + (res.matches.length - 50) + ' more';
        pathsHtml = '<div class="result-item"><div class="result-label">Matched Paths</div><div class="result-value">' + shown + '</div></div>';
      } else {
        pathsHtml = '<div class="result-item"><div class="result-label">Resolved Path</div><div class="result-value">' + escapeHtml(res.matches[0].path) + '</div></div>';
      }

      contentEl.innerHTML =
        '<div class="result-item"><div class="result-label">Path</div><div class="result-value">' + escapeHtml(expr) + '</div></div>' +
        '<div class="result-item"><div class="result-label">Matches</div><div class="result-value">' + res.matches.length + '</div></div>' +
        '<div class="result-item"><div class="result-label">Type</div><div class="result-value">' + escapeHtml(types.join(' | ')) + (res.matches.length > 1 ? ' (array of ' + res.matches.length + ')' : '') + '</div></div>' +
        pathsHtml +
        '<pre>' + escapeHtml(output) + '</pre>';
      resultsEl.style.display = 'block';
    }

    function stringify(value) {
      if (value === undefined) return 'undefined';
      try {
        return JSON.stringify(value, null, 2);
      } catch (e) {
        return String(value);
      }
    }

    function previewOf(value) {
      var type = valueType(value);
      if (type === 'string') return '<span class="val-string">' + escapeHtml(JSON.stringify(value)) + '</span>';
      if (type === 'number') return '<span class="val-number">' + escapeHtml(String(value)) + '</span>';
      if (type === 'boolean') return '<span class="val-boolean">' + value + '</span>';
      if (type === 'null') return '<span class="val-null">null</span>';
      if (type === 'array') return '<span class="val-meta">Array(' + value.length + ')</span>';
      return '<span class="val-meta">Object{' + Object.keys(value).length + '}</span>';
    }

    function buildNode(label, value, path, isRoot) {
      var li = document.createElement('li');
      var type = valueType(value);
      var expandable = (type === 'object' || type === 'array') && Object.keys(value).length > 0;

      var toggle = document.createElement('span');
      toggle.className = 'toggle' + (expandable ? '' : ' leaf');
      toggle.textContent = expandable ? '\u25be' : '\u00b7';
      li.appendChild(toggle);

      var keySpan = document.createElement('span');
      keySpan.className = 'node-key';
      keySpan.textContent = label;
      keySpan.title = 'Click to use path: ' + path;
      keySpan.addEventListener('click', function (e) {
        e.stopPropagation();
        var input = document.getElementById('pathInput');
        input.value = path === '$' ? '$' : path.replace(/^\$\.?/, '');
        runQuery();
      });
      li.appendChild(keySpan);

      var sep = document.createElement('span');
      sep.className = 'node-sep';
      sep.textContent = ': ';
      li.appendChild(sep);

      var preview = document.createElement('span');
      preview.innerHTML = previewOf(value);
      li.appendChild(preview);

      if (expandable) {
        var ul = document.createElement('ul');
        if (type === 'array') {
          for (var i = 0; i < value.length; i++) {
            ul.appendChild(buildNode('[' + i + ']', value[i], path + '[' + i + ']', false));
          }
        } else {
          var keys = Object.keys(value);
          for (var k = 0; k < keys.length; k++) {
            var childPath = joinPath(path, { type: 'key', name: keys[k] });
            ul.appendChild(buildNode(keys[k], value[keys[k]], childPath, false));
          }
        }
        li.appendChild(ul);
        if (!isRoot) { li.className = 'collapsed'; toggle.textContent = '\u25b8'; }
        toggle.addEventListener('click', function (e) {
          e.stopPropagation();
          var collapsed = li.className === 'collapsed';
          li.className = collapsed ? '' : 'collapsed';
          toggle.textContent = collapsed ? '\u25be' : '\u25b8';
        });
      }
      return li;
    }

    function renderTree(data) {
      var treeEl = document.getElementById('tree');
      treeEl.innerHTML = '';
      var ul = document.createElement('ul');
      ul.appendChild(buildNode('$', data, '$', true));
      treeEl.appendChild(ul);
      document.getElementById('treeCard').style.display = 'block';
    }

    function flash(btn) {
      var original = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(function () { btn.textContent = original; }, 2000);
    }

    function copyText(text, btn) {
      if (!text) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { flash(btn); }, function () {});
      }
    }

    function copyPath() {
      var expr = document.getElementById('pathInput').value.trim();
      if (!expr) { showError('Nothing to copy — enter a path expression first'); return; }
      copyText(expr, document.querySelectorAll('.btn.success')[0]);
    }

    function copyResult() {
      if (!lastResultText) { showError('Nothing to copy — run a query that matches first'); return; }
      copyText(lastResultText, document.querySelectorAll('.btn.success')[1]);
    }

    function loadSample() {
      document.getElementById('jsonInput').value = JSON.stringify({
        users: [
          { name: 'Ada Lovelace', role: 'admin', email: 'ada@example.com' },
          { name: 'Alan Turing', role: 'editor', email: null }
        ],
        items: [
          { id: 101, sku: 'ZTG-1', qty: 2 },
          { id: 102, sku: 'ZTG-2', qty: 5 },
          { id: 103, sku: 'ZTG-3', qty: 1 }
        ],
        a: { b: { c: 'deeply nested value' } },
        meta: { total: 3, tags: ['alpha', 'beta'], missing: null }
      }, null, 2);
      document.getElementById('pathInput').value = 'items[*].id';
      hideError();
      runQuery();
    }

    function clearAll() {
      document.getElementById('jsonInput').value = '';
      document.getElementById('pathInput').value = '';
      document.getElementById('error').style.display = 'none';
      document.getElementById('results').style.display = 'none';
      document.getElementById('treeCard').style.display = 'none';
      document.getElementById('tree').innerHTML = '';
      lastResultText = '';
    }

    document.getElementById('pathInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') runQuery();
    });
  </script>
</body>
</html>
