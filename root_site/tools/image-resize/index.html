<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Resize | Zion Tech Group</title>
  <meta name="description" content="Resize images online — set width/height with aspect ratio lock, download resized image.">
  <meta property="og:title" content="Image Resize | Zion Tech Group">
  <meta property="og:description" content="Free online image resizer.">
  <meta property="og:url" content="https://ziontechgroup.com/tools/image-resize/">
  <link rel="canonical" href="https://ziontechgroup.com/tools/image-resize/">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b0f1a; color: #e5e7eb; min-height: 100vh; }
    .container { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    .subtitle { color: #94a3b8; margin-bottom: 2rem; }
    .upload-area { border: 2px dashed #334155; border-radius: 0.75rem; padding: 2rem; text-align: center; cursor: pointer; margin-bottom: 1.5rem; transition: border-color 0.2s; }
    .upload-area:hover { border-color: #6366f1; }
    .upload-area input { display: none; }
    .preview { text-align: center; margin-bottom: 1.5rem; }
    .preview img { max-width: 100%; max-height: 300px; border-radius: 0.5rem; border: 1px solid #334155; }
    .controls { display: grid; grid-template-columns: 1fr 1fr auto; gap: 1rem; margin-bottom: 1.5rem; align-items: end; }
    .field label { display: block; font-size: 0.875rem; color: #94a3b8; margin-bottom: 0.5rem; }
    .field input[type="number"] { width: 100%; padding: 0.75rem; background: #1e293b; border: 1px solid #334155; border-radius: 0.5rem; color: #fff; }
    .field input[type="checkbox"] { margin-right: 0.5rem; }
    .buttons { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .btn { padding: 0.5rem 1rem; background: #6366f1; color: #fff; border: none; border-radius: 0.5rem; cursor: pointer; font-size: 0.875rem; }
    .btn:hover { background: #4f46e5; }
    .btn.success { background: #059669; }
    .btn.success:hover { background: #047857; }
    .info { font-size: 0.875rem; color: #94a3b8; margin-top: 0.5rem; }
    .back { display: inline-block; margin-top: 1.5rem; color: #818cf8; text-decoration: none; }
    .back:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Image Resize</h1>
    <p class="subtitle">Resize images with aspect ratio lock.</p>
    <label class="upload-area" id="dropZone">
      <input type="file" accept="image/*" onchange="handleFile(this.files[0])">
      <p>Click or drag image here</p>
      <p class="info">Supports PNG, JPG, GIF, WebP</p>
    </label>
    <div class="preview" id="preview" style="display:none;">
      <img id="imgPreview" src="" alt="Preview">
      <p class="info" id="imgInfo"></p>
    </div>
    <div class="controls">
      <div class="field">
        <label>Width (px)</label>
        <input type="number" id="width" min="1" oninput="syncHeight()">
      </div>
      <div class="field">
        <label>Height (px)</label>
        <input type="number" id="height" min="1" oninput="syncWidth()">
      </div>
      <div class="field">
        <label><input type="checkbox" id="lockRatio" checked> Lock aspect ratio</label>
      </div>
    </div>
    <div class="buttons">
      <button class="btn success" onclick="download()">Download</button>
      <button class="btn" onclick="clearAll()">Clear</button>
    </div>
    <a href="/tools/" class="back">← Back to Tools</a>
  </div>
  <script>
    let img = null, originalWidth = 0, originalHeight = 0, ratio = 1;
    function handleFile(file) {
      if (!file || !file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        img = new Image();
        img.onload = function() {
          originalWidth = img.width;
          originalHeight = img.height;
          ratio = originalWidth / originalHeight;
          document.getElementById('width').value = originalWidth;
          document.getElementById('height').value = originalHeight;
          document.getElementById('imgPreview').src = e.target.result;
          document.getElementById('preview').style.display = 'block';
          document.getElementById('imgInfo').textContent = `${originalWidth} × ${originalHeight} px`;
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
    function syncHeight() {
      const w = parseInt(document.getElementById('width').value);
      if (w && document.getElementById('lockRatio').checked) {
        document.getElementById('height').value = Math.round(w / ratio);
      }
    }
    function syncWidth() {
      const h = parseInt(document.getElementById('height').value);
      if (h && document.getElementById('lockRatio').checked) {
        document.getElementById('width').value = Math.round(h * ratio);
      }
    }
    function download() {
      if (!img) return;
      const w = parseInt(document.getElementById('width').value);
      const h = parseInt(document.getElementById('height').value);
      if (!w || !h) return;
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const link = document.createElement('a');
      link.download = `resized_${w}x${h}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
    function clearAll() {
      img = null;
      document.getElementById('preview').style.display = 'none';
      document.getElementById('width').value = '';
      document.getElementById('height').value = '';
    }
    const dropZone = document.getElementById('dropZone');
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.style.borderColor = '#6366f1'; });
    dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = '#334155'; });
    dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.style.borderColor = '#334155'; handleFile(e.dataTransfer.files[0]); });
  </script>
</body>
</html>
