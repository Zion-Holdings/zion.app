<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Shadow &amp; Border Radius CSS Generator | Zion Tech Group</title>
  <meta name="description" content="Visual CSS box-shadow and border-radius generator. Stack multiple shadows, control offset, blur, spread, color, opacity and inset, plus per-corner radius. Live preview and copy-ready CSS.">
  <meta property="og:title" content="Box Shadow &amp; Border Radius CSS Generator | Zion Tech Group">
  <meta property="og:description" content="Free visual generator for CSS box-shadow and border-radius — multiple stacked shadows, inset toggle, per-corner radius, live preview and one-click copy.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ziontechgroup.com/tools/css-box-shadow/">
  <link rel="canonical" href="https://ziontechgroup.com/tools/css-box-shadow/">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b0f1a; color: #e5e7eb; min-height: 100vh; }
    .container { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    .subtitle { color: #94a3b8; margin-bottom: 2rem; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; padding: 1.5rem; margin-bottom: 1.5rem; }
    .card h3 { font-size: 1rem; margin-bottom: 1rem; color: #818cf8; }
    .buttons { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .btn { padding: 0.5rem 1rem; background: #6366f1; color: #fff; border: none; border-radius: 0.5rem; cursor: pointer; font-size: 0.875rem; }
    .btn:hover { background: #4f46e5; }
    .btn.secondary { background: #374151; }
    .btn.secondary:hover { background: #4b5563; }
    .btn.success { background: #059669; }
    .btn.success:hover { background: #047857; }
    .btn.danger { background: #7f1d1d; }
    .btn.danger:hover { background: #991b1b; }
    .btn.small { padding: 0.3rem 0.6rem; font-size: 0.75rem; }
    .preview-stage { background: repeating-conic-gradient(#131a2b 0% 25%, #0f1524 0% 50%) 50% / 24px 24px; border: 1px solid #334155; border-radius: 0.5rem; padding: 3rem 1rem; display: flex; align-items: center; justify-content: center; min-height: 260px; }
    #previewBox { width: 190px; height: 130px; background: #6366f1; }
    .shadow-layer { border: 1px solid #334155; border-radius: 0.5rem; padding: 1rem; margin-bottom: 1rem; background: #16213a; }
    .layer-head { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
    .layer-title { font-size: 0.875rem; font-weight: 600; color: #e5e7eb; }
    .layer-head .tools { display: flex; align-items: center; gap: 0.5rem; }
    .slider-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.6rem; }
    .slider-row label { flex: 0 0 96px; font-size: 0.8125rem; color: #94a3b8; }
    input[type="range"] { flex: 1; accent-color: #6366f1; background: transparent; min-width: 90px; }
    .val { flex: 0 0 62px; text-align: right; font-family: monospace; font-size: 0.8125rem; color: #e5e7eb; }
    input[type="color"] { width: 46px; height: 30px; padding: 0; background: #1e293b; border: 1px solid #334155; border-radius: 0.375rem; cursor: pointer; }
    .inline { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8125rem; color: #94a3b8; }
    input[type="checkbox"] { width: 16px; height: 16px; accent-color: #6366f1; cursor: pointer; }
    .radius-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 1.25rem; }
    .output { width: 100%; padding: 0.75rem; background: #0f172a; border: 1px solid #334155; border-radius: 0.5rem; color: #e5e7eb; font-family: monospace; font-size: 0.8125rem; min-height: 130px; resize: vertical; white-space: pre; }
    .output:focus { outline: none; border-color: #6366f1; }
    .hint { color: #64748b; font-size: 0.8125rem; margin-top: 0.5rem; }
    .back { display: inline-block; margin-top: 1.5rem; color: #818cf8; text-decoration: none; }
    .back:hover { text-decoration: underline; }
    @media (max-width: 560px) {
      .radius-grid { grid-template-columns: 1fr; }
      .slider-row label { flex-basis: 84px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Box Shadow &amp; Border Radius Generator</h1>
    <p class="subtitle">Build layered CSS shadows and per-corner rounding with a live preview.</p>

    <div class="card">
      <h3>Live Preview</h3>
      <div class="preview-stage">
        <div id="previewBox"></div>
      </div>
      <div class="slider-row" style="margin-top:1rem;">
        <label for="boxColor">Box color</label>
        <input type="color" id="boxColor" value="#6366f1">
        <span class="val" id="boxColorVal">#6366f1</span>
      </div>
    </div>

    <div class="card">
      <h3>Shadow Layers</h3>
      <div id="layers"></div>
      <div class="buttons" style="margin-bottom:0;">
        <button class="btn" id="addLayer">+ Add Shadow</button>
        <button class="btn secondary" id="resetAll">Reset</button>
      </div>
      <p class="hint">Layers render front-to-back: the first layer paints on top.</p>
    </div>

    <div class="card">
      <h3>Border Radius</h3>
      <div class="slider-row">
        <label class="inline" for="linkRadius" style="flex:0 0 auto;">
          <input type="checkbox" id="linkRadius" checked> Link all corners
        </label>
      </div>
      <div class="radius-grid" id="radiusGrid">
        <div class="slider-row">
          <label for="rTL">Top left</label>
          <input type="range" id="rTL" min="0" max="120" value="12">
          <span class="val" id="rTLVal">12px</span>
        </div>
        <div class="slider-row">
          <label for="rTR">Top right</label>
          <input type="range" id="rTR" min="0" max="120" value="12">
          <span class="val" id="rTRVal">12px</span>
        </div>
        <div class="slider-row">
          <label for="rBR">Bottom right</label>
          <input type="range" id="rBR" min="0" max="120" value="12">
          <span class="val" id="rBRVal">12px</span>
        </div>
        <div class="slider-row">
          <label for="rBL">Bottom left</label>
          <input type="range" id="rBL" min="0" max="120" value="12">
          <span class="val" id="rBLVal">12px</span>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>Generated CSS</h3>
      <textarea class="output" id="cssOutput" readonly spellcheck="false"></textarea>
      <div class="buttons" style="margin-top:1rem; margin-bottom:0;">
        <button class="btn success" id="copyBtn">Copy CSS</button>
      </div>
    </div>

    <a href="/tools/" class="back">← Back to Tools</a>
  </div>

  <script>
    var uid = 0;
    var layers = [];

    function defaultLayer() {
      return { id: ++uid, x: 0, y: 10, blur: 20, spread: 0, color: '#000000', opacity: 35, inset: false };
    }

    function hexToRgb(hex) {
      var h = String(hex).replace('#', '');
      if (h.length === 3) { h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2]; }
      var n = parseInt(h, 16);
      if (isNaN(n)) { return { r: 0, g: 0, b: 0 }; }
      return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
    }

    function layerColor(layer) {
      var rgb = hexToRgb(layer.color);
      var a = Math.round(layer.opacity) / 100;
      if (a >= 1) { return 'rgb(' + rgb.r + ', ' + rgb.g + ', ' + rgb.b + ')'; }
      var alpha = String(Math.round(a * 100) / 100);
      return 'rgba(' + rgb.r + ', ' + rgb.g + ', ' + rgb.b + ', ' + alpha + ')';
    }

    function layerToCss(layer) {
      var parts = [];
      if (layer.inset) { parts.push('inset'); }
      parts.push(layer.x + 'px', layer.y + 'px', layer.blur + 'px', layer.spread + 'px', layerColor(layer));
      return parts.join(' ');
    }

    function shadowValue() {
      if (!layers.length) { return 'none'; }
      return layers.map(layerToCss).join(', ');
    }

    function radiusValue() {
      var tl = +document.getElementById('rTL').value;
      var tr = +document.getElementById('rTR').value;
      var br = +document.getElementById('rBR').value;
      var bl = +document.getElementById('rBL').value;
      if (tl === tr && tr === br && br === bl) { return tl + 'px'; }
      return tl + 'px ' + tr + 'px ' + br + 'px ' + bl + 'px';
    }

    function sliderRow(layer, key, label, min, max) {
      return '<div class="slider-row">' +
        '<label for="' + key + '-' + layer.id + '">' + label + '</label>' +
        '<input type="range" id="' + key + '-' + layer.id + '" data-id="' + layer.id + '" data-key="' + key + '" min="' + min + '" max="' + max + '" value="' + layer[key] + '">' +
        '<span class="val" id="' + key + '-' + layer.id + '-val">' + layer[key] + 'px</span>' +
        '</div>';
    }

    function renderLayers() {
      var host = document.getElementById('layers');
      if (!layers.length) {
        host.innerHTML = '<p class="hint" style="margin:0 0 1rem;">No shadow layers — add one to get started.</p>';
        return;
      }
      var html = '';
      for (var i = 0; i < layers.length; i++) {
        var layer = layers[i];
        html += '<div class="shadow-layer">' +
          '<div class="layer-head">' +
            '<span class="layer-title">Shadow ' + (i + 1) + '</span>' +
            '<span class="tools">' +
              '<label class="inline"><input type="checkbox" data-id="' + layer.id + '" data-key="inset"' + (layer.inset ? ' checked' : '') + '> inset</label>' +
              '<button class="btn danger small" data-remove="' + layer.id + '">Remove</button>' +
            '</span>' +
          '</div>' +
          sliderRow(layer, 'x', 'Offset X', -100, 100) +
          sliderRow(layer, 'y', 'Offset Y', -100, 100) +
          sliderRow(layer, 'blur', 'Blur', 0, 200) +
          sliderRow(layer, 'spread', 'Spread', -100, 100) +
          '<div class="slider-row">' +
            '<label for="color-' + layer.id + '">Color</label>' +
            '<input type="color" id="color-' + layer.id + '" data-id="' + layer.id + '" data-key="color" value="' + layer.color + '">' +
            '<input type="range" data-id="' + layer.id + '" data-key="opacity" min="0" max="100" value="' + layer.opacity + '">' +
            '<span class="val" id="opacity-' + layer.id + '-val">' + layer.opacity + '%</span>' +
          '</div>' +
        '</div>';
      }
      host.innerHTML = html;
    }

    function update() {
      var box = document.getElementById('previewBox');
      var shadow = shadowValue();
      var radius = radiusValue();
      var bg = document.getElementById('boxColor').value;
      box.style.boxShadow = shadow;
      box.style.borderRadius = radius;
      box.style.background = bg;
      document.getElementById('boxColorVal').textContent = bg;

      ['TL', 'TR', 'BR', 'BL'].forEach(function (c) {
        document.getElementById('r' + c + 'Val').textContent = document.getElementById('r' + c).value + 'px';
      });

      var css = '.element {\n  box-shadow: ' + shadow + ';\n  border-radius: ' + radius + ';\n}';
      document.getElementById('cssOutput').value = css;
    }

    function findLayer(id) {
      for (var i = 0; i < layers.length; i++) {
        if (layers[i].id === +id) { return layers[i]; }
      }
      return null;
    }

    document.getElementById('layers').addEventListener('input', function (e) {
      var t = e.target;
      var key = t.getAttribute('data-key');
      if (!key) { return; }
      var layer = findLayer(t.getAttribute('data-id'));
      if (!layer) { return; }
      if (key === 'color') {
        layer.color = t.value;
      } else if (key === 'inset') {
        layer.inset = t.checked;
      } else if (key === 'opacity') {
        layer.opacity = +t.value;
        document.getElementById('opacity-' + layer.id + '-val').textContent = layer.opacity + '%';
      } else {
        layer[key] = +t.value;
        var label = document.getElementById(key + '-' + layer.id + '-val');
        if (label) { label.textContent = layer[key] + 'px'; }
      }
      update();
    });

    document.getElementById('layers').addEventListener('change', function (e) {
      if (e.target.getAttribute('data-key') === 'inset') {
        var layer = findLayer(e.target.getAttribute('data-id'));
        if (layer) { layer.inset = e.target.checked; update(); }
      }
    });

    document.getElementById('layers').addEventListener('click', function (e) {
      var id = e.target.getAttribute('data-remove');
      if (!id) { return; }
      layers = layers.filter(function (l) { return l.id !== +id; });
      renderLayers();
      update();
    });

    document.getElementById('addLayer').addEventListener('click', function () {
      layers.push(defaultLayer());
      renderLayers();
      update();
    });

    document.getElementById('resetAll').addEventListener('click', function () {
      layers = [defaultLayer()];
      document.getElementById('linkRadius').checked = true;
      ['TL', 'TR', 'BR', 'BL'].forEach(function (c) { document.getElementById('r' + c).value = 12; });
      document.getElementById('boxColor').value = '#6366f1';
      renderLayers();
      update();
    });

    ['TL', 'TR', 'BR', 'BL'].forEach(function (c) {
      document.getElementById('r' + c).addEventListener('input', function (e) {
        if (document.getElementById('linkRadius').checked) {
          ['TL', 'TR', 'BR', 'BL'].forEach(function (o) { document.getElementById('r' + o).value = e.target.value; });
        }
        update();
      });
    });

    document.getElementById('linkRadius').addEventListener('change', function (e) {
      if (e.target.checked) {
        var v = document.getElementById('rTL').value;
        ['TR', 'BR', 'BL'].forEach(function (o) { document.getElementById('r' + o).value = v; });
        update();
      }
    });

    document.getElementById('boxColor').addEventListener('input', update);

    document.getElementById('copyBtn').addEventListener('click', function () {
      var out = document.getElementById('cssOutput');
      var btn = this;
      var done = function () {
        var original = 'Copy CSS';
        btn.textContent = 'Copied!';
        setTimeout(function () { btn.textContent = original; }, 2000);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(out.value).then(done, function () {
          out.select(); document.execCommand('copy'); done();
        });
      } else {
        out.select();
        document.execCommand('copy');
        done();
      }
    });

    layers = [defaultLayer()];
    renderLayers();
    update();
  </script>
</body>
</html>
