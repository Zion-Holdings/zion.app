<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Entity Encoder / Decoder | Zion Tech Group</title>
  <meta name="description" content="Encode text to HTML entities or decode entities back to plain text. Handles &amp;amp; &amp;lt; &amp;gt; &amp;quot; &amp;#39; &amp;nbsp; plus numeric entities for non-ASCII characters. Free online HTML entity tool.">
  <meta property="og:title" content="HTML Entity Encoder / Decoder | Zion Tech Group">
  <meta property="og:description" content="Free online HTML entity encoder and decoder — escape special characters or convert entities back to text.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ziontechgroup.com/tools/html-entities/">
  <link rel="canonical" href="https://ziontechgroup.com/tools/html-entities/">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b0f1a; color: #e5e7eb; min-height: 100vh; }
    .container { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    .subtitle { color: #94a3b8; margin-bottom: 2rem; }
    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 0.875rem; color: #94a3b8; margin-bottom: 0.5rem; }
    textarea { width: 100%; min-height: 160px; padding: 0.75rem; background: #1e293b; border: 1px solid #334155; border-radius: 0.5rem; color: #fff; font-family: monospace; font-size: 0.875rem; resize: vertical; line-height: 1.5; }
    textarea:focus { outline: none; border-color: #6366f1; }
    .buttons { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .btn { padding: 0.5rem 1rem; background: #6366f1; color: #fff; border: none; border-radius: 0.5rem; cursor: pointer; font-size: 0.875rem; }
    .btn:hover { background: #4f46e5; }
    .btn.secondary { background: #374151; }
    .btn.secondary:hover { background: #4b5563; }
    .btn.success { background: #059669; }
    .btn.success:hover { background: #047857; }
    .error { background: #7f1d1d; border: 1px solid #991b1b; border-radius: 0.5rem; padding: 0.75rem; color: #fecaca; margin-bottom: 1rem; display: none; }
    .options { background: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; padding: 1rem 1.5rem; margin-bottom: 1rem; }
    .options label { display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; color: #cbd5e1; margin-right: 1.5rem; cursor: pointer; }
    .stats { font-size: 0.8125rem; color: #64748b; margin-top: 0.375rem; }
    .reference { background: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; padding: 1.5rem; margin-top: 2rem; }
    .reference h3 { font-size: 1rem; margin-bottom: 1rem; color: #818cf8; }
    .ref-table { width: 100%; border-collapse: collapse; }
    .ref-table th, .ref-table td { padding: 0.5rem; text-align: left; border-bottom: 1px solid #334155; font-size: 0.875rem; }
    .ref-table th { color: #94a3b8; font-weight: 600; }
    .ref-table tr:last-child td { border-bottom: none; }
    .ref-table td { font-family: monospace; word-break: break-all; }
    .ref-table td.desc { font-family: inherit; color: #94a3b8; }
    .back { display: inline-block; margin-top: 1.5rem; color: #818cf8; text-decoration: none; }
    .back:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <h1>HTML Entity Encoder / Decoder</h1>
    <p class="subtitle">Escape special characters into HTML entities, or decode entities back to plain text.</p>

    <div class="field">
      <label for="rawInput">Raw Text</label>
      <textarea id="rawInput" placeholder="<div class=&quot;greeting&quot;>Café &amp; crème — 5 < 10</div>" spellcheck="false"></textarea>
      <div class="stats" id="rawStats">0 characters</div>
    </div>

    <div class="options">
      <label><input type="checkbox" id="optNonAscii" checked> Encode non-ASCII as numeric entities</label>
      <label><input type="checkbox" id="optHex"> Use hex form (&amp;#x2014;)</label>
    </div>

    <div class="buttons">
      <button class="btn" onclick="encode()">↓ Encode</button>
      <button class="btn" onclick="decode()">↑ Decode</button>
      <button class="btn success" onclick="copyOutput()">Copy Output</button>
      <button class="btn secondary" onclick="clearAll()">Clear</button>
    </div>

    <div class="error" id="error"></div>

    <div class="field">
      <label for="encodedInput">Encoded (HTML Entities)</label>
      <textarea id="encodedInput" placeholder="&amp;lt;div class=&amp;quot;greeting&amp;quot;&amp;gt;Caf&amp;#233; &amp;amp; cr&amp;#232;me&amp;lt;/div&amp;gt;" spellcheck="false"></textarea>
      <div class="stats" id="encodedStats">0 characters</div>
    </div>

    <div class="reference">
      <h3>Common Named Entities</h3>
      <table class="ref-table">
        <thead><tr><th>Character</th><th>Named</th><th>Numeric</th><th class="desc">Description</th></tr></thead>
        <tbody id="refBody"></tbody>
      </table>
    </div>

    <a href="/tools/" class="back">← Back to Tools</a>
  </div>

  <script>
    // ---- Named entity tables ----
    var ENCODE_NAMED = {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;',
      '\u00a0': '&nbsp;'
    };

    var DECODE_NAMED = {
      amp: '&', lt: '<', gt: '>', quot: '"', apos: "'", nbsp: '\u00a0',
      copy: '\u00a9', reg: '\u00ae', trade: '\u2122', hellip: '\u2026',
      mdash: '\u2014', ndash: '\u2013', lsquo: '\u2018', rsquo: '\u2019',
      ldquo: '\u201c', rdquo: '\u201d', bull: '\u2022', dagger: '\u2020',
      deg: '\u00b0', plusmn: '\u00b1', times: '\u00d7', divide: '\u00f7',
      frac12: '\u00bd', frac14: '\u00bc', frac34: '\u00be', sup2: '\u00b2',
      sup3: '\u00b3', micro: '\u00b5', para: '\u00b6', sect: '\u00a7',
      middot: '\u00b7', laquo: '\u00ab', raquo: '\u00bb', iexcl: '\u00a1',
      iquest: '\u00bf', cent: '\u00a2', pound: '\u00a3', yen: '\u00a5',
      euro: '\u20ac', curren: '\u00a4', not: '\u00ac', shy: '\u00ad',
      macr: '\u00af', acute: '\u00b4', cedil: '\u00b8', ordf: '\u00aa',
      ordm: '\u00ba', szlig: '\u00df', agrave: '\u00e0', aacute: '\u00e1',
      acirc: '\u00e2', atilde: '\u00e3', auml: '\u00e4', aring: '\u00e5',
      aelig: '\u00e6', ccedil: '\u00e7', egrave: '\u00e8', eacute: '\u00e9',
      ecirc: '\u00ea', euml: '\u00eb', igrave: '\u00ec', iacute: '\u00ed',
      icirc: '\u00ee', iuml: '\u00ef', ntilde: '\u00f1', ograve: '\u00f2',
      oacute: '\u00f3', ocirc: '\u00f4', otilde: '\u00f5', ouml: '\u00f6',
      oslash: '\u00f8', ugrave: '\u00f9', uacute: '\u00fa', ucirc: '\u00fb',
      uuml: '\u00fc', yacute: '\u00fd', yuml: '\u00ff',
      Agrave: '\u00c0', Aacute: '\u00c1', Acirc: '\u00c2', Atilde: '\u00c3',
      Auml: '\u00c4', Aring: '\u00c5', AElig: '\u00c6', Ccedil: '\u00c7',
      Egrave: '\u00c8', Eacute: '\u00c9', Ecirc: '\u00ca', Euml: '\u00cb',
      Igrave: '\u00cc', Iacute: '\u00cd', Icirc: '\u00ce', Iuml: '\u00cf',
      Ntilde: '\u00d1', Ograve: '\u00d2', Oacute: '\u00d3', Ocirc: '\u00d4',
      Otilde: '\u00d5', Ouml: '\u00d6', Oslash: '\u00d8', Ugrave: '\u00d9',
      Uacute: '\u00da', Ucirc: '\u00db', Uuml: '\u00dc', Yacute: '\u00dd',
      alpha: '\u03b1', beta: '\u03b2', gamma: '\u03b3', delta: '\u03b4',
      pi: '\u03c0', sigma: '\u03c3', omega: '\u03c9', Omega: '\u03a9',
      lambda: '\u03bb', mu: '\u03bc', infin: '\u221e', ne: '\u2260',
      le: '\u2264', ge: '\u2265', asymp: '\u2248', radic: '\u221a',
      sum: '\u2211', prod: '\u220f', int: '\u222b', part: '\u2202',
      larr: '\u2190', uarr: '\u2191', rarr: '\u2192', darr: '\u2193',
      harr: '\u2194', spades: '\u2660', clubs: '\u2663', hearts: '\u2665',
      diams: '\u2666', star: '\u2606', check: '\u2713', cross: '\u2717',
      ensp: '\u2002', emsp: '\u2003', thinsp: '\u2009', zwnj: '\u200c',
      zwj: '\u200d', lrm: '\u200e', rlm: '\u200f', sbquo: '\u201a',
      bdquo: '\u201e', permil: '\u2030', prime: '\u2032', Prime: '\u2033',
      lsaquo: '\u2039', rsaquo: '\u203a', oline: '\u203e', frasl: '\u2044',
      minus: '\u2212', lowast: '\u2217', prop: '\u221d', ang: '\u2220',
      and: '\u2227', or: '\u2228', cap: '\u2229', cup: '\u222a',
      there4: '\u2234', sim: '\u223c', cong: '\u2245', equiv: '\u2261',
      sub: '\u2282', sup: '\u2283', nsub: '\u2284', sube: '\u2286',
      supe: '\u2287', oplus: '\u2295', otimes: '\u2297', perp: '\u22a5',
      sdot: '\u22c5', loz: '\u25ca', nabla: '\u2207', isin: '\u2208',
      notin: '\u2209', ni: '\u220b', empty: '\u2205', exist: '\u2203',
      forall: '\u2200', alefsym: '\u2135', weierp: '\u2118', image: '\u2111',
      real: '\u211c', crarr: '\u21b5', lArr: '\u21d0', uArr: '\u21d1',
      rArr: '\u21d2', dArr: '\u21d3', hArr: '\u21d4', lceil: '\u2308',
      rceil: '\u2309', lfloor: '\u230a', rfloor: '\u230b', lang: '\u2329',
      rang: '\u232a', circ: '\u02c6', tilde: '\u02dc', thinspace: '\u2009'
    };

    // ---- Encode ----
    function encodeEntities(text, nonAscii, hex) {
      var out = '';
      for (var i = 0; i < text.length; i++) {
        var ch = text.charAt(i);
        if (ENCODE_NAMED.hasOwnProperty(ch)) {
          out += ENCODE_NAMED[ch];
          continue;
        }
        var cp = text.codePointAt(i);
        // Handle astral characters (surrogate pairs) as one code point
        if (cp > 0xFFFF) { i++; }
        if (nonAscii && (cp > 126 || cp < 32) && cp !== 9 && cp !== 10 && cp !== 13) {
          out += hex ? '&#x' + cp.toString(16).toUpperCase() + ';' : '&#' + cp + ';';
        } else {
          out += String.fromCodePoint(cp);
        }
      }
      return out;
    }

    // ---- Decode ----
    function decodeEntities(text) {
      return text.replace(/&(#[0-9]+|#[xX][0-9a-fA-F]+|[a-zA-Z][a-zA-Z0-9]*);/g, function (match, body) {
        if (body.charAt(0) === '#') {
          var code;
          if (body.charAt(1) === 'x' || body.charAt(1) === 'X') {
            code = parseInt(body.slice(2), 16);
          } else {
            code = parseInt(body.slice(1), 10);
          }
          if (isNaN(code) || code < 0 || code > 0x10FFFF) return match;
          try { return String.fromCodePoint(code); } catch (e) { return match; }
        }
        if (DECODE_NAMED.hasOwnProperty(body)) return DECODE_NAMED[body];
        var lower = body.toLowerCase();
        if (DECODE_NAMED.hasOwnProperty(lower)) return DECODE_NAMED[lower];
        return match;
      });
    }

    // ---- UI ----
    var raw = document.getElementById('rawInput');
    var enc = document.getElementById('encodedInput');
    var errorEl = document.getElementById('error');
    var lastOutput = 'encoded';

    function showError(msg) {
      errorEl.textContent = '✗ ' + msg;
      errorEl.style.display = 'block';
    }
    function hideError() { errorEl.style.display = 'none'; }

    function encode() {
      var text = raw.value;
      if (!text) { showError('Enter some raw text to encode.'); return; }
      hideError();
      enc.value = encodeEntities(
        text,
        document.getElementById('optNonAscii').checked,
        document.getElementById('optHex').checked
      );
      lastOutput = 'encoded';
      updateStats();
    }

    function decode() {
      var text = enc.value;
      if (!text) { showError('Enter some encoded text to decode.'); return; }
      hideError();
      raw.value = decodeEntities(text);
      lastOutput = 'raw';
      updateStats();
    }

    function copyOutput() {
      var value = lastOutput === 'raw' ? raw.value : enc.value;
      if (!value) { showError('Nothing to copy yet.'); return; }
      hideError();
      var btn = document.querySelector('.btn.success');
      var original = btn.textContent;
      function done() {
        btn.textContent = 'Copied!';
        setTimeout(function () { btn.textContent = original; }, 2000);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(value).then(done, fallbackCopy);
      } else {
        fallbackCopy();
      }
      function fallbackCopy() {
        var ta = document.createElement('textarea');
        ta.value = value;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); done(); } catch (e) { showError('Copy failed — select the text manually.'); }
        document.body.removeChild(ta);
      }
    }

    function clearAll() {
      raw.value = '';
      enc.value = '';
      hideError();
      updateStats();
    }

    function updateStats() {
      document.getElementById('rawStats').textContent = raw.value.length + ' characters';
      document.getElementById('encodedStats').textContent = enc.value.length + ' characters';
    }

    raw.addEventListener('input', function () { lastOutput = 'raw'; updateStats(); });
    enc.addEventListener('input', function () { lastOutput = 'encoded'; updateStats(); });

    // ---- Reference table ----
    (function () {
      var rows = [
        ['&', 'amp', 38, 'Ampersand'],
        ['<', 'lt', 60, 'Less than'],
        ['>', 'gt', 62, 'Greater than'],
        ['"', 'quot', 34, 'Double quote'],
        ["'", 'apos', 39, 'Apostrophe (encoded as &#39;)'],
        ['\u00a0', 'nbsp', 160, 'Non-breaking space'],
        ['\u00a9', 'copy', 169, 'Copyright'],
        ['\u00ae', 'reg', 174, 'Registered trademark'],
        ['\u2122', 'trade', 8482, 'Trademark'],
        ['\u2014', 'mdash', 8212, 'Em dash'],
        ['\u2013', 'ndash', 8211, 'En dash'],
        ['\u2026', 'hellip', 8230, 'Horizontal ellipsis'],
        ['\u00e9', 'eacute', 233, 'e with acute accent'],
        ['\u20ac', 'euro', 8364, 'Euro sign']
      ];
      var tbody = document.getElementById('refBody');
      rows.forEach(function (r) {
        var tr = document.createElement('tr');
        var c1 = document.createElement('td');
        c1.textContent = r[0] === '\u00a0' ? '(space)' : r[0];
        var c2 = document.createElement('td');
        c2.textContent = '&' + r[1] + ';';
        var c3 = document.createElement('td');
        c3.textContent = '&#' + r[2] + ';';
        var c4 = document.createElement('td');
        c4.className = 'desc';
        c4.textContent = r[3];
        tr.appendChild(c1); tr.appendChild(c2); tr.appendChild(c3); tr.appendChild(c4);
        tbody.appendChild(tr);
      });
    })();

    updateStats();
  </script>
</body>
</html>
