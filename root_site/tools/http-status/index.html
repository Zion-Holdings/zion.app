<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTTP Status Code Lookup | Zion Tech Group</title>
  <meta name="description" content="Search and browse HTTP status codes by category — 1xx, 2xx, 3xx, 4xx, 5xx. Copy status codes and descriptions instantly.">
  <meta property="og:title" content="HTTP Status Code Lookup | Zion Tech Group">
  <meta property="og:description" content="Free online HTTP status code lookup tool.">
  <meta property="og:url" content="https://ziontechgroup.com/tools/http-status/">
  <link rel="canonical" href="https://ziontechgroup.com/tools/http-status/">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b0f1a; color: #e5e7eb; min-height: 100vh; }
    .container { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    .subtitle { color: #94a3b8; margin-bottom: 2rem; }
    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 0.875rem; color: #94a3b8; margin-bottom: 0.5rem; }
    .field input { width: 100%; padding: 0.75rem; background: #1e293b; border: 1px solid #334155; border-radius: 0.5rem; color: #fff; font-family: monospace; }
    .field input:focus { outline: none; border-color: #6366f1; }
    .tags { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .tag { padding: 0.25rem 0.75rem; border-radius: 1rem; font-size: 0.75rem; background: #334155; color: #94a3b8; cursor: pointer; }
    .tag:hover { background: #475569; }
    .tag.active { background: #6366f1; color: #fff; }
    .section { background: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; padding: 1.5rem; margin-bottom: 1rem; }
    .section h3 { font-size: 1rem; margin-bottom: 0.75rem; color: #818cf8; }
    .status-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem; border-bottom: 1px solid #334155; }
    .status-item:last-child { border-bottom: none; }
    .status-code { font-weight: 600; color: #fff; min-width: 4rem; }
    .status-desc { color: #94a3b8; flex: 1; margin-left: 1rem; }
    .status-copy { font-family: monospace; font-size: 0.875rem; color: #818cf8; background: #0f172a; padding: 0.25rem 0.5rem; border-radius: 0.25rem; cursor: pointer; white-space: nowrap; }
    .status-copy:hover { background: #1e293b; color: #fff; }
    .back { display: inline-block; margin-top: 1.5rem; color: #818cf8; text-decoration: none; }
    .back:hover { text-decoration: underline; }
    .result-preview { margin-top: 1rem; padding: 1rem; background: #0f172a; border-radius: 0.5rem; border: 1px solid #334155; }
    .result-preview .code { font-size: 1.5rem; font-weight: 700; color: #818cf8; }
    .result-preview .desc { color: #94a3b8; margin-top: 0.25rem; }
    .no-results { color: #64748b; text-align: center; padding: 2rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>HTTP Status Code Lookup</h1>
    <p class="subtitle">Search and browse HTTP status codes by category.</p>
    <div class="field">
      <label>Search by code or description</label>
      <input type="text" id="search" placeholder="e.g., 404, redirect, server error..." oninput="render()">
    </div>
    <div class="tags" id="categories">
      <span class="tag active" onclick="filterCat('all')">All</span>
      <span class="tag" onclick="filterCat('1xx')">1xx Informational</span>
      <span class="tag" onclick="filterCat('2xx')">2xx Success</span>
      <span class="tag" onclick="filterCat('3xx')">3xx Redirection</span>
      <span class="tag" onclick="filterCat('4xx')">4xx Client Error</span>
      <span class="tag" onclick="filterCat('5xx')">5xx Server Error</span>
    </div>
    <div class="section">
      <h3>Status Codes</h3>
      <div id="statusList"></div>
    </div>
    <a href="/tools/" class="back">← Back to Tools</a>
  </div>
  <script>
    const statusCodes = [
      { code: 100, desc: 'Continue', cat: '1xx' },
      { code: 101, desc: 'Switching Protocols', cat: '1xx' },
      { code: 102, desc: 'Processing', cat: '1xx' },
      { code: 103, desc: 'Early Hints', cat: '1xx' },
      { code: 200, desc: 'OK', cat: '2xx' },
      { code: 201, desc: 'Created', cat: '2xx' },
      { code: 202, desc: 'Accepted', cat: '2xx' },
      { code: 203, desc: 'Non-Authoritative Information', cat: '2xx' },
      { code: 204, desc: 'No Content', cat: '2xx' },
      { code: 205, desc: 'Reset Content', cat: '2xx' },
      { code: 206, desc: 'Partial Content', cat: '2xx' },
      { code: 207, desc: 'Multi-Status', cat: '2xx' },
      { code: 208, desc: 'Already Reported', cat: '2xx' },
      { code: 226, desc: 'IM Used', cat: '2xx' },
      { code: 300, desc: 'Multiple Choices', cat: '3xx' },
      { code: 301, desc: 'Moved Permanently', cat: '3xx' },
      { code: 302, desc: 'Found', cat: '3xx' },
      { code: 303, desc: 'See Other', cat: '3xx' },
      { code: 304, desc: 'Not Modified', cat: '3xx' },
      { code: 305, desc: 'Use Proxy', cat: '3xx' },
      { code: 307, desc: 'Temporary Redirect', cat: '3xx' },
      { code: 308, desc: 'Permanent Redirect', cat: '3xx' },
      { code: 400, desc: 'Bad Request', cat: '4xx' },
      { code: 401, desc: 'Unauthorized', cat: '4xx' },
      { code: 402, desc: 'Payment Required', cat: '4xx' },
      { code: 403, desc: 'Forbidden', cat: '4xx' },
      { code: 404, desc: 'Not Found', cat: '4xx' },
      { code: 405, desc: 'Method Not Allowed', cat: '4xx' },
      { code: 406, desc: 'Not Acceptable', cat: '4xx' },
      { code: 407, desc: 'Proxy Authentication Required', cat: '4xx' },
      { code: 408, desc: 'Request Timeout', cat: '4xx' },
      { code: 409, desc: 'Conflict', cat: '4xx' },
      { code: 410, desc: 'Gone', cat: '4xx' },
      { code: 411, desc: 'Length Required', cat: '4xx' },
      { code: 412, desc: 'Precondition Failed', cat: '4xx' },
      { code: 413, desc: 'Payload Too Large', cat: '4xx' },
      { code: 414, desc: 'URI Too Long', cat: '4xx' },
      { code: 415, desc: 'Unsupported Media Type', cat: '4xx' },
      { code: 416, desc: 'Range Not Satisfiable', cat: '4xx' },
      { code: 417, desc: 'Expectation Failed', cat: '4xx' },
      { code: 418, desc: "I'm a teapot", cat: '4xx' },
      { code: 421, desc: 'Misdirected Request', cat: '4xx' },
      { code: 422, desc: 'Unprocessable Entity', cat: '4xx' },
      { code: 423, desc: 'Locked', cat: '4xx' },
      { code: 424, desc: 'Failed Dependency', cat: '4xx' },
      { code: 425, desc: 'Too Early', cat: '4xx' },
      { code: 426, desc: 'Upgrade Required', cat: '4xx' },
      { code: 428, desc: 'Precondition Required', cat: '4xx' },
      { code: 429, desc: 'Too Many Requests', cat: '4xx' },
      { code: 431, desc: 'Request Header Fields Too Large', cat: '4xx' },
      { code: 451, desc: 'Unavailable For Legal Reasons', cat: '4xx' },
      { code: 500, desc: 'Internal Server Error', cat: '5xx' },
      { code: 501, desc: 'Not Implemented', cat: '5xx' },
      { code: 502, desc: 'Bad Gateway', cat: '5xx' },
      { code: 503, desc: 'Service Unavailable', cat: '5xx' },
      { code: 504, desc: 'Gateway Timeout', cat: '5xx' },
      { code: 505, desc: 'HTTP Version Not Supported', cat: '5xx' },
      { code: 506, desc: 'Variant Also Negotiates', cat: '5xx' },
      { code: 507, desc: 'Insufficient Storage', cat: '5xx' },
      { code: 508, desc: 'Loop Detected', cat: '5xx' },
      { code: 510, desc: 'Not Extended', cat: '5xx' },
      { code: 511, desc: 'Network Authentication Required', cat: '5xx' },
    ];
    let currentCat = 'all';
    function render() {
      const search = document.getElementById('search').value.toLowerCase();
      const container = document.getElementById('statusList');
      container.innerHTML = '';
      const filtered = statusCodes.filter(s => {
        const matchCat = currentCat === 'all' || s.cat === currentCat;
        const matchSearch = search === '' ||
          String(s.code).includes(search) ||
          s.desc.toLowerCase().includes(search);
        return matchCat && matchSearch;
      });
      if (filtered.length === 0) {
        container.innerHTML = '<div class="no-results">No matching status codes found.</div>';
        return;
      }
      filtered.forEach(s => {
        const item = document.createElement('div');
        item.className = 'status-item';
        item.innerHTML = `
          <span class="status-code">${s.code}</span>
          <span class="status-desc">${s.desc}</span>
          <span class="status-copy" onclick="copyStatus(${s.code}, '${s.desc.replace(/'/g, "\\'")}')">${s.code} ${s.desc} 📋</span>
        `;
        container.appendChild(item);
      });
    }
    function filterCat(cat) {
      currentCat = cat;
      document.querySelectorAll('.tag').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      render();
    }
    function copyStatus(code, desc) {
      navigator.clipboard.writeText(`${code} ${desc}`).then(() => {
        const btn = event.target;
        const orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = orig; }, 1500);
      });
    }
    render();
  </script>
</body>
</html>
