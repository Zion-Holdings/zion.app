<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b0f1a; color: #e5e7eb; min-height: 100vh; }
    .container { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    .subtitle { color: #94a3b8; margin-bottom: 2rem; }
    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 0.875rem; color: #94a3b8; margin-bottom: 0.5rem; }
    textarea { width: 100%; padding: 0.75rem; background: #1e293b; border: 1px solid #334155; border-radius: 0.5rem; color: #fff; font-family: monospace; resize: vertical; min-height: 120px; }
    textarea:focus { outline: none; border-color: #6366f1; }
    .buttons { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .btn { padding: 0.5rem 1rem; background: #6366f1; color: #fff; border: none; border-radius: 0.5rem; cursor: pointer; font-size: 0.875rem; }
    .btn:hover { background: #4f46e5; }
    .btn.success { background: #059669; }
    .btn.success:hover { background: #047857; }
    .section { background: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; padding: 1.5rem; margin-bottom: 1rem; }
    .section h3 { font-size: 1rem; margin-bottom: 0.75rem; color: #818cf8; }
    .section pre { background: #0f172a; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; font-size: 0.875rem; line-height: 1.5; white-space: pre-wrap; word-break: break-all; min-height: 60px; }
    .back { display: inline-block; margin-top: 1.5rem; color: #818cf8; text-decoration: none; }
    .back:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <h1>JS Obfuscator</h1>
    <p class="subtitle">Obfuscate JavaScript code with variable renaming and string encoding.</p>
    <div class="field">
      <label>JavaScript Input</label>
      <textarea id="input" placeholder="Enter JavaScript code...">function greet(name) {
  var message = "Hello, " + name + "!";
  console.log(message);
  return message;
}

var result = greet("World");</textarea>
    </div>
    <div class="buttons">
      <button class="btn" onclick="obfuscate()">Obfuscate</button>
      <button class="btn success" onclick="copy()">Copy Output</button>
      <button class="btn" onclick="clearAll()">Clear</button>
    </div>
    <div class="section">
      <h3>Obfuscated Output</h3>
      <pre id="output">—</pre>
    </div>
    <a href="/tools/" class="back">← Back to Tools</a>
  </div>
  <script>
    function obfuscate() {
      let code = document.getElementById('input').value;
      if (!code.trim()) { document.getElementById('output').textContent = '—'; return; }
      
      // Simple obfuscation: rename variables and encode strings
      const varMap = {};
      let varIndex = 0;
      
      // Find and rename variables
      code = code.replace(/\b(var|let|const)\s+([a-zA-Z_$][a-zA-Z0-9_$]*)/g, function(match, decl, name) {
        if (!varMap[name]) {
          varMap[name] = '_' + varIndex.toString(36);
          varIndex++;
        }
        return decl + ' ' + varMap[name];
      });
      
      // Rename variable usages
      Object.keys(varMap).forEach(name => {
        const regex = new RegExp('\\b' + name + '\\b', 'g');
        code = code.replace(regex, varMap[name]);
      });
      
      // Encode strings to hex
      code = code.replace(/"([^"]*)"/g, function(match, str) {
        let encoded = '';
        for (let i = 0; i < str.length; i++) {
          encoded += '\\x' + str.charCodeAt(i).toString(16).padStart(2, '0');
        }
        return '"' + encoded + '"';
      });
      
      // Remove comments
      code = code.replace(/\/\/.*$/gm, '');
      code = code.replace(/\/\*[\s\S]*?\*\//g, '');
      
      // Remove extra whitespace
      code = code.replace(/\s+/g, ' ').trim();
      
      document.getElementById('output').textContent = code;
    }
    function copy() {
      const output = document.getElementById('output').textContent;
      if (output !== '—') navigator.clipboard.writeText(output);
    }
    function clearAll() {
      document.getElementById('input').value = '';
      document.getElementById('output').textContent = '—';
    }
  </script>
</body>
