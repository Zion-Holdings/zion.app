<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Services - Zion Tech Group</title>
  <meta name="description" content="Applied AI capabilities built for enterprise scale, governance, and measurable ROI." />
  <link rel="canonical" href="https://ziontechgroup.com/ai-services/" />
  <style>
    body { background:#020617; color:#e2e8f0; font-family:Inter,ui-sans-serif,system-ui; }
    main { max-width:1100px; margin:0 auto; padding:5rem 1rem; }
    h1 { font-size:2.5rem; font-weight:700; color:#fff; }
    p { color:#cbd5e1; }
    .grid { display:grid; gap:1.25rem; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); margin-top:2rem; }
    .card { background:#0f172a; border:1px solid #334155; border-radius:1rem; padding:1.25rem; }
    .card h3 { color:#fff; margin:.5rem 0 .25rem; }
    .icon { font-size:1.75rem; }
  </style>
</head>
<body>
  <main>
    <h1>AI Services</h1>
    <p>Applied AI capabilities built for enterprise scale, governance, and measurable ROI.</p>
    <div class="grid" id="services"></div>
    <script>
      const SERVICES = [
        { id:'ai-analytics', title:'AI Analytics Platform', desc:'Predictive BI dashboards, anomaly detection, and automated insight generation.', icon:'📊' },
        { id:'ai-chatbot-builder-pro', title:'AI Chatbot Builder Pro', desc:'Conversational AI with RAG, handoff to humans, and multi-channel deployment.', icon:'💬' },
        { id:'ai-code-assistant-enterprise', title:'Enterprise Code Assistant', desc:'AI pair-programming, automated reviews, and secure code-generation guardrails.', icon:'🧑‍💻' },
        { id:'ai-customer-support', title:'Customer Support AI', desc:'Ticket triage, auto-responses, and knowledge-base automation for support teams.', icon:'🎧' },
        { id:'ai-knowledge-graph', title:'Knowledge Graph Builder', desc:'Entity resolution, relationship mapping, and semantic search across enterprise data.', icon:'🕸️' },
        { id:'ai-meeting-assistant-pro', title:'Meeting Assistant Pro', desc:'Transcription, summaries, action-item extraction, and CRM auto-updates.', icon:'📝' },
        { id:'ai-voice-agent-platform', title:'Voice Agent Platform', desc:'IVR replacement, voice analytics, and multilingual support automation.', icon:'🎙️' },
        { id:'ai-agentic-workflows', title:'Agentic Workflows', desc:'Multi-step autonomous agents for operations, approvals, and business processes.', icon:'⚡' }
      ];
      document.getElementById('services').innerHTML = SERVICES.map(s => `<div class="card"><div class="icon">${s.icon}</div><h3>${s.title}</h3><p>${s.desc}</p></div>`).join('');
    </script>
  </main>
</body>
</html>
