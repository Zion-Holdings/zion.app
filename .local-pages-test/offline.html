<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/favicon.ico">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You are offline — Zion Tech Group</title>
  <meta name="robots" content="noindex" />
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, sans-serif; background: radial-gradient(1200px 800px at 20% -10%, #1f2a48, #0b1221 60%, #060a14); color: #e5e7eb; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .card { max-width: 520px; width: 100%; background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; padding: 28px; backdrop-filter: blur(10px); box-shadow: 0 30px 60px rgba(0,0,0,0.35); }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #a1a1aa; line-height: 1.55; margin: 0 0 18px; }
    a { color: #7dd3fc; text-decoration: none; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    button, .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); background: #0b1221; color: #e5e7eb; cursor: pointer; }
    .btn-primary { background: linear-gradient(180deg, #6366f1, #4f46e5); border-color: transparent; color: white; }
  </style>
</head>
<body>
  <main class="card">
    <h1>You’re offline</h1>
    <p>Some parts of Zion Tech Group require an internet connection. Try again when you’re back online.</p>
    <div class="actions">
      <button class="btn-primary" onclick="location.reload()">Try again</button>
      <a class="btn" href="/">Go to homepage</a>
    </div>
  </main>
</body>
</html>
