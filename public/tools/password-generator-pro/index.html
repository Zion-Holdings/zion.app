<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Generator Pro | Zion Tech Group</title>
  <meta name="description" content="Generate secure, random passwords with advanced options — length, character types, exclude ambiguous chars, and strength analysis.">
  <meta property="og:title" content="Password Generator Pro | Zion Tech Group">
  <meta property="og:description" content="Free online password generator with advanced options and strength meter.">
  <meta property="og:url" content="https://ziontechgroup.com/tools/password-generator-pro/">
  <link rel="canonical" href="https://ziontechgroup.com/tools/password-generator-pro/">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b0f1a; color: #e5e7eb; min-height: 100vh; }
    .container { max-width: 700px; margin: 0 auto; padding: 2rem 1rem; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    .subtitle { color: #94a3b8; margin-bottom: 2rem; }
    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 0.875rem; color: #94a3b8; margin-bottom: 0.5rem; }
    .field input[type="text"], .field input[type="number"] { width: 100%; padding: 0.75rem; background: #1e293b; border: 1px solid #334155; border-radius: 0.5rem; color: #fff; font-family: monospace; }
    .field input[type="text"]:focus, .field input[type="number"]:focus { outline: none; border-color: #6366f1; }
    .slider-container { display: flex; align-items: center; gap: 1rem; }
    .slider-container input[type="range"] { flex: 1; -webkit-appearance: none; height: 6px; background: #334155; border-radius: 3px; outline: none; }
    .slider-container input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; background: #6366f1; border-radius: 50%; cursor: pointer; }
    .slider-container input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; background: #6366f1; border-radius: 50%; cursor: pointer; border: none; }
    .slider-value { min-width: 3rem; text-align: center; font-family: monospace; font-size: 1rem; color: #818cf8; }
    .checkbox-group { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .checkbox-item { display: flex; align-items: center; gap: 0.5rem; }
    .checkbox-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: #6366f1; cursor: pointer; }
    .checkbox-item label { font-size: 0.875rem; color: #e5e7eb; cursor: pointer; }
    .btn { padding: 0.5rem 1rem; background: #6366f1; color: #fff; border: none; border-radius: 0.5rem; cursor: pointer; font-size: 0.875rem; }
    .btn:hover { background: #4f46e5; }
    .btn.secondary { background: #374151; }
    .btn.secondary:hover { background: #4b5563; }
    .btn.copy { background: #059669; }
    .btn.copy:hover { background: #047857; }
    .result-box { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .result-box input { flex: 1; padding: 0.75rem; background: #1e293b; border: 1px solid #334155; border-radius: 0.5rem; color: #fff; font-family: monospace; font-size: 0.875rem; }
    .strength-bar { height: 8px; background: #334155; border-radius: 4px; margin-bottom: 1rem; overflow: hidden; }
    .strength-fill { height: 100%; border-radius: 4px; transition: width 0.3s, background 0.3s; }
    .section { background: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; padding: 1.5rem; margin-bottom: 1rem; }
    .section h3 { font-size: 1rem; margin-bottom: 0.75rem; color: #818cf8; }
    .stat { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #334155; }
    .stat:last-child { border-bottom: none; }
    .stat-label { color: #94a3b8; font-size: 0.875rem; }
    .stat-value { font-family: monospace; font-size: 0.875rem; }
    .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .back { display: inline-block; margin-top: 1.5rem; color: #818cf8; text-decoration: none; }
    .back:hover { text-decoration: underline; }
    .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); background: #059669; color: #fff; padding: 0.75rem 1.5rem; border-radius: 0.5rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; font-size: 0.875rem; }
    .toast.show { opacity: 1; }
    .history-list { background: #1e293b; border: 1px solid #334155; border-radius: 0.5rem; max-height: 200px; overflow-y: auto; margin-bottom: 1rem; }
    .history-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.75rem; border-bottom: 1px solid #334155; }
    .history-item:last-child { border-bottom: none; }
    .history-item span { flex: 1; font-family: monospace; font-size: 0.875rem; color: #e5e7eb; word-break: break-all; }
    .history-item .btn { flex-shrink: 0; padding: 0.25rem 0.5rem; font-size: 0.75rem; }
    .empty-history { padding: 1rem; text-align: center; color: #64748b; font-size: 0.875rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Password Generator Pro</h1>
    <p class="subtitle">Generate secure passwords with advanced options and strength analysis.</p>
    
    <div class="section">
      <h3>Generated Password</h3>
      <div class="result-box">
        <input type="text" id="passwordOutput" readonly placeholder="Click Generate...">
        <button class="btn copy" onclick="copyPassword()">Copy</button>
      </div>
      <div class="strength-bar"><div class="strength-fill" id="strengthFill" style="width: 0%"></div></div>
      <div class="actions">
        <button class="btn" onclick="generatePassword()">Generate</button>
        <button class="btn secondary" onclick="generateMultiple()">Generate 5</button>
      </div>
    </div>

    <div class="section">
      <h3>Options</h3>
      <div class="field">
        <label>Password Length: <span id="lengthValue" style="color: #818cf8;">16</span></label>
        <div class="slider-container">
          <input type="range" id="length" min="4" max="64" value="16" oninput="updateLength()">
          <span class="slider-value" id="lengthDisplay">16</span>
        </div>
      </div>
      <div class="field">
        <label>Character Types</label>
        <div class="checkbox-group">
          <div class="checkbox-item">
            <input type="checkbox" id="uppercase" checked>
            <label for="uppercase">Uppercase (A-Z)</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="lowercase" checked>
            <label for="lowercase">Lowercase (a-z)</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="numbers" checked>
            <label for="numbers">Numbers (0-9)</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="symbols" checked>
            <label for="symbols">Symbols (!@#$...)</label>
          </div>
        </div>
      </div>
      <div class="field">
        <div class="checkbox-item">
          <input type="checkbox" id="excludeAmbiguous">
          <label for="excludeAmbiguous">Exclude ambiguous characters (0, O, l, 1, I)</label>
        </div>
      </div>
    </div>

    <div class="section">
      <h3>Strength Analysis</h3>
      <div id="strengthStats"></div>
    </div>

    <div class="section">
      <h3>History</h3>
      <div class="history-list" id="historyList">
        <div class="empty-history">No passwords generated yet</div>
      </div>
      <div class="actions">
        <button class="btn secondary" onclick="clearHistory()">Clear History</button>
        <button class="btn copy" onclick="copyAllHistory()">Copy All</button>
      </div>
    </div>

    <a href="/tools/" class="back">← Back to Tools</a>
  </div>

  <div class="toast" id="toast">Copied to clipboard!</div>

  <script>
    const CHAR_SETS = {
      uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
      lowercase: 'abcdefghijklmnopqrstuvwxyz',
      numbers: '0123456789',
      symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
    };
    
    const AMBIGUOUS = '0OlI1';
    
    let history = [];
    
    function updateLength() {
      const val = document.getElementById('length').value;
      document.getElementById('lengthValue').textContent = val;
      document.getElementById('lengthDisplay').textContent = val;
    }
    
    function getCharacterSet() {
      let chars = '';
      if (document.getElementById('uppercase').checked) chars += CHAR_SETS.uppercase;
      if (document.getElementById('lowercase').checked) chars += CHAR_SETS.lowercase;
      if (document.getElementById('numbers').checked) chars += CHAR_SETS.numbers;
      if (document.getElementById('symbols').checked) chars += CHAR_SETS.symbols;
      
      if (document.getElementById('excludeAmbiguous').checked) {
        chars = chars.split('').filter(c => !AMBIGUOUS.includes(c)).join('');
      }
      
      return chars;
    }
    
    function generatePassword() {
      const length = parseInt(document.getElementById('length').value);
      let chars = getCharacterSet();
      
      if (!chars) {
        showToast('Select at least one character type');
        return;
      }
      
      const array = new Uint32Array(length);
      crypto.getRandomValues(array);
      
      let password = '';
      for (let i = 0; i < length; i++) {
        password += chars[array[i] % chars.length];
      }
      
      document.getElementById('passwordOutput').value = password;
      analyzeStrength(password);
      addToHistory(password);
    }
    
    function generateMultiple() {
      for (let i = 0; i < 5; i++) {
        generatePassword();
      }
    }
    
    function analyzeStrength(password) {
      const fill = document.getElementById('strengthFill');
      const stats = document.getElementById('strengthStats');
      
      if (!password) {
        fill.style.width = '0%';
        stats.innerHTML = '';
        return;
      }
      
      let score = 0;
      const len = password.length;
      
      // Length scoring
      if (len >= 8) score++;
      if (len >= 12) score++;
      if (len >= 16) score++;
      if (len >= 24) score++;
      
      // Character variety
      if (/[a-z]/.test(password)) score++;
      if (/[A-Z]/.test(password)) score++;
      if (/[0-9]/.test(password)) score++;
      if (/[^a-zA-Z0-9]/.test(password)) score++;
      
      // Calculate entropy
      let poolSize = 0;
      if (/[a-z]/.test(password)) poolSize += 26;
      if (/[A-Z]/.test(password)) poolSize += 26;
      if (/[0-9]/.test(password)) poolSize += 10;
      if (/[^a-zA-Z0-9]/.test(password)) poolSize += 32;
      const entropy = Math.floor(len * Math.log2(poolSize || 1));
      
      // Crack time estimation
      const guessesPerSecond = 1e10;
      const possibleCombinations = Math.pow(poolSize || 1, len);
      const secondsToCrack = possibleCombinations / guessesPerSecond;
      let crackTime;
      if (secondsToCrack < 1) crackTime = 'Instantly';
      else if (secondsToCrack < 60) crackTime = 'Seconds';
      else if (secondsToCrack < 3600) crackTime = 'Minutes';
      else if (secondsToCrack < 86400) crackTime = 'Hours';
      else if (secondsToCrack < 31536000) crackTime = 'Days';
      else if (secondsToCrack < 31536000 * 1000) crackTime = 'Years';
      else if (secondsToCrack < 31536000 * 1000000) crackTime = 'Thousands of years';
      else crackTime = 'Millions of years';
      
      const colors = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#10b981'];
      const labels = ['Very Weak', 'Weak', 'Fair', 'Strong', 'Very Strong'];
      const pct = Math.min(100, (score / 9) * 100);
      const level = Math.min(4, Math.floor(score / 2));
      
      fill.style.width = pct + '%';
      fill.style.background = colors[level];
      
      stats.innerHTML = `
        <div class="stat"><span class="stat-label">Strength</span><span class="stat-value" style="color: ${colors[level]}">${labels[level]}</span></div>
        <div class="stat"><span class="stat-label">Length</span><span class="stat-value">${len}</span></div>
        <div class="stat"><span class="stat-label">Entropy</span><span class="stat-value">${entropy} bits</span></div>
        <div class="stat"><span class="stat-label">Character Pool</span><span class="stat-value">${poolSize}</span></div>
        <div class="stat"><span class="stat-label">Crack Time</span><span class="stat-value">${crackTime}</span></div>
        <div class="stat"><span class="stat-label">Lowercase</span><span class="stat-value">${/[a-z]/.test(password) ? '✓' : '✗'}</span></div>
        <div class="stat"><span class="stat-label">Uppercase</span><span class="stat-value">${/[A-Z]/.test(password) ? '✓' : '✗'}</span></div>
        <div class="stat"><span class="stat-label">Numbers</span><span class="stat-value">${/[0-9]/.test(password) ? '✓' : '✗'}</span></div>
        <div class="stat"><span class="stat-label">Symbols</span><span class="stat-value">${/[^a-zA-Z0-9]/.test(password) ? '✓' : '✗'}</span></div>
      `;
    }
    
    function addToHistory(password) {
      history.unshift(password);
      if (history.length > 20) history.pop();
      renderHistory();
    }
    
    function renderHistory() {
      const list = document.getElementById('historyList');
      if (history.length === 0) {
        list.innerHTML = '<div class="empty-history">No passwords generated yet</div>';
        return;
      }
      list.innerHTML = history.map((pw, i) => `
        <div class="history-item">
          <span>${pw}</span>
          <button class="btn copy" onclick="copyFromHistory(${i})">Copy</button>
        </div>
      `).join('');
    }
    
    function clearHistory() {
      history = [];
      renderHistory();
    }
    
    function copyPassword() {
      const pw = document.getElementById('passwordOutput').value;
      if (!pw) return;
      navigator.clipboard.writeText(pw).then(() => showToast('Copied to clipboard!'));
    }
    
    function copyFromHistory(index) {
      navigator.clipboard.writeText(history[index]).then(() => showToast('Copied to clipboard!'));
    }
    
    function copyAllHistory() {
      if (history.length === 0) return;
      navigator.clipboard.writeText(history.join('\n')).then(() => showToast('All passwords copied!'));
    }
    
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    
    // Generate on load
    generatePassword();
  </script>
</body>
</html>
