<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YAML to JSON Converter | Zion Tech Group</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0f1a;color:#e5e7eb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem}
.container{max-width:900px;width:100%}
h1{font-size:1.75rem;font-weight:700;margin-bottom:.25rem}
.subtitle{color:#9ca3af;font-size:.9rem;margin-bottom:1.5rem}
.card{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:1.5rem;margin-bottom:1rem}
label{display:block;font-size:.85rem;color:#9ca3af;margin-bottom:.5rem;font-weight:600}
textarea{width:100%;background:#0b0f1a;border:1px solid #374151;border-radius:8px;color:#e5e7eb;padding:.75rem;font-size:.9rem;font-family:'Fira Code',monospace;resize:vertical;min-height:180px}
textarea:focus{outline:none;border-color:#6366f1}
.btn-group{display:flex;gap:.5rem;margin-top:1rem;flex-wrap:wrap}
.btn{padding:.6rem 1.25rem;border:none;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;transition:.2s}
.btn-primary{background:#6366f1;color:#fff}
.btn-primary:hover{background:#4f46e5}
.btn-secondary{background:#1f2937;color:#e5e7eb}
.btn-secondary:hover{background:#374151}
.btn-copy{background:#10b981;color:#fff}
.btn-copy:hover{background:#059669}
.stats{display:flex;gap:1rem;margin-top:1rem;flex-wrap:wrap}
.stat{background:#0b0f1a;border:1px solid #374151;border-radius:8px;padding:.5rem 1rem;flex:1;min-width:140px}
.stat-label{font-size:.75rem;color:#9ca3af;text-transform:uppercase;letter-spacing:.05em}
.stat-value{font-size:1rem;font-weight:700;color:#6366f1;font-family:'Fira Code',monospace}
.output-section{margin-top:1rem}
.output-box{background:#0b0f1a;border:1px solid #374151;border-radius:8px;padding:.75rem;font-size:.85rem;font-family:'Fira Code',monospace;word-break:break-all;max-height:300px;overflow-y:auto;white-space:pre-wrap;color:#e5e7eb}
.error{color:#ef4444;font-size:.85rem;margin-top:.5rem}
.success{color:#10b981;font-size:.85rem;margin-top:.5rem}
.cta-section{margin-top:1.5rem;text-align:center;padding:1.5rem;background:linear-gradient(135deg,rgba(99,102,211,.1),rgba(16,185,129,.1));border:1px solid #374151;border-radius:12px}
.cta-section h2{font-size:1.1rem;margin-bottom:.5rem}
.cta-section p{color:#9ca3af;font-size:.85rem;margin-bottom:1rem}
.cta-links{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap}
.cta-links a{padding:.6rem 1.25rem;border-radius:8px;text-decoration:none;font-weight:600;font-size:.9rem;transition:.2s}
.cta-services{background:#6366f1;color:#fff}
.cta-services:hover{background:#4f46e5}
.cta-calendly{background:#10b981;color:#fff}
.cta-calendly:hover{background:#059669}
.toggle-group{display:flex;background:#0b0f1a;border:1px solid #374151;border-radius:8px;overflow:hidden;margin-bottom:1rem}
.toggle-btn{flex:1;padding:.5rem 1rem;text-align:center;cursor:pointer;font-size:.85rem;font-weight:600;color:#9ca3af;border:none;background:none;transition:.2s}
.toggle-btn.active{background:#6366f1;color:#fff}
</style>
</head>
<body>
<div class="container">
<h1>YAML ↔ JSON Converter</h1>
<p class="subtitle">Converte YAML para JSON e vice-versa — 100% no seu navegador.</p>

<div class="card">
<div class="toggle-group">
<button class="toggle-btn active" id="mode-yaml-json">YAML → JSON</button>
<button class="toggle-btn" id="mode-json-yaml">JSON → YAML</button>
</div>

<label for="input-text">Entrada <span id="input-label">YAML</span></label>
<textarea id="input-text" placeholder="Cole seu YAML ou JSON aqui..."></textarea>

<div class="btn-group">
<button class="btn btn-primary" id="btn-converter">Converter</button>
<button class="btn btn-secondary" id="btn-sample">Exemplo</button>
<button class="btn btn-secondary" id="btn-clear">Limpar</button>
</div>

<div id="msg"></div>
</div>

<div class="card output-section" id="output-card" style="display:none">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem">
<label style="margin:0" id="output-label">Resultado JSON</label>
<button class="btn btn-copy" id="btn-copy">📋 Copiar</button>
</div>
<div class="output-box" id="output-box"></div>
<div class="stats">
<div class="stat"><div class="stat-label">Tamanho Original</div><div class="stat-value" id="stat-original">0 B</div></div>
<div class="stat"><div class="stat-label">Tamanho Convertido</div><div class="stat-value" id="stat-converted">0 B</div></div>
<div class="stat"><div class="stat-label">Linhas</div><div class="stat-value" id="stat-lines">0</div></div>
</div>
</div>

<div class="cta-section">
<h2>Precisa de ajuda com automação?</h2>
<p>Nossa equipe pode integrar soluções sob medida para seu negócio.</p>
<div class="cta-links">
<a href="/services/" class="cta-services">Ver Serviços</a>
<a href="https://calendly.com/kleber-ziontechgroup" target="_blank" rel="noopener" class="cta-calendly">Agendar Reunião</a>
</div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
let currentMode='yaml-json';

const input=$('input-text');
const outputCard=$('output-card');
const outputBox=$('output-box');
const msg=$('msg');

$('mode-yaml-json').addEventListener('click',()=>setMode('yaml-json'));
$('mode-json-yaml').addEventListener('click',()=>setMode('json-yaml'));

function setMode(mode){
currentMode=mode;
$('mode-yaml-json').classList.toggle('active',mode==='yaml-json');
$('mode-json-yaml').classList.toggle('active',mode==='json-yaml');
$('input-label').textContent=mode==='yaml-json'?'YAML':'JSON';
$('output-label').textContent=mode==='yaml-json'?'Resultado JSON':'Resultado YAML';
input.placeholder=mode==='yaml-json'?'Cole seu YAML aqui...':'Cole seu JSON aqui...';
outputCard.style.display='none';
clearMsg();
}

$('btn-converter').addEventListener('click',()=>{
clearMsg();
const text=input.value.trim();
if(!text){showError('Digite ou cole um conteúdo para converter.');return}
try{
if(currentMode==='yaml-json'){
const result=yamlToJson(text);
showOutput(JSON.stringify(result,null,2),text.length,result);
}else{
const parsed=JSON.parse(text);
const result=jsonToYaml(parsed);
showOutput(result,text.length,parsed);
}
}catch(e){showError(e.message)}
});

$('btn-sample').addEventListener('click',()=>{
if(currentMode==='yaml-json'){
input.value=`# Exemplo YAML
nome: Zion Tech Group
fundada: 2020
ativo: true
equipe:
  - nome: Kleber
    cargo: CEO
    habilidades:
      - liderança
      - arquitetura
  - nome: Maria
    cargo: CTO
endereco:
  cidade: São Paulo
  estado: SP
  pais: Brasil
metadata: &defaults
  versao: 1.0
  ambiente: producao
producao:
  <<: *defaults
  ambiente: staging
lista:
  - 1
  - 2
  - 3
texto: |
  Linha 1
  Linha 2
  Linha 3
numero: 42.5
nulo: null`;
}else{
input.value=JSON.stringify({nome:"Zion Tech Group",fundada:2020,ativo:true,equipe:[{nome:"Kleber",cargo:"CEO"}],endereco:{cidade:"São Paulo",estado:"SP"}});
}
outputCard.style.display='none';
clearMsg();
});

$('btn-clear').addEventListener('click',()=>{
input.value='';outputCard.style.display='none';clearMsg();
});

$('btn-copy').addEventListener('click',()=>{
navigator.clipboard.writeText(outputBox.textContent).then(()=>{
const btn=$('btn-copy');btn.textContent='✅ Copiado!';setTimeout(()=>btn.textContent='📋 Copiar',2000);
});
});

function showOutput(result,origLen,parsed){
outputBox.textContent=result;
$('stat-original').textContent=formatSize(origLen);
$('stat-converted').textContent=formatSize(result.length);
const lines=result.split('\n').length;
$('stat-lines').textContent=lines;
outputCard.style.display='block';
}

function formatSize(bytes){
if(bytes<1024)return bytes+' B';
if(bytes<1048576)return(bytes/1024).toFixed(1)+' KB';
return(bytes/1048576).toFixed(1)+' MB';
}
function showError(t){msg.innerHTML='<div class="error">'+escapeHtml(t)+'</div>'}
function showSuccess(t){msg.innerHTML='<div class="success">'+escapeHtml(t)+'</div>'}
function clearMsg(){msg.innerHTML=''}
function escapeHtml(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

// YAML Parser
function yamlToJson(yaml){
const lines=yaml.split('\n');
const result=parseBlock(lines,0,0,'').value;
return result;
}

function parseBlock(lines,start,baseIndent,mode){
let result=mode==='seq'?[]:{};
let i=start;
let anchorMap={};

function resolveAnchor(name){
return anchorMap[name]!==undefined?anchorMap[name]:undefined;
}

while(i<lines.length){
const line=lines[i];
const trimmed=line.trim();
if(trimmed===''||trimmed.startsWith('#')){i++;continue}
const indent=getIndent(line);

if(indent<baseIndent)break;
if(indent>baseIndent)break;

if(trimmed.startsWith('- ')){
if(mode!=='seq'&&Array.isArray(result)===false){
result=[];
mode='seq';
}
const value=trimmed.substring(2).trim();
const {obj,nextIndex}=parseListItem(lines,i,indent,value,anchorMap);
if(Array.isArray(result)){
result.push(obj.value);
Object.assign(anchorMap,obj.anchors);
}
i=nextIndex;
}else{
const colonIndex=findColon(trimmed);
if(colonIndex===-1){
i++;continue;
}
const key=trimmed.substring(0,colonIndex).trim();
let value=trimmed.substring(colonIndex+1).trim();

const anchorMatch=key.match(/^&(\w+)$/);
if(anchorMatch){
const anchorName=anchorMatch[1];
const val=parseScalar(value);
anchorMap[anchorName]=JSON.parse(JSON.stringify(val));
if(result&&typeof result==='object'&&!Array.isArray(result)){
result[key]=val;
}
i++;continue;
}

const aliasMatch=key.match(/^\*(\w+)$/);
if(aliasMatch){
const aliasName=aliasMatch[1];
const val=resolveAnchor(aliasName);
if(result&&typeof result==='object'&&!Array.isArray(result)){
result[key]=val;
}
i++;continue;
}

if(value===''){
let j=i+1;
let childIndent=0;
let childLines=[];
while(j<lines.length){
const cl=lines[j];
const ct=cl.trim();
if(ct===''){j++;continue}
const ci=getIndent(cl);
if(ci>indent){
childIndent=ci;
childLines.push(cl);
j++;
}else{break}
}
if(childLines.length>0){
const firstLine=childLines[0].trim();
const isSeq=firstLine.startsWith('- ');
const childMode=isSeq?'seq':'map';
const childResult=parseBlock(lines,i+1,childIndent,childMode);
result[key]=childResult.value;
i=childResult.nextIndex;
}else{
result[key]=null;
i++;
}
}else{
result[key]=parseScalar(value);
i++;
}
}}
return{value:result,nextIndex:i};
}

function parseListItem(lines,start,indent,valueText,anchorMap){
const result=[];

if(valueText.includes(':')){
const colonIdx=findColon(valueText);
if(colonIdx>=0){
const key=valueText.substring(0,colonIdx).trim();
const val=valueText.substring(colonIdx+1).trim();
const obj={};

const anchorMatch=key.match(/^&(\w+)$/);
if(anchorMatch){
const anchorName=anchorMatch[1];
}

if(val===''){
let j=start+1;
let childIndent=indent+2;
let childLines=[];
while(j<lines.length){
const cl=lines[j];
if(cl.trim()===''){j++;continue}
const ci=getIndent(cl);
const ct=cl.trim();
if(ci<indent)break;
if(ci===indent&&ct.startsWith('- '))break;
if(ci>=indent+1){
childLines.push(cl);
j++;
}else{break}
}
if(childLines.length>0){
const firstLine=childLines[0].trim();
const isSeq=firstLine.startsWith('- ');
const childMode=isSeq?'seq':'map';
const childResult=parseBlock(lines,start+1,childIndent,childMode);
return{value:{key:key,value:childResult.value,anchors:{}},nextIndex:childResult.nextIndex};
}else{
return{value:{key:key,value:null,anchors:{}},nextIndex:j};
}
}else{
obj[key]=parseScalar(val);
return{value:{key:key,value:obj[key],anchors:{}},nextIndex:start+1};
}
}else{
const {obj,nextIndex}=parseListItem(lines,start,indent,valueText,anchorMap);
return{value:obj.value,nextIndex:nextIndex};
}
}

let j=start+1;
let childIndent=indent+2;
let childLines=[];
while(j<lines.length){
const cl=lines[j];
if(cl.trim()===''){j++;continue}
const ci=getIndent(cl);
const ct=cl.trim();
if(ci<indent)break;
if(ci===indent&&ct.startsWith('- '))break;
if(ci>=indent+1){
childLines.push(cl);
j++;
}else{break}
}
if(childLines.length>0){
const firstLine=childLines[0].trim();
const isSeq=firstLine.startsWith('- ');
const childMode=isSeq?'seq':'map';
const childResult=parseBlock(lines,start+1,childIndent,childMode);
return{value:{key:null,value:childResult.value,anchors:{}},nextIndex:childResult.nextIndex};
}
return{value:{key:null,value:parseScalar(valueText),anchors:{}},nextIndex:start+1};
}

function getIndent(line){
let count=0;
for(let i=0;i<line.length;i++){
if(line[i]===' ')count++;
else if(line[i]==='\t')count+=2;
else break;
}
return count;
}

function findColon(str){
let inString=false;
let stringChar='';
for(let i=0;i<str.length;i++){
const c=str[i];
if(inString){
if(c==='\\'){i++;continue}
if(c===stringChar)inString=false;
}else{
if(c==='"'||c==="'"){inString=true;stringChar=c;}
else if(c===':')return i;
}
}
return-1;
}

function parseScalar(value){
if(value==='')return null;
if(value==='null'||value==='~')return null;
if(value==='true'||value==='True')return true;
if(value==='false'||value==='False')return false;

const num=Number(value);
if(!isNaN(num)&&value!=='')return num;

if((value.startsWith('"')&&value.endsWith('"'))||(value.startsWith("'")&&value.endsWith("'"))){
return value.substring(1,value.length-1);
}

if(value.startsWith('|')||value.startsWith('>')){
return value;
}

if(value.startsWith('*')){
return value;
}

if(value.startsWith('<<')){
return value;
}

return value;
}

// JSON to YAML
function jsonToYaml(obj,indent){
indent=indent||0;
const lines=[];
const prefix='  '.repeat(indent);

if(obj===null)return'null';
if(obj===undefined)return'';

if(typeof obj==='boolean')return obj?'true':'false';
if(typeof obj==='number')return String(obj);
if(typeof obj==='string'){
if(obj==='')return'""';
if(/^[a-zA-Z_$][a-zA-Z0-9_$]*$/.test(obj)&&!obj.match(/^(true|false|null|True|False|Null|~)$/))return obj;
return'"'+obj.replace(/\\/g,'\\\\').replace(/"/g,'\\"')+'"';
}

if(Array.isArray(obj)){
if(obj.length===0)return'[]';
obj.forEach(item=>{
if(item!==null&&typeof item==='object'&&!Array.isArray(item)){
const keys=Object.keys(item);
if(keys.length>0){
lines.push(prefix+'- '+keys[0]+': '+formatYamlValue(item[keys[0]]));
for(let i=1;i<keys.length;i++){
lines.push(prefix+'  '+keys[i]+': '+formatYamlValue(item[keys[i]]));
}
}else{
lines.push(prefix+'- {}');
}
}else{
lines.push(prefix+'- '+formatYamlValue(item));
}
});
return lines.join('\n');
}

if(typeof obj==='object'){
const keys=Object.keys(obj);
if(keys.length===0)return'{}';
keys.forEach(key=>{
const val=obj[key];
if(val!==null&&typeof val==='object'&&!Array.isArray(val)){
lines.push(prefix+key+':');
lines.push(jsonToYaml(val,indent+1));
}else if(Array.isArray(val)){
lines.push(prefix+key+':');
lines.push(jsonToYaml(val,indent+1));
}else{
lines.push(prefix+key+': '+formatYamlValue(val));
}
});
return lines.join('\n');
}

return String(obj);
}

function formatYamlValue(val){
if(val===null)return'null';
if(val===undefined)return'';
if(typeof val==='boolean')return val?'true':'false';
if(typeof val==='number')return String(val);
if(typeof val==='string'){
if(val==='')return'""';
if(/^[a-zA-Z_$][a-zA-Z0-9_$]*$/.test(val)&&!val.match(/^(true|false|null|True|False|Null|~)$/))return val;
return'"'+val.replace(/\\/g,'\\\\').replace(/"/g,'\\"')+'"';
}
return String(val);
}
</script>
</body>
</html>
