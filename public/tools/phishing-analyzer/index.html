<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Phishing Analyzer | Zion Tech Group</title>
  <meta name="description" content="Free phishing email analyzer by Zion Tech Group. Detect suspicious links, sender spoofing, and social engineering patterns instantly.">
  <meta name="theme-color" content="#0b1221">
  <link rel="canonical" href="https://ziontechgroup.com/tools/phishing-analyzer/">
  <link rel="icon" href="/favicon.ico">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI Emoji, sans-serif; background: linear-gradient(180deg, #0b0f1a, #0b1221); color: #e5e7eb; }
    .container { max-width: 800px; margin: 0 auto; padding: 64px 24px; }
    h1 { font-size: 2.25rem; margin: 0 0 16px; }
    p { color: #9ca3af; line-height: 1.6; }
    .box { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 20px; margin-top: 24px; }
    textarea { width: 100%; min-height: 160px; background: rgba(0,0,0,0.3); color: #e5e7eb; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 12px; font-family: inherit; }
    button { margin-top: 12px; background: #2563eb; color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    button:hover { background: #1d4ed8; }
    .result { margin-top: 16px; color: #9ca3af; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Phishing Analyzer</h1>
    <p>Paste an email or message below to check for phishing indicators: suspicious links, spoofed sender domains, urgency tactics, and malicious attachments.</p>
    <div class="box">
      <textarea id="input" placeholder="Paste email content here..."></textarea>
      <button onclick="analyze()">Analyze</button>
      <div class="result" id="result"></div>
    </div>
  </div>
  <script>
    function analyze() {
      const text = document.getElementById('input').value || '';
      const result = document.getElementById('result');
      if (!text.trim()) { result.innerHTML = 'Please paste content to analyze.'; return; }
      const signals = [];
      if (/urgent|immediate|verify your account/i.test(text)) signals.push('Urgency or account-verification language detected.');
      if (/https?:\/\//i.test(text)) signals.push('Contains a link — hover to inspect the real URL before clicking.');
      if (/password|ssn|social security/i.test(text)) signals.push('Mentions sensitive credentials or identifiers.');
      result.innerHTML = signals.length
        ? '<strong>Potential signals:</strong><ul>' + signals.map(s => '<li>' + s + '</li>').join('') + '</ul>'
        : 'No obvious phishing signals detected in this short sample.';
    }
  </script>
</body>
</html>
