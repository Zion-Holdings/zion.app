body{font-family:system-ui,-apple-system,sans-serif;background:#0b1220;color:#e6f0ff;min-height:100vh;line-height:1.65}

.section{margin:24px 0}

.item{padding:10px 0;border-bottom:1px solid rgba(124,58,237,0.1);display:flex;align-items:flex-start;gap:12px}
.item input[type="checkbox"]{margin-top:4px;width:18px;height:18px;accent-color:#7c3aed}
.item label{font-size:0.95rem;color:#cbd5e1}
.item label strong{color:#fff}
.cta{display:inline-block;margin-top:24px;padding:12px 24px;background:linear-gradient(135deg,#7c3aed,#db2777);color:#fff;text-decoration:none;border-radius:8px;font-weight:600}

<body>
<div class="container">
<h1>Due Diligence TI 2026</h1>
<p class="subtitle">Checklist estratégico para avaliar tecnologia, IA e cibersegurança em M&A.</p>

<div class="section">
<h2>Infraestrutura & Cloud</h2>
<div class="item"><input type="checkbox" id="a1"><label for="a1"><strong>Arquitetura de cloud</strong> — AWS, Azure, GCP? Custos mensais? Contratos atuais?</label></div>
<div class="item"><input type="checkbox" id="a2"><label for="a2"><strong>Uptime & SLA</strong> — Qual o uptime garantido? Penalidades por downtime?</label></div>
<div class="item"><input type="checkbox" id="a3"><label for="a3"><strong>Recuperação de desastres</strong> — Backup automatizado? RTO/RPO definidos?</label></div>
<div class="item"><input type="checkbox" id="a4"><label for="a4"><strong>Escalabilidade</strong> — A infraestrutura suporta crescimento de 10x?</label></div>
</div>

<div class="section">
<h2>Cibersegurança</h2>
<div class="item"><input type="checkbox" id="b1"><label for="b1"><strong>Políticas de segurança</strong> — Existe política documentada? Última atualização?</label></div>
<div class="item"><input type="checkbox" id="b2"><label for="b2"><strong>Penetração testing</strong> — Último teste realizado? Vulnerabilidades críticas?</label></div>
<div class="item"><input type="checkbox" id="b3"><label for="b3"><strong>LGPD/GDPR</strong> — Conformidade? DPO designado? Incidentes reportados?</label></div>
<div class="item"><input type="checkbox" id="b4"><label for="b4"><strong>Acesso & IAM</strong> — MFA em todos os sistemas? Revisão trimestral de acessos?</label></div>
</div>

<div class="section">
<h2>Inteligência Artificial</h2>
<div class="item"><input type="checkbox" id="c1"><label for="c1"><strong>Modelos em produção</strong> — Quais IAs estão rodando? Custos de inferência?</label></div>
<div class="item"><input type="checkbox" id="c2"><label for="c2"><strong>Viés & Ética</strong> — Testes de viés realizados? Comitê de ética?</label></div>
<div class="item"><input type="checkbox" id="c3"><label for="c3"><strong>Dados de treinamento</strong> — Licenças adequadas? Dados proprietários ou de terceiros?</label></div>
<div class="item"><input type="checkbox" id="c4"><label for="c4"><strong>Dependência de vendors</strong> — Lock-in com OpenAI, Anthropic, etc?</label></div>
</div>

<div class="section">
<h2>Equipe & Processos</h2>
<div class="item"><input type="checkbox" id="d1"><label for="d1"><strong>Headcount tech</strong> — Quantos desenvolvedores? Turnover? Salários competitivos?</label></div>
<div class="item"><input type="checkbox" id="d2"><label for="d2"><strong>Documentação</strong> — Arquitetura documentada? Runbooks atualizados?</label></div>
<div class="item"><input type="checkbox" id="d3"><label for="d3"><strong>Dependência chave</strong> — Existe "herói" sem backup? Concentração de conhecimento?</label></div>
</div>
