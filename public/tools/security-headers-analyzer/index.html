<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTTP Security Headers Analyzer | Zion Tech Group</title>
  <meta name="description" content="Analyze HTTP response headers for security best practices and get a security grade.">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white">
  <div class="max-w-5xl mx-auto px-4 py-10">
    <h1 class="text-3xl font-bold mb-2">HTTP Security Headers Analyzer</h1>
    <p class="text-slate-300 mb-6">Paste HTTP response headers and get a security grade with per-check findings.</p>
    <div class="grid gap-6 md:grid-cols-2">
      <div>
        <label class="block text-sm font-semibold mb-2">HTTP Headers</label>
        <textarea id="headersInput" class="w-full h-72 rounded-xl border border-slate-800 bg-slate-900/60 p-4 text-sm font-mono" placeholder="HTTP/1.1 200 OK&#10;Content-Type: text/html&#10;X-Frame-Options: DENY&#10;Strict-Transport-Security: max-age=31536000"></textarea>
        <div class="mt-3 flex gap-3">
          <button id="analyzeBtn" class="rounded-xl bg-indigo-500 px-4 py-2 text-sm font-semibold hover:bg-indigo-400">Analyze</button>
          <button id="sampleBtn" class="rounded-xl bg-slate-800 px-4 py-2 text-sm font-semibold hover:bg-slate-700">Load Sample</button>
        </div>
      </div>
      <div>
        <label class="block text-sm font-semibold mb-2">Analysis</label>
        <div id="grade" class="text-4xl font-bold mb-2">—</div>
        <pre id="result" class="w-full h-72 overflow-auto rounded-xl border border-slate-800 bg-slate-900/60 p-4 text-xs font-mono text-slate-200">—</pre>
      </div>
    </div>
    <div class="mt-8 rounded-2xl border border-slate-800 bg-slate-900/60 p-6">
      <h2 class="text-xl font-bold mb-2">Need a security governance partner?</h2>
      <p class="text-slate-300 mb-4">Talk to Zion Tech Group about cybersecurity and governance services.</p>
      <a href="/services/cybersecurity-governance//" class="inline-block rounded-xl bg-indigo-500 px-5 py-3 text-sm font-semibold hover:bg-indigo-400">Explore Cybersecurity & Governance</a>
    </div>
  </div>
  <script>
    'use strict';
    const headersInput = document.getElementById('headersInput');
    const resultEl = document.getElementById('result');
    const gradeEl = document.getElementById('grade');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const sampleBtn = document.getElementById('sampleBtn');

    const checks = [
      { header: 'strict-transport-security', label: 'HSTS', weight: 1 },
      { header: 'content-security-policy', label: 'CSP', weight: 1 },
      { header: 'x-frame-options', label: 'X-Frame-Options', weight: 1 },
      { header: 'x-content-type-options', label: 'X-Content-Type-Options', weight: 1 },
      { header: 'referrer-policy', label: 'Referrer-Policy', weight: 0.5 },
      { header: 'permissions-policy', label: 'Permissions-Policy', weight: 0.5 },
      { header: 'x-xss-protection', label: 'X-XSS-Protection', weight: 0.5 },
    ];

    function analyze(text) {
      const lower = text.toLowerCase();
      const findings = [];
      let score = 0;
      let max = 0;
      checks.forEach(check => {
        max += check.weight;
        if (lower.includes(check.header)) {
          score += check.weight;
          findings.push(`✅ ${check.label}: present`);
        } else {
          findings.push(`❌ ${check.label}: missing`);
        }
      });
      const pct = max ? score / max : 0;
      const grade = pct >= 0.85 ? 'A' : pct >= 0.7 ? 'B' : pct >= 0.5 ? 'C' : pct >= 0.3 ? 'D' : 'F';
      gradeEl.textContent = `Grade: ${grade}`;
      gradeEl.className = `text-4xl font-bold mb-2 ${pct >= 0.7 ? 'text-emerald-400' : pct >= 0.4 ? 'text-yellow-400' : 'text-red-400'}`;
      resultEl.textContent = findings.join('\n');
    }

    analyzeBtn.addEventListener('click', () => analyze(headersInput.value));
    sampleBtn.addEventListener('click', () => {
      headersInput.value = `HTTP/1.1 200 OK
Content-Type: text/html
X-Frame-Options: DENY
Strict-Transport-Security: max-age=31536000
Content-Security-Policy: default-src 'self'
X-Content-Type-Options: nosniff
Referrer-Policy: strict-origin-when-cross-origin`;
      analyze(headersInput.value);
    });
  </script>
</body>
</html>
