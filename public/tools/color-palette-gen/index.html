<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Palette Generator | Zion Tech Group</title>
  <meta name="description" content="Generate beautiful color palettes — random generation, export as CSS/JSON, lock colors.">
  <meta property="og:title" content="Color Palette Generator | Zion Tech Group">
  <meta property="og:description" content="Free online color palette generator.">
  <meta property="og:url" content="https://ziontechgroup.com/tools/color-palette-gen/">
  <link rel="canonical" href="https://ziontechgroup.com/tools/color-palette-gen/">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b0f1a; color: #e5e7eb; min-height: 100vh; }
    .container { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    .subtitle { color: #94a3b8; margin-bottom: 2rem; }
    .section { background: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; padding: 1.5rem; margin-bottom: 1rem; }
    .section h3 { font-size: 1rem; margin-bottom: 0.75rem; color: #818cf8; }
    .palette { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.5rem; margin-bottom: 1rem; }
    .swatch { height: 80px; border-radius: 0.5rem; cursor: pointer; border: 2px solid transparent; position: relative; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 0.5rem; font-size: 0.75rem; font-family: monospace; }
    .swatch:hover { border-color: #6366f1; }
    .swatch .lock { position: absolute; top: 4px; right: 4px; font-size: 0.875rem; }
    .buttons { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .btn { padding: 0.5rem 1rem; background: #6366f1; color: #fff; border: none; border-radius: 0.5rem; cursor: pointer; font-size: 0.875rem; }
    .btn:hover { background: #4f46e5; }
    .btn.success { background: #059669; }
    .btn.success:hover { background: #047857; }
    .btn.secondary { background: #374151; }
    .btn.secondary:hover { background: #4b5563; }
    .back { display: inline-block; margin-top: 1.5rem; color: #818cf8; text-decoration: none; }
    .back:hover { text-decoration: underline; }
  </style>
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Color Palette Generator | Zion Tech Group">
<meta name="twitter:description" content="Generate beautiful color palettes — random generation, export as CSS/JSON, lock colors.">
<meta name="twitter:site" content="@ziontechgroup">
<meta name="twitter:image" content="https://ziontechgroup.com/images/og-default.png">
</head>
<body>
  <div class="container">
    <h1>Color Palette Generator</h1>
    <p class="subtitle">Generate beautiful color palettes.</p>
    <div class="section">
      <h3>Palette</h3>
      <div class="palette" id="palette"></div>
      <div class="buttons">
        <button class="btn" onclick="generate()">Generate</button>
        <button class="btn success" onclick="copyCSS()">Copy CSS</button>
        <button class="btn secondary" onclick="copyJSON()">Copy JSON</button>
      </div>
    </div>
    <a href="/tools/" class="back">← Back to Tools</a>
  </div>
  <script>
    let palette = [];
    function randomColor() {
      return '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
    }
    function generate() {
      palette = [];
      for (let i = 0; i < 5; i++) {
        palette.push({ color: randomColor(), locked: false });
      }
      render();
    }
    function render() {
      const container = document.getElementById('palette');
      container.innerHTML = '';
      palette.forEach((swatch, i) => {
        const div = document.createElement('div');
        div.className = 'swatch';
        div.style.background = swatch.color;
        div.style.color = isLight(swatch.color) ? '#000' : '#fff';
        div.innerHTML = `<span class="lock">${swatch.lock ? '🔒' : '🔓'}</span><span>${swatch.color}</span>`;
        div.onclick = () => {
          if (swatch.lock) {
            swatch.lock = false;
          } else {
            swatch.lock = true;
          }
          render();
        };
        div.ondblclick = () => {
          const newColor = randomColor();
          swatch.color = newColor;
          render();
        };
        container.appendChild(div);
      });
    }
    function isLight(hex) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return (r * 299 + g * 587 + b * 114) / 1000 > 128;
    }
    function copyCSS() {
      const css = ':root {\n' + palette.map((s, i) => `  --color-${i + 1}: ${s.color};`).join('\n') + '\n}';
      navigator.clipboard.writeText(css);
    }
    function copyJSON() {
      const json = JSON.stringify(palette.reduce((acc, s, i) => { acc[`color${i + 1}`] = s.color; return acc; }, {}), null, 2);
      navigator.clipboard.writeText(json);
    }
    generate();
  </script>
</body>
</html>
