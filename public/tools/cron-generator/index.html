<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cron Expression Generator | Zion Tech Group</title>
  <meta name="description" content="Generate cron expressions online — select minutes, hours, days, months, weekdays.">
  <meta property="og:title" content="Cron Expression Generator | Zion Tech Group">
  <meta property="og:description" content="Free online cron expression generator.">
  <meta property="og:url" content="https://ziontechgroup.com/tools/cron-generator/">
  <link rel="canonical" href="https://ziontechgroup.com/tools/cron-generator/">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b0f1a; color: #e5e7eb; min-height: 100vh; }
    .container { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    .subtitle { color: #94a3b8; margin-bottom: 2rem; }
    .section { background: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; padding: 1.5rem; margin-bottom: 1rem; }
    .section h3 { font-size: 1rem; margin-bottom: 0.75rem; color: #818cf8; }
    .section pre { background: #0f172a; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; font-size: 0.875rem; line-height: 1.5; white-space: pre-wrap; word-break: break-all; }
    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 0.875rem; color: #94a3b8; margin-bottom: 0.5rem; }
    .field input, .field select { width: 100%; padding: 0.75rem; background: #0f172a; border: 1px solid #334155; border-radius: 0.5rem; color: #fff; }
    .field input:focus, .field select:focus { outline: none; border-color: #6366f1; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; }
    .buttons { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .btn { padding: 0.5rem 1rem; background: #6366f1; color: #fff; border: none; border-radius: 0.5rem; cursor: pointer; font-size: 0.875rem; }
    .btn:hover { background: #4f46e5; }
    .btn.success { background: #059669; }
    .btn.success:hover { background: #047857; }
    .back { display: inline-block; margin-top: 1.5rem; color: #818cf8; text-decoration: none; }
    .back:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Cron Expression Generator</h1>
    <p class="subtitle">Generate cron expressions for any schedule.</p>
    <div class="section">
      <h3>Schedule</h3>
      <div class="grid">
        <div class="field">
          <label>Minute (0-59)</label>
          <input type="text" id="minute" value="0" oninput="generate()">
        </div>
        <div class="field">
          <label>Hour (0-23)</label>
          <input type="text" id="hour" value="0" oninput="generate()">
        </div>
        <div class="field">
          <label>Day of Month (1-31)</label>
          <input type="text" id="day" value="*" oninput="generate()">
        </div>
        <div class="field">
          <label>Month (1-12)</label>
          <input type="text" id="month" value="*" oninput="generate()">
        </div>
        <div class="field">
          <label>Day of Week (0-7)</label>
          <input type="text" id="weekday" value="*" oninput="generate()">
        </div>
      </div>
      <div class="buttons">
        <button class="btn success" onclick="copy()">Copy Expression</button>
        <button class="btn" onclick="preset('hourly')">Hourly</button>
        <button class="btn" onclick="preset('daily')">Daily</button>
        <button class="btn" onclick="preset('weekly')">Weekly</button>
        <button class="btn" onclick="preset('monthly')">Monthly</button>
      </div>
    </div>
    <div class="section">
      <h3>Generated Expression</h3>
      <pre id="output">0 0 * * *</pre>
    </div>
    <div class="section">
      <h3>Next 5 Execution Times</h3>
      <pre id="nextTimes">—</pre>
    </div>
    <a href="/tools/" class="back">← Back to Tools</a>
  </div>
  <script>
    function generate() {
      const minute = document.getElementById('minute').value || '*';
      const hour = document.getElementById('hour').value || '*';
      const day = document.getElementById('day').value || '*';
      const month = document.getElementById('month').value || '*';
      const weekday = document.getElementById('weekday').value || '*';
      const expr = `${minute} ${hour} ${day} ${month} ${weekday}`;
      document.getElementById('output').textContent = expr;
      preview(expr);
    }
    function preview(expr) {
      const parts = expr.split(' ');
      if (parts.length !== 5) return;
      let times = '';
      const now = new Date();
      for (let i = 0; i < 5; i++) {
        const d = new Date(now.getTime() + (i * 3600000));
        times += `${d.toISOString().split('T')[0]} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}\n`;
      }
      document.getElementById('nextTimes').textContent = times;
    }
    function copy() {
      const expr = document.getElementById('output').textContent;
      navigator.clipboard.writeText(expr);
    }
    function preset(type) {
      switch(type) {
        case 'hourly': document.getElementById('minute').value = '0'; document.getElementById('hour').value = '*'; document.getElementById('day').value = '*'; document.getElementById('month').value = '*'; document.getElementById('weekday').value = '*'; break;
        case 'daily': document.getElementById('minute').value = '0'; document.getElementById('hour').value = '0'; document.getElementById('day').value = '*'; document.getElementById('month').value = '*'; document.getElementById('weekday').value = '*'; break;
        case 'weekly': document.getElementById('minute').value = '0'; document.getElementById('hour').value = '0'; document.getElementById('day').value = '*'; document.getElementById('month').value = '*'; document.getElementById('weekday').value = '0'; break;
        case 'monthly': document.getElementById('minute').value = '0'; document.getElementById('hour').value = '0'; document.getElementById('day').value = '1'; document.getElementById('month').value = '*'; document.getElementById('weekday').value = '*'; break;
      }
      generate();
    }
    generate();
  </script>
</body>
</html>
