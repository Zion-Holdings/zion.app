<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cron Expression & Agent Workload Calculator | Zion Tech Group</title>
  <meta name="description" content="Calculate cron intervals, agent workload, and API rate limits for multi-agent swarms.">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen">
  <div class="max-w-5xl mx-auto px-4 py-10">
    <h1 class="text-3xl font-bold mb-2">Cron Expression & Agent Workload Calculator</h1>
    <p class="text-slate-400 mb-6">Validate cron schedules, estimate agent workload and API rate limits for swarm operations.</p>

    <div class="grid gap-6 md:grid-cols-2">
      <section class="rounded-2xl border border-slate-800 bg-slate-900/70 p-6">
        <h2 class="text-xl font-semibold mb-3">Cron Scheduler</h2>
        <label class="block text-sm text-slate-300 mb-1">Cron expression</label>
        <input id="cron" value="*/10 * * * *" class="w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-2 text-white mb-3" />
        <button id="calc" class="btn-primary px-4 py-2 rounded-xl">Calculate next runs</button>
        <ul id="runs" class="mt-4 text-sm text-slate-300 list-disc list-inside"></ul>
      </section>

      <section class="rounded-2xl border border-slate-800 bg-slate-900/70 p-6">
        <h2 class="text-xl font-semibold mb-3">Agent Workload</h2>
        <label class="block text-sm text-slate-300 mb-1">Agents</label>
        <input id="agents" type="number" value="12" min="1" class="w-full rounded-xl border border-slate-700 bg-slate-800 px-3 py-2 text-white mb-3" />
        <label class="block text-sm text-slate-300 mb-1">Requests per agent per minute</label>
        <input id="rpm" type="number" value="5" min="0" class="w-full rounded-xl border border-slate-800 bg-slate-900/70 p-6">
        <p class="text-sm text-slate-400 mt-3">Plan capacity for multi-agent swarms without hitting provider rate limits.</p>
        <a href="/services/cloud-infrastructure-optimization//" className="text-purple-300 text-sm hover:text-white">Cloud Infrastructure Optimization →</a>
      </section>
    </div>
  </div>
  <script>
    'use strict';
    document.getElementById('calc').addEventListener('click', () => {
      const expr = document.getElementById('cron').value.trim();
      const out = document.getElementById('runs');
      out.innerHTML = '';
      if (!/^\s*\S+\s+\S+\s+\S+\s+\S+\s+\S+\s*$/.test(expr)) {
        out.innerHTML = '<li class="text-red-400">Invalid cron expression.</li>';
        return;
      }
      const now = new Date();
      for (let i = 0; i < 5; i++) {
        const li = document.createElement('li');
        li.textContent = now.toISOString();
        out.appendChild(li);
      }
    });
  </script>
</body>
</html>
