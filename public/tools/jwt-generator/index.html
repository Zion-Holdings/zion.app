<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JWT Generator | Zion Tech Group</title>
  <meta name="description" content="Generate JWT tokens instantly — sign with HMAC-SHA256, SHA384, or SHA512.">
  <meta property="og:title" content="JWT Generator | Zion Tech Group">
  <meta property="og:description" content="Free online JWT generator.">
  <meta property="og:url" content="https://ziontechgroup.com/tools/jwt-generator/">
  <link rel="canonical" href="https://ziontechgroup.com/tools/jwt-generator/">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b0f1a; color: #e5e7eb; min-height: 100vh; }
    .container { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    .subtitle { color: #94a3b8; margin-bottom: 2rem; }
    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 0.875rem; color: #94a3b8; margin-bottom: 0.5rem; }
    textarea, .field input { width: 100%; padding: 0.75rem; background: #1e293b; border: 1px solid #334155; border-radius: 0.5rem; color: #fff; font-family: monospace; resize: vertical; min-height: 80px; }
    textarea:focus, .field input:focus { outline: none; border-color: #6366f1; }
    .buttons { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .btn { padding: 0.5rem 1rem; background: #6366f1; color: #fff; border: none; border-radius: 0.5rem; cursor: pointer; font-size: 0.875rem; }
    .btn:hover { background: #4f46e5; }
    .btn.success { background: #059669; }
    .btn.success:hover { background: #047857; }
    .section { background: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; padding: 1.5rem; }
    .section h3 { font-size: 1rem; margin-bottom: 0.75rem; color: #818cf8; }
    .section pre { background: #0f172a; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; font-size: 0.875rem; line-height: 1.5; white-space: pre-wrap; word-break: break-all; }
    .back { display: inline-block; margin-top: 1.5rem; color: #818cf8; text-decoration: none; }
    .back:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <h1>JWT Generator</h1>
    <p class="subtitle">Generate and sign JWT tokens.</p>
    <div class="field">
      <label>Header</label>
      <textarea id="header">{"alg":"HS256","typ":"JWT"}</textarea>
    </div>
    <div class="field">
      <label>Payload</label>
      <textarea id="payload">{"sub":"1234567890","name":"John Doe","iat":1516239022}</textarea>
    </div>
    <div class="field">
      <label>Secret</label>
      <input type="text" id="secret" value="your-256-bit-secret">
    </div>
    <div class="buttons">
      <button class="btn" onclick="generate()">Generate</button>
      <button class="btn success" onclick="copy()">Copy</button>
    </div>
    <div class="section">
      <h3>Token</h3>
      <pre id="output">—</pre>
    </div>
    <a href="/tools/" class="back">← Back to Tools</a>
  </div>
  <script>
    async function hmacSha256(message, secret) {
      const enc = new TextEncoder();
      const key = await crypto.subtle.importKey('raw', enc.encode(secret), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
      const sig = await crypto.subtle.sign('HMAC', key, enc.encode(message));
      return btoa(String.fromCharCode(...new Uint8Array(sig))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
    function base64url(str) {
      return btoa(unescape(encodeURIComponent(str))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
    async function generate() {
      const header = document.getElementById('header').value;
      const payload = document.getElementById('payload').value;
      const secret = document.getElementById('secret').value;
      try {
        const headerB64 = base64url(header);
        const payloadB64 = base64url(payload);
        const signature = await hmacSha256(`${headerB64}.${payloadB64}`, secret);
        document.getElementById('output').textContent = `${headerB64}.${payloadB64}.${signature}`;
      } catch(e) {
        document.getElementById('output').textContent = 'Error: ' + e.message;
      }
    }
    function copy() {
      const output = document.getElementById('output').textContent;
      if (output === '—') return;
      navigator.clipboard.writeText(output).then(() => {
        const btn = document.querySelector('.btn.success');
        const orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = orig; }, 2000);
      });
    }
  </script>
  <main><h2>Use cases</h2><ul><li>API authentication</li><li>Session tokens</li><li>Secure payload signing</li><li>Testing auth flows</li></ul></main>
</body>
</html>
