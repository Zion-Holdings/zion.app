<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSON to CSV | Zion Tech Group</title><meta name="description" content="Free JSON to CSV converter tool by Zion Tech Group."></head><body><h1>JSON to CSV</h1><p>Convert JSON arrays to CSV instantly.</p><textarea id="json" rows="10" placeholder='[{"a":1,"b":2}]'></textarea><button onclick="convert()">Convert</button><pre id="out"></pre><script>function convert(){const t=document.getElementById('json').value;try{const j=JSON.parse(t);const keys=Array.from(new Set(j.flatMap(Object.keys)));let csv=keys.join(',')+'\n';for(const row of j){const values=keys.map(k=>{const v=row[k];return v===undefined||v===null?'':String(v).replace(/"/g,'""');});csv+='"'+values.join('","')+'"\n';}document.getElementById('out').textContent=csv;}catch(e){document.getElementById('out').textContent='Error: '+e.message;}}</script></body></html>
