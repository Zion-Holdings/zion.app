<body>
  <div class="container">
    <h1>JSON to CSV Converter</h1>
    <p class="subtitle">Convert JSON arrays to CSV format instantly.</p>
    
    <div class="field">
      <label>JSON Input</label>
      <textarea id="jsonInput" placeholder="Paste your JSON array here...">[
  {
    "name": "Zion Tech Group",
    "industry": "AI",
    "founded": 2024,
    "active": true
  },
  {
    "name": "Acme Corp",
    "industry": "Software",
    "founded": 2010,
    "active": false
  },
  {
    "name": "Globex Inc",
    "industry": "Cloud",
    "founded": 2018,
    "active": true
  }
]</textarea>
    </div>
    
    <div class="buttons">
      <button class="btn" onclick="convert()">Convert to CSV</button>
      <button class="btn success" onclick="copy()">Copy</button>
      <button class="btn secondary" onclick="download()">Download</button>
      <button class="btn secondary" onclick="clearAll()">Clear</button>
    </div>
    
    <div class="error" id="error"></div>
    <div class="success" id="success"></div>
    
    <div class="section">
      <h3>CSV Output</h3>
      <pre id="output">—</pre>
    </div>
    
    <div class="stats" id="stats"></div>
    
    <a href="/tools/" class="back">← Back to Tools</a>
  </div>

  <script>
    function convertToCSV(arr) {
      if (!arr || arr.length === 0) return '';
      
      // Collect all unique keys across all objects
      const allKeys = [];
      const keySet = new Set();
      for (const obj of arr) {
        if (obj && typeof obj === 'object') {
          for (const key of Object.keys(obj)) {
            if (!keySet.has(key)) {
              keySet.add(key);
              allKeys.push(key);
            }
          }
        }
      }
      
      // Escape CSV field
      function escapeField(value) {
        if (value === null || value === undefined) return '';
        const str = typeof value === 'object' ? JSON.stringify(value) : String(value);
        if (str.includes(',') || str.includes('"') || str.includes('\n') || str.includes('\r')) {
          return '"' + str.replace(/"/g, '""') + '"';
        }
        return str;
      }
      
      // Build CSV
      const header = allKeys.map(escapeField).join(',');
      const rows = arr.map(obj => {
        return allKeys.map(key => escapeField(obj[key])).join(',');
      });
      
      return [header, ...rows].join('\n');
    }
    
    function convert() {
      const input = document.getElementById('jsonInput').value;
      const errorEl = document.getElementById('error');
      const successEl = document.getElementById('success');
      const outputEl = document.getElementById('output');
      const statsEl = document.getElementById('stats');
      
      try {
        const parsed = JSON.parse(input);
        
        if (!Array.isArray(parsed)) {
          throw new Error('Input must be a JSON array (e.g. [{...}, {...}])');
        }
        
        if (parsed.length === 0) {
          throw new Error('JSON array is empty');
        }
        
        const csvStr = convertToCSV(parsed);
        outputEl.textContent = csvStr;
        errorEl.style.display = 'none';
        successEl.textContent = '✓ Conversion successful';
        successEl.style.display = 'block';
        
        // Stats
        const rows = parsed.length;
        const cols = new Set(parsed.flatMap(o => o ? Object.keys(o) : [])).size;
        const cells = rows * cols;
        const size = csvStr.length;
        statsEl.innerHTML = `
          <span>Rows: ${rows}</span>
          <span>Columns: ${cols}</span>
          <span>Cells: ${cells}</span>
          <span>Size: ${size.toLocaleString()} chars</span>
        `;
      } catch(e) {
        errorEl.textContent = '✗ ' + e.message;
        errorEl.style.display = 'block';
        successEl.style.display = 'none';
        statsEl.innerHTML = '';
      }
    }
    
    function copy() {
      const output = document.getElementById('output').textContent;
      if (output === '—') return;
      navigator.clipboard.writeText(output).then(() => {
        const btn = document.querySelector('.btn.success');
        const original = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = original; }, 2000);
      });
    }
    
    function download() {
      const output = document.getElementById('output').textContent;
      if (output === '—') return;
      const blob = new Blob([output], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'output.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
    
    function clearAll() {
      document.getElementById('jsonInput').value = '';
      document.getElementById('output').textContent = '—';
      document.getElementById('error').style.display = 'none';
      document.getElementById('success').style.display = 'none';
      document.getElementById('stats').innerHTML = '';
    }
    
    // Auto-convert on load with sample data
    convert();
  </script>
</body>
</html>
