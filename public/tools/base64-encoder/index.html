<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base64 Encoder/Decoder | Zion Tech Group</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0f1a;color:#e5e7eb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem}
.container{max-width:720px;width:100%}
h1{font-size:1.75rem;font-weight:700;margin-bottom:.25rem}
.subtitle{color:#9ca3af;font-size:.9rem;margin-bottom:1.5rem}
.card{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:1.5rem;margin-bottom:1rem}
label{display:block;font-size:.85rem;color:#9ca3af;margin-bottom:.5rem;font-weight:600}
textarea{width:100%;background:#0b0f1a;border:1px solid #374151;border-radius:8px;color:#e5e7eb;padding:.75rem;font-size:.9rem;font-family:'Fira Code',monospace;resize:vertical;min-height:120px}
textarea:focus{outline:none;border-color:#6366f1}
.file-upload{border:2px dashed #374151;border-radius:8px;padding:1.5rem;text-align:center;cursor:pointer;transition:.2s}
.file-upload:hover{border-color:#6366f1;background:rgba(99,102,211,.05)}
.file-upload input{display:none}
.file-upload p{color:#9ca3af;font-size:.85rem}
.file-upload .file-name{color:#6366f1;font-weight:600;margin-top:.5rem}
.btn-group{display:flex;gap:.5rem;margin-top:1rem;flex-wrap:wrap}
.btn{padding:.6rem 1.25rem;border:none;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;transition:.2s}
.btn-primary{background:#6366f1;color:#fff}
.btn-primary:hover{background:#4f46e5}
.btn-secondary{background:#1f2937;color:#e5e7eb}
.btn-secondary:hover{background:#374151}
.btn-copy{background:#10b981;color:#fff}
.btn-copy:hover{background:#059669}
.stats{display:flex;gap:1rem;margin-top:1rem;flex-wrap:wrap}
.stat{background:#0b0f1a;border:1px solid #374151;border-radius:8px;padding:.5rem 1rem;flex:1;min-width:140px}
.stat-label{font-size:.75rem;color:#9ca3af;text-transform:uppercase;letter-spacing:.05em}
.stat-value{font-size:1rem;font-weight:700;color:#6366f1;font-family:'Fira Code',monospace}
.output-section{margin-top:1rem}
.output-box{background:#0b0f1a;border:1px solid #374151;border-radius:8px;padding:.75rem;font-size:.85rem;font-family:'Fira Code',monospace;word-break:break-all;max-height:200px;overflow-y:auto;white-space:pre-wrap;color:#e5e7eb}
.cta-section{margin-top:1.5rem;text-align:center;padding:1.5rem;background:linear-gradient(135deg,rgba(99,102,211,.1),rgba(16,185,129,.1));border:1px solid #374151;border-radius:12px}
.cta-section h2{font-size:1.1rem;margin-bottom:.5rem}
.cta-section p{color:#9ca3af;font-size:.85rem;margin-bottom:1rem}
.cta-links{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap}
.cta-links a{padding:.6rem 1.25rem;border-radius:8px;text-decoration:none;font-weight:600;font-size:.9rem;transition:.2s}
.cta-services{background:#6366f1;color:#fff}
.cta-services:hover{background:#4f46e5}
.cta-calendly{background:#10b981;color:#fff}
.cta-calendly:hover{background:#059669}
.error{color:#ef4444;font-size:.85rem;margin-top:.5rem}
.success{color:#10b981;font-size:.85rem;margin-top:.5rem}
</style>
</head>
<body>
<div class="container">
<h1>Base64 Encoder / Decoder</h1>
<p class="subtitle">Codifique e decodifique texto ou arquivos em Base64 — 100% no seu navegador.</p>

<div class="card">
<label for="input-text">Entrada de Texto</label>
<textarea id="input-text" placeholder="Digite ou cole o texto aqui..."></textarea>

<p style="text-align:center;color:#6b7280;margin:.75rem 0">— ou —</p>

<label class="file-upload" id="drop-zone">
<input type="file" id="file-input">
<p id="file-label">📎 Clique ou arraste um arquivo aqui</p>
<p class="file-name" id="file-name"></p>
</label>

<div class="btn-group">
<button class="btn btn-primary" id="btn-encode">Codificar (Encode)</button>
<button class="btn btn-secondary" id="btn-decode">Decodificar (Decode)</button>
<button class="btn btn-secondary" id="btn-clear">Limpar</button>
</div>

<div id="msg"></div>
</div>

<div class="card output-section" id="output-card" style="display:none">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem">
<label style="margin:0">Resultado</label>
<button class="btn btn-copy" id="btn-copy">📋 Copiar</button>
</div>
<div class="output-box" id="output-box"></div>
<div class="stats">
<div class="stat"><div class="stat-label">Tamanho Original</div><div class="stat-value" id="stat-original">0 B</div></div>
<div class="stat"><div class="stat-label">Tamanho Codificado</div><div class="stat-value" id="stat-encoded">0 B</div></div>
<div class="stat"><div class="stat-label">Razão</div><div class="stat-value" id="stat-ratio">—</div></div>
</div>
</div>

<div class="cta-section">
<h2>Precisa de ajuda com automação?</h2>
<p>Nossa equipe pode integrar soluções sob medida para seu negócio.</p>
<div class="cta-links">
<a href="/services/" class="cta-services">Ver Serviços</a>
<a href="https://calendly.com/kleber-ziontechgroup" target="_blank" rel="noopener" class="cta-calendly">Agendar Reunião</a>
</div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const input=$('input-text');
const fileInput=$('file-input');
const fileLabel=$('file-label');
const fileName=$('file-name');
const outputCard=$('output-card');
const outputBox=$('output-box');
const msg=$('msg');
let currentFile=null;

fileInput.addEventListener('change',e=>{
const f=e.target.files[0];
if(f){currentFile=f;fileName.textContent=f.name+' ('+formatSize(f.size)+')';fileLabel.textContent='📎 Arquivo selecionado'}
});

$('drop-zone').addEventListener('dragover',e=>{e.preventDefault();$('drop-zone').style.borderColor='#6366f1'});
$('drop-zone').addEventListener('dragleave',()=>{$('drop-zone').style.borderColor='#374151'});
$('drop-zone').addEventListener('drop',e=>{
e.preventDefault();
$('drop-zone').style.borderColor='#374151';
const f=e.dataTransfer.files[0];
if(f){currentFile=f;fileInput.files=e.dataTransfer.files;fileName.textContent=f.name+' ('+formatSize(f.size)+')';fileLabel.textContent='📎 Arquivo selecionado'}
});

$('btn-encode').addEventListener('click',async()=>{
clearMsg();
const text=input.value;
if(text){encodeText(text);return}
if(currentFile){encodeFile(currentFile);return}
showError('Digite um texto ou selecione um arquivo.');
});

$('btn-decode').addEventListener('click',()=>{
clearMsg();
const text=input.value.trim();
if(!text){showError('Digite ou cole um texto Base64 para decodificar.');return}
try{
const decoded=decodeURIComponent(escape(atob(text)));
showOutput(decoded,text.length,decoded.length,false);
}catch(e){
try{
const decoded=atob(text);
showOutput(decoded,text.length,decoded.length,false);
}catch(e2){showError('Texto Base64 inválido. Verifique a entrada.')}
}
});

$('btn-clear').addEventListener('click',()=>{
input.value='';currentFile=null;fileInput.value='';fileName.textContent='';fileLabel.textContent='📎 Clique ou arraste um arquivo aqui';outputCard.style.display='none';clearMsg();
});

$('btn-copy').addEventListener('click',()=>{
navigator.clipboard.writeText(outputBox.textContent).then(()=>{
const btn=$('btn-copy');
btn.textContent='✅ Copiado!';
setTimeout(()=>btn.textContent='📋 Copiar',2000);
});
});

function encodeText(text){
const encoded=btoa(unescape(encodeURIComponent(text)));
showOutput(encoded,text.length,encoded.length,true);
}

function encodeFile(file){
const reader=new FileReader();
reader.onload=()=>{
const bytes=new Uint8Array(reader.result);
let binary='';
bytes.forEach(b=>binary+=String.fromCharCode(b));
const encoded=btoa(binary);
showOutput(encoded,file.size,encoded.length,true);
};
reader.readAsArrayBuffer(file);
}

function showOutput(result,origLen,encLen,isEncode){
outputBox.textContent=result;
$('stat-original').textContent=formatSize(origLen);
$('stat-encoded').textContent=formatSize(encLen);
const ratio=((encLen/origLen)*100).toFixed(1);
$('stat-ratio').textContent=isEncode?ratio+'%':ratio+'%';
outputCard.style.display='block';
}

function formatSize(bytes){
if(bytes<1024)return bytes+' B';
if(bytes<1048576)return(bytes/1024).toFixed(1)+' KB';
return(bytes/1048576).toFixed(1)+' MB';
}

function showError(t){msg.innerHTML='<div class="error">'+t+'</div>'}
function clearMsg(){msg.innerHTML=''}
</script>
</body>
</html>
