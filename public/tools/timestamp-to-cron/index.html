body>
  <div class="container">
    <h1>Timestamp to Cron Converter</h1>
    <p class="subtitle">Convert Unix timestamps to cron expressions.</p>
    <div class="field">
      <label>Unix Timestamp</label>
      <input type="text" id="timestamp" placeholder="e.g., 1704067200" value="1704067200">
    </div>
    <div class="buttons">
      <button class="btn" onclick="convert()">Convert</button>
      <button class="btn success" onclick="copy()">Copy Cron</button>
      <button class="btn" onclick="useNow()">Use Current Time</button>
    </div>
    <div class="section">
      <h3>Cron Expression</h3>
      <pre id="cronOutput">—</pre>
    </div>
    <div class="section">
      <h3>Next Occurrences</h3>
      <pre id="nextOutput">—</pre>
    </div>
    <a href="/tools/" class="back">← Back to Tools</a>
  </div>
  <script>
    function convert() {
      const ts = parseInt(document.getElementById('timestamp').value);
      if (isNaN(ts)) { document.getElementById('cronOutput').textContent = 'Invalid timestamp'; return; }
      const date = new Date(ts * 1000);
      const min = date.getMinutes();
      const hour = date.getHours();
      const day = date.getDate();
      const month = date.getMonth() + 1;
      const dow = date.getDay();
      const cron = `${min} ${hour} ${day} ${month} ${dow}`;
      document.getElementById('cronOutput').textContent = cron;
      // Next occurrences
      let next = '';
      for (let i = 1; i <= 5; i++) {
        const d = new Date((ts + i * 86400) * 1000);
        next += `${d.toISOString().split('T')[0]} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}\n`;
      }
      document.getElementById('nextOutput').textContent = next;
    }
    function copy() {
      const cron = document.getElementById('cronOutput').textContent;
      if (cron === '—') return;
      navigator.clipboard.writeText(cron).then(() => {
        const btn = document.querySelector('.btn.success');
        const orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = orig; }, 2000);
      });
    }
    function useNow() {
      document.getElementById('timestamp').value = Math.floor(Date.now() / 1000);
      convert();
    }
    convert();
  </script>
  <main><h2>Usage</h2><ul><li>Paste timestamp</li><li>Generate cron</li><li>Validate expression</li></ul></main>
