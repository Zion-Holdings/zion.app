<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Strength Checker | Zion Tech Group</title>
  <meta name="description" content="Check password strength online — analyze length, complexity, entropy, and crack time.">
  <meta property="og:title" content="Password Strength Checker | Zion Tech Group">
  <meta property="og:description" content="Free online password strength analyzer.">
  <meta property="og:url" content="https://ziontechgroup.com/tools/password-strength/">
  <link rel="canonical" href="https://ziontechgroup.com/tools/password-strength/">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b0f1a; color: #e5e7eb; min-height: 100vh; }
    .container { max-width: 700px; margin: 0 auto; padding: 2rem 1rem; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    .subtitle { color: #94a3b8; margin-bottom: 2rem; }
    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 0.875rem; color: #94a3b8; margin-bottom: 0.5rem; }
    .field input { width: 100%; padding: 0.75rem; background: #1e293b; border: 1px solid #334155; border-radius: 0.5rem; color: #fff; font-family: monospace; }
    .field input:focus { outline: none; border-color: #6366f1; }
    .strength-bar { height: 8px; background: #334155; border-radius: 4px; margin-bottom: 1rem; overflow: hidden; }
    .strength-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
    .section { background: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; padding: 1.5rem; margin-bottom: 1rem; }
    .section h3 { font-size: 1rem; margin-bottom: 0.75rem; color: #818cf8; }
    .stat { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #334155; }
    .stat:last-child { border-bottom: none; }
    .stat-label { color: #94a3b8; font-size: 0.875rem; }
    .stat-value { font-family: monospace; font-size: 0.875rem; }
    .back { display: inline-block; margin-top: 1.5rem; color: #818cf8; text-decoration: none; }
    .back:hover { text-decoration: underline; }
  </style>
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Password Strength Checker | Zion Tech Group">
<meta name="twitter:description" content="Check password strength online — analyze length, complexity, entropy, and crack time.">
<meta name="twitter:site" content="@ziontechgroup">
<meta name="twitter:image" content="https://ziontechgroup.com/images/og-default.png">
</head>
<body>
  <div class="container">
    <h1>Password Strength Checker</h1>
    <p class="subtitle">Analyze password strength, complexity, and crack time.</p>
    <div class="field">
      <label>Password</label>
      <input type="text" id="password" placeholder="Enter password..." oninput="analyze()">
    </div>
    <div class="strength-bar"><div class="strength-fill" id="strengthFill" style="width: 0%"></div></div>
    <div class="section">
      <h3>Analysis</h3>
      <div id="stats"></div>
    </div>
    <a href="/tools/" class="back">← Back to Tools</a>
  </div>
  <script>
    function analyze() {
      const pw = document.getElementById('password').value;
      const fill = document.getElementById('strengthFill');
      const stats = document.getElementById('stats');
      if (!pw) { fill.style.width = '0%'; stats.innerHTML = ''; return; }
      let score = 0;
      const len = pw.length;
      if (len >= 8) score++;
      if (len >= 12) score++;
      if (len >= 16) score++;
      if (/[a-z]/.test(pw)) score++;
      if (/[A-Z]/.test(pw)) score++;
      if (/[0-9]/.test(pw)) score++;
      if (/[^a-zA-Z0-9]/.test(pw)) score++;
      const pwned = len < 8 ? 'Very Common' : len < 12 ? 'Common' : len < 16 ? 'Rare' : 'Very Rare';
      const crackTime = len < 4 ? 'Instantly' : len < 8 ? 'Seconds' : len < 12 ? 'Hours' : len < 16 ? 'Years' : 'Centuries';
      const colors = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#10b981'];
      const labels = ['Very Weak', 'Weak', 'Fair', 'Strong', 'Very Strong'];
      const pct = Math.min(100, (score / 7) * 100);
      fill.style.width = pct + '%';
      fill.style.background = colors[Math.min(4, Math.floor(score / 1.5))];
      stats.innerHTML = `
        <div class="stat"><span class="stat-label">Strength</span><span class="stat-value" style="color: ${colors[Math.min(4, Math.floor(score / 1.5))]}">${labels[Math.min(4, Math.floor(score / 1.5))]}</span></div>
        <div class="stat"><span class="stat-label">Length</span><span class="stat-value">${len}</span></div>
        <div class="stat"><span class="stat-label">Lowercase</span><span class="stat-value">${/[a-z]/.test(pw) ? '✓' : '✗'}</span></div>
        <div class="stat"><span class="stat-label">Uppercase</span><span class="stat-value">${/[A-Z]/.test(pw) ? '✓' : '✗'}</span></div>
        <div class="stat"><span class="stat-label">Numbers</span><span class="stat-value">${/[0-9]/.test(pw) ? '✓' : '✗'}</span></div>
        <div class="stat"><span class="stat-label">Symbols</span><span class="stat-value">${/[^a-zA-Z0-9]/.test(pw) ? '✓' : '✗'}</span></div>
        <div class="stat"><span class="stat-label">Crack Time</span><span class="stat-value">${crackTime}</span></div>
      `;
    }
  </script>
</body>
</html>
