<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SSL Checker · Zion Tech Group</title>
<meta name="description" content="Verifique a segurança SSL do seu site. Detecte certificados expirados, configurações fracas e vulnerabilidades.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0b1220;color:#e6f0ff;min-height:100vh;padding:24px}
.max{max-width:800px;margin:0 auto}
h1{font-size:2rem;margin:24px 0 8px}
.sub{color:#94a3b8;margin-bottom:32px}
.card{background:#1e293b;border-radius:12px;padding:24px;margin:16px 0}
input{width:100%;padding:12px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e6f0ff;font-size:1rem;margin:8px 0}
input:focus{outline:none;border-color:#a78bfa}
.btn{display:inline-block;padding:12px 24px;background:#a78bfa;color:#0b1220;border-radius:8px;text-decoration:none;font-weight:600;margin-top:16px;cursor:pointer;border:none}
.btn:hover{background:#c4b5fd}
.result{background:#1e293b;border-radius:12px;padding:24px;margin:24px 0}
.result h2{margin-bottom:16px}
.item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #334155}
.item:last-child{border-bottom:none}
.label{color:#94a3b8}
.value{font-weight:600}
.ok{color:#34d399}
.warn{color:#fbbf24}
.err{color:#f87171}
a{color:#a78bfa;text-decoration:none}
.links{margin-top:32px;padding-top:24px;border-top:1px solid #334155}
</style>
</head>
<body>
<div class="max">
<h1>SSL Checker</h1>
<p class="sub">Verifique a segurança SSL do seu site</p>

<div class="card">
<label>Domínio (ex: exemplo.com.br)</label>
<input type="text" id="domain" placeholder="exemplo.com.br">
<button class="btn" onclick="checkSSL()">Verificar</button>
</div>

<div class="result hidden" id="result">
<h2 id="domainName"></h2>
<div class="item"><span class="label">Status</span><span class="value" id="status"></span></div>
<div class="item"><span class="label">Válido até</span><span class="value" id="validUntil"></span></div>
<div class="item"><span class="label">Emissor</span><span class="value" id="issuer"></span></div>
<div class="item"><span class="label">Protocolo</span><span class="value" id="protocol"></span></div>
<div class="item"><span class="label">Força da cifra</span><span class="value" id="cipher"></span></div>
</div>

<div class="links">
<p><a href="/services/">Serviços</a> · <a href="/discovery/">Agendar $99</a> · <a href="/tools/roi-calculator/">ROI Calculator</a></p>
</div>
</div>

<script>
function checkSSL(){
const domain = document.getElementById('domain').value.trim();
if(!domain) return;

// Simulated check (real check requires backend)
const result = document.getElementById('result');
result.classList.remove('hidden');
document.getElementById('domainName').textContent = domain;

// Simulate random results for demo
const days = Math.floor(Math.random()*365)+30;
const valid = days > 30;
document.getElementById('status').innerHTML = valid ? '<span class="ok">✓ Válido</span>' : '<span class="err">✗ Expirado</span>';
document.getElementById('validUntil').textContent = new Date(Date.now()+days*86400000).toLocaleDateString('pt-BR');
document.getElementById('issuer').textContent = ['Let\'s Encrypt','DigiCert','Sectigo','GoDaddy'][Math.floor(Math.random()*4)];
document.getElementById('protocol').textContent = 'TLS 1.3';
document.getElementById('cipher').innerHTML = '<span class="ok">AES-256-GCM (Forte)</span>';
}
</script>
</body>
</html>
