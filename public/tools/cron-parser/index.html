<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cron Expression Parser</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0f1a;--surface:#111827;--surface2:#1e293b;
  --text:#e5e7eb;--text-dim:#94a3b8;--accent:#6366f1;
  --accent-glow:rgba(99,102,241,.25);--success:#22c55e;
  --danger:#ef4444;--warning:#f59e0b;--border:#374151;
  --radius:10px;
}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  line-height:1.6;padding:2rem 1rem;
}
.container{max-width:820px;margin:0 auto}
header{text-align:center;margin-bottom:2rem}
header h1{
  font-size:2rem;font-weight:800;
  background:linear-gradient(135deg,#6366f1,#a78bfa,#818cf8);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;margin-bottom:.5rem;
}
header p{color:var(--text-dim);font-size:.95rem}
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:1.5rem;margin-bottom:1.25rem;
}
label{font-weight:600;font-size:.9rem;display:block;margin-bottom:.4rem;color:var(--text-dim)}
.input-row{display:flex;gap:.75rem;align-items:flex-end;flex-wrap:wrap}
input[type="text"]{
  flex:1;min-width:220px;padding:.7rem 1rem;font-size:1rem;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;color:var(--text);outline:none;
  transition:border-color .2s,box-shadow .2s;
}
input[type="text"]:focus{
  border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);
}
input[type="text"]::placeholder{color:#4b5563}
button{
  padding:.7rem 1.4rem;font-size:.95rem;font-weight:600;
  border:none;border-radius:8px;cursor:pointer;
  background:var(--accent);color:#fff;transition:background .2s,transform .1s;
  white-space:nowrap;
}
button:hover{background:#4f46e5;transform:translateY(-1px)}
button:active{transform:translateY(0)}
.field-hint{
  display:flex;justify-content:space-between;font-size:.75rem;
  color:var(--text-dim);margin-top:.4rem;padding-left:.2rem;
}
.field-hint span{flex:1;text-align:center}
.description-box{
  background:var(--surface2);border-left:4px solid var(--accent);
  padding:1rem 1.25rem;border-radius:6px;font-size:1.05rem;
  min-height:3.2rem;display:flex;align-items:center;
}
.next-runs{display:flex;flex-direction:column;gap:.5rem}
.run-item{
  display:flex;align-items:center;gap:1rem;
  background:var(--surface2);padding:.75rem 1rem;border-radius:8px;
  border:1px solid var(--border);
}
.run-index{
  width:28px;height:28px;border-radius:50%;
  background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.85rem;flex-shrink:0;
}
.run-time{font-weight:600;font-family:'SF Mono',Monaco,'Cascadia Code',monospace;font-size:1rem;flex:1}
.run-relative{color:var(--text-dim);font-size:.85rem}
.error-msg{
  background:rgba(239,68,68,.1);border:1px solid var(--danger);
  color:#fca5a5;padding:.75rem 1rem;border-radius:8px;
  font-size:.9rem;
}
.cta-section{margin-top:2.5rem}
.cta-section h3{font-size:1.1rem;margin-bottom:1rem;text-align:center}
.cta-buttons{
  display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;
}
.cta-btn{
  display:inline-flex;align-items:center;gap:.5rem;
  padding:.85rem 1.6rem;border-radius:8px;
  font-weight:600;font-size:.95rem;text-decoration:none;
  transition:transform .15s,box-shadow .15s;
}
.cta-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.3)}
.cta-primary{background:var(--accent);color:#fff}
.cta-secondary{
  background:var(--surface2);color:var(--text);
  border:1px solid var(--border);
}
.cta-secondary:hover{background:var(--surface)}
.cta-icon{font-size:1.2rem}
.examples{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.75rem}
.example-chip{
  background:var(--surface2);border:1px solid var(--border);
  padding:.35rem .7rem;border-radius:20px;font-size:.8rem;
  cursor:pointer;transition:border-color .2s,background .2s;
  font-family:'SF Mono',Monaco,'Cascadia Code',monospace;
  color:var(--text-dim);
}
.example-chip:hover{border-color:var(--accent);color:var(--text);background:rgba(99,102,241,.08)}
footer{text-align:center;margin-top:2rem;color:var(--text-dim);font-size:.8rem}
footer a{color:var(--accent);text-decoration:none}
footer a:hover{text-decoration:underline}
@media(max-width:600px){
  header h1{font-size:1.5rem}
  .input-row{flex-direction:column}
  input[type="text"]{width:100%}
  button{width:100%}
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Cron Expression Parser</h1>
    <p>Parse and describe standard 5-field cron expressions in plain English</p>
  </header>

  <div class="card">
    <label for="cronInput">Enter a cron expression:</label>
    <div class="input-row">
      <input type="text" id="cronInput" placeholder="e.g. 30 3 * * 1-5" autocomplete="off" spellcheck="false">
      <button id="parseBtn">Parse</button>
    </div>
    <div class="field-hint">
      <span>min (0-59)</span>
      <span>hour (0-23)</span>
      <span>day (1-31)</span>
      <span>month (1-12)</span>
      <span>weekday (0-6)</span>
    </div>
    <div class="examples" id="examples"></div>
  </div>

  <div id="resultArea"></div>

  <div class="cta-section">
    <h3>Ready to automate your workflows?</h3>
    <div class="cta-buttons">
      <a href="/services/automation-orchestration/" class="cta-btn cta-primary">
        <span class="cta-icon">⚡</span> Automation Orchestration
      </a>
      <a href="https://calendly.com/kleber-ziontechgroup" target="_blank" rel="noopener" class="cta-btn cta-secondary">
        <span class="cta-icon">📅</span> Schedule a Call
      </a>
    </div>
  </div>

  <footer>
    <p>Built by <a href="https://ziontechgroup.com">ZionTechGroup</a></p>
  </footer>
</div>

<script>
/* ============================================================
   CRON EXPRESSION PARSER — fully client-side
   Supports: 5-field standard cron + @daily @hourly @weekly @monthly @yearly
   ============================================================ */

const CRON_MACROS = {
  '@yearly':  '0 0 1 1 *',
  '@annually': '0 0 1 1 *',
  '@monthly': '0 0 1 * *',
  '@weekly':  '0 0 * * 0',
  '@daily':   '0 0 * * *',
  '@midnight':'0 0 * * *',
  '@hourly':  '0 * * * *'
};

const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const WEEK_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

const EXAMPLES = [
  {expr:'30 3 * * 1-5', desc:'Weekdays at 3:30 AM'},
  {expr:'0 */6 * * *', desc:'Every 6 hours'},
  {expr:'0 0 1 * *', desc:'First of every month'},
  {expr:'*/15 * * * *', desc:'Every 15 minutes'},
  {expr:'0 8,20 * * *', desc:'Twice daily (8 AM & 8 PM)'},
  {expr:'@daily', desc:'Daily at midnight'},
  {expr:'0 9 * * 1', desc:'Every Monday at 9 AM'},
  {expr:'58 23 31 12 *', desc:'New Year\'s Eve at 11:58 PM'}
];

/* ---------- Parsing ---------- */

function expandRange(start, end, maxVal){
  const result = [];
  for(let i=start;i<=end && i<=maxVal;i++) result.push(i);
  return result;
}

function parseField(field, minVal, maxVal){
  // Returns sorted array of integers this field matches
  const values = new Set();
  const parts = field.split(',');

  for(const part of parts){
    let step = 1;
    let rangePart = part;

    if(part.includes('/')){
      [rangePart, step] = part.split('/');
      step = parseInt(step,10);
    }

    if(rangePart === '*'){
      for(let v=minVal;v<=maxVal;v+=step) values.add(v);
    } else if(rangePart.includes('-')){
      const [s,e] = rangePart.split('-');
      const start = parseInt(s,10);
      const end = parseInt(e,10);
      for(let v=start;v<=end;v+=step) values.add(v);
    } else {
      values.add(parseInt(rangePart,10));
    }
  }

  return [...values].sort((a,b)=>a-b);
}

function parseCron(expr){
  const normalized = expr.trim().toLowerCase();
  const raw = CRON_MACROS[normalized] || expr.trim();
  const fields = raw.split(/\s+/);

  if(fields.length !== 5) throw new Error('A expressão cron deve ter exatamente 5 campos');

  return {
    macro: CRON_MACROS[normalized] ? normalized : null,
    minute: parseField(fields[0], 0, 59),
    hour:   parseField(fields[1], 0, 23),
    dom:    parseField(fields[2], 1, 31),
    month:  parseField(fields[3], 1, 12),
    dow:    parseField(fields[4], 0, 6)
  };
}

/* ---------- Description ---------- */

function describeValue(val){
  const suffixes = ['th','st','nd','rd'];
  const v = val % 100;
  const suffix = suffixes[(v-20)%10] || suffixes[v] || suffixes[0];
  return `${val}${suffix}`;
}

function describeList(arr, label){
  if(arr.length === 0) return '';
  if(arr.length === 1) return `${arr[0]}`;
  if(arr.length === 2) return `${arr[0]} and ${arr[1]}`;
  return `${arr.slice(0,-1).join(', ')}, and ${arr[arr.length-1]}`;
}

function describeHours(arr){
  if(arr.length === 24) return 'every hour';
  return 'at ' + arr.map(h=>{
    const period = h >= 12 ? 'PM' : 'AM';
    const hour = h % 12 || 12;
    return `${hour}:00 ${period}`;
  }).join(', ');
}

function describeMinutes(arr){
  if(arr.length === 60) return 'every minute';
  if(arr.length === 1 && arr[0] === 0) return '';
  return 'minute ' + describeList(arr, 'minute');
}

function describeDays(arr){
  if(arr.length === 31) return '';
  if(arr.length === 1) return `on the ${describeValue(arr[0])} of each month`;
  return `on days ${describeList(arr, 'day')} of each month`;
}

function describeMonths(arr){
  if(arr.length === 12) return '';
  if(arr.length === 1) return `in ${MONTH_NAMES[arr[0]-1]}`;
  return `in ${arr.map(m=>MONTH_NAMES[m-1]).join(', ')}`;
}

function describeWeekdays(arr){
  if(arr.length === 7) return '';
  if(arr.length === 1) return `only on ${WEEK_NAMES[arr[0]]}`;
  return `only on ${arr.map(d=>WEEK_NAMES[d]).join(', ')}`;
}

function describeCron(parsed){
  if(parsed.macro){
    switch(parsed.macro){
      case '@yearly':  return 'Every year on January 1st at midnight (0 0 1 1 *)';
      case '@annually': return 'Every year on January 1st at midnight (0 0 1 1 *)';
      case '@monthly':  return 'Every month on the 1st at midnight (0 0 1 * *)';
      case '@weekly':   return 'Every week on Sunday at midnight (0 0 * * 0)';
      case '@daily':
      case '@midnight': return 'Every day at midnight (0 0 * * *)';
      case '@hourly':   return 'Every hour at minute 0 (0 * * * *)';
      default:          return `Every day (${parsed.macro})`;
    }
  }

  const desc = [];

  const minutesDesc = describeMinutes(parsed.minute);
  const hoursDesc = describeHours(parsed.hour);

  if(minutesDesc && hoursDesc && !hoursDesc.startsWith('every hour')){
    desc.push(`${capitalize(hoursDesc.replace(/^at /, ''))} at minute ${parsed.minute.join(', ')}`);
  } else if(parsed.minute.length === 1 && parsed.minute[0] === 0){
    desc.push(capitalize(hoursDesc));
  } else if(parsed.hour.length === 24){
    if(minutesDesc.startsWith('every')){
      desc.push('Every hour, every minute');
    } else {
      desc.push(`${hoursDesc}, ${minutesDesc.replace(/^minute /,'at minute ')}`);
    }
  } else {
    desc.push(capitalize(`${hoursDesc} ${minutesDesc ? minutesDesc : ''}`.trim()));
  }

  const daysDesc = describeDays(parsed.dom);
  if(daysDesc) desc.push(daysDesc);

  const monthsDesc = describeMonths(parsed.month);
  if(monthsDesc) desc.push(monthsDesc);

  const weekdaysDesc = describeWeekdays(parsed.dow);
  if(weekdaysDesc) desc.push(weekdaysDesc);

  return capitalize(desc.filter(d=>d.length>0).join(', '));
}

function capitalize(s){
  if(!s) return s;
  return s.charAt(0).toUpperCase() + s.slice(1);
}

/* ---------- Next Run Calculation ---------- */

function isLeapYear(year){ return (year%4===0 && year%100!==0) || year%400===0; }
function daysInMonth(month, year){
  return new Date(year, month, 0).getDate();
}

function matches(parsed, date){
  const m = date.getMinutes();
  const h = date.getHours();
  const d = date.getDate();
  const mo = date.getMonth() + 1;
  const dw = date.getDay();

  return parsed.minute.includes(m) &&
         parsed.hour.includes(h) &&
         parsed.dom.includes(d) &&
         parsed.month.includes(mo) &&
         parsed.dow.includes(dw);
}

function nextRuns(parsed, count = 5){
  const results = [];
  const now = new Date();
  const start = new Date(now.getTime() + 1000); // Start from at least 1 second ahead
  start.setSeconds(0, 0);

  let current = new Date(start);
  // Round up to next minute if we're not at :00
  if(current.getSeconds() !== 0){
    current.setMinutes(current.getMinutes() + 1);
    current.setSeconds(0, 0);
  }

  const maxYear = now.getFullYear() + 5;

  while(results.length < count && current.getFullYear() <= maxYear){
    if(matches(parsed, current)){
      results.push(new Date(current));
    }
    current.setMinutes(current.getMinutes() + 1);
    // Safety check
    if(results.length === 0 && current.getTime() - start.getTime() > 366 * 24 * 60 * 60 * 1000){
      break;
    }
  }

  return results;
}

/* ---------- Time formatting ---------- */

function formatDate(d){
  const opts = {weekday:'long', year:'numeric', month:'long', day:'numeric', hour:'numeric', minute:'2-digit', hour12:true};
  return d.toLocaleString('en-US', opts);
}

function timeAgo(date){
  const now = new Date();
  const diff = date.getTime() - now.getTime();
  if(diff < 0) return 'in the past';

  const seconds = Math.floor(diff / 1000);
  const minutes = Math.floor(seconds / 60);
  const hours = Math.floor(minutes / 60);
  const days = Math.floor(hours / 24);
  const weeks = Math.floor(days / 7);
  const months = Math.floor(days / 30);
  const years = Math.floor(days / 365);

  if(years > 0) return `in ${years} year${years>1?'s':''}`;
  if(months > 0) return `in ${months} month${months>1?'s':''}`;
  if(weeks > 0) return `in ${weeks} week${weeks>1?'s':''}`;
  if(days > 0) return `in ${days} day${days>1?'s':''}`;
  if(hours > 0) return `in ${hours} hour${hours>1?'s':''}`;
  if(minutes > 0) return `in ${minutes} minute${minutes>1?'s':''}`;
  return 'in less than a minute';
}

/* ---------- UI ---------- */

function renderResult(expr, description, runs){
  const html = `
    <div class="card">
      <label>Human-readable description:</label>
      <div class="description-box">${escapeHtml(description)}</div>
    </div>
    <div class="card">
      <label>Next 5 execution times:</label>
      <div class="next-runs">
        ${runs.map((r,i)=>`
          <div class="run-item">
            <div class="run-index">${i+1}</div>
            <div class="run-time">${escapeHtml(formatDate(r))}</div>
            <div class="run-relative">${escapeHtml(timeAgo(r))}</div>
          </div>
        `).join('')}
        ${runs.length === 0 ? '<div class="error-msg">No upcoming execution times found. The cron expression may be invalid or unreachable.</div>' : ''}
      </div>
    </div>
  `;
  document.getElementById('resultArea').innerHTML = html;
}

function renderError(msg){
  document.getElementById('resultArea').innerHTML = `
    <div class="card">
      <div class="error-msg">${escapeHtml(msg)}</div>
    </div>
  `;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function doParse(){
  const expr = document.getElementById('cronInput').value.trim();
  if(!expr){
    renderError('Please enter a cron expression.');
    return;
  }
  try {
    const parsed = parseCron(expr);
    const desc = describeCron(parsed);
    const runs = nextRuns(parsed, 5);
    renderResult(expr, desc, runs);
  } catch(err){
    renderError(err.message || 'Invalid cron expression.');
  }
}

/* ---------- Init ---------- */

function init(){
  const exContainer = document.getElementById('examples');
  EXAMPLES.forEach(ex => {
    const chip = document.createElement('span');
    chip.className = 'example-chip';
    chip.textContent = ex.expr;
    chip.title = ex.desc;
    chip.addEventListener('click', () => {
      document.getElementById('cronInput').value = ex.expr;
      doParse();
    });
    exContainer.appendChild(chip);
  });

  document.getElementById('parseBtn').addEventListener('click', doParse);
  document.getElementById('cronInput').addEventListener('keypress', e => {
    if(e.key === 'Enter') doParse();
  });
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
