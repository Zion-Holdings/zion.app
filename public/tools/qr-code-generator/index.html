<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR Code Generator · Zion Tech Group</title>
<meta name="description" content="Gere QR Codes gratuitos para URLs, texto, email ou WhatsApp.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0b1220;color:#e6f0ff;min-height:100vh;padding:24px}
.max{max-width:800px;margin:0 auto}
h1{font-size:2rem;margin:24px 0 8px}
.sub{color:#94a3b8;margin-bottom:32px}
.card{background:#1e293b;border-radius:12px;padding:24px;margin:16px 0}
input,select{width:100%;padding:12px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e6f0ff;font-size:1rem;margin:8px 0}
input:focus,select:focus{outline:none;border-color:#a78bfa}
.btn{display:inline-block;padding:12px 24px;background:#a78bfa;color:#0b1220;border-radius:8px;text-decoration:none;font-weight:600;margin-top:16px;cursor:pointer;border:none}
.btn:hover{background:#c4b5fd}
.result{background:#1e293b;border-radius:12px;padding:24px;margin:24px 0;text-align:center}
canvas{border:1px solid #334155;border-radius:8px;background:#fff;padding:16px;max-width:256px}
a{color:#a78bfa;text-decoration:none}
.links{margin-top:32px;padding-top:24px;border-top:1px solid #334155}
</style>
</head>
<body>
<div class="max">
<h1>QR Code Generator</h1>
<p class="sub">Gere QR Codes gratuitos</p>

<div class="card">
<label>Tipo</label>
<select id="type">
<option value="url">URL</option>
<option value="text">Texto</option>
<option value="email">Email</option>
<option value="whatsapp">WhatsApp</option>
</select>
<label>Conteúdo</label>
<input type="text" id="content" placeholder="https://exemplo.com.br">
<button class="btn" onclick="generate()">Gerar QR Code</button>
</div>

<div class="result hidden" id="result">
<canvas id="qrcode" width="256" height="256"></canvas>
<p style="margin-top:16px;color:#94a3b8">Simulação visual - QR Code sería gerado aqui</p>
</div>

<div class="links">
<p><a href="/services/">Serviços</a> · <a href="https://calendly.com/kleber-ziontechgroup/zion-tech-group-ai-it-discovery-1">Agendar $99</a> · <a href="/tools/json-formatter/">JSON Formatter</a></p>
</div>
</div>

<script>
function generate(){
const content = document.getElementById('content').value.trim();
if(!content) return;

const result = document.getElementById('result');
result.classList.remove('hidden');

// Simple QR-like pattern simulation
const canvas = document.getElementById('qrcode');
const ctx = canvas.getContext('2d');
ctx.fillStyle = '#fff';
ctx.fillRect(0,0,256,256);
ctx.fillStyle = '#000';

// Draw random QR-like pattern
for(let i=0;i<21;i++){
  for(let j=0;j<21;j++){
    if(Math.random()>0.5){
      ctx.fillRect(i*12+4,j*12+4,10,10);
    }
  }
}

// Draw finder patterns
ctx.fillRect(4,4,36,36);
ctx.fillRect(216,4,36,36);
ctx.fillRect(4,216,36,36);
ctx.fillStyle='#fff';
ctx.fillRect(8,8,28,28);
ctx.fillRect(220,8,28,28);
ctx.fillRect(8,220,28,28);
ctx.fillStyle='#000';
ctx.fillRect(12,12,20,20);
ctx.fillRect(224,12,20,20);
ctx.fillRect(12,224,20,20);
}
</script>
</body>
</html>
