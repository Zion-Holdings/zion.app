<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown to HTML Converter | Zion Tech Group</title>
<style>
  :root {
    --bg: #0b0f1a;
    --surface: #111827;
    --text: #e5e7eb;
    --accent: #6366f1;
    --border: #1f2937;
    --code-bg: #1e293b;
    --muted: #9ca3af;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 1rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  header h1 { font-size: 1.25rem; color: var(--accent); }
  header a { color: var(--muted); text-decoration: none; font-size: 0.875rem; transition: color .2s; }
  header a:hover { color: var(--accent); }
  main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 1.5rem;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
  }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .panel-header {
    padding: 0.75rem 1rem;
    background: var(--border);
    font-size: 0.875rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .panel-header .tab-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 0.25rem 0.75rem;
    border-radius: 4px;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all .2s;
  }
  .panel-header .tab-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .panel-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  textarea {
    flex: 1;
    background: var(--bg);
    color: var(--text);
    border: none;
    padding: 1rem;
    font-family: 'Fira Code', 'Cascadia Code', monospace;
    font-size: 0.875rem;
    resize: none;
    min-height: 400px;
    outline: none;
    line-height: 1.6;
  }
  textarea::placeholder { color: var(--muted); }
  .preview, .source {
    flex: 1;
    padding: 1rem;
    overflow-y: auto;
    min-height: 400px;
    line-height: 1.7;
  }
  .source {
    display: none;
    background: var(--code-bg);
    font-family: 'Fira Code', 'Cascadia Code', monospace;
    font-size: 0.8rem;
    white-space: pre-wrap;
    word-break: break-all;
    color: #a5f3fc;
  }
  .source.active { display: block; }
  .preview.active { display: block; }
  .preview:not(.active) { display: none; }

  /* Rendered markdown styles */
  .preview h1, .preview h2, .preview h3, .preview h4, .preview h5, .preview h6 {
    margin: 1rem 0 0.5rem;
    color: var(--accent);
    line-height: 1.3;
  }
  .preview h1 { font-size: 1.75rem; border-bottom: 1px solid var(--border); padding-bottom: 0.3rem; }
  .preview h2 { font-size: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.25rem; }
  .preview h3 { font-size: 1.25rem; }
  .preview p { margin: 0.5rem 0; }
  .preview strong { color: #fff; font-weight: 700; }
  .preview em { color: #c4b5fd; font-style: italic; }
  .preview a { color: var(--accent); text-decoration: underline; }
  .preview a:hover { color: #818cf8; }
  .preview ul, .preview ol { margin: 0.5rem 0; padding-left: 2rem; }
  .preview li { margin: 0.25rem 0; }
  .preview blockquote {
    border-left: 3px solid var(--accent);
    margin: 0.75rem 0;
    padding: 0.5rem 1rem;
    background: rgba(99, 102, 241, 0.08);
    border-radius: 0 4px 4px 0;
  }
  .preview code {
    background: var(--code-bg);
    padding: 0.15rem 0.4rem;
    border-radius: 3px;
    font-family: 'Fira Code', monospace;
    font-size: 0.85em;
    color: #fbbf24;
  }
  .preview pre {
    background: var(--code-bg);
    padding: 1rem;
    border-radius: 6px;
    overflow-x: auto;
    margin: 0.75rem 0;
    border: 1px solid var(--border);
  }
  .preview pre code { background: none; padding: 0; color: #a5f3fc; }
  .preview img { max-width: 100%; border-radius: 6px; margin: 0.5rem 0; }
  .preview hr { border: none; border-top: 1px solid var(--border); margin: 1rem 0; }

  .cta-section {
    margin-top: 2rem;
    padding: 1.5rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    text-align: center;
  }
  .cta-section h2 { color: var(--accent); margin-bottom: 0.75rem; border: none; }
  .cta-buttons { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-top: 1rem; }
  .cta-btn {
    display: inline-block;
    padding: 0.75rem 1.5rem;
    border-radius: 6px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
    transition: all .2s;
  }
  .cta-btn.primary { background: var(--accent); color: #fff; }
  .cta-btn.primary:hover { background: #4f46e5; transform: translateY(-1px); }
  .cta-btn.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .cta-btn.secondary:hover { background: rgba(99, 102, 241, 0.1); }

  .toolbar {
    display: flex;
    gap: 0.5rem;
    padding: 0.5rem 1rem;
    background: var(--code-bg);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .toolbar button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 0.25rem 0.6rem;
    border-radius: 4px;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all .2s;
  }
  .toolbar button:hover { color: var(--text); border-color: var(--accent); }

  footer {
    text-align: center;
    padding: 1.5rem;
    color: var(--muted);
    font-size: 0.8rem;
    border-top: 1px solid var(--border);
    margin-top: 2rem;
  }
</style>
</head>
<body>

<header>
  <h1>⚡ Markdown → HTML Converter</h1>
  <a href="/">← Voltar ao site</a>
</header>

<main>
  <section class="panel">
    <div class="panel-header"><span>📝 Markdown</span></div>
    <div class="toolbar">
      <button onclick="insertSyntax('# ')">H1</button>
      <button onclick="insertSyntax('## ')">H2</button>
      <button onclick="insertSyntax('### ')">H3</button>
      <button onclick="insertSyntax('**bold**')">Bold</button>
      <button onclick="insertSyntax('*italic*')">Italic</button>
      <button onclick="insertSyntax('`code`')">Code</button>
      <button onclick="insertSyntax('[text](url)')">Link</button>
      <button onclick="insertSyntax('![alt](url)')">Image</button>
      <button onclick="insertSyntax('> quote')">Quote</button>
      <button onclick="insertSyntax('- item')">List</button>
      <button onclick="insertSyntax('```\ncode block\n```')">Code Block</button>
    </div>
    <div class="panel-body">
      <textarea id="md-input" placeholder="Digite seu Markdown aqui...

# Título H1
## Subtítulo H2

**Texto em negrito** e *texto em itálico*

- Item da lista
- Outro item

> Uma citação interessante

```javascript
console.log('Hello World');
```

[Link para Google](https://google.com)
![Imagem](https://via.placeholder.com/300x100)"></textarea>
    </div>
  </section>

  <section class="panel">
    <div class="panel-header">
      <span>👁️ Saída</span>
      <div>
        <button class="tab-btn active" onclick="switchTab('preview')">Preview</button>
        <button class="tab-btn" onclick="switchTab('source')">HTML Source</button>
      </div>
    </div>
    <div class="panel-body">
      <div id="preview" class="preview active"></div>
      <div id="source" class="source"></div>
    </div>
  </section>
</main>

<section class="cta-section" style="max-width: 1400px; margin: 0 auto 2rem; padding: 0 1.5rem;">
  <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 2rem;">
    <h2>Precisa de ajuda com automação ou desenvolvimento?</h2>
    <p style="color: var(--muted); margin-top: 0.5rem;">A Zion Tech Group pode transformar suas ideias em soluções digitais.</p>
    <div class="cta-buttons">
      <a href="/services/" class="cta-btn primary">Ver Serviços</a>
      <a href="https://calendly.com/kleber-ziontechgroup" target="_blank" rel="noopener" class="cta-btn secondary">Agendar Consultoria</a>
    </div>
  </div>
</section>

<footer>
  <p>Zion Tech Group — Ferramentas e soluções digitais</p>
</footer>

<script>
function mdToHtml(md) {
  let html = md;

  // Code blocks (fenced)
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, function(_, lang, code) {
    return '<pre><code>' + escapeHtml(code.trim()) + '</code></pre>';
  });

  // Inline code
  html = html.replace(/`([^`]+)`/g, function(_, code) {
    return '<code>' + escapeHtml(code) + '</code>';
  });

  // Images (before links)
  html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">');

  // Links
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

  // Headers
  html = html.replace(/^######\s+(.+)$/gm, '<h6>$1</h6>');
  html = html.replace(/^#####\s+(.+)$/gm, '<h5>$1</h5>');
  html = html.replace(/^####\s+(.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^###\s+(.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^##\s+(.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^#\s+(.+)$/gm, '<h1>$1</h1>');

  // Horizontal rule
  html = html.replace(/^---+$/gm, '<hr>');

  // Blockquotes
  html = html.replace(/^>\s+(.+)$/gm, '<blockquote>$1</blockquote>');

  // Bold (must be before italic)
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/__([^_]+)__/g, '<strong>$1</strong>');

  // Italic
  html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  html = html.replace(/_([^_]+)_/g, '<em>$1</em>');

  // Unordered lists
  html = html.replace(/^(\s*)[-*+]\s+(.+)$/gm, function(_, indent, content) {
    return '<li>' + content.trim() + '</li>';
  });
  html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, function(match) {
    return '<ul>' + match + '</ul>';
  });

  // Ordered lists
  html = html.replace(/^(\s*)\d+\.\s+(.+)$/gm, function(_, indent, content) {
    return '<oli>' + content.trim() + '</oli>';
  });
  html = html.replace(/((?:<oli>.*<\/oli>\n?)+)/g, function(match) {
    return '<ol>' + match.replace(/<\/?oli>/g, function(m) { return m.replace('oli','li'); }) + '</ol>';
  });

  // Paragraphs - wrap lines that aren't already wrapped
  html = html.split('\n').map(function(line) {
    line = line.trim();
    if (line === '' || /^<(h[1-6]|ul|ol|li|blockquote|pre|hr|img)/i.test(line)) {
      return line;
    }
    if (!/^</.test(line)) {
      return '<p>' + line + '</p>';
    }
    return line;
  }).join('\n');

  // Clean up empty paragraphs
  html = html.replace(/<p>\s*<\/p>/g, '');
  html = html.replace(/\n{2,}/g, '\n');

  return html.trim();
}

function escapeHtml(text) {
  return text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function update() {
  const input = document.getElementById('md-input').value;
  const html = mdToHtml(input);
  document.getElementById('preview').innerHTML = html;
  document.getElementById('source').textContent = html;
}

function switchTab(tab) {
  const preview = document.getElementById('preview');
  const source = document.getElementById('source');
  const btns = document.querySelectorAll('.tab-btn');
  if (tab === 'preview') {
    preview.classList.add('active');
    source.classList.remove('active');
    btns[0].classList.add('active');
    btns[1].classList.remove('active');
  } else {
    preview.classList.remove('active');
    source.classList.add('active');
    btns[0].classList.remove('active');
    btns[1].classList.add('active');
  }
}

function insertSyntax(syntax) {
  const ta = document.getElementById('md-input');
  const start = ta.selectionStart;
  const end = ta.selectionEnd;
  const text = ta.value;
  ta.value = text.substring(0, start) + syntax + text.substring(end);
  ta.focus();
  ta.selectionStart = ta.selectionEnd = start + syntax.length;
  update();
}

document.getElementById('md-input').addEventListener('input', update);

// Initial render
update();
</script>

</body>
</html>
