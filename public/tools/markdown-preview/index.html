<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0f1a;color:#e5e7eb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem}

.preview pre{margin:1rem 0;padding:1rem;background:#0b0f1a;border:1px solid #1f2937;border-radius:8px;overflow-x:auto}
.preview pre code{background:none;padding:0;color:#e5e7eb;font-size:.85em;line-height:1.6}
.preview img{max-width:100%;height:auto;border-radius:8px;margin:1rem 0;border:1px solid #1f2937}
.preview hr{border:none;border-top:1px solid #1f2937;margin:1.5rem 0}
.preview table{width:100%;border-collapse:collapse;margin:1rem 0}

.empty-state code{color:#6366f1;background:rgba(99,102,211,.1);padding:.15em .4em;border-radius:4px}
.cta-section{margin-top:1.5rem;text-align:center;padding:1.5rem;background:linear-gradient(135deg,rgba(99,102,211,.1),rgba(16,185,129,.1));border:1px solid #374151;border-radius:12px}
.cta-section h2{font-size:1.1rem;margin-bottom:.5rem}

.cta-links{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap}
.cta-links a{padding:.6rem 1.25rem;border-radius:8px;text-decoration:none;font-weight:600;font-size:.9rem;transition:.2s}
.cta-services{background:#6366f1;color:#fff}
.cta-services:hover{background:#4f46e5}
.cta-calendly{background:#10b981;color:#fff}

@media(max-width:768px){.split{grid-template-columns:1fr}textarea.source{min-height:300px}}
.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:#1f2937;color:#e5e7eb;padding:.75rem 1.5rem;border-radius:8px;font-size:.85rem;border:1px solid #374151;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1}

<body>
<div class="container">
<h1>Markdown Preview</h1>
<p class="subtitle">Visualize seu Markdown em tempo real — 100% no seu navegador.</p>

<div class="toolbar">
<button class="btn btn-primary" id="btn-sample">Exemplo</button>
<button class="btn btn-secondary" id="btn-copy-md">Copiar MD</button>
<button class="btn btn-secondary" id="btn-copy-html">Copiar HTML</button>
<button class="btn btn-ghost" id="btn-clear">Limpar</button>
</div>

<div class="split">
<div class="panel">
<div class="panel-header">
<span class="panel-title">Markdown</span>
<span class="panel-meta" id="meta-md">0 palavras · 0 linhas</span>
</div>
<div class="panel-body">
<textarea class="source" id="md-input" placeholder="Digite seu Markdown aqui...

# Título
## Subtítulo
**Negrito** · *Itálico* · ~~Tachado~~

- Lista item 1
- Lista item 2
  - Sub-item

1. Numerada 1
2. Numerada 2

> Citação importante

`código inline`

```
bloco de código
```

[Link](https://exemplo.com)
![Imagem](https://via.placeholder.com/300x100)</textarea>
</div>
</div>

<div class="panel">
<div class="panel-header">
<span class="panel-title">Preview HTML</span>
<span class="panel-meta" id="meta-html">0 caracteres</span>
</div>
<div class="panel-body preview" id="preview-pane">
<div class="empty-state">
<div>Comece a digitar Markdown no painel à esquerda.<br>A preview aparecerá aqui automaticamente.<br><br>Suporta: <code># H1</code> · <code>**bold**</code> · <code>*italic*</code> · <code>- listas</code> · <code>```code```</code> · <code>[links]()</code></div>
</div>
</div>
</div>
</div>

<div class="cta-section">
<h2>Precisa de ajuda com conteúdo ou automação?</h2>
<p>Nossa equipe pode integrar soluções sob medida para seu negócio.</p>
<div class="cta-links">
<a href="/services/" class="cta-services">Ver Serviços</a>
<a href="https://calendly.com/kleber-ziontechgroup" target="_blank" rel="noopener" class="cta-calendly">Agendar Reunião</a>
</div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const input=$('md-input');
const preview=$('preview-pane');
const metaMd=$('meta-md');
const metaHtml=$('meta-html');

const SAMPLE='# Bem-vindo ao Markdown Preview\n\nEste é um **editor de Markdown** com preview em tempo real. Tudo funciona diretamente no seu navegador — sem servidores, sem espera.\n\n## Funcionalidades\n\n- **Headers** de H1 a H6\n- **Negrito**, *itálico*, ~~tachado~~ e `código inline`\n- Listas ordenadas e não-ordenadas\n- Blocos de código\n- Links e imagens\n- Blockquotes\n\n## Exemplo de Código\n\n```javascript\nfunction saudacao(nome) {\n  return `Olá, ${nome}! Bem-vindo à Zion Tech`;\n}\n\nconsole.log(saudacao("Mundo"));\n```\n\n## Lista de Tarefas\n\n- [x] Criar o editor de Markdown\n- [x] Adicionar preview em tempo real\n- [ ] Adicionar suporte a tabelas\n- [ ] Exportar como PDF\n\n## Citação\n\n> "O melhor modo de prever o futuro é inventá-lo."\n> — Alan Kay\n\n## Link e Imagem\n\nVisite nosso [site](https://ziontechgroup.com) para mais informações.\n\n![Placeholder](https://via.placeholder.com/600x200/6366f1/ffffff?text=Zion+Tech+Group)\n\n---\n\n*Criado com 💜 pela Zion Tech Group*\n';

function renderMarkdown(md){
  let html=md;
  const codeBlocks=[];
  html=html.replace(/```(\w*)\n?([\s\S]*?)```/g,function(_,lang,code){
    const idx=codeBlocks.length;
    const langLabel=lang?'<span style="font-size:.7rem;color:#6b7280;float:right;text-transform:uppercase">'+escapeHtml(lang)+'</span>':'';
    codeBlocks.push(langLabel+'<code>'+escapeHtml(code.trim())+'</code>');
    return'\x00CODE'+idx+'\x00';
  });
  const inlineCodes=[];
  html=html.replace(/`([^`\n]+)`/g,function(_,code){
    const idx=inlineCodes.length;
    inlineCodes.push('<code>'+escapeHtml(code)+'</code>');
    return'\x00INLINE'+idx+'\x00';
  });
  html=escapeHtml(html);
  html=html.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  html=html.replace(/^## (.+)$/gm,'<h2>$1</h2>');
  html=html.replace(/^# (.+)$/gm,'<h1>$1</h1>');
  html=html.replace(/^#### (.+)$/gm,'<h4>$1</h4>');
  html=html.replace(/^##### (.+)$/gm,'<h5>$1</h5>');
  html=html.replace(/^###### (.+)$/gm,'<h6>$1</h6>');
  html=html.replace(/^\s*> (.+)$/gm,'<blockquote><p>$1</p></blockquote>');
  html=html.replace(/---+/g,'<hr>');
  html=html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img src="$2" alt="$1" loading="lazy">');
  html=html.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  html=html.replace(/\*\*\*([^*]+)\*\*\*/g,'<strong><em>$1</em></strong>');
  html=html.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  html=html.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<em>$2</em>');
  html=html.replace(/~~([^~]+)~~/g,'<del>$1</del>');
  html=html.replace(/^\s*-\s+\[x\]\s+(.+)$/gm,'<li><input type="checkbox" checked disabled> $1</li>');
  html=html.replace(/^\s*-\s+\[ \]\s+(.+)$/gm,'<li><input type="checkbox" disabled> $1</li>');
  html=html.replace(/^(?:\s*-\s+.+\n?)+/gm,function(block){
    const items=block.trim().split('\n');
    let result='<ul>';
    let depthStack=[0];
    items.forEach(function(item){
      const m=item.match(/^(\s*)-\s+(.+)$/);
      if(m){
        const indent=m[1].length;
        const content=m[2];
        if(indent>depthStack[depthStack.length-1]){
          result+='<ul>';
          depthStack.push(indent);
        }else while(indent<depthStack[depthStack.length-1]){
          result+='</ul>';
          depthStack.pop();
        }
        result+='<li>'+content+'</li>';
      }
    });
    while(depthStack.length>1){result+='</ul>';depthStack.pop()}
    result+='</ul>';
    return result;
  });
  html=html.replace(/^(?:\s*\d+\.\s+.+\n?)+/gm,function(block){
    const items=block.trim().split('\n');
    let result='<ol>';
    items.forEach(function(item){
      const m=item.match(/^\s*\d+\.\s+(.+)$/);
      if(m)result+='<li>'+m[1]+'</li>';
    });
    result+='</ol>';
    return result;
  });
  html=html.replace(/\x00INLINE(\d+)\x00/g,function(_,idx){
    return inlineCodes[parseInt(idx)];
  });
  html=html.replace(/\x00CODE(\d+)\x00/g,function(_,idx){
    return'<pre>'+codeBlocks[parseInt(idx)]+'</pre>';
  });
  html=html.replace(/^(?!<[a-z])((?!<\/?(h[1-6]|ul|ol|li|blockquote|pre|hr|img|table|tr|th|td|thead|tbody|figure|figcaption|div|section|article|aside|header|footer|nav|main|form|fieldset|details|dialog|address)).)+$/gm,'<p>$1</p>');
  html=html.replace(/<blockquote><p>(<h[1-6]>.*?<\/h[1-6]>)<\/p><\/blockquote>/g,'<blockquote>$1</blockquote>');
  html=html.replace(/\n{2,}/g,'\n');
  return html;
}

function escapeHtml(text){
  const map={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'};
  return text.replace(/[&<>"']/g,function(m){return map[m]});
}

function updatePreview(){
  const md=input.value;
  if(!md.trim()){
    preview.innerHTML='<div class="empty-state"><div>Comece a digitar Markdown no painel à esquerda.<br>A preview aparecerá aqui automaticamente.<br><br>Suporta: <code># H1</code> · <code>**bold**</code> · <code>*italic*</code> · <code>- listas</code> · <code>```code```</code> · <code>[links]()</code></div></div>';
    metaMd.textContent='0 palavras · 0 linhas';
    metaHtml.textContent='0 caracteres';
    return;
  }
  const html=renderMarkdown(md);
  preview.innerHTML=html;
  const words=md.trim().split(/\s+/).length;
  const lines=md.split('\n').length;
  metaMd.textContent=words+' palavras · '+lines+' linhas';
  metaHtml.textContent=html.length+' caracteres';
}

let timeout;
input.addEventListener('input',function(){
  clearTimeout(timeout);
  timeout=setTimeout(updatePreview,80);
});

$('btn-sample').addEventListener('click',function(){
  input.value=SAMPLE;
  updatePreview();
  showToast('Exemplo carregado!');
});

$('btn-clear').addEventListener('click',function(){
  input.value='';
  updatePreview();
  showToast('Conteúdo limpo.');
});

$('btn-copy-md').addEventListener('click',function(){
  if(!input.value){showToast('Nada para copiar.');return}
  navigator.clipboard.writeText(input.value).then(()=>showToast('Markdown copiado!'));
});

$('btn-copy-html').addEventListener('click',function(){
  if(!input.value){showToast('Nada para copiar.');return}
  const html=renderMarkdown(input.value);
  navigator.clipboard.writeText(html).then(()=>showToast('HTML copiado!'));
});

function showToast(msg){
  const t=$('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

updatePreview();
</script>
  <main><h2>Use cases</h2><ul><li>Preview markdown before publishing</li><li>Test formatting</li><li>Documentation review</li><li>Content quality checks</li></ul></main>
</body>
</html>
