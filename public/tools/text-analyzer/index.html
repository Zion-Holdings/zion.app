<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Analyzer | Zion Tech Group</title>
  <meta name="description" content="Analyze text online — word count, character count, keyword density, and reading time.">
  <meta property="og:title" content="Text Analyzer | Zion Tech Group">
  <meta property="og:description" content="Free online text analyzer with keyword density.">
  <meta property="og:url" content="https://ziontechgroup.com/tools/text-analyzer/">
  <link rel="canonical" href="https://ziontechgroup.com/tools/text-analyzer/">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b0f1a; color: #e5e7eb; min-height: 100vh; }
    .container { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    .subtitle { color: #94a3b8; margin-bottom: 2rem; }
    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 0.875rem; color: #94a3b8; margin-bottom: 0.5rem; }
    textarea { width: 100%; padding: 0.75rem; background: #1e293b; border: 1px solid #334155; border-radius: 0.5rem; color: #fff; font-family: monospace; resize: vertical; min-height: 120px; }
    textarea:focus { outline: none; border-color: #6366f1; }
    .buttons { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .btn { padding: 0.5rem 1rem; background: #6366f1; color: #fff; border: none; border-radius: 0.5rem; cursor: pointer; font-size: 0.875rem; }
    .btn:hover { background: #4f46e5; }
    .btn.success { background: #059669; }
    .btn.success:hover { background: #047857; }
    .section { background: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; padding: 1.5rem; margin-bottom: 1rem; }
    .section h3 { font-size: 1rem; margin-bottom: 0.75rem; color: #818cf8; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; }
    .stat { background: #0f172a; padding: 1rem; border-radius: 0.5rem; text-align: center; }
    .stat-value { font-size: 1.5rem; font-weight: 700; color: #818cf8; }
    .stat-label { font-size: 0.75rem; color: #94a3b8; margin-top: 0.25rem; }
    .keyword-item { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #334155; }
    .keyword-item:last-child { border-bottom: none; }
    .keyword-word { color: #fff; }
    .keyword-count { color: #818cf8; font-weight: 600; }
    .back { display: inline-block; margin-top: 1.5rem; color: #818cf8; text-decoration: none; }
    .back:hover { text-decoration: underline; }
  </style>
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Text Analyzer | Zion Tech Group">
<meta name="twitter:description" content="Analyze text online — word count, character count, keyword density, and reading time.">
<meta name="twitter:site" content="@ziontechgroup">
<meta name="twitter:image" content="https://ziontechgroup.com/images/og-default.png">
</head>
<body>
  <div class="container">
    <h1>Text Analyzer</h1>
    <p class="subtitle">Analyze text with keyword density and stats.</p>
    <div class="field">
      <label>Input Text</label>
      <textarea id="input" placeholder="Paste your text here..." oninput="analyze()">The quick brown fox jumps over the lazy dog. The dog barked at the fox, and the fox ran away quickly. This is a sample text for analyzing keyword density and other text statistics.</textarea>
    </div>
    <div class="buttons">
      <button class="btn success" onclick="copyStats()">Copy Stats</button>
      <button class="btn" onclick="clearAll()">Clear</button>
    </div>
    <div class="section">
      <h3>Statistics</h3>
      <div class="stats">
        <div class="stat"><div class="stat-value" id="wordCount">0</div><div class="stat-label">Words</div></div>
        <div class="stat"><div class="stat-value" id="charCount">0</div><div class="stat-label">Characters</div></div>
        <div class="stat"><div class="stat-value" id="charNoSpaces">0</div><div class="stat-label">Chars (no spaces)</div></div>
        <div class="stat"><div class="stat-value" id="sentenceCount">0</div><div class="stat-label">Sentences</div></div>
        <div class="stat"><div class="stat-value" id="paragraphCount">0</div><div class="stat-label">Paragraphs</div></div>
        <div class="stat"><div class="stat-value" id="readingTime">0s</div><div class="stat-label">Reading Time</div></div>
      </div>
    </div>
    <div class="section">
      <h3>Keyword Density (Top 10)</h3>
      <div id="keywords"></div>
    </div>
    <a href="/tools/" class="back">← Back to Tools</a>
  </div>
  <script>
    function analyze() {
      const text = document.getElementById('input').value;
      const words = text.trim().split(/\s+/).filter(w => w.length > 0);
      const wordCount = words.length;
      const charCount = text.length;
      const charNoSpaces = text.replace(/\s/g, '').length;
      const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 0);
      const paragraphs = text.split(/\n\n+/).filter(p => p.trim().length > 0);
      const readingTime = Math.ceil(wordCount / 200);
      
      document.getElementById('wordCount').textContent = wordCount;
      document.getElementById('charCount').textContent = charCount;
      document.getElementById('charNoSpaces').textContent = charNoSpaces;
      document.getElementById('sentenceCount').textContent = sentences.length;
      document.getElementById('paragraphCount').textContent = paragraphs.length || (text.trim() ? 1 : 0);
      document.getElementById('readingTime').textContent = readingTime + 'm';
      
      // Keyword density
      const stopWords = ['the','a','an','and','or','but','in','on','at','to','for','of','is','it','this','that','with','as','by','from','be','are','was','were','has','have','had','do','does','did','will','would','could','should','may','might','can','shall','i','you','he','she','we','they','my','your','his','her','our','their'];
      const freq = {};
      words.forEach(w => {
        const word = w.toLowerCase().replace(/[^a-z0-9]/g, '');
        if (word.length > 2 && !stopWords.includes(word)) {
          freq[word] = (freq[word] || 0) + 1;
        }
      });
      
      const sorted = Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, 10);
      const container = document.getElementById('keywords');
      container.innerHTML = '';
      sorted.forEach(([word, count]) => {
        const pct = ((count / wordCount) * 100).toFixed(1);
        const item = document.createElement('div');
        item.className = 'keyword-item';
        item.innerHTML = `<span class="keyword-word">${word}</span><span class="keyword-count">${count} (${pct}%)</span>`;
        container.appendChild(item);
      });
    }
    function copyStats() {
      const stats = `Words: ${document.getElementById('wordCount').textContent}\nCharacters: ${document.getElementById('charCount').textContent}\nSentences: ${document.getElementById('sentenceCount').textContent}\nReading Time: ${document.getElementById('readingTime').textContent}`;
      navigator.clipboard.writeText(stats);
    }
    function clearAll() {
      document.getElementById('input').value = '';
      analyze();
    }
    analyze();
  </script>
</body>
</html>
