    textarea, .field input { width: 100%; padding: 0.75rem; background: #1e293b; border: 1px solid #334155; border-radius: 0.5rem; color: #fff; font-family: monospace; resize: vertical; min-height: 80px; }
    textarea:focus, .field input:focus { outline: none; border-color: #6366f1; }

    .section pre { background: #0f172a; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; font-size: 0.875rem; line-height: 1.5; white-space: pre-wrap; word-break: break-all; }

<body>
  <div class="container">
    <h1>JWT Decoder Pro</h1>
    <p class="subtitle">Decode JWT tokens with signature verification.</p>
    <div class="field">
      <label>JWT Token</label>
      <textarea id="jwtInput" placeholder="Paste your JWT here...">eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c</textarea>
    </div>
    <div class="field">
      <label>Secret (for verification)</label>
      <input type="text" id="secret" value="your-256-bit-secret">
    </div>
    <div class="buttons">
      <button class="btn" onclick="decode()">Decode</button>
      <button class="btn success" onclick="verify()">Verify Signature</button>
    </div>
    <div class="section">
      <h3>Header</h3>
      <pre id="headerOutput">—</pre>
    </div>
    <div class="section">
      <h3>Payload</h3>
      <pre id="payloadOutput">—</pre>
    </div>
    <div class="section">
      <h3>Signature Verification</h3>
      <pre id="sigOutput">—</pre>
    </div>
    <a href="/tools/" class="back">← Back to Tools</a>
  </div>
  <script>
    async function hmacSha256(message, secret) {
      const enc = new TextEncoder();
      const key = await crypto.subtle.importKey('raw', enc.encode(secret), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
      const sig = await crypto.subtle.sign('HMAC', key, enc.encode(message));
      return btoa(String.fromCharCode(...new Uint8Array(sig))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
    function base64url(str) {
      return decodeURIComponent(escape(atob(str.replace(/-/g, '+').replace(/_/g, '/'))));
    }
    function decode() {
      const jwt = document.getElementById('jwtInput').value.trim();
      const parts = jwt.split('.');
      if (parts.length !== 3) {
        document.getElementById('headerOutput').textContent = 'Invalid JWT format';
        document.getElementById('payloadOutput').textContent = '—';
        return;
      }
      try {
        const header = JSON.parse(base64url(parts[0]));
        const payload = JSON.parse(base64url(parts[1]));
        document.getElementById('headerOutput').textContent = JSON.stringify(header, null, 2);
        document.getElementById('payloadOutput').textContent = JSON.stringify(payload, null, 2);
      } catch(e) {
        document.getElementById('headerOutput').textContent = 'Error: ' + e.message;
      }
    }
    async function verify() {
      const jwt = document.getElementById('jwtInput').value.trim();
      const secret = document.getElementById('secret').value;
      const parts = jwt.split('.');
      if (parts.length !== 3) {
        document.getElementById('sigOutput').textContent = 'Invalid JWT format';
        return;
      }
      const expectedSig = await hmacSha256(`${parts[0]}.${parts[1]}`, secret);
      const isValid = expectedSig === parts[2];
      const result = document.getElementById('sigOutput');
      result.textContent = isValid ? '✓ Signature VALID' : '✗ Signature INVALID';
      result.className = isValid ? 'verify-result valid' : 'verify-result invalid';
    }
    decode();
  </script>
