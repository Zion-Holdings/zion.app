<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Search | Zion Tech Group</title>
<meta name="description" content="Search AI and IT services, solutions, blog posts, and resources." />
<link rel="canonical" href="https://ziontechgroup.com/search/" />
<meta name="robots" content="noindex, follow" />
<style>
  body { background:#0b1220; color:#e5e7eb; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 40px 20px; }
  a { color: #c4b5fd; }
  .box { border:1px solid #334155; border-radius:16px; padding:24px; background:#0f172a; }
  input { width:100%; padding:12px 14px; border-radius:12px; border:1px solid #334155; background:#020617; color:#e5e7eb; }
  button { margin-top:12px; padding:10px 16px; border-radius:12px; border:0; background:white; color:#0f172a; font-weight:600; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Search</h1>
    <p>Find services, solutions, blog posts, and resources.</p>
    <form class="box" action="/search/" method="GET">
      <label for="q" style="display:block;margin-bottom:8px;font-size:14px;color:#94a3b8;">Search query</label>
      <input id="q" name="q" type="search" placeholder="Search services, solutions, topics..." />
      <button type="submit">Search</button>
    </form>
    <p style="margin-top:18px;color:#94a3b8;font-size:14px;">Wire this page to a search backend or index to enable full-text search.</p>
  </div>
  <main><h2>Search tips</h2><ul><li>Use keywords</li><li>Filter by category</li><li>Browse related posts</li></ul></main>
</body>
</html>
