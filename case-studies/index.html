<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Case Studies | Zion Tech Group</title>
  <meta name="description" content="Real outcomes from Zion Tech Group engagements.">
  <link rel="canonical" href="https://ziontechgroup.com/case-studies/">
  <link rel="stylesheet" href="/styles.css"/>
  <style>
    :root { color-scheme: dark; }
    body { background:#020617; color:#e5e7eb; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin:0; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px; }
    .hero { padding: 96px 0 64px; }
    h1 { font-size: 44px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em; }
    .cta-row { display:flex; flex-wrap:wrap; gap:12px; margin-top:24px; }
    .btn { display:inline-flex; align-items:center; gap:8px; padding:12px 18px; border-radius:10px; background:#0ea5e9; color:#0b1220; font-weight:600; text-decoration:none; }
    .btn-secondary { background:#ffffff14; color:#e5e7eb; border:1px solid #334155; }
    .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:16px; margin-top: 36px; }
    .card { border:1px solid #334155; border-radius:12px; padding:18px; background:#0b1220; }
    .card a { color:#93c5fd; text-decoration:none; }
    .card a:hover { text-decoration: underline; }
    .footer { margin-top: 64px; padding: 24px 0; color:#64748b; font-size:13px; }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>Case Studies</h1>
      <p class="lead">See how we reduced incident response time, cut cloud waste, and hardened identity postures.</p>
      <div class="cta-row">
        <a class="btn" href="/contact/">Request case study pack</a>
        <a class="btn btn-secondary" href="/services/">Explore services</a>
      </div>
      <div class="grid">
        <div class="card"><a href="/services/ai-observability/">Observability</a></div>
        <div class="card"><a href="/services/cybersecurity/">Cybersecurity</a></div>
        <div class="card"><a href="/services/cloud-migration/">Cloud Migration</a></div>
      </div>
    </section>
    <footer class="footer">© <span id="y"></span> Zion Tech Group. <a href="/">Home</a> · <a href="/contact/">Contact</a></footer>
  </main>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
