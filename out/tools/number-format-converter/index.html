<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Number Format Converter | Zion Tech Group Free Tools</title>
  <meta name="description" content="Convert between number formats (decimal, hex, binary, octal). Free online tool by Zion Tech Group." />
  <link rel="canonical" href="https://ziontechgroup.com/tools/number-format-converter/" />
</head>
<body>
  <main>
    <h1>Number Format Converter</h1>
    <input id="num" type="text" placeholder="Enter number" value="255" />
    <select id="from"><option value="dec">Decimal</option><option value="hex">Hex</option><option value="bin">Binary</option><option value="oct">Octal</option></select>
    <select id="to"><option value="dec">Decimal</option><option value="hex">Hex</option><option value="bin">Binary</option><option value="oct">Octal</option></select>
    <button onclick="convert()">Convert</button>
    <p id="result"></p>
    <p><a href="/tools/">Back to tools</a></p>
    <script>
      function convert(){
        const val = document.getElementById('num').value.trim();
        const from = document.getElementById('from').value;
        const to = document.getElementById('to').value;
        let dec;
        if (from === 'dec') dec = parseInt(val, 10);
        else if (from === 'hex') dec = parseInt(val, 16);
        else if (from === 'bin') dec = parseInt(val, 2);
        else dec = parseInt(val, 8);
        let result;
        if (to === 'dec') result = dec;
        else if (to === 'hex') result = '0x' + dec.toString(16);
        else if (to === 'bin') result = dec.toString(2);
        else result = dec.toString(8);
        document.getElementById('result').textContent = 'Result: ' + result;
      }
    </script>
  </main>
</body>
</html>
