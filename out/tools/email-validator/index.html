<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Validator | Zion Tech Group Free Tools</title>
  <meta name="description" content="Validate email addresses instantly. Free online tool by Zion Tech Group." />
  <link rel="canonical" href="https://ziontechgroup.com/tools/email-validator/" />
</head>
<body>
  <main>
    <h1>Email Validator</h1>
    <input id="email" type="email" placeholder="Enter email address" value="test@example.com" />
    <button onclick="validate()">Validate</button>
    <p id="result"></p>
    <p><a href="/tools/">Back to tools</a></p>
    <script>
      function validate(){
        const email = document.getElementById('email').value.trim();
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const res = document.getElementById('result');
        if (re.test(email)) res.textContent = 'Valid Email';
        else res.textContent = 'Invalid Email';
      }
    </script>
  </main>
</body>
</html>
